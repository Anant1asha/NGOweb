<style>

body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#f5f3ff 0%,#ede9fe 300px);color:var(--text);line-height:1.6;font-size:16px;overscroll-behavior:none;max-width:600px;margin:0 auto;min-height:100vh}
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(135deg,#fff,#f5f3ff);border-bottom:2px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(124,58,237,.1)}

.topbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:62px;z-index:99}
.progress-track{flex:1;height:10px;background:var(--border);border-radius:10px;overflow:hidden}

.profile-name{font-size:.76rem;font-weight:600}
.profile-swap{margin-left:auto;padding:3px 8px;background:#ede9fe;border:none;border-radius:6px;font-size:.66rem;cursor:pointer;color:var(--brand);font-weight:600}
.screen{padding:14px;min-height:400px;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
.intro-icon{font-size:3.5rem;margin-bottom:8px;text-align:center;animation:pop .5s ease}
.intro-title{font-size:1.3rem;font-weight:800;text-align:center;margin-bottom:4px}
.intro-sub{color:var(--muted);font-size:.8rem;font-weight:600;text-align:center;margin-bottom:12px}
.instruction{text-align:center;font-size:.85rem;font-weight:700;color:var(--brand);margin:8px auto;padding:8px 14px;background:linear-gradient(135deg,#ede9fe,#fce7f3);border-radius:10px;max-width:400px}
.hint{font-size:.7rem;color:var(--muted);text-align:center;margin:6px 0}
.bt{font-size:.92rem;line-height:1.7;color:var(--text);max-width:400px;margin:0 auto;text-align:left;font-weight:500}
.wd{cursor:pointer;border-radius:3px;padding:0 1px;transition:background .15s}
.wd:hover{background:#ede9fe}
.cn{color:var(--brand);font-weight:700;cursor:pointer;border-bottom:2px dotted var(--bl);padding:0 1px}
.ch{color:var(--purple);font-size:.8em;font-weight:600}
.card{background:#fff;border:2px solid var(--border);border-radius:14px;padding:16px;max-width:400px;width:100%;margin:0 auto 8px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.game-card{background:#fff;border:2px solid var(--border);border-radius:14px;padding:14px;max-width:400px;width:100%;margin:0 auto;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.game-card canvas{display:block;margin:0 auto;border-radius:8px;touch-action:none}
.we-card{background:linear-gradient(180deg,#fff,#faf5ff);border:2px solid var(--border);border-radius:14px;padding:14px;max-width:400px;width:100%;margin:0 auto 8px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.we-tag{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);margin-bottom:6px;display:inline-block;background:#ede9fe;padding:2px 10px;border-radius:6px}
.we-question{font-size:.9rem;font-weight:600;margin-bottom:10px;line-height:1.5}
.we-step{padding:10px 12px;background:linear-gradient(90deg,#ede9fe,#f5f3ff);border-left:4px solid var(--brand);border-radius:0 8px 8px 0;margin-bottom:6px;animation:stepReveal .3s ease;font-size:.8rem;line-height:1.5}
.we-step.green{background:linear-gradient(90deg,#d1fae5,#ecfdf5);border-left-color:var(--green)}
.we-step.amber{background:linear-gradient(90deg,#fef3c7,#fffbeb);border-left-color:var(--gold)}
.we-step.final{padding:12px;background:linear-gradient(135deg,#d1fae5,#a7f3d0);border:2px solid var(--green);border-radius:10px;margin-top:6px;text-align:center;font-weight:800;color:#065f46;font-size:.88rem}
.we-num{display:inline-block;width:22px;height:22px;background:var(--brand);color:#fff;border-radius:50%;text-align:center;font-size:.62rem;font-weight:700;line-height:22px;margin-right:6px}
.we-step.green .we-num{background:var(--green)}.we-step.amber .we-num{background:var(--gold)}
@keyframes stepReveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.quiz-opt{display:flex;align-items:flex-start;gap:10px;padding:12px;margin-bottom:7px;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all .2s;background:#fff}
.quiz-opt:hover{border-color:var(--bl);box-shadow:0 2px 8px rgba(139,92,246,.15)}
.quiz-opt.selected{border-color:var(--brand);background:#ede9fe}
.quiz-opt.correct{border-color:var(--green);background:#d1fae5}
.quiz-opt.wrong{border-color:var(--red);background:#fee2e2}
.quiz-radio{width:22px;height:22px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;margin-top:1px;transition:all .2s}
.quiz-opt.selected .quiz-radio{border-color:var(--brand);background:var(--brand);box-shadow:0 0 0 3px rgba(124,58,237,.2)}
.quiz-opt.correct .quiz-radio{border-color:var(--green);background:var(--green)}
.quiz-opt.wrong .quiz-radio{border-color:var(--red);background:var(--red)}
.quiz-opt-text{flex:1;font-size:.8rem}
.feedback{padding:12px;border-radius:12px;margin:8px auto;max-width:400px;font-size:.82rem;text-align:center;line-height:1.4}
.feedback.ok{background:linear-gradient(135deg,#d1fae5,#a7f3d0);border:1px solid #6ee7b7;color:#065f46;font-weight:700}
.feedback.no{background:linear-gradient(135deg,#fee2e2,#fecaca);border:1px solid #fca5a5;color:#991b1b;font-weight:700}
.misconception{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #f59e0b;border-radius:10px;padding:12px;margin:8px auto;max-width:400px;font-size:.76rem;color:#92400e;line-height:1.5}

.correct-method{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1px solid #86efac;border-radius:10px;padding:12px;margin:8px auto;max-width:400px;font-size:.76rem;color:#065f46;line-height:1.5}
.correct-method strong{color:#047857}
input[type=text]{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-size:1rem;margin-bottom:8px}
input[type=text]:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(139,92,246,.2)}
input[type=range]{width:100%;max-width:300px;accent-color:var(--brand);height:6px;border-radius:3px}

.milestone-icon{font-size:4rem;margin-bottom:6px;animation:pop .5s ease}
.milestone-text{font-size:1.1rem;font-weight:800;text-align:center}
.milestone-reward{font-size:1.8rem;font-weight:800;color:var(--gold);margin:6px 0;animation:pulse 1.5s infinite}
.milestone-next{font-size:.76rem;color:var(--muted);margin-top:10px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.complete-icon{font-size:4rem;margin-bottom:8px}
.complete-title{font-size:1.3rem;font-weight:800;margin-bottom:6px}
.complete-coins{font-size:2.2rem;font-weight:800;color:var(--gold);margin:10px 0}
.star-row{display:flex;gap:4px;justify-content:center;margin:8px 0}
.star-row span{font-size:1.8rem}
.bottom-bar{position:sticky;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);padding:10px 16px;box-shadow:0 -2px 8px rgba(0,0,0,.06);z-index:50;display:flex;gap:8px;align-items:center;justify-content:center}
.btn{width:100%;padding:14px;border:none;border-radius:13px;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--bl));color:#fff;box-shadow:0 3px 10px rgba(124,58,237,.3)}
.btn-primary:hover{box-shadow:0 5px 15px rgba(124,58,237,.4);transform:translateY(-1px)}
.btn-primary:disabled{background:#cbd5e1;cursor:not-allowed;color:#fff;box-shadow:none;transform:none}
.btn-green{background:linear-gradient(135deg,var(--green),#34d399);color:#fff;box-shadow:0 3px 10px rgba(16,185,129,.3)}
.btn-green:hover{box-shadow:0 5px 15px rgba(16,185,129,.4);transform:translateY(-1px)}
.btn-back{background:#f1f5f9;color:#475569;border:2px solid #cbd5e1;padding:10px 16px;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .15s;flex-shrink:0}
.btn-back:active{transform:scale(.95)}
.btn-back:disabled{opacity:.3;cursor:not-allowed}
.btn-restart{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border:none;padding:12px 24px;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:12px;box-shadow:0 3px 10px rgba(245,158,11,.3)}
.bottom-bar .btn-primary,.bottom-bar .btn-green{flex:1;max-width:300px}
dialog{border:none;border-radius:18px;padding:24px;max-width:300px;width:100%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.15);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.4);backdrop-filter:blur(2px)}
.prop-box{background:linear-gradient(90deg,#f0fdf4,#ecfdf5);border-left:4px solid var(--green);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.76rem;margin:6px 0;line-height:1.5}
.formula-box{background:linear-gradient(135deg,#ede9fe,#ddd6fe);border:2px solid var(--bl);border-radius:12px;padding:12px;margin:8px 0;text-align:center}
.formula-box .f-label{font-size:.62rem;color:var(--muted);text-transform:uppercase;font-weight:600;letter-spacing:.05em}
.formula-box .f-expr{font-size:1.05rem;font-weight:800;color:var(--brand);margin:4px 0}
.discovery-box{background:linear-gradient(135deg,#ede9fe,#fce7f3);border:2px solid var(--bl);border-radius:14px;padding:14px;margin:8px 0;text-align:center}
.discovery-box .d-title{font-size:.82rem;font-weight:800;color:var(--brand);margin-bottom:4px}
.discovery-box .d-text{font-size:.76rem;color:var(--text);line-height:1.5}
.interactive-hint{font-size:.7rem;color:var(--purple);text-align:center;font-weight:600;margin:4px 0;animation:pulse 1.5s infinite}
.tf-btn{display:flex;gap:10px;max-width:380px;margin:0 auto 8px}
.tf-opt{flex:1;padding:14px;border:2px solid var(--border);border-radius:12px;cursor:pointer;text-align:center;font-weight:700;font-size:1rem;transition:all .2s;background:#fff}
.tf-opt:hover{border-color:var(--bl)}
.tf-opt.sel-true{border-color:var(--green);background:#d1fae5;color:#065f46}
.tf-opt.sel-false{border-color:var(--red);background:#fee2e2;color:#991b1b}
.tf-opt.correct{border-color:var(--green);background:#d1fae5;color:#065f46}
.tf-opt.wrong{border-color:var(--red);background:#fee2e2;color:#991b1b}
.fb-input{width:100%;max-width:380px;margin:0 auto 8px;display:block;padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-size:1rem}
.fb-input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(139,92,246,.2)}
.diff-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-left:6px}
.diff-easy{background:#d1fae5;color:#065f46}.diff-medium{background:#fef3c7;color:#92400e}.diff-hard{background:#fee2e2;color:#991b1b}
.mm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:340px;margin:0 auto;padding:8px 0}
.mm-card{aspect-ratio:1;perspective:600px;cursor:pointer}

.mm-card-front{background:linear-gradient(135deg,var(--bl),var(--pi));border:2px solid var(--bl);color:#fff;font-size:1.4rem;box-shadow:0 3px 8px rgba(139,92,246,.3)}
.mm-card-back{background:#fff;border:2px solid var(--border);transform:rotateY(180deg);color:var(--text)}
.mm-card.matched .mm-card-back{background:linear-gradient(135deg,#d1fae5,#a7f3d0);border-color:var(--green);color:#065f46}

.mm-info{text-align:center;font-size:.78rem;color:var(--muted);margin:4px 0}

.timer-bar.danger{background:linear-gradient(90deg,var(--red),#f87171);animation:tpulse .5s infinite}

.rf-header{text-align:center;margin:4px 0}
.rf-q-num{font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}

.visual-card{background:linear-gradient(135deg,#fff,#f5f3ff);border:2px solid var(--bl);border-radius:14px;padding:16px;max-width:400px;margin:0 auto;box-shadow:0 4px 16px rgba(124,58,237,.08)}
.visual-title{font-size:.92rem;font-weight:800;color:var(--brand);text-align:center;margin-bottom:8px}
.ns-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.68rem;font-weight:700;margin:2px;cursor:pointer;transition:all .2s}

.prop-table{width:100%;max-width:400px;margin:0 auto;border-collapse:collapse;font-size:.72rem;border-radius:8px;overflow:hidden}

.prop-table td.yes{color:var(--green);font-weight:700}.prop-table td.no{color:var(--red);font-weight:700}
.prop-table tr:nth-child(even){background:#f8fafc}
.prop-table tr{cursor:pointer;transition:background .15s}
.prop-table tr.hl{background:#ede9fe!important}
.tutor-box{background:linear-gradient(135deg,#fef3c7,#fde68a);border:2px solid var(--gold);border-radius:14px;padding:14px;max-width:400px;margin:8px auto;font-size:.82rem;line-height:1.6;color:#78350f}
.tutor-box .tutor-icon{font-size:1.5rem;float:left;margin-right:8px}
.real-example{background:linear-gradient(135deg,#dbeafe,#bfdbfe);border:2px solid var(--bl);border-radius:12px;padding:12px;max-width:400px;margin:8px auto;font-size:.8rem;line-height:1.6;color:#1e3a8a}
.real-example .re-icon{font-size:1.2rem;margin-right:4px}

.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.shop-item{padding:12px 8px;border:2px solid var(--border);border-radius:10px;text-align:center;background:var(--surface)}

.shop-item-icon{font-size:1.8rem}.shop-item-name{font-size:.72rem;font-weight:700;margin:4px 0}

.shop-buy-btn{margin-top:6px;padding:5px 10px;font-size:.72rem;border:none;border-radius:6px;color:#fff;background:var(--brand);font-weight:700;cursor:pointer}
body.theme-ocean{--brand:#0ea5e9;--bl:#06b6d4;--green:#14b8a6;--gold:#f59e0b}

function rt(text,sm){
  if(!text)return "";
  var html=text;var keys=Object.keys(CONN).sort(function(a,b){return b.length-a.length});
  var connCount=0,result="",i=0;
  while(i<html.length){
    var ch=html[i];
    if(ch==="."||ch==="!"||ch==="?"||ch===","){connCount=0;result+=ch;i++;continue;}
    if(ch===" "){result+=" ";i++;continue;}
    if(ch==="<"){var ci=html.indexOf(">",i);if(ci>=0){result+=html.substring(i,ci+1);i=ci+1;continue;}}
    var matched=false;
    if(i===0||!/[a-zA-Z]/.test(html[i-1])){
      for(var k=0;k<keys.length;k++){
        var c=keys[k];var sub=html.substring(i,i+c.length);
        if(sub.toLowerCase()===c.toLowerCase()){
          var ai=i+c.length;if(ai<html.length&&/[a-zA-Z]/.test(html[ai]))continue;
          var hi=CONN[c];connCount++;
          if(connCount<=4){result+='<span class="cn" data-w="'+sub+'" data-h="'+hi+'">'+sub+' <span class="ch">('+hi+')</span></span>';}
          else{result+='<span class="wd" data-w="'+sub.toLowerCase()+'" data-h="'+hi+'">'+sub+'</span>';}
          i+=c.length;matched=true;break;
        }
      }
    }
    if(matched)continue;
    if(/[a-zA-Z]/.test(ch)){
      var ws=i;while(i<html.length&&/[a-zA-Z]/.test(html[i]))i++;
      var word=html.substring(ws,i);var cw=word.toLowerCase();
      if(!cw){result+=word;continue;}
      var hi2=WM[cw];
      if(hi2)result+='<span class="wd" data-w="'+cw+'" data-h="'+hi2+'">'+word+'</span>';
      else result+='<span class="wd" data-w="'+cw+'" data-h="">'+word+'</span>';
    }else{result+=ch;i++;}
  }
  return result;
}

function applyLLE(){
  var sels=".bt,.we-question,.we-step,.quiz-opt-text,.instruction,.hint,.prop-box,.formula-box,.f-label,.f-expr,.f-note,.misconception,.correct-method,.feedback,.milestone-text,.milestone-next,.discovery-box .d-text,.discovery-box .d-title,.intro-title,.intro-sub,.complete-title,.complete-sub,.rf-question,.rf-opt-text,.prop-table th,.prop-table td,.we-tag,.visual-title,.tutor-box,.real-example";
  var els=document.querySelectorAll(sels);
  for(var i=0;i<els.length;i++){
    var el=els[i];if(el.querySelector(".wd")||el.querySelector(".cn"))continue;
    if(el.tagName==="BUTTON"||el.tagName==="INPUT")continue;
    var h=el.innerHTML;if(!h||h.trim().length<3)continue;
    var textOnly=h.replace(/<[^>]+>/g,"");if(textOnly.trim().length<3)continue;
    try{el.innerHTML=rt(h)}catch(e){}
  }
}

function showWord(w,h,d){
  var dlg=document.getElementById("wordDialog");if(!dlg)return;
  document.getElementById("dlgWord").textContent=w;
  document.getElementById("dlgHindi").textContent=h||"—";
  document.getElementById("dlgDesc").textContent=d||"";
  if(!dlg.open)dlg.showModal();
}

document.addEventListener("click",function(e){
  var el=e.target.closest(".cn");if(el){showWord(el.getAttribute("data-w"),el.getAttribute("data-h"),"Connecting word");return}
  el=e.target.closest(".wd");if(el){showWord(el.getAttribute("data-w"),el.getAttribute("data-h")||"—",el.getAttribute("data-h")?"":"Hindi meaning not available");return}
});

var STEPS=[{"t":"intro","icon":"📐","title":"Mensuration","sub":"Class 8 Math — Chapter 11","intro":"Imagine you want to paint your room, or find how much water a tank can hold, or calculate the area of a field. Mensuration is the branch of mathematics that deals with measurements of length, area, and volume. In this chapter, we will learn to find areas of trapeziums, quadrilaterals, rhombuses, and polygons. We will also discover surface area and volume of cubes, cuboids, and cylinders. Let us begin!"},{"t":"tutor","icon":"💡","title":"Recalling Area and Perimeter","body":"Perimeter is the distance around a shape. Area is the space inside it. For a rectangle: Area = length x breadth, Perimeter = 2(length + breadth). For a square: Area = side squared, Perimeter = 4 x side. For a triangle: Area = (1/2) x base x height. For a parallelogram: Area = base x height. For a circle: Area = pi x r squared, Circumference = 2 x pi x r. These are the building blocks for everything we will learn next."},{"t":"formula","title":"Area Formulas Recap","formulas":[{"label":"Rectangle","expr":"Area = l x b","note":"Perimeter = 2(l + b)"},{"label":"Square","expr":"Area = a x a","note":"Perimeter = 4a"},{"label":"Triangle","expr":"Area = (1/2) x b x h","note":"b = base, h = height"},{"label":"Parallelogram","expr":"Area = b x h","note":"b = base, h = perpendicular height"},{"label":"Circle","expr":"Area = pi x r^2","note":"Circumference = 2 x pi x r"}]},{"t":"quiz","q":"Quick Check: What is the area of a parallelogram with base 10 cm and height 6 cm?","diff":"easy","opts":[{"t":"60 cm^2 (base x height = 10 x 6)","c":true},{"t":"30 cm^2","c":false,"m":"That is for a triangle: (1/2) x 10 x 6 = 30. A parallelogram is b x h = 60.","correctMethod":"Area = 10 x 6 = 60 cm^2."},{"t":"16 cm^2","c":false,"m":"That would be 10 + 6. Area = base x height = 60.","correctMethod":"60 cm^2."},{"t":"120 cm^2","c":false,"m":"That is 10 x 12, but height is 6, not 12. Area = 10 x 6 = 60.","correctMethod":"60 cm^2."}]},{"t":"tutor","icon":"💡","title":"Area of a Trapezium","body":"A trapezium has one pair of parallel sides. To find its area, we need the lengths of the two parallel sides (a and b) and the perpendicular distance (h) between them. The formula is: Area = (1/2) x (a + b) x h. For example, if the parallel sides are 20 m and 30 m, and the height is 12 m: Area = (1/2) x (20 + 30) x 12 = (1/2) x 50 x 12 = 300 square metres. The key insight is to average the parallel sides and multiply by height."},{"t":"formula","title":"Trapezium Area","formulas":[{"label":"Area of Trapezium","expr":"(1/2) x (a + b) x h","note":"a, b = parallel sides, h = height"},{"label":"Key insight","expr":"Average of parallel sides x height","note":"(a+b)/2 x h"}]},{"t":"ix_trapezium_calc","instruction":"Enter the two parallel sides and the height. Tap Calculate to see the area of the trapezium, with the formula applied step by step!"},{"t":"we","q":"Example 1: Area of trapezium field is 480 m^2. Height = 15 m. One parallel side = 20 m. Find the other.","steps":[{"text":"Area = (1/2) x (a + b) x h. So 480 = (1/2) x (20 + b) x 15."},{"text":"480 = (1/2) x 15 x (20 + b) = 7.5 x (20 + b). So 20 + b = 480/7.5 = 64."},{"text":"b = 64 - 20 = 44 m."}],"answer":"Other parallel side = 44 m"},{"t":"text","title":"Exercise 11.2","body":"Area of trapezium and quadrilateral questions — all unique!"},{"t":"solve","q":"Ex 11.2 Q1: Table top is a trapezium with parallel sides 1 m and 1.2 m, height 0.8 m. Find area.","steps":[{"type":"input","prompt":"Area = (1/2) x (1 + 1.2) x 0.8 = (1/2) x 2.2 x 0.8 = ? ","answer":"0.88","m":"0.88 m^2.","correctMethod":"Area = 0.88 m^2."}]},{"t":"solve","q":"Ex 11.2 Q5: Diagonals of a rhombus are 7.5 cm and 12 cm. Find its area.","steps":[{"type":"input","prompt":"Area of rhombus = (1/2) x d1 x d2 = (1/2) x 7.5 x 12 = ? ","answer":"45","m":"45 cm^2.","correctMethod":"Area = 45 cm^2."}]},{"t":"tutor","icon":"💡","title":"Area of a General Quadrilateral","body":"Any quadrilateral can be split into two triangles by drawing a diagonal. The area = (1/2) x d x (h1 + h2), where d is the diagonal length and h1, h2 are the perpendicular heights from the opposite vertices to the diagonal. A special case is the rhombus, whose area = (1/2) x d1 x d2 (half the product of the diagonals). This is because the diagonals of a rhombus are perpendicular bisectors."},{"t":"formula","title":"Quadrilateral and Rhombus Area","formulas":[{"label":"General Quadrilateral","expr":"(1/2) x d x (h1 + h2)","note":"d = diagonal, h1, h2 = perpendicular heights"},{"label":"Rhombus","expr":"(1/2) x d1 x d2","note":"d1, d2 = diagonals (perpendicular bisectors)"}]},{"t":"we","q":"Example 2: Area of a rhombus is 240 cm^2. One diagonal is 16 cm. Find the other diagonal.","steps":[{"text":"Area of rhombus = (1/2) x d1 x d2. So 240 = (1/2) x 16 x d2."},{"text":"240 = 8 x d2. Therefore d2 = 240/8 = 30 cm."}],"answer":"Other diagonal = 30 cm"},{"t":"quiz","q":"Quick Check: A rhombus has diagonals 10 cm and 8 cm. What is its area?","diff":"easy","opts":[{"t":"40 cm^2 ((1/2) x 10 x 8)","c":true},{"t":"80 cm^2","c":false,"m":"That is d1 x d2 = 80. But area = (1/2) x d1 x d2 = 40.","correctMethod":"(1/2) x 10 x 8 = 40 cm^2."},{"t":"20 cm^2","c":false,"m":"That would be (1/4) x 10 x 8. Area = (1/2) x 10 x 8 = 40.","correctMethod":"40 cm^2."},{"t":"18 cm^2","c":false,"m":"That is 10 + 8. Area = (1/2) x d1 x d2 = 40.","correctMethod":"40 cm^2."}]},{"t":"solve","q":"Ex 11.2 Q4: Diagonal of quadrilateral field is 24 m. Perpendiculars from opposite vertices are 8 m and 13 m. Find area.","steps":[{"type":"input","prompt":"Area = (1/2) x d x (h1 + h2) = (1/2) x 24 x (8 + 13) = (1/2) x 24 x ? ","answer":"21","m":"(1/2) x 24 x 21 = 252 m^2.","correctMethod":"Area = 252 m^2."}]},{"t":"solve","q":"Ex 11.2 Q2: Area of trapezium is 34 cm^2. One parallel side = 10 cm, height = 4 cm. Find other side.","steps":[{"type":"input","prompt":"34 = (1/2) x (10 + b) x 4. So 34 = 2 x (10 + b). 10 + b = 17. b = ? ","answer":"7","m":"b = 7 cm.","correctMethod":"Other parallel side = 7 cm."}]},{"t":"tutor","icon":"💡","title":"Surface Area of Cube, Cuboid and Cylinder","body":"Surface area is the total area of all faces of a 3D object. For a cuboid (l x b x h): Surface Area = 2(lb + bh + hl). Lateral Surface Area (4 walls only) = 2h(l + b). For a cube (side a): Surface Area = 6a^2. Lateral Surface Area = 4a^2. For a cylinder (radius r, height h): Curved Surface Area = 2 x pi x r x h. Total Surface Area = 2 x pi x r x (r + h). Think of surface area as the amount of wrapping paper needed to cover the entire object!"},{"t":"formula","title":"Surface Area Formulas","formulas":[{"label":"Cuboid SA","expr":"2(lb + bh + hl)","note":"All 6 faces"},{"label":"Cube SA","expr":"6a^2","note":"a = side length"},{"label":"Cylinder CSA","expr":"2 x pi x r x h","note":"Curved surface only"},{"label":"Cylinder TSA","expr":"2 x pi x r x (r + h)","note":"Includes top and bottom"}]},{"t":"ix_sa_explorer","instruction":"Select a shape (cube, cuboid, cylinder). Enter dimensions. Tap Calculate to see the total surface area and how each face contributes!"},{"t":"quiz","q":"Quick Check: What is the surface area of a cube with side 5 cm?","diff":"easy","opts":[{"t":"150 cm^2 (6 x 5 x 5 = 150)","c":true},{"t":"25 cm^2","c":false,"m":"That is one face (5x5). Total = 6 faces x 25 = 150.","correctMethod":"6 x 5^2 = 150 cm^2."},{"t":"125 cm^2","c":false,"m":"That is the volume (5^3 = 125). Surface area = 6 x 25 = 150.","correctMethod":"150 cm^2."},{"t":"30 cm^2","c":false,"m":"That is the perimeter (12 x 5 = 60, not 30). SA = 6 x 25 = 150.","correctMethod":"150 cm^2."}]},{"t":"text","title":"Exercise 11.3","body":"Surface area problems — all unique!"},{"t":"solve","q":"Ex 11.3 Q3: Find the side of a cube whose surface area is 600 cm^2.","steps":[{"type":"input","prompt":"SA = 6a^2 = 600. So a^2 = 100. a = ? ","answer":"10","m":"a = 10 cm.","correctMethod":"Side = 10 cm."}]},{"t":"solve","q":"Ex 11.3 Q7: A closed cylindrical tank has radius 7 m and height 3 m. How much metal sheet is needed?","steps":[{"type":"input","prompt":"TSA = 2 x pi x r x (r + h) = 2 x (22/7) x 7 x (7 + 3) = 2 x 22 x 10 = ? ","answer":"440","m":"440 m^2 of metal sheet.","correctMethod":"440 m^2 of sheet required."}]},{"t":"tutor","icon":"💡","title":"Volume of Cube, Cuboid and Cylinder","body":"Volume is the amount of space a 3D object occupies. For a cuboid: Volume = l x b x h (or base area x height). For a cube: Volume = a^3 (side cubed). For a cylinder: Volume = pi x r^2 x h (base area x height). Volume is measured in cubic units (cm^3, m^3). The relationship between volume and capacity: 1 mL = 1 cm^3, 1 L = 1000 cm^3, 1 m^3 = 1000 L. So if you know the volume of a container in cm^3, you can find its capacity in litres by dividing by 1000."},{"t":"formula","title":"Volume Formulas","formulas":[{"label":"Cuboid Volume","expr":"l x b x h","note":"Or: base area x height"},{"label":"Cube Volume","expr":"a^3 (side cubed)","note":"a = side length"},{"label":"Cylinder Volume","expr":"pi x r^2 x h","note":"base area (pi r^2) x height"},{"label":"Capacity","expr":"1 L = 1000 cm^3","note":"1 m^3 = 1000 L"}]},{"t":"we","q":"Example 8: Find the height of a cuboid whose volume is 275 cm^3 and base area is 25 cm^2.","steps":[{"text":"Volume = base area x height. So 275 = 25 x height."},{"text":"Height = 275/25 = 11 cm."}],"answer":"Height = 11 cm"},{"t":"quiz","q":"Quick Check: What is the volume of a cube with side 4 cm?","diff":"easy","opts":[{"t":"64 cm^3 (4 x 4 x 4 = 64)","c":true},{"t":"16 cm^3","c":false,"m":"That is 4^2 = 16 (area of one face). Volume = 4^3 = 64.","correctMethod":"4^3 = 64 cm^3."},{"t":"96 cm^3","c":false,"m":"That is the surface area (6 x 16). Volume = 4 x 4 x 4 = 64.","correctMethod":"64 cm^3."},{"t":"12 cm^3","c":false,"m":"That is 3 x 4. Volume = side cubed = 4^3 = 64.","correctMethod":"64 cm^3."}]},{"t":"text","title":"Exercise 11.4","body":"Volume problems — all unique!"},{"t":"solve","q":"Ex 11.4 Q1: A cuboid has dimensions 60 cm x 54 cm x 30 cm. Find its volume.","steps":[{"type":"input","prompt":"Volume = l x b x h = 60 x 54 x 30 = ? ","answer":"97200","m":"97200 cm^3.","correctMethod":"Volume = 97200 cm^3."}]},{"t":"solve","q":"Ex 11.4 Q3: Find the volume of a cylinder with radius 7 cm and height 10 cm. (Use pi = 22/7)","steps":[{"type":"input","prompt":"Volume = pi x r^2 x h = (22/7) x 49 x 10 = 22 x 7 x 10 = ? ","answer":"1540","m":"1540 cm^3.","correctMethod":"Volume = 1540 cm^3."}]},{"t":"solve","q":"Ex 11.4 Q6: A milk tank is in the form of a cylinder with radius 1.5 m and length 7 m. Find the quantity of milk in litres it can hold.","steps":[{"type":"input","prompt":"Volume = pi x r^2 x h = (22/7) x 2.25 x 7 = 22 x 2.25 = 49.5 m^3 = ? L ","answer":"49500","m":"49.5 m^3 x 1000 = 49500 L.","correctMethod":"49500 litres."}]},{"t":"milestone","icon":"🎓","title":"Full Chapter Mastered!","xp":100,"next":"Final assessment — Rapid Fire and Memory Match!"},{"t":"rapid_fire","qs":[{"q":"Area of trapezium?","opts":["(1/2)(a+b)h","a x b","(1/2)bh","a^2"],"ans":0},{"q":"Surface area of cube?","opts":["6a^2","a^3","4a^2","2(lb+bh)"],"ans":0},{"q":"Volume of cylinder?","opts":["pi r^2 h","2 pi r h","pi r^2","2 pi r"],"ans":0},{"q":"Area of rhombus?","opts":["(1/2) d1 d2","d1 x d2","a x h","a^2"],"ans":0},{"q":"Volume of cuboid?","opts":["l x b x h","2(lb+bh)","l+b+h","l^2 b"],"ans":0},{"q":"1 L = how many cm^3?","opts":["1000","100","10","1"],"ans":0},{"q":"Volume of cube (side a)?","opts":["a^3","6a^2","a^2","3a"],"ans":0},{"q":"TSA of cylinder?","opts":["2 pi r (r+h)","2 pi r h","pi r^2 h","pi r^2"],"ans":0}]},{"t":"memory_match","pairs":[{"en":"Trapezium","hi":"समलम्ब"},{"en":"Surface Area","hi":"पृष्ठीय क्षेत्रफल"},{"en":"Volume","hi":"आयतन"},{"en":"Capacity","hi":"धारिता"},{"en":"Rhombus","hi":"विषमकोण"},{"en":"Cylinder","hi":"बेलन"},{"en":"Cuboid","hi":"घनाभ"},{"en":"Diagonal","hi":"विकर्ण"}]},{"t":"complete","icon":"📐","title":"Chapter 11 Complete!","sub":"Mensuration — Mastered! Class 8"}];

var App={
  nIdx:0,sIdx:0,xp:0,coins:0,streak:0,level:1,
  answered:false,selOpt:null,solveStepIdx:0,solveAnswered:false,selTf:null,
  rfIdx:0,rfScore:0,rfTimer:null,rfTime:30,
  mmFlipped:[],mmMatched:0,mmBusy:false,
  selTheme:'default',ownedThemes:[],badges:[],retryTimer:null,
  init:function(){
    var self=this;
    var cb=document.getElementById("continueBtn");
    if(cb)cb.addEventListener("click",function(){
      var step=STEPS[self.sIdx];if(!step)return;
      if(step.t==="quiz"&&!self.answered){self.checkQuiz(step,cb);return;}
      if(step.t==="truefalse"&&!self.answered){self.checkTrueFalse(step,cb);return;}
      if(step.t==="solve"&&!self.solveAnswered){self.checkSolve(step,cb);return;}
      if(step.t==="we"&&self.weStepIdx!==undefined&&self.weStepIdx<step.steps.length){
        self.weStepIdx++;if(self.weStepIdx>=step.steps.length){self.weStepIdx=0;self.next();return;}self.render();return;}
      self.next();
    });
    var bb=document.getElementById("backBtn");
    if(bb)bb.addEventListener("click",function(){self.back();});
    var lc=document.getElementById("luClose");
    if(lc)lc.addEventListener("click",function(){var d=document.getElementById("levelUpDialog");if(d){if(d.open)d.close();else d.removeAttribute("open");}});
    var dc=document.getElementById("dlgClose");
    if(dc)dc.addEventListener("click",function(){var d=document.getElementById("wordDialog");if(d){if(d.open)d.close();else d.removeAttribute("open");}});
    this.render();
  },
  render:function(){
    var step=STEPS[this.sIdx];if(!step)return;
    var cb=document.getElementById("continueBtn");if(!cb)return;
    /* CRITICAL FIX: Always reset button */
    cb.style.display="";cb.disabled=false;cb.className="btn btn-primary";
    var bb=document.getElementById("backBtn");if(bb)bb.disabled=this.sIdx===0;
    var pf=document.getElementById("progressFill");
    if(pf)pf.style.width=Math.round((this.sIdx/(STEPS.length-1))*100)+"%";
    this.answered=false;this.selOpt=null;this.selTf=null;this.shuffledOpts=null;
    if(this._prevSIdx!==this.sIdx){this.solveStepIdx=0;this.solveAnswered=false;this.weStepIdx=0;this._prevSIdx=this.sIdx;}
    if(this.rfTimer){clearInterval(this.rfTimer);this.rfTimer=null;}
    switch(step.t){
      case"intro":this.renderIntro(step,cb);break;
      case"text":this.renderText(step,cb);break;
      case"tutor":this.renderTutor(step,cb);break;
      case"real_example":this.renderRealExample(step,cb);break;
      case"formula":this.renderFormula(step,cb);break;
      case"ix_numbersets":this.renderIxNumberSets(step,cb);break;
      case"ix_numberline":this.renderIxNumberLine(step,cb);break;
      case"ix_properties":this.renderIxProperties(step,cb);break;
      case"ix_reciprocal":this.renderIxReciprocal(step,cb);break;
      case"ix_between":this.renderIxBetween(step,cb);break;
      case"discovery":this.renderDiscovery(step,cb);break;
      case"quiz":this.renderQuiz(step,cb);break;
      case"truefalse":this.renderTrueFalse(step,cb);break;
      case"we":this.renderWE(step,cb);break;
      case"solve":this.renderSolve(step,cb);break;
      case"rapid_fire":this.renderRapidFire(step,cb);break;
      case"memory_match":this.renderMemoryMatch(step,cb);break;
      case"milestone":this.renderMilestone(step,cb);break;
      case"complete":this.renderComplete(step,cb);break;
    }
    setTimeout(function(){applyLLE();},50);
    this.updateStats();
  },
  updateStats:function(){
    var sl=document.getElementById("statLvl");if(sl)sl.textContent="Lv "+this.level;
    var sc=document.getElementById("statCoins");if(sc)sc.textContent=this.coins;
    var sx=document.getElementById("statXp");if(sx)sx.textContent=this.xp;
  },
  checkLevelUp:function(){
    var th=[0,50,120,200,300,450];var nm=["Beginner","Learner","Scholar","Expert","Master","Champion"];
    for(var i=th.length-1;i>=0;i--){if(this.xp>=th[i]){if(this.level<i+1){this.level=i+1;this.showLevelUp(nm[i]);}break;}}
  },
  showLevelUp:function(name){
    var dlg=document.getElementById("levelUpDialog");if(!dlg)return;
    var ti=dlg.querySelector("div:nth-child(2)");if(ti)ti.textContent="Level Up! You are now a "+name+"!";
    if(dlg&&!dlg.open){try{dlg.showModal();}catch(e){}}
    this.fireConfetti();
  },
  fireConfetti:function(){
    var c=document.getElementById("confetti");if(!c)return;c.style.display="block";
    var ctx=c.getContext("2d");if(!ctx)return;
    c.width=window.innerWidth;c.height=window.innerHeight;
    var parts=[];
    for(var i=0;i<80;i++){parts.push({x:Math.random()*c.width,y:-20,vx:(Math.random()-0.5)*4,vy:Math.random()*3+2,c:["#7c3aed","#a855f7","#10b981","#f59e0b","#ec4899"][Math.floor(Math.random()*5)],s:Math.random()*6+3});}
    var t=0;
    function anim(){ctx.clearRect(0,0,c.width,c.height);for(var i=0;i<parts.length;i++){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);}t++;if(t<120)requestAnimationFrame(anim);else c.style.display="none";}
    anim();
  },
  next:function(){
    var step=STEPS[this.sIdx];if(!step)return;
    if((step.t==="quiz"||step.t==="truefalse")&&!this.answered)return;
    if(step.t==="solve"&&!this.solveAnswered)return;
    if(step.t==="rapid_fire"&&this.rfIdx<step.qs.length)return;
    if(step.t==="memory_match"&&this.mmMatched<step.pairs.length)return;
    this.sIdx++;if(this.sIdx>=STEPS.length)this.sIdx=STEPS.length-1;this.render();
  },
  back:function(){if(this.sIdx>0){this.sIdx--;if(this.rfTimer){clearInterval(this.rfTimer);this.rfTimer=null;}this.render();}},
  /* ===== SIMPLE STEPS (Continue always enabled) ===== */
  renderIntro:function(step,cb){
    var introText=step.intro||"Welcome! Let us begin learning.";
    document.getElementById("screen").innerHTML=
      '<div style="text-align:center"><div class="intro-icon">'+step.icon+'</div><div class="intro-title">'+rt(step.title)+'</div><div class="intro-sub">'+rt(step.sub)+'</div></div>'+
      '<div class="bt" style="padding:14px;background:linear-gradient(135deg,#fff,#eef2ff);border-radius:14px;border:2px solid var(--bl);max-width:400px;box-shadow:0 4px 12px rgba(79,70,229,.08)">'+rt(introText)+'</div>'+
      '<div class="hint">Tap any word for Hindi meaning. Connecting words show Hindi automatically.</div>';
    cb.textContent="Start Learning";cb.className="btn btn-primary";cb.disabled=false;
  },
  renderText:function(step,cb){
    document.getElementById("screen").innerHTML=
      '<div class="instruction">'+rt(step.title)+'</div>'+
      '<div class="bt" style="padding:14px;background:linear-gradient(135deg,#fff,#f5f3ff);border-radius:14px;border:2px solid var(--border);max-width:400px;box-shadow:0 4px 12px rgba(0,0,0,.05)">'+rt(step.body)+'</div>';
    cb.textContent="Continue →";cb.className="btn btn-primary";cb.disabled=false;
  },
  renderTutor:function(step,cb){
    document.getElementById("screen").innerHTML=
      '<div class="instruction">'+rt("Tutor Tip")+'</div>'+
      '<div class="tutor-box"><span class="tutor-icon">'+step.icon+'</span>'+rt(step.title)+'</div>'+
      '<div class="bt" style="padding:14px;background:#fff;border-radius:14px;border:2px solid var(--gold);max-width:400px;font-size:.85rem;line-height:1.7;margin:0 auto;box-shadow:0 4px 12px rgba(245,158,11,.08)">'+rt(step.body)+'</div>';
    cb.textContent="Continue →";cb.className="btn btn-primary";cb.disabled=false;
  },
  renderRealExample:function(step,cb){
    document.getElementById("screen").innerHTML=
      '<div class="instruction">'+rt("Real Life Example")+'</div>'+
      '<div class="real-example"><span class="re-icon">'+step.icon+'</span>'+rt(step.body)+'</div>';
    cb.textContent="Continue →";cb.className="btn btn-primary";cb.disabled=false;
  },
  renderFormula:function(step,cb){
    var html='<div class="instruction">'+rt(step.title)+'</div>';
    for(var i=0;i<step.formulas.length;i++){var f=step.formulas[i];
      html+='<div class="formula-box"><div class="f-label">'+rt(f.label)+'</div><div class="f-expr">'+rt(f.expr)+'</div>'+(f.note?'<div class="f-label" style="color:#78350f">'+rt(f.note)+'</div>':'')+'</div>';}
    document.getElementById("screen").innerHTML=html;
    cb.textContent="Continue →";cb.className="btn btn-primary";cb.disabled=false;
  },
  renderDiscovery:function(step,cb){
    document.getElementById("screen").innerHTML=
      '<div class="instruction">'+rt(step.title)+'</div>'+
      '<div class="discovery-box"><div class="d-title">'+rt(step.discoveryTitle)+'</div><div class="d-text">'+rt(step.body)+'</div></div>'+
      (step.prop?'<div class="prop-box" style="max-width:400px;margin:0 auto">'+rt(step.prop)+'</div>':'');
    cb.textContent="Continue →";cb.className="btn btn-primary";cb.disabled=false;
  },
  renderWE:function(step,cb){
    var self=this;if(this.weStepIdx===undefined)this.weStepIdx=0;var idx=this.weStepIdx;
    if(idx>=step.steps.length){cb.textContent="Continue";cb.className="btn btn-green";cb.disabled=false;cb.style.display="";return;}
    var html='<div class="instruction">Worked Example - Step '+(idx+1)+' of '+step.steps.length+'</div>';
    html+='<div class="we-card"><div class="we-tag">Step-by-step solution</div><div class="we-question">'+rt(step.q)+'</div>';
    for(var i=0;i<=idx&&i<step.steps.length;i++){var s=step.steps[i];var cls=s.color?" "+s.color:"";var isCurrent=(i===idx);
      html+='<div class="we-step'+cls+'"'+(isCurrent?' style="border-left-color:var(--gold);background:linear-gradient(90deg,#fef3c7,#fde68a);animation:slideIn .3s ease"':'')+'><span class="we-num">'+(i+1)+'</span>'+rt(s.text)+'</div>';}
    if(idx>=step.steps.length-1&&step.answer){html+='<div class="we-step final">Answer: '+rt(step.answer)+'</div>';}
    html+='</div>';document.getElementById("screen").innerHTML=html;
    if(idx<step.steps.length-1){cb.textContent="Next Step ("+(idx+2)+" of "+step.steps.length+")";cb.className="btn btn-primary";cb.disabled=false;cb.style.display="";}
    else{cb.textContent="Continue";cb.className="btn btn-green";cb.disabled=false;cb.style.display="";}
  },
  renderMilestone:function(step,cb){
    document.getElementById("screen").innerHTML=
      '<div style="text-align:center;padding:20px">'+
      '<div class="milestone-icon">'+step.icon+'</div>'+
      '<div class="milestone-text">'+rt(step.title)+'</div>'+
      '<div class="milestone-reward">+'+step.xp+' XP</div>'+

  calcBetween:function(){
    function pf(s){s=s.trim();if(s.indexOf("/")>=0){var p=s.split("/");return parseInt(p[0])/parseInt(p[1]);}return parseFloat(s);}
    function tf(d){for(var i=1;i<=100;i++){var n=Math.round(d*i);if(Math.abs(n/i-d)<0.001)return n+"/"+i;}return d.toFixed(4);}
    var a=pf(document.getElementById("ixA").value);var b=pf(document.getElementById("ixB").value);
    if(isNaN(a)||isNaN(b)){document.getElementById("ixBetDisc").style.display="block";document.getElementById("ixBetTitle").textContent="Galat!";document.getElementById("ixBetInfo").innerHTML="Sahi fraction daalo jaise 1/4";return;}
    var mid=(a+b)/2;var aF=document.getElementById("ixA").value.trim();var bF=document.getElementById("ixB").value.trim();var mF=tf(mid);
    var lo=Math.min(a,b),hi=Math.max(a,b);
    var canvas=document.getElementById("betCanvas");if(!canvas)return;var ctx=canvas.getContext("2d");if(!ctx)return;
    ctx.clearRect(0,0,340,120);var cy=60;var m=30;var pad=(hi-lo)*0.2;var min=lo-pad,max=hi+pad;var sc=(340-2*m)/(max-min);
    ctx.strokeStyle="#475569";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m,cy);ctx.lineTo(340-m,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(340-m,cy);ctx.lineTo(333-m,cy-5);ctx.lineTo(333-m,cy+5);ctx.closePath();ctx.fillStyle="#475569";ctx.fill();
    var xa=m+(a-min)*sc;ctx.fillStyle="#8b5cf6";ctx.beginPath();ctx.arc(xa,cy,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle="#8b5cf6";ctx.font="bold 11px sans-serif";ctx.textAlign="center";ctx.fillText(aF,xa,cy-15);
    var xb=m+(b-min)*sc;ctx.fillStyle="#ec4899";ctx.beginPath();ctx.arc(xb,cy,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.stroke();
    ctx.fillStyle="#ec4899";ctx.fillText(bF,xb,cy-15);
    var xm=m+(mid-min)*sc;var gg=ctx.createRadialGradient(xm,cy,2,xm,cy,18);gg.addColorStop(0,"rgba(16,185,129,0.4)");gg.addColorStop(1,"rgba(16,185,129,0)");
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(xm,cy,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#10b981";ctx.beginPath();ctx.arc(xm,cy,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.stroke();
    ctx.fillStyle="#065f46";ctx.font="bold 12px sans-serif";ctx.fillText(mF,xm,cy+25);
    document.getElementById("ixBetDisc").style.display="block";
    document.getElementById("ixBetTitle").textContent="Mean = ("+aF+" + "+bF+") ÷ 2 = "+mF;
    document.getElementById("ixBetInfo").innerHTML=lo.toFixed(4)+" < "+mid.toFixed(4)+" < "+hi.toFixed(4)+". Toh "+mF+" beech mein hai! Aur aise hi aur nikal sakte ho!";
  },

    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Balance Scale: 3x + 2 = 11</div><canvas id="blCanvas" width="320" height="240" style="display:block;margin:0 auto;border-radius:8px;background:#fff"></canvas><div style="margin-top:10px"><label style="font-size:.78rem;font-weight:700;color:var(--brand)">x = <span id="blX" style="color:var(--pi);font-size:1.2rem">3</span></label><input type="range" id="blSlider" min="-2" max="8" step="1" value="3" style="width:100%;max-width:280px"></div><div class="discovery-box" style="margin-top:8px"><div class="d-title" id="blTitle">Balanced!</div><div class="d-text" id="blInfo">LHS = 3(3)+2 = 11. RHS = 11.</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;var c=document.getElementById("blCanvas");if(!c)return;var ctx=c.getContext("2d");if(!ctx)return;
    function draw(){var x=parseInt(document.getElementById("blSlider").value);document.getElementById("blX").textContent=x;ctx.clearRect(0,0,320,240);var lhs=3*x+2,rhs=11,balanced=(lhs===rhs),cx=160,baseY=200;ctx.fillStyle="#64748b";ctx.beginPath();ctx.moveTo(cx-15,baseY);ctx.lineTo(cx+15,baseY);ctx.lineTo(cx,baseY-35);ctx.closePath();ctx.fill();ctx.strokeStyle="#64748b";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,baseY-35);ctx.lineTo(cx,60);ctx.stroke();var tilt=balanced?0:(lhs>rhs?-0.15:0.15);ctx.save();ctx.translate(cx,60);ctx.rotate(tilt);ctx.strokeStyle="#4f46e5";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-100,0);ctx.lineTo(100,0);ctx.stroke();ctx.fillStyle=balanced?"#10b981":"#64748b";ctx.beginPath();ctx.arc(-80,0,6,0,2*Math.PI);ctx.fill();ctx.beginPath();ctx.arc(80,0,6,0,2*Math.PI);ctx.fill();ctx.strokeStyle="#64748b";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-80,6);ctx.lineTo(-80,30);ctx.moveTo(80,6);ctx.lineTo(80,30);ctx.stroke();ctx.fillStyle="#4f46e5";ctx.font="bold 10px sans-serif";ctx.textAlign="center";ctx.fillText("3x+2",-80,45);ctx.fillText("11",80,45);ctx.fillStyle="#7c3aed";ctx.font="bold 12px sans-serif";ctx.fillText("= "+lhs,-80,20);ctx.fillText("= "+rhs,80,20);if(balanced){ctx.fillStyle="#10b981";ctx.font="bold 14px sans-serif";ctx.fillText("BALANCED!",0,-15);}else{ctx.fillStyle="#ef4444";ctx.font="bold 12px sans-serif";ctx.fillText("Not balanced",0,-15);}ctx.restore();ctx.fillStyle="#64748b";ctx.font="10px sans-serif";ctx.textAlign="center";ctx.fillText("LHS = 3("+x+")+2 = "+lhs+"  |  RHS = "+rhs,cx,230);
      if(balanced){document.getElementById("blTitle").textContent="Balanced! x = "+x+" is the solution!";document.getElementById("blInfo").textContent="LHS = 3("+x+")+2 = "+lhs+". RHS = "+rhs+". Both sides equal!";}
      else{document.getElementById("blTitle").textContent="Not balanced (LHS="+lhs+", RHS="+rhs+")";document.getElementById("blInfo").textContent="LHS = 3("+x+")+2 = "+lhs+" but RHS = "+rhs+". Try a different value of x!";}}
    document.getElementById("blSlider").addEventListener("input",draw);draw();
  },
  renderIxWordProblemSim:function(step,cb){
    var wpStep=0;var wpSteps=[{title:"Step 1: Read the problem",text:"Rahul's father is 3 times as old as Rahul. After 10 years, the sum of their ages will be 70. Find their present ages."},{title:"Step 2: Choose a variable",text:"Let Rahul's present age = x years. Then father's age = 3x years."},{title:"Step 3: Express future ages",text:"After 10 years: Rahul = x + 10, Father = 3x + 10."},{title:"Step 4: Form the equation",text:"Sum of future ages = 70. So (x+10) + (3x+10) = 70. Simplify: 4x + 20 = 70."},{title:"Step 5: Solve!",text:"4x = 50. x = 12.5. Rahul = 12.5 years, Father = 37.5 years."}];
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Word Problem Builder</div><div id="wpProgress" style="text-align:center"></div><div class="sim-step-text active" id="wpStepText" style="min-height:60px"></div><div style="text-align:center;margin-top:8px"><button class="shape-btn" id="wpPrev">Prev</button><button class="shape-btn" id="wpNext">Next</button></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    var prog="";for(var i=0;i<wpSteps.length;i++){prog+='<span class="sim-dot" id="wpDot'+i+'" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#e2e8f0;margin:0 2px"></span>';}document.getElementById("wpProgress").innerHTML=prog;
    function draw(){for(var i=0;i<wpSteps.length;i++){var dot=document.getElementById("wpDot"+i);if(dot){dot.style.background=i<wpStep?"#10b981":(i===wpStep?"#4f46e5":"#e2e8f0");}}var s=wpSteps[wpStep];document.getElementById("wpStepText").innerHTML="<b>"+s.title+"</b><br>"+s.text;}
    document.getElementById("wpPrev").addEventListener("click",function(){if(wpStep>0){wpStep--;draw();}});document.getElementById("wpNext").addEventListener("click",function(){if(wpStep<wpSteps.length-1){wpStep++;draw();}});draw();
  },

  renderIxTrapeziumCalc:function(step,cb){
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Trapezium Area Calculator</div><div style="margin:6px 0"><label style="font-size:.72rem;font-weight:600">Parallel side a:</label><input type="number" id="tcA" value="20" style="width:100%;padding:6px;border:2px solid #e2e8f0;border-radius:8px;font-size:.85rem"></div><div style="margin:6px 0"><label style="font-size:.72rem;font-weight:600">Parallel side b:</label><input type="number" id="tcB" value="30" style="width:100%;padding:6px;border:2px solid #e2e8f0;border-radius:8px;font-size:.85rem"></div><div style="margin:6px 0"><label style="font-size:.72rem;font-weight:600">Height h:</label><input type="number" id="tcH" value="12" style="width:100%;padding:6px;border:2px solid #e2e8f0;border-radius:8px;font-size:.85rem"></div><button class="shape-btn" id="tcCalc" style="background:#4f46e5;color:#fff;border:none">Calculate</button><div class="discovery-box" id="tcResult" style="margin-top:8px"><div class="d-title">Enter values and tap Calculate</div><div class="d-text">Area = (1/2) x (a + b) x h</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    document.getElementById("tcCalc").addEventListener("click",function(){
      var a=parseFloat(document.getElementById("tcA").value);var b=parseFloat(document.getElementById("tcB").value);var h=parseFloat(document.getElementById("tcH").value);
      if(isNaN(a)||isNaN(b)||isNaN(h)||h<=0){document.getElementById("tcResult").innerHTML='<div class="d-title">Enter valid values</div>';return;}
      var sum=a+b;var area=0.5*sum*h;
      document.getElementById("tcResult").innerHTML='<div class="d-title">Area = '+area+'</div><div class="d-text">Step 1: a + b = '+a+' + '+b+' = '+sum+'<br>Step 2: (1/2) x '+sum+' x '+h+' = '+area+'</div>';
    });
  },
  renderIxSaExplorer:function(step,cb){
    var curShape="cube";
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Surface Area Explorer</div><div style="margin:6px 0"><label style="font-size:.72rem;font-weight:600">Shape:</label><br><button class="shape-btn active" id="saCube">Cube</button><button class="shape-btn" id="saCuboid">Cuboid</button><button class="shape-btn" id="saCyl">Cylinder</button></div><div id="saInputs" style="margin:8px 0"></div><button class="shape-btn" id="saCalc" style="background:#4f46e5;color:#fff;border:none">Calculate SA</button><div class="discovery-box" id="saResult" style="margin-top:8px"><div class="d-title">Select a shape and enter values!</div><div class="d-text">See the total surface area calculated step by step.</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    function showInputs(){
      if(curShape==="cube"){document.getElementById("saInputs").innerHTML='<label style="font-size:.72rem;font-weight:600">Side (a):</label><input type="number" id="saA" value="5" style="width:100%;padding:6px;border:2px solid #e2e8f0;border-radius:8px;font-size:.85rem">';}
      else if(curShape==="cuboid"){document.getElementById("saInputs").innerHTML='<label style="font-size:.72rem;font-weight:600">Length:</label><input type="number" id="saL" value="10" style="width:100%;padding:6px;border:2px solid #e2e8f0;border-radius:8px;font-size:.85rem"><label style="font-size:.72rem;font-weight:600">Breadth:</label><input type="number" id="saB" value="5" style="width:100%;padding:6px;border:2px solid #e2e8f0;border-radius:8px;font-size:.85rem"><label style="font-size:.72rem;font-weight:600">Height:</label><input type="number" id="saH" value="3" style="width:100%;padding:6px;border:2px solid #e2e8f0;border-radius:8px;font-size:.85rem">';}
      else{document.getElementById("saInputs").innerHTML='<label style="font-size:.72rem;font-weight:600">Radius (r):</label><input type="number" id="saR" value="7" style="width:100%;padding:6px;border:2px solid #e2e8f0;border-radius:8px;font-size:.85rem"><label style="font-size:.72rem;font-weight:600">Height (h):</label><input type="number" id="saH2" value="10" style="width:100%;padding:6px;border:2px solid #e2e8f0;border-radius:8px;font-size:.85rem">';}
    }
    document.getElementById("saCube").addEventListener("click",function(){curShape="cube";document.querySelectorAll("#saInputs").forEach(function(){});showInputs();document.getElementById("saCube").className="shape-btn active";document.getElementById("saCuboid").className="shape-btn";document.getElementById("saCyl").className="shape-btn";});
    document.getElementById("saCuboid").addEventListener("click",function(){curShape="cuboid";showInputs();document.getElementById("saCube").className="shape-btn";document.getElementById("saCuboid").className="shape-btn active";document.getElementById("saCyl").className="shape-btn";});
    document.getElementById("saCyl").addEventListener("click",function(){curShape="cylinder";showInputs();document.getElementById("saCube").className="shape-btn";document.getElementById("saCuboid").className="shape-btn";document.getElementById("saCyl").className="shape-btn active";});
    document.getElementById("saCalc").addEventListener("click",function(){
      if(curShape==="cube"){var a=parseFloat(document.getElementById("saA").value);if(isNaN(a)||a<=0){document.getElementById("saResult").innerHTML='<div class="d-title">Enter valid side</div>';return;}var sa=6*a*a;document.getElementById("saResult").innerHTML='<div class="d-title">Surface Area = '+sa+'</div><div class="d-text">SA = 6 x a^2 = 6 x '+a+' x '+a+' = '+sa+'</div>';}
      else if(curShape==="cuboid"){var l=parseFloat(document.getElementById("saL").value);var b=parseFloat(document.getElementById("saB").value);var h=parseFloat(document.getElementById("saH").value);if(isNaN(l)||isNaN(b)||isNaN(h)){document.getElementById("saResult").innerHTML='<div class="d-title">Enter valid values</div>';return;}var sa=2*(l*b+b*h+h*l);document.getElementById("saResult").innerHTML='<div class="d-title">Surface Area = '+sa+'</div><div class="d-text">SA = 2(lb + bh + hl) = 2('+l*b+' + '+b*h+' + '+h*l+') = '+sa+'</div>';}
      else{var r=parseFloat(document.getElementById("saR").value);var h=parseFloat(document.getElementById("saH2").value);if(isNaN(r)||isNaN(h)){document.getElementById("saResult").innerHTML='<div class="d-title">Enter valid values</div>';return;}var pi=22/7;var tsa=2*pi*r*(r+h);document.getElementById("saResult").innerHTML='<div class="d-title">TSA = '+tsa.toFixed(2)+'</div><div class="d-text">TSA = 2 x pi x r x (r + h) = 2 x '+pi.toFixed(2)+' x '+r+' x '+(r+h)+' = '+tsa.toFixed(2)+'</div>';}
    });
    showInputs();
  },
renderShop:function(){
    var self=this;var themes=[{id:"default",name:"Purple",icon:"🟣",cost:0},{id:"ocean",name:"Ocean",icon:"🌊",cost:50},{id:"forest",name:"Forest",icon:"🌲",cost:80},{id:"sunset",name:"Sunset",icon:"🌅",cost:100}];
    var html='<div class="shop-overlay" id="shopOv" onclick="if(event.target===this)document.getElementById(\'shopOv\').remove()"><div class="shop-modal"><div class="shop-title">🛒 Shop</div><div class="shop-coins">🪙 '+this.coins+'</div><div class="shop-grid">';
    for(var i=0;i<themes.length;i++){var th=themes[i];var owned=this.ownedThemes.indexOf(th.id)>=0||th.cost===0;var active=this.selTheme===th.id;
      html+='<div class="shop-item'+(owned?' owned':'')+'"><div class="shop-item-icon">'+th.icon+'</div><div class="shop-item-name">'+th.name+'</div>';
      if(!owned){html+='<div class="shop-item-cost">🪙 '+th.cost+'</div><button class="shop-buy-btn" data-buy="'+th.id+'" data-cost="'+th.cost+'">Buy</button>';}
      else if(active){html+='<div style="font-size:.7rem;color:var(--green);font-weight:700">✓ Active</div>';}
      else{html+='<button class="shop-buy-btn" data-apply="'+th.id+'">Apply</button>';}
      html+='</div>';}
    html+='</div><div style="text-align:center;margin-top:12px"><button class="btn btn-primary" style="max-width:200px" onclick="document.getElementById(\'shopOv\').remove()">Close</button></div></div></div>';
    var ex=document.getElementById("shopOv");if(ex)ex.remove();var div=document.createElement("div");div.innerHTML=html;document.body.appendChild(div.firstChild);
    var bb=document.querySelectorAll("[data-buy]");for(var i=0;i<bb.length;i++){bb[i].addEventListener("click",function(){var id=this.getAttribute("data-buy");var cost=parseInt(this.getAttribute("data-cost"));if(self.coins>=cost){self.coins-=cost;self.ownedThemes.push(id);self.selTheme=id;document.body.className="theme-"+id;self.updateStats();self.renderShop();}});}
    var ab=document.querySelectorAll("[data-apply]");for(var i=0;i<ab.length;i++){ab[i].addEventListener("click",function(){var id=this.getAttribute("data-apply");self.selTheme=id;document.body.className="theme-"+id;self.renderShop();});}
  }
};

App.init();
</script>
