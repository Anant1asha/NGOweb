<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Aasha — Fractions Chapter (Enhanced)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f4ff;--surface:#fff;--text:#1e293b;--muted:#64748b;
  --blue:#3b82f6;--blue-dk:#2563eb;--blue-lt:#dbeafe;
  --green:#22c55e;--green-dk:#16a34a;--green-lt:#dcfce7;
  --red:#ef4444;--red-lt:#fee2e2;
  --amber:#f59e0b;--amber-lt:#fef3c7;
  --purple:#8b5cf6;--purple-lt:#ede9fe;
  --pink:#ec4899;--teal:#14b8a6;
  --border:#e2e8f0;
  --shadow:0 2px 8px rgba(0,0,0,.06);--shadow-lg:0 8px 24px rgba(0,0,0,.15);
  --radius:16px;--radius-sm:12px;--radius-xs:8px;
  --brand:#1e3a5f;--brand-lt:#2d5a8e;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* Brand Header */
.brand-header{background:linear-gradient(135deg,var(--brand),var(--brand-lt));padding:8px 14px;display:flex;align-items:center;gap:10px;color:#fff}
.brand-logo{width:42px;height:42px;flex-shrink:0}
.brand-logo svg{width:100%;height:100%}
.brand-info{flex:1;min-width:0}
.brand-name{font-size:.78rem;font-weight:800;letter-spacing:.02em;line-height:1.2}
.brand-name-hi{font-size:.68rem;opacity:.85;line-height:1.2}
.brand-tagline{font-size:.6rem;opacity:.7;margin-top:1px}

/* Topbar */
.topbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:50}
.exit-btn{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;padding:4px}
.progress-track{flex:1;height:10px;background:var(--border);border-radius:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:10px;transition:width .5s cubic-bezier(.4,0,.2,1);width:0}
.stat{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:700;padding:3px 7px;border-radius:16px;white-space:nowrap;transition:transform .2s}
.stat.coins{color:var(--amber);background:var(--amber-lt)}
.stat.xp{color:var(--purple);background:var(--purple-lt)}
.stat.lvl{color:var(--blue);background:var(--blue-lt)}
.stat.streak{color:#ef4444;background:var(--red-lt)}
.stat.bump{transform:scale(1.3)}

/* Screen */
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 14px 90px;min-height:calc(100vh - 120px);animation:slideIn .35s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}

/* Intro */
.intro-icon{font-size:3.2rem;margin-bottom:8px;text-align:center;animation:pop .5s ease}
.intro-title{font-size:1.15rem;font-weight:800;text-align:center;margin-bottom:6px}
.intro-sub{color:var(--muted);font-size:.85rem;font-weight:600;text-align:center;margin-bottom:12px}

/* Instruction */
.instruction{text-align:center;font-size:.88rem;font-weight:700;color:var(--blue);margin:8px auto;padding:8px 14px;background:var(--blue-lt);border-radius:10px;max-width:400px}
.hint{font-size:.7rem;color:var(--muted);text-align:center;margin:6px 0}

/* LLE Text */
.lle-text{font-size:1.05rem;line-height:2.6;color:var(--text);max-width:380px;margin:8px auto;text-align:left}
.lle-text-sm{font-size:.9rem;line-height:2;color:var(--text);max-width:360px;margin:6px auto;text-align:left}
.word{cursor:pointer;border-radius:3px;padding:0 1px;transition:background .15s}.word:hover{background:#e0e7ff}
.connective{color:var(--blue);font-weight:700;cursor:pointer;border-bottom:2px dotted var(--blue);padding:0 1px}
.connective-hi{color:var(--purple);font-size:.85em;font-weight:600}

/* Fraction display */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1;margin:0 2px}
.frac-top{border-bottom:1.5px solid currentColor;padding:0 4px}
.frac-bot{padding:0 4px}
.frac-display{text-align:center;font-size:2rem;font-weight:800;margin:8px 0}

/* Cards */
.card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:14px;max-width:400px;width:100%;margin:0 auto 8px;box-shadow:var(--shadow)}
.card-caption{text-align:center;font-size:.78rem;color:var(--muted);margin-top:6px;line-height:1.4}
.canvas-visual{display:block;margin:0 auto;border-radius:var(--radius-xs)}

/* Game card */
.game-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:14px;max-width:400px;width:100%;margin:0 auto;box-shadow:var(--shadow)}
.game-card canvas{display:block;margin:0 auto;cursor:pointer;border-radius:var(--radius-xs);touch-action:none}

/* Worked Example */
.we-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:14px;max-width:400px;width:100%;margin:0 auto;box-shadow:var(--shadow)}
.we-tag{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);margin-bottom:6px}
.we-question{margin-bottom:10px}
.we-step{padding:10px 12px;background:var(--blue-lt);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;margin-bottom:6px;animation:stepReveal .35s ease}
.we-step.green{background:var(--green-lt);border-left-color:var(--green)}
.we-step.amber{background:var(--amber-lt);border-left-color:var(--amber)}
.we-step.final{padding:10px;background:var(--green-lt);border:2px solid var(--green);border-radius:10px;margin-top:6px;text-align:center;font-weight:700;color:var(--green-dk)}
.we-num{display:inline-block;width:20px;height:20px;background:var(--blue);color:#fff;border-radius:50%;text-align:center;font-size:.65rem;font-weight:700;line-height:20px;margin-right:6px}
.we-step.green .we-num{background:var(--green)}.we-step.amber .we-num{background:var(--amber)}
.we-visual{margin:8px 0}
@keyframes stepReveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Quiz */
.quiz-question{margin-bottom:14px;max-width:380px;margin-left:auto;margin-right:auto}
.quiz-opt{display:flex;align-items:flex-start;gap:10px;padding:12px;margin-bottom:7px;border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;background:var(--surface)}
.quiz-opt:hover{border-color:var(--blue)}
.quiz-opt.selected{border-color:var(--blue);background:var(--blue-lt)}
.quiz-opt.correct{border-color:var(--green);background:var(--green-lt)}
.quiz-opt.wrong{border-color:var(--red);background:var(--red-lt)}
.quiz-radio{width:20px;height:20px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;margin-top:1px;transition:all .15s}
.quiz-opt.selected .quiz-radio{border-color:var(--blue);background:var(--blue)}
.quiz-opt.correct .quiz-radio{border-color:var(--green);background:var(--green)}
.quiz-opt.wrong .quiz-radio{border-color:var(--red);background:var(--red)}
.quiz-opt-text{flex:1}

/* Feedback */
.feedback{padding:12px;border-radius:var(--radius-sm);margin:8px auto;max-width:380px;font-size:.85rem;text-align:center;line-height:1.4;animation:stepReveal .3s ease}
.feedback.ok{background:var(--green-lt);border:1px solid #86efac;color:#166534}
.feedback.no{background:var(--red-lt);border:1px solid #fca5a5;color:#991b1b}
.misconception{background:var(--red-lt);border:1px solid #fca5a5;border-radius:10px;padding:10px;margin:8px auto;max-width:380px;font-size:.8rem;color:#991b1b;line-height:1.4;animation:stepReveal .3s ease}

/* Visual quiz */
.vq-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:380px;margin:0 auto}
.vq-opt{padding:10px;border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;background:var(--surface);text-align:center}
.vq-opt:hover{border-color:var(--blue)}
.vq-opt.selected{border-color:var(--blue);background:var(--blue-lt)}
.vq-opt.correct{border-color:var(--green);background:var(--green-lt)}
.vq-opt.wrong{border-color:var(--red);background:var(--red-lt)}
.vq-opt canvas{display:block;margin:0 auto;border-radius:6px}

/* Drag-drop */
.dd-label{font-size:.8rem;color:var(--muted);text-align:center;margin-bottom:6px;font-weight:600}
.dd-zone{min-height:60px;border:2px dashed var(--border);border-radius:var(--radius-sm);padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;transition:all .2s}
.dd-zone.over{border-color:var(--green);background:var(--green-lt)}
.dd-zone.wrong{border-color:var(--red);background:var(--red-lt)}
.dd-item{padding:8px 14px;background:#f1f5f9;border:1px solid var(--border);border-radius:10px;cursor:grab;font-size:.9rem;font-weight:600;color:var(--text);transition:all .15s;user-select:none;touch-action:none}
.dd-item:hover{border-color:var(--blue);transform:scale(1.05)}
.dd-item.dragging{opacity:.5}
.dd-item.placed{background:var(--blue-lt);border-color:var(--blue)}

/* Input */
input[type=text]{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:1rem;margin-bottom:8px}
input[type=text]:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-lt)}
input[type=range]{width:100%;max-width:260px;accent-color:var(--blue);height:6px}

/* Tap area */
.tap-area{display:flex;gap:3px;justify-content:center;margin:12px auto;max-width:280px}
.tap-cell{flex:1;height:42px;border-radius:var(--radius-xs);border:3px solid var(--border);background:#f1f5f9;cursor:pointer;transition:all .15s;touch-action:none}
.tap-cell.tapped{background:var(--green);border-color:var(--green);transform:scale(1.05)}
.tap-count{text-align:center;font-size:1.2rem;font-weight:800;margin-top:6px}

/* Fraction label (vertical) */
.flb{display:flex;flex-direction:column;align-items:center;gap:2px;margin:8px auto}
.fn{font-size:2rem;font-weight:800;line-height:1;cursor:pointer}.fn:hover{transform:scale(1.1)}
.fln{width:48px;height:3px;background:var(--text);border-radius:2px}

/* Slider */
.slider-area{text-align:center;margin:12px auto}
.slider-display{font-size:1.6rem;font-weight:800;margin-bottom:6px}

/* Milestone / Progress */
.milestone-icon{font-size:3.5rem;margin-bottom:6px;animation:pop .5s ease}
.milestone-text{font-size:1.1rem;font-weight:700;text-align:center}
.milestone-reward{font-size:1.8rem;font-weight:800;color:var(--amber);margin:6px 0;animation:pop .4s ease .2s both}
.milestone-next{font-size:.8rem;color:var(--muted);margin-top:10px}

/* Complete */
.complete-icon{font-size:4rem;margin-bottom:8px;animation:pop .6s ease}
.complete-title{font-size:1.3rem;font-weight:800;margin-bottom:6px}
.complete-coins{font-size:2.5rem;font-weight:800;color:var(--amber);margin:10px 0}
.star-row{display:flex;gap:4px;justify-content:center;margin:8px 0}
.star-row span{font-size:1.8rem}
.chip{padding:3px 8px;border-radius:20px;font-size:.65rem;font-weight:600}

/* Bottom bar */
.bottom-bar{position:sticky;bottom:0;left:0;right:0;background:var(--surface);padding:10px 16px;box-shadow:0 -1px 3px rgba(0,0,0,.06);z-index:50}
.btn{width:100%;padding:13px;border:none;border-radius:13px;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-dk)}.btn-primary:disabled{background:#cbd5e1;cursor:not-allowed;color:#fff}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:var(--green-dk)}
.btn-amber{background:var(--amber);color:#fff}

/* Dialogs (native <dialog>) */
dialog{border:none;border-radius:18px;padding:24px;max-width:300px;width:100%;text-align:center;box-shadow:var(--shadow-lg);color:var(--text);animation:dlgIn .25s ease}
@keyframes dlgIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
dialog::backdrop{background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}
.dlg-word{font-size:1.5rem;font-weight:800}
.dlg-hindi{font-size:1.2rem;color:var(--purple);font-weight:600;margin-top:4px}
.dlg-desc{font-size:.8rem;color:var(--muted);margin-top:8px;line-height:1.4}
.dlg-btn{margin-top:14px;padding:8px 24px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:.85rem}
.dlg-btn:hover{background:var(--blue-dk)}
.lu-icon{font-size:3rem}.lu-title{font-size:1.2rem;font-weight:800;color:var(--amber);margin-top:4px}.lu-sub{font-size:.85rem;color:var(--muted);margin-top:6px}

/* Badge toast */
.badge-toast{position:fixed;top:110px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:12px 20px;box-shadow:var(--shadow-lg);z-index:95;text-align:center;animation:pop .4s ease}
.badge-toast-icon{font-size:2rem}.badge-toast-name{font-size:.8rem;font-weight:800;color:var(--amber)}.badge-toast-desc{font-size:.68rem;color:var(--muted)}

/* Streak combo indicator */
.combo-indicator{position:fixed;top:110px;right:16px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border-radius:12px;padding:6px 12px;font-size:.75rem;font-weight:800;z-index:90;display:none;box-shadow:0 4px 12px rgba(245,158,11,.4);animation:pop .3s ease}
.combo-indicator.show{display:block}

/* CSS 3D */
.css3d-scene{perspective:700px;width:100%;max-width:360px;margin:0 auto;padding:20px 0;touch-action:none}
.css3d-blocks{display:flex;gap:8px;justify-content:center;transform-style:preserve-3d;transition:transform .1s linear;transform:rotateX(-15deg) rotateY(-20deg)}
.css3d-block{width:40px;transition:transform .3s}
.css3d-block-filled{height:60px;background:linear-gradient(135deg,var(--blue),var(--blue-dk));border-radius:6px;box-shadow:0 4px 8px rgba(59,130,246,.3);border:1px solid rgba(255,255,255,.2)}
.css3d-block-empty{height:8px;background:var(--border);border-radius:3px;margin-top:26px}
.css3d-label{text-align:center;font-size:1.2rem;font-weight:800;margin-top:8px;color:var(--blue)}
.css3d-controls{display:flex;gap:8px;justify-content:center;margin-top:10px}
.css3d-btn{padding:6px 14px;background:var(--blue-lt);border:1px solid var(--blue);border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--blue)}
.css3d-btn:hover{background:var(--blue);color:#fff}

/* Confetti canvas */
#confettiCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:200}

/* Chapter map dialog */
.chap-map{max-width:360px}
.chap-map-title{font-size:1.1rem;font-weight:800;margin-bottom:10px}
.chap-map-list{display:flex;flex-direction:column;gap:6px;max-height:400px;overflow-y:auto}
.chap-map-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:.82rem;text-align:left}
.chap-map-item.done{background:var(--green-lt);border:1px solid #86efac}
.chap-map-item.current{background:var(--blue-lt);border:1px solid var(--blue);font-weight:600}
.chap-map-item.locked{opacity:.4}
.chap-map-ic{font-size:1.2rem}

/* Number line interactive */
.numline-container{position:relative;width:100%;max-width:320px;margin:0 auto;height:80px;touch-action:none}
</style>
</head>
<body>
<div class="app">
  <div class="brand-header">
    <div class="brand-logo">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e40af"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#60a5fa"/>
          </linearGradient>
          <linearGradient id="vine" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#15803d"/><stop offset="50%" stop-color="#22c55e"/><stop offset="100%" stop-color="#4ade80"/>
          </linearGradient>
          <linearGradient id="medal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24"/><stop offset="50%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/>
          </linearGradient>
        </defs>
        <!-- Left loop: water (infinity left) -->
        <path d="M 48 50 C 48 28, 28 18, 16 28 C 6 36, 8 50, 20 56 C 30 60, 42 56, 48 50 Z" fill="url(#water)" opacity="0.92"/>
        <!-- Water highlights -->
        <path d="M 32 30 C 26 32, 22 38, 24 44" stroke="#bfdbfe" stroke-width="2" fill="none" opacity="0.7"/>
        <circle cx="20" cy="40" r="1.5" fill="#dbeafe" opacity="0.8"/>
        <circle cx="26" cy="48" r="1" fill="#dbeafe" opacity="0.6"/>
        <!-- Right loop: vine (infinity right) -->
        <path d="M 52 50 C 52 72, 72 82, 84 72 C 94 64, 92 50, 80 44 C 70 40, 58 44, 52 50 Z" fill="url(#vine)" opacity="0.92"/>
        <!-- Vine leaves -->
        <ellipse cx="70" cy="38" rx="5" ry="2.5" fill="#22c55e" transform="rotate(-30 70 38)"/>
        <ellipse cx="78" cy="36" rx="4.5" ry="2.5" fill="#16a34a" transform="rotate(20 78 36)"/>
        <ellipse cx="62" cy="62" rx="4" ry="2" fill="#4ade80" transform="rotate(40 62 62)"/>
        <ellipse cx="76" cy="64" rx="4" ry="2.5" fill="#22c55e" transform="rotate(-25 76 64)"/>
        <ellipse cx="86" cy="56" rx="3.5" ry="2" fill="#15803d" transform="rotate(15 86 56)"/>
        <!-- Center crossing -->
        <ellipse cx="50" cy="50" rx="5" ry="4" fill="#1e3a5f" opacity="0.3"/>
        <!-- Book in lower-left loop -->
        <g transform="translate(22 44) rotate(-8)">
          <rect x="-6" y="-4" width="12" height="8" rx="1" fill="#dbeafe" stroke="#1e40af" stroke-width="0.6"/>
          <line x1="0" y1="-4" x2="0" y2="4" stroke="#3b82f6" stroke-width="0.5"/>
          <line x1="-4" y1="-1" x2="-1" y2="-1" stroke="#93c5fd" stroke-width="0.4"/>
          <line x1="-4" y1="1" x2="-1" y2="1" stroke="#93c5fd" stroke-width="0.4"/>
          <line x1="1" y1="-1" x2="4" y2="-1" stroke="#93c5fd" stroke-width="0.4"/>
          <line x1="1" y1="1" x2="4" y2="1" stroke="#93c5fd" stroke-width="0.4"/>
        </g>
        <!-- Water drop upper-right loop -->
        <path d="M 68 30 C 66 33, 64 36, 66 38 C 67 39, 69 39, 70 38 C 72 36, 70 33, 68 30 Z" fill="#60a5fa" opacity="0.9"/>
        <circle cx="67" cy="34" r="1" fill="#dbeafe" opacity="0.8"/>
        <!-- Gold medal on far right -->
        <g transform="translate(88 68)">
          <circle r="7" fill="url(#medal)" stroke="#b45309" stroke-width="0.6"/>
          <text x="0" y="1.5" text-anchor="middle" font-size="3" font-weight="bold" fill="#78350f">MERIT</text>
          <text x="0" y="5" text-anchor="middle" font-size="3" font-weight="bold" fill="#78350f">2024</text>
          <path d="M -5 -6 L -7 -11 M 5 -6 L 7 -11" stroke="#d97706" stroke-width="1.5" fill="none"/>
        </g>
        <!-- Small leaf at bottom -->
        <ellipse cx="50" cy="92" rx="3" ry="1.5" fill="#22c55e" transform="rotate(0 50 92)"/>
      </svg>
    </div>
    <div class="brand-info">
      <div class="brand-name">Annanth Aasha Foundation</div>
      <div class="brand-name-hi">अनन्त आशा फाउंडेशन</div>
      <div class="brand-tagline">Safe Learning. Real Impact.</div>
    </div>
  </div>
  <div class="topbar">
    <button class="exit-btn" onclick="App.exit()">✕</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="stat lvl" id="statLvl" onclick="App.showMap()">Lv 1</span>
    <span class="stat coins">🪙 <span id="statCoins">0</span></span>
    <span class="stat xp">⭐ <span id="statXp">0</span></span>
    <span class="stat streak" id="statStreakWrap" style="display:none">🔥 <span id="statStreak">0</span></span>
  </div>
  <div class="screen" id="screen"></div>
  <div class="bottom-bar" id="bottomBar" style="display:none"><button class="btn btn-primary" id="continueBtn" onclick="App.next()">Continue</button></div>
</div>

<dialog id="wordDialog"><div class="dlg-word" id="dlgWord"></div><div class="dlg-hindi" id="dlgHindi"></div><div class="dlg-desc" id="dlgDesc"></div><button class="dlg-btn" onclick="document.getElementById('wordDialog').close()">OK</button></dialog>

function rt(text,sm){
  var cls=sm?'lle-text-sm':'lle-text';var html=text;
  html=html.replace(/(\d+)\/(\d+)/g,'<span class="frac"><span class="frac-top">$1</span><span class="frac-bot">$2</span></span>');
  var keys=Object.keys(CONN).sort(function(a,b){return b.length-a.length});
  var connCount=0,result='',i=0;
  while(i<html.length){
    var ch=html[i];
    if(ch==='.'||ch==='!'||ch==='?'){connCount=0;result+=ch;i++;continue;}
    if(ch==='<'){var ci=html.indexOf('>',i);if(ci>=0){result+=html.substring(i,ci+1);i=ci+1;continue;}}
    var matched=false;
    if(i===0||!/[a-zA-Z]/.test(html[i-1])){
      for(var k=0;k<keys.length;k++){
        var c=keys[k];var sub=html.substring(i,i+c.length);
        if(sub.toLowerCase()===c.toLowerCase()){
          var ai=i+c.length;
          if(ai<html.length&&/[a-zA-Z]/.test(html[ai]))continue;
          var hi=CONN[c];connCount++;
          if(connCount<=2){
            result+='<span class="connective" data-w="'+sub+'" data-h="'+hi+'">'+sub+' <span class="connective-hi">('+hi+')</span></span>';
          }else{
            result+='<span class="word" data-w="'+sub.toLowerCase()+'" data-h="'+hi+'">'+sub+'</span>';
          }
          i+=c.length;matched=true;break;
        }
      }
    }
    if(matched)continue;
    if(/[a-zA-Z]/.test(ch)){
      var ws=i;while(i<html.length&&/[a-zA-Z]/.test(html[i]))i++;
      var word=html.substring(ws,i);var cw=word.toLowerCase();var hi=WM[cw];
      if(hi)result+='<span class="word" data-w="'+cw+'" data-h="'+hi+'">'+word+'</span>';
      else result+='<span class="word" data-w="'+cw+'" data-h="">'+word+'</span>';
    }else{result+=ch;i++;}
  }
  return '<div class="'+cls+'">'+result+'</div>';
}

// ═══ CANVAS VISUAL ENGINE (enhanced with animation) ═══
var COLORS={blue:'#3b82f6',green:'#22c55e',purple:'#8b5cf6',amber:'#f59e0b',red:'#ef4444',pink:'#ec4899',teal:'#14b8a6'};

function drawFracBar(canvas,num,den,color,progress){
  var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
  var p=progress!==undefined?progress:1;
  var segW=w/den;
  for(var i=0;i<den;i++){
    var fillPct=i<num?p:0;
    ctx.fillStyle=i<num?(COLORS[color]||color):'#e2e8f0';
    if(i<num){
      ctx.fillRect(i*segW+2,2,(segW-4)*fillPct,h-4);
      if(fillPct<1){ctx.fillStyle='#e2e8f0';ctx.fillRect(i*segW+2+(segW-4)*fillPct,2,(segW-4)*(1-fillPct),h-4);}
    }else{
      ctx.fillRect(i*segW+2,2,segW-4,h-4);
    }
    ctx.strokeStyle='#94a3b8';ctx.lineWidth=1.5;ctx.strokeRect(i*segW+2,2,segW-4,h-4);
  }
}

function animateFracBar(canvas,num,den,color){
  var start=performance.now(),dur=600;
  function frame(t){
    var e=Math.min((t-start)/dur,1);
    var eased=1-Math.pow(1-e,3);
    drawFracBar(canvas,num,den,color,eased);
    if(e<1)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function drawPizza(canvas,fillStates,total){
  var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
  var cx=w/2,cy=h/2,r=Math.min(w,h)/2-10;
  ctx.fillStyle='#fef3c7';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#b45309';ctx.lineWidth=3;ctx.stroke();
  var angle=2*Math.PI/total;
  for(var i=0;i<total;i++){
    var start=i*angle-Math.PI/2,end=(i+1)*angle-Math.PI/2;
    ctx.strokeStyle='#b45309';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(start)*r,cy+Math.sin(start)*r);ctx.stroke();
    if(fillStates[i]){ctx.fillStyle='rgba(251,191,116,0.85)';ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,start,end);ctx.closePath();ctx.fill();}
  }
}

function drawAreaModel(canvas,rows,cols,fillRows,fillCols,progress){
  var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
  var p=progress!==undefined?progress:1;
  var cellW=w/cols,cellH=h/rows;
  for(var r=0;r<rows;r++){for(var c=0;c<cols;c++){
    var x=c*cellW,y=r*cellH;var shaded=r<fillRows&&c<fillCols;
    if(shaded){
      ctx.fillStyle='#3b82f6';
      ctx.globalAlpha=p;ctx.fillRect(x+1,y+1,cellW-2,cellH-2);ctx.globalAlpha=1;
    }else{ctx.fillStyle='#e2e8f0';ctx.fillRect(x+1,y+1,cellW-2,cellH-2);}
    ctx.strokeStyle='#94a3b8';ctx.lineWidth=1;ctx.strokeRect(x+1,y+1,cellW-2,cellH-2);
  }}
}

function animateAreaModel(canvas,rows,cols,fillRows,fillCols){
  var start=performance.now(),dur=700;
  function frame(t){
    var e=Math.min((t-start)/dur,1);var eased=1-Math.pow(1-e,3);
    drawAreaModel(canvas,rows,cols,fillRows,fillCols,eased);
    if(e<1)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function drawNumLine(canvas,markers){
  var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
  var pad=30,lineY=h/2,lineW=w-pad*2,lineX=pad;
  ctx.strokeStyle='#94a3b8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(lineX,lineY);ctx.lineTo(lineX+lineW,lineY);ctx.stroke();
  // ticks
  for(var t=0;t<=4;t++){
    var tx=lineX+(lineW*t/4);
    ctx.strokeStyle='#cbd5e1';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(tx,lineY-5);ctx.lineTo(tx,lineY+5);ctx.stroke();
  }
  ctx.fillStyle='#64748b';ctx.font='12px sans-serif';ctx.textAlign='center';
  ctx.strokeStyle='#64748b';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(lineX,lineY-8);ctx.lineTo(lineX,lineY+8);ctx.stroke();
  ctx.fillText('0',lineX,lineY+24);
  ctx.beginPath();ctx.moveTo(lineX+lineW,lineY-8);ctx.lineTo(lineX+lineW,lineY+8);ctx.stroke();
  ctx.fillText('1',lineX+lineW,lineY+24);
  for(var i=0;i<markers.length;i++){
    var m=markers[i];var mx=lineX+m.pos*lineW;
    // glow
    ctx.fillStyle=m.color;ctx.globalAlpha=0.3;ctx.beginPath();ctx.arc(mx,lineY,14,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle=m.color;ctx.beginPath();ctx.arc(mx,lineY,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=m.color;ctx.font='bold 13px sans-serif';ctx.fillText(m.frac,mx,lineY-14);
  }
}

// ═══ INTERACTIVE CANVAS: Pizza (tap to fill) ═══
function setupPizzaCanvas(canvasId,total,onUpdate){
  var canvas=document.getElementById(canvasId);if(!canvas)return;
  var states=[];for(var i=0;i<total;i++)states.push(false);
  drawPizza(canvas,states,total);
  var r=canvas.width/2,cx=canvas.width/2,cy=canvas.height/2;
  var angle=2*Math.PI/total;
  function getSlice(x,y){
    var dx=x-cx,dy=y-cy,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>r)return-1;
    var theta=Math.atan2(dy,dx)+Math.PI/2;if(theta<0)theta+=2*Math.PI;
    return Math.floor(theta/angle)%total;
  }
  function handle(e){
    e.preventDefault();var rect=canvas.getBoundingClientRect();var scale=canvas.width/rect.width;
    var x=((e.clientX||e.touches[0].clientX)-rect.left)*scale;
    var y=((e.clientY||e.touches[0].clientY)-rect.top)*scale;
    var idx=getSlice(x,y);if(idx<0)return;
    states[idx]=!states[idx];drawPizza(canvas,states,total);playTone(states[idx]?'tap':'untap');
    var filled=states.filter(function(s){return s}).length;
    if(onUpdate)onUpdate(filled,total);
  }
  canvas.addEventListener('click',handle);canvas.addEventListener('touchstart',handle,{passive:false});
}

// ═══ INTERACTIVE CANVAS: Fraction bar (tap to fill) ═══
function setupBarCanvas(canvasId,den,onUpdate){
  var canvas=document.getElementById(canvasId);if(!canvas)return;
  var states=[];for(var i=0;i<den;i++)states.push(false);
  function draw(){
    var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
    var segW=w/den;
    for(var i=0;i<den;i++){
      ctx.fillStyle=states[i]?'#3b82f6':'#e2e8f0';ctx.fillRect(i*segW+2,2,segW-4,h-4);
      ctx.strokeStyle='#94a3b8';ctx.lineWidth=1.5;ctx.strokeRect(i*segW+2,2,segW-4,h-4);
    }
  }
  draw();
  function handle(e){
    e.preventDefault();var rect=canvas.getBoundingClientRect();var scale=canvas.width/rect.width;
    var x=((e.clientX||e.touches[0].clientX)-rect.left)*scale;
    var idx=Math.floor(x/(canvas.width/den));if(idx<0||idx>=den)return;
    states[idx]=!states[idx];draw();playTone(states[idx]?'tap':'untap');
    var filled=states.filter(function(s){return s}).length;
    if(onUpdate)onUpdate(filled,den);
  }
  canvas.addEventListener('click',handle);canvas.addEventListener('touchstart',handle,{passive:false});
}

// ═══ INTERACTIVE CANVAS: Area model ═══
function setupAreaCanvas(canvasId,rows,cols,fillRows,fillCols){
  var canvas=document.getElementById(canvasId);if(!canvas)return;
  animateAreaModel(canvas,rows,cols,fillRows,fillCols);
}

// ═══ CSS 3D BLOCKS (with drag rotate + auto-spin) ═══
var _rotY=-20,_rotX=-15,_autoSpin=null,_dragging3D=false;
function setupCSS3D(containerId,num,den){
  var container=document.getElementById(containerId);if(!container)return;
  var isProper=num<den;
  var label=isProper?'proper fraction':(num===den?'whole number':'improper fraction');
  var html='<div class="css3d-scene"><div class="css3d-blocks" id="css3dBlocks">';
  for(var i=0;i<den;i++){
    var filled=i<num;
    html+='<div class="css3d-block"><div class="'+(filled?'css3d-block-filled':'css3d-block-empty')+'"></div></div>';
  }
  html+='</div></div>';
  html+='<div class="css3d-controls"><button class="css3d-btn" onclick="rot3D(-15)">↺</button><button class="css3d-btn" onclick="rot3D(15)">↻</button><button class="css3d-btn" onclick="toggleAutoSpin()">🔄 Auto</button></div>';
  html+='<div class="css3d-label">'+num+' / '+den+' = '+label+'</div>';
  container.innerHTML=html;
  _rotY=-20;_rotX=-15;
  update3D();
  // drag support
  var scene=document.getElementById('css3dBlocks');
  var sx,sy,rx,ry;
  function dStart(e){_dragging3D=true;stopAutoSpin();var t=e.touches?e.touches[0]:e;sx=t.clientX;sy=t.clientY;rx=_rotX;ry=_rotY;e.preventDefault();}
  function dMove(e){if(!_dragging3D)return;var t=e.touches?e.touches[0]:e;_rotY=ry+(t.clientX-sx)*0.5;_rotX=rx-(t.clientY-sy)*0.5;update3D();e.preventDefault();}
  function dEnd(){_dragging3D=false;}
  scene.addEventListener('mousedown',dStart);scene.addEventListener('touchstart',dStart,{passive:false});
  document.addEventListener('mousemove',dMove);document.addEventListener('touchmove',dMove,{passive:false});
  document.addEventListener('mouseup',dEnd);document.addEventListener('touchend',dEnd);
}
function update3D(){var el=document.getElementById('css3dBlocks');if(el)el.style.transform='rotateX('+_rotX+'deg) rotateY('+_rotY+'deg)';}
function rot3D(d){_rotY+=d;update3D();}
function toggleAutoSpin(){if(_autoSpin)stopAutoSpin();else startAutoSpin();}
function startAutoSpin(){_autoSpin=setInterval(function(){if(!_dragging3D){_rotY+=2;update3D();}},50);}
function stopAutoSpin(){if(_autoSpin){clearInterval(_autoSpin);_autoSpin=null;}}

// ═══ TOUCH DRAG-DROP ═══
function setupTouchDrag(items,zone,onDrop){
  var dragEl=null,dragOffsetX=0,dragOffsetY=0;
  for(var i=0;i<items.length;i++){
    (function(item){
      function start(e){
        e.preventDefault();dragEl=item;dragEl.classList.add('dragging');
        var rect=dragEl.getBoundingClientRect();var touch=e.touches?e.touches[0]:e;
        dragOffsetX=touch.clientX-rect.left;dragOffsetY=touch.clientY-rect.top;
      }
      item.addEventListener('mousedown',start);item.addEventListener('touchstart',start,{passive:false});
    })(items[i]);
  }
  function move(e){
    if(!dragEl)return;e.preventDefault();var touch=e.touches?e.touches[0]:e;
    var zr=zone.getBoundingClientRect();
    var over=touch.clientX>=zr.left&&touch.clientX<=zr.right&&touch.clientY>=zr.top&&touch.clientY<=zr.bottom;
    zone.classList.toggle('over',over);
  }
  document.addEventListener('mousemove',move);document.addEventListener('touchmove',move,{passive:false});
  function end(e){
    if(!dragEl)return;var touch=e.changedTouches?e.changedTouches[0]:e;
    var zr=zone.getBoundingClientRect();
    var over=touch.clientX>=zr.left&&touch.clientX<=zr.right&&touch.clientY>=zr.top&&touch.clientY<=zr.bottom;
    dragEl.classList.remove('dragging');
    if(over&&!dragEl.classList.contains('placed')){onDrop(dragEl,zone);}
    dragEl=null;zone.classList.remove('over');
  }
  document.addEventListener('mouseup',end);document.addEventListener('touchend',end);
}

// ═══ WEB AUDIO SOUND EFFECTS ═══
var _audioCtx=null;
function getAudio(){if(!_audioCtx){try{_audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return _audioCtx;}
function playTone(type){
  var ctx=getAudio();if(!ctx)return;
  var now=ctx.currentTime;
  var freqs={tap:523,untap:392,correct:[523,659,784],wrong:[311,233],levelup:[523,659,784,1047],complete:[523,659,784,1047,1319]};
  var f=freqs[type]||523;
  if(typeof f==='number'){
    var osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.frequency.value=f;osc.type='sine';
    gain.gain.setValueAtTime(0.15,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.3);
    osc.connect(gain);gain.connect(ctx.destination);osc.start(now);osc.stop(now+0.3);
  }else{
    for(var i=0;i<f.length;i++){
      var osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.frequency.value=f[i];osc.type='sine';
      var t=now+i*0.1;
      gain.gain.setValueAtTime(0.15,t);gain.gain.exponentialRampToValueAtTime(0.001,t+0.25);
      osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+0.25);
    }
  }
}

// ═══ CONFETTI SYSTEM ═══
var _confetti=[],_confettiRAF=null;
function fireConfetti(count){
  var canvas=document.getElementById('confettiCanvas');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  var ctx=canvas.getContext('2d');
  var colors=['#3b82f6','#22c55e','#f59e0b','#8b5cf6','#ec4899','#14b8a6'];
  count=count||50;
  for(var i=0;i<count;i++){
    _confetti.push({
      x:canvas.width/2+(Math.random()-0.5)*100,y:canvas.height/3,
      vx:(Math.random()-0.5)*8,vy:-Math.random()*8-4,
      g:0.3,size:Math.random()*6+4,color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360,vrot:(Math.random()-0.5)*10,life:1
    });
  }
  if(!_confettiRAF)_confettiRAF=requestAnimationFrame(updateConfetti);
}
function updateConfetti(){
  var canvas=document.getElementById('confettiCanvas');var ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(var i=_confetti.length-1;i>=0;i--){
    var p=_confetti[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vrot;p.life-=0.008;
    if(p.y>canvas.height+20||p.life<=0){_confetti.splice(i,1);continue;}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
    ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.color;
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    ctx.restore();
  }
  if(_confetti.length>0){_confettiRAF=requestAnimationFrame(updateConfetti);}
  else{_confettiRAF=null;ctx.clearRect(0,0,canvas.width,canvas.height);}
}

// ── App ──
var App={
  nIdx:0,sIdx:0,coins:0,xp:0,level:1,streak:0,selOpt:null,answered:false,
  weStepIdx:0,solveStepIdx:0,solveAnswered:false,retryTimer:null,
  tapCount:0,tapped:{},

  init:function(){
    try{var s=JSON.parse(localStorage.getItem('aasha_v4')||'{}');
    if(s.nIdx!==undefined){this.nIdx=s.nIdx;this.sIdx=s.sIdx;this.coins=s.coins||0;this.xp=s.xp||0;this.level=s.level||1;this.streak=s.streak||0;earnedBadges=s.badges||{};}}catch(e){}
    this.render();
  },
  save:function(){try{localStorage.setItem('aasha_v4',JSON.stringify({nIdx:this.nIdx,sIdx:this.sIdx,coins:this.coins,xp:this.xp,level:this.level,streak:this.streak,badges:earnedBadges}))}catch(e){}},
  updateStats:function(){
    document.getElementById('statCoins').textContent=this.coins;
    document.getElementById('statXp').textContent=this.xp;
    document.getElementById('statLvl').textContent='Lv '+this.level;
    var sw=document.getElementById('statStreakWrap');
    if(this.streak>=2){sw.style.display='inline-flex';document.getElementById('statStreak').textContent=this.streak;}
    else{sw.style.display='none';}
  },
  checkLevelUp:function(){
    var nl=1;for(var i=LEVELS.length-1;i>=0;i--){if(this.xp>=LEVELS[i].xp){nl=i+1;break}}
    if(nl>this.level){
      this.level=nl;var lv=LEVELS[this.level-1];
      var d=document.getElementById('levelUpDialog');
      document.getElementById('luIcon').textContent=lv.ic;
      document.getElementById('luTitle').textContent='Level '+this.level+': '+lv.name+'!';
      document.getElementById('luSub').textContent='You earned '+this.xp+' XP. Keep going!';
      if(!d.open)d.showModal();
      playTone('levelup');fireConfetti(80);
    }
  },
  checkBadges:function(){
    var checks=[{idx:1,id:"first"},{idx:6,id:"add"},{idx:9,id:"mult"},{idx:10,id:"div"},{idx:10,id:"champ"}];
    for(var i=0;i<checks.length;i++){var c=checks[i];
      if(this.nIdx>=c.idx&&!earnedBadges[c.id]){
        earnedBadges[c.id]=true;
        var b=BADGES.filter(function(x){return x.id===c.id})[0];
        if(b)this.showBadge(b);
      }
    }
  },
  showBadge:function(b){
    var t=document.createElement('div');t.className='badge-toast';
    t.innerHTML='<div class="badge-toast-icon">'+b.ic+'</div><div class="badge-toast-name">'+b.name+'</div><div class="badge-toast-desc">'+b.desc+'</div>';
    document.body.appendChild(t);setTimeout(function(){t.remove()},3000);
  },
  awardXP:function(amount){
    var bonus=0;
    if(this.streak>=3)bonus=Math.floor(amount*0.5);
    else if(this.streak>=2)bonus=Math.floor(amount*0.25);
    var total=amount+bonus;
    this.xp+=total;
    if(bonus>0){this.showCombo(bonus);}
    bumpStat('statXp');
    this.updateStats();
  },
  showCombo:function(bonus){
    var ci=document.getElementById('comboInd');
    ci.textContent='🔥 +'+bonus+' XP combo!';
    ci.classList.add('show');
    setTimeout(function(){ci.classList.remove('show');},2000);
  },
  showMap:function(){
    var html='';
    for(var i=0;i<NODES.length;i++){
      var n=NODES[i],cls='';
      if(i<this.nIdx)cls='done';
      else if(i===this.nIdx)cls='current';
      else cls='locked';
      var ic=cls==='done'?'✓':(cls==='current'?'▶':'🔒');
      html+='<div class="chap-map-item '+cls+'"><span class="chap-map-ic">'+n.icon+'</span><span><strong>'+n.title+'</strong><br><span style="font-size:.72rem;color:var(--muted)">'+n.title_hi+'</span></span><span style="margin-left:auto">'+ic+'</span></div>';
    }
    document.getElementById('chapMapList').innerHTML=html;
    var d=document.getElementById('chapterMapDialog');if(!d.open)d.showModal();
  },
  exit:function(){if(confirm('Exit? Your progress is saved.')){this.save();this.nIdx=0;this.sIdx=0;this.render();}},
  clearRetry:function(){if(this.retryTimer){clearTimeout(this.retryTimer);this.retryTimer=null;}},

  render:function(){
    this.clearRetry();stopAutoSpin();
    var node=NODES[this.nIdx],step=node.steps[this.sIdx];
    var total=0;for(var i=0;i<NODES.length;i++)total+=NODES[i].steps.length;
    var done=0;for(var i=0;i<this.nIdx;i++)done+=NODES[i].steps.length;done+=this.sIdx+1;
    document.getElementById('progressFill').style.width=(done/total*100)+'%';
    this.updateStats();
    var sc=document.getElementById('screen'),bb=document.getElementById('bottomBar'),cb=document.getElementById('continueBtn');
    sc.style.animation='none';sc.offsetHeight;sc.style.animation='';

    if(step.t==='intro')this.renderIntro(step,cb);
    else if(step.t==='text')this.renderText(step,cb);
    else if(step.t==='ctx_visual')this.renderCtxVisual(step,cb);
    else if(step.t==='canvas_visual')this.renderCanvasVisual(step,cb);
    else if(step.t==='ix_pizza')this.renderIXPizza(step,cb);
    else if(step.t==='ix_bar')this.renderIXBar(step,cb);
    else if(step.t==='ix_area')this.renderIXArea(step,cb);
    else if(step.t==='ix_tap')this.renderIXTap(step,cb);
    else if(step.t==='ix_tap_label')this.renderIXTapLabel(step,cb);
    else if(step.t==='ix_slider')this.renderIXSlider(step,cb);
    else if(step.t==='css3d')this.renderCSS3D(step,cb);
    else if(step.t==='worked')this.renderWorked(step,cb);
    else if(step.t==='solve')this.renderSolve(step,cb);
    else if(step.t==='dd_build')this.renderDDBuild(step,cb);
    else if(step.t==='dd_match')this.renderDDMatch(step,cb);
    else if(step.t==='vq')this.renderVQ(step,cb);
    else if(step.t==='quiz')this.renderQuiz(step,cb);
    else if(step.t==='progress')this.renderProgress(step,node,cb);
  },

  renderIntro:function(step,cb){
    var subHtml=rt(step.sub,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'');
    document.getElementById('screen').innerHTML='<div style="text-align:center"><div class="intro-icon">'+step.icon+'</div><div class="intro-title">'+step.title+'</div><div class="intro-sub">'+subHtml+'</div></div>';
    document.getElementById('bottomBar').style.display='block';cb.textContent='Start';cb.className='btn btn-primary';cb.disabled=false;
  },
  renderText:function(step,cb){
    document.getElementById('screen').innerHTML=rt(step.text)+'<div class="hint">Blue = connecting words · Tap any word for Hindi</div>';
    document.getElementById('bottomBar').style.display='block';cb.textContent='Continue';cb.className='btn btn-primary';cb.disabled=false;
  },

  // ── Static visual (from stable Aasha: fraction label, compare bars, pizza, numline) ──
  renderCtxVisual:function(step,cb){
    var v=step.vis,html='';
    if(v.type==='flab_ctx'){
      html='<div class="card"><div class="flb"><div class="fn" style="color:var(--blue)">'+v.num+'</div><div class="fln"></div><div class="fn" style="color:var(--purple)">'+v.den+'</div></div><div style="display:flex;gap:40px;margin-top:4px;font-size:.7rem;justify-content:center"><span style="color:var(--blue);font-weight:600">↑ '+v.numLabel+'</span><span style="color:var(--purple);font-weight:600">↑ '+v.denLabel+'</span></div><div class="card-caption">'+v.caption+'</div></div>';
    }
    else if(v.type==='fbar_ctx'){
      html='<div class="card"><canvas id="cv" width="320" height="50" class="canvas-visual"></canvas><div class="frac-display"><span class="frac"><span class="frac-top">'+v.num+'</span><span class="frac-bot">'+v.den+'</span></span></div><div class="card-caption">'+v.caption+'</div></div>';
    }
    document.getElementById('screen').innerHTML=html;
    if(v.type==='fbar_ctx'){animateFracBar(document.getElementById('cv'),v.num,v.den,v.color);}
    document.getElementById('bottomBar').style.display='block';cb.textContent='Continue';cb.className='btn btn-primary';cb.disabled=false;
  },

  // ── Canvas visual (from v3.1: bars, compare, add_merge, numline, division) ──
  renderCanvasVisual:function(step,cb){
    var d=step.draw,html='<div class="card">';
    if(d.type==='fbar'){html+='<canvas id="cv" width="320" height="50" class="canvas-visual"></canvas><div class="frac-display"><span class="frac"><span class="frac-top">'+d.num+'</span><span class="frac-bot">'+d.den+'</span></span></div>';}
    else if(d.type==='cmp'){
      for(var i=0;i<d.bars.length;i++){var b=d.bars[i];
        html+='<canvas id="cv'+i+'" width="320" height="40" class="canvas-visual"></canvas><div style="text-align:center;font-size:.8rem;font-weight:600;margin-bottom:4px">'+b.num+'/'+b.den+'</div>';
      }
      if(d.eq)html+='<div style="text-align:center;font-size:1rem;font-weight:700;color:var(--green);margin:4px 0">'+d.eq+'</div>';
    }
    else if(d.type==='add_merge'){
      html+='<canvas id="cv0" width="320" height="40" class="canvas-visual"></canvas><div style="text-align:center;font-size:1.2rem;font-weight:800;color:var(--green)">+</div><canvas id="cv1" width="320" height="40" class="canvas-visual"></canvas><div style="text-align:center;font-size:1.2rem;font-weight:800;color:var(--green)">=</div><canvas id="cv2" width="320" height="40" class="canvas-visual"></canvas>';
    }
    else if(d.type==='numline'){html+='<canvas id="cv" width="320" height="80" class="canvas-visual"></canvas>';}
    else if(d.type==='division'){
      html+='<div style="text-align:center;font-size:1.2rem;font-weight:700;margin:8px 0"><span class="frac"><span class="frac-top">'+d.a_num+'</span><span class="frac-bot">'+d.a_den+'</span></span> ÷ <span class="frac"><span class="frac-top">'+d.b_num+'</span><span class="frac-bot">'+d.b_den+'</span></span></div><div style="text-align:center;font-size:.9rem;color:var(--amber);margin:8px 0">Flip the second → <span class="frac"><span class="frac-top">'+d.b_den+'</span><span class="frac-bot">'+d.b_num+'</span></span></div><div style="text-align:center;font-size:1.2rem;font-weight:700;color:var(--green)">= <span class="frac"><span class="frac-top">'+(d.a_num*d.b_den)+'</span><span class="frac-bot">'+(d.a_den*d.b_num)+'</span></span></div>';
    }
    html+='<div class="card-caption">'+step.caption+'</div></div>';
    document.getElementById('screen').innerHTML=html;
    if(d.type==='fbar'){animateFracBar(document.getElementById('cv'),d.num,d.den,d.color);}
    else if(d.type==='cmp'){for(var i=0;i<d.bars.length;i++){animateFracBar(document.getElementById('cv'+i),d.bars[i].num,d.bars[i].den,d.bars[i].color);}}
    else if(d.type==='add_merge'){animateFracBar(document.getElementById('cv0'),d.a_num,d.a_den,d.color_a);animateFracBar(document.getElementById('cv1'),d.b_num,d.b_den,d.color_b);animateFracBar(document.getElementById('cv2'),d.a_num+d.b_num,d.a_den,d.color_a);}
    else if(d.type==='numline'){drawNumLine(document.getElementById('cv'),d.markers);}
    document.getElementById('bottomBar').style.display='block';cb.textContent='Continue';cb.className='btn btn-primary';cb.disabled=false;
  },

  // ── Interactive: Tap blocks ──
  renderIXTap:function(step,cb){

    document.getElementById('screen').innerHTML='<div class="instruction">'+rt(step.instruction,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'')+'</div><div class="tap-area">'+s+'</div><div class="tap-count" id="tCount">0 tapped</div>';

    if(this.tapped[i])return;this.tapped[i]=true;
    var bs=document.querySelectorAll('.tap-cell');
    for(var j=0;j<bs.length;j++)if(bs[j].getAttribute('data-i')==i)bs[j].classList.add('tapped');
    this.tapCount++;playTone('tap');
    document.getElementById('tCount').textContent=this.tapCount+' tapped';
    if(this.tapCount>=this._ix.correct){
      document.getElementById('tCount').innerHTML='<span style="color:var(--green)">✓ '+this._ix.ok+'</span>';
      document.getElementById('continueBtn').disabled=false;
    }
  },

    this.weStepIdx=0;var we=step.we;
    document.getElementById('screen').innerHTML='<div class="we-card"><div class="we-tag">'+we.title+'</div><div class="we-question">'+rt(we.question,true)+'</div><div id="weSteps"></div></div>';
    this.showNextWE(we,cb);
  },
  showNextWE:function(we,cb){
    if(this.weStepIdx>=we.steps.length)return;
    var s=we.steps[this.weStepIdx];var c=document.getElementById('weSteps');var div=document.createElement('div');
    var cls=s.c==='green'?'green':(s.c==='amber'?'amber':'');div.className='we-step '+cls;
    var inner=rt(s.text,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'');
    if(s.final){div.classList.add('final');div.innerHTML=inner;playTone('correct');}
    else{div.innerHTML='<span class="we-num">'+(this.weStepIdx+1)+'</span>'+inner;playTone('tap');}
    c.appendChild(div);this.weStepIdx++;
    if(this.weStepIdx>=we.steps.length){cb.textContent='Continue →';cb.disabled=false;}
    else{cb.textContent='Next Step →';cb.disabled=false;}
  },

  // ── Solve ──
  renderSolve:function(step,cb){
    this.solveStepIdx=0;this.solveAnswered=false;var sl=step.sl;
    document.getElementById('screen').innerHTML='<div class="we-card"><div class="we-tag">'+sl.title+'</div><div class="we-question">'+rt(sl.question,true)+'</div><div id="slArea"></div></div>';
    this.showSolveStep(sl,cb);
  },
  showSolveStep:function(sl,cb){
    if(this.solveStepIdx>=sl.steps.length){
      document.getElementById('slArea').innerHTML='<div class="we-step final">✓ Problem solved! All steps correct.</div>';
      cb.textContent='Continue →';cb.disabled=false;return;
    }
    var step=sl.steps[this.solveStepIdx];var area=document.getElementById('slArea');this.solveAnswered=false;
    var promptHtml='<div class="we-step" style="margin-top:8px"><span class="we-num">'+(this.solveStepIdx+1)+'</span>'+rt(step.prompt,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'')+'</div>';
    var inputHtml='';
    if(step.type==='mcq'){inputHtml='<div style="margin-top:8px">';for(var i=0;i<step.opts.length;i++){inputHtml+='<div class="quiz-opt" onclick="App.selSolve('+i+')" id="so'+i+'"><div class="quiz-radio"></div><div class="quiz-opt-text">'+rt(step.opts[i].t,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'')+'</div></div>';}inputHtml+='</div>';}
    else if(step.type==='input'){inputHtml='<div style="margin-top:8px"><input type="text" id="slInput" placeholder="Type your answer..." oninput="document.getElementById(\'continueBtn\').disabled=this.value.trim()?false:true"><div style="font-size:.7rem;color:#64748b;margin-top:4px" class="format-hint">Write fractions as numerator/denominator, e.g. 3/4. Use numbers only for numeric answers.</div></div>';}
    area.innerHTML=promptHtml+inputHtml+'<div id="slFb"></div>';
    cb.textContent='Check';cb.disabled=true;
  },
  selSolve:function(i){if(this.solveAnswered)return;this.selOpt=i;var opts=document.querySelectorAll('#slArea .quiz-opt');for(var j=0;j<opts.length;j++)opts[j].classList.remove('selected');document.getElementById('so'+i).classList.add('selected');document.getElementById('continueBtn').disabled=false;document.getElementById('continueBtn').textContent='Check';},
  checkSolve:function(){
    var sl=NODES[this.nIdx].steps[this.sIdx].sl,step=sl.steps[this.solveStepIdx];this.solveAnswered=true;
    var fb=document.getElementById('slFb'),correct=false,misc='';
    if(step.type==='mcq'){var opt=step.opts[this.selOpt];correct=opt.c;var opts=document.querySelectorAll('#slArea .quiz-opt');for(var i=0;i<opts.length;i++){opts[i].style.pointerEvents='none';if(step.opts[i].c)opts[i].classList.add('correct');else if(i===this.selOpt&&!opt.c)opts[i].classList.add('wrong');}if(!opt.c)misc=opt.m;}
    else if(step.type==='input'){var val=document.getElementById('slInput').value.trim();var ans=step.answer;correct=(val===ans||val===ans.replace(/\s/g,''));document.getElementById('slInput').disabled=true;if(!correct)misc=step.m;}
    if(correct){
      fb.innerHTML='<div class="feedback ok">✓ Correct! +5 XP</div>';
      this.streak++;this.awardXP(5);this.updateStats();playTone('correct');
      document.getElementById('continueBtn').textContent='Next Step →';document.getElementById('continueBtn').disabled=false;
    }else{
      this.streak=0;this.updateStats();playTone('wrong');
      fb.innerHTML='<div class="feedback no">✗ Not quite.</div>'+(misc?'<div class="misconception">'+rt('⚠ '+misc,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'')+'</div>':'');
      document.getElementById('continueBtn').textContent='Try again';
      var self=this;this.retryTimer=setTimeout(function(){
        self.solveAnswered=false;self.selOpt=null;
        if(step.type==='mcq'){var o2=document.querySelectorAll('#slArea .quiz-opt');for(var i=0;i<o2.length;i++){o2[i].classList.remove('selected','correct','wrong');o2[i].style.pointerEvents='';}}
        else{var inp=document.getElementById('slInput');if(inp){inp.disabled=false;inp.value='';}}
        fb.innerHTML='';document.getElementById('continueBtn').textContent='Check';document.getElementById('continueBtn').disabled=true;
      },5000);
    }
  },

  // ── Drag-Drop Build ──
  renderDDBuild:function(step,cb){
    var self=this;var piecesHtml='';
    for(var i=0;i<step.target_den;i++)piecesHtml+='<div class="dd-item" id="dd'+i+'" data-id="'+i+'">▢</div>';
    document.getElementById('screen').innerHTML='<div class="instruction">'+rt(step.instruction,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'')+'</div><div class="dd-label">Drag pieces here (need '+step.target_num+'):</div><div class="dd-zone" id="dropZone" style="min-height:70px"></div><div class="frac-display" id="ddFrac">0/'+step.target_den+'</div><div class="dd-label">Available pieces:</div><div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:300px;margin:0 auto">'+piecesHtml+'</div><div id="ddFb"></div>';
    var placed=0;var items=document.querySelectorAll('.dd-item');var zone=document.getElementById('dropZone');
    setupTouchDrag(items,zone,function(el,zone){if(el.classList.contains('placed'))return;el.classList.add('placed');zone.appendChild(el);placed++;playTone('tap');
      document.getElementById('ddFrac').innerHTML='<span class="frac"><span class="frac-top">'+placed+'</span><span class="frac-bot">'+step.target_den+'</span></span>';
      if(placed===step.target_num){document.getElementById('ddFb').innerHTML='<div class="feedback ok">✓ Correct! '+step.target_num+'/'+step.target_den+'!</div>';self.streak++;self.awardXP(10);self.updateStats();playTone('correct');fireConfetti(30);cb.textContent='Continue →';cb.disabled=false;}
      else if(placed>step.target_num){document.getElementById('ddFb').innerHTML='<div class="feedback no">✗ Too many! You need '+step.target_num+', not '+placed+'.</div>';playTone('wrong');}
    });
    document.getElementById('bottomBar').style.display='block';cb.textContent='Check';cb.className='btn btn-primary';cb.disabled=true;
  },

  // ── Drag-Drop Match ──
  renderDDMatch:function(step,cb){
    var self=this;var matched=0;var totalPairs=step.pairs.length;
    var rightShuffled=step.pairs.slice().sort(function(){return Math.random()-0.5});
    var leftHtml='',rightHtml='';
    for(var i=0;i<step.pairs.length;i++)leftHtml+='<div class="dd-item" id="ml'+i+'" data-match="'+step.pairs[i].b+'">'+step.pairs[i].a+'</div>';
    for(var i=0;i<rightShuffled.length;i++){rightHtml+='<div class="dd-zone" id="mz'+i+'" data-accept="'+rightShuffled[i].a+'" style="min-height:50px;min-width:60px"><div style="font-size:.8rem;color:var(--muted)">'+rightShuffled[i].a+' = ?</div></div>';}
    document.getElementById('screen').innerHTML='<div class="instruction">'+rt(step.instruction,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'')+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:380px;margin:0 auto"><div><div class="dd-label">Drag from here:</div>'+leftHtml+'</div><div><div class="dd-label">Drop here:</div>'+rightHtml+'</div></div><div id="ddFb"></div>';
    var items=document.querySelectorAll('.dd-item');var zones=document.querySelectorAll('.dd-zone');
    for(var k=0;k<zones.length;k++){
      (function(zone){
        setupTouchDrag(items,zone,function(el,zone){
          if(el.classList.contains('placed'))return;
          var zoneFrac=zone.getAttribute('data-accept');
          if(el.getAttribute('data-match')===zoneFrac){
            el.classList.add('placed');zone.appendChild(el);zone.style.borderColor='var(--green)';zone.style.background='var(--green-lt)';matched++;playTone('tap');
            if(matched===totalPairs){document.getElementById('ddFb').innerHTML='<div class="feedback ok">✓ All matched!</div>';self.streak++;self.awardXP(10);self.updateStats();playTone('correct');fireConfetti(40);cb.textContent='Continue →';cb.disabled=false;}
          }else{zone.classList.add('wrong');playTone('wrong');document.getElementById('ddFb').innerHTML='<div class="feedback no">✗ Not equivalent. Try again!</div>';setTimeout(function(){zone.classList.remove('wrong')},1500);}
        });
      })(zones[k]);
    }
    document.getElementById('bottomBar').style.display='block';cb.textContent='Check';cb.className='btn btn-primary';cb.disabled=true;
  },

  // ── Visual Quiz ──
  renderVQ:function(step,cb){
    this.selOpt=null;this.answered=false;var opts='';
    for(var i=0;i<step.q.opts.length;i++){var o=step.q.opts[i];opts+='<div class="vq-opt" onclick="App.selVQ('+i+')" id="vqo'+i+'"><canvas width="140" height="30" id="vqc'+i+'"></canvas><div style="font-size:.75rem;margin-top:4px">'+o.num+'/'+o.den+'</div></div>';}
    document.getElementById('screen').innerHTML='<div class="instruction">'+rt(step.q.q,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'')+'</div><div class="vq-grid">'+opts+'</div><div id="vqf"></div>';
    for(var i=0;i<step.q.opts.length;i++)animateFracBar(document.getElementById('vqc'+i),step.q.opts[i].num,step.q.opts[i].den,step.q.opts[i].color);
    document.getElementById('bottomBar').style.display='block';cb.textContent='Check';cb.className='btn btn-primary';cb.disabled=true;
  },
  selVQ:function(i){if(this.answered)return;this.selOpt=i;var opts=document.querySelectorAll('.vq-opt');for(var j=0;j<opts.length;j++)opts[j].classList.remove('selected');document.getElementById('vqo'+i).classList.add('selected');document.getElementById('continueBtn').disabled=false;},
  checkVQ:function(){
    var step=NODES[this.nIdx].steps[this.sIdx],q=step.q,opt=q.opts[this.selOpt];this.answered=true;
    var opts=document.querySelectorAll('.vq-opt');for(var i=0;i<opts.length;i++){opts[i].style.pointerEvents='none';if(q.opts[i].c)opts[i].classList.add('correct');else if(i===this.selOpt&&!opt.c)opts[i].classList.add('wrong');}
    var fb=document.getElementById('vqf');
    if(opt.c){fb.innerHTML='<div class="feedback ok">✓ Correct! +5 XP</div>';this.streak++;this.awardXP(5);this.updateStats();playTone('correct');fireConfetti(20);document.getElementById('continueBtn').textContent='Continue →';}
    else{this.streak=0;this.updateStats();playTone('wrong');var m=opt.m?'<div class="misconception">'+rt('⚠ '+opt.m,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'')+'</div>':'';fb.innerHTML='<div class="feedback no">✗ Not quite.</div>'+m;document.getElementById('continueBtn').textContent='Try again';var self=this;this.retryTimer=setTimeout(function(){self.answered=false;self.selOpt=null;for(var i=0;i<opts.length;i++){opts[i].classList.remove('selected','correct','wrong');opts[i].style.pointerEvents='';}fb.innerHTML='';document.getElementById('continueBtn').textContent='Check';document.getElementById('continueBtn').disabled=true;},5000);}
  },

  // ── Quiz ──
  renderQuiz:function(step,cb){
    this.selOpt=null;this.answered=false;var opts='';
    for(var i=0;i<step.q.opts.length;i++)opts+='<div class="quiz-opt" onclick="App.selQuiz('+i+')" id="qo'+i+'"><div class="quiz-radio"></div><div class="quiz-opt-text">'+rt(step.q.opts[i].t,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'')+'</div></div>';
    document.getElementById('screen').innerHTML='<div class="instruction">'+rt(step.q.q,true).replace(/^<div class="lle-text">/,'').replace(/<\/div>$/,'')+'</div><div style="max-width:380px;margin:0 auto">'+opts+'</div><div id="qf"></div>';
    document.getElementById('bottomBar').style.display='block';cb.textContent='Check';cb.className='btn btn-primary';cb.disabled=true;
  },
  selQuiz:function(i){if(this.answered)return;this.selOpt=i;var opts=document.querySelectorAll('.quiz-opt');for(var j=0;j<opts.length;j++){opts[j].classList.remove('selected');}document.getElementById('qo'+i).classList.add('selected');document.getElementById('continueBtn').disabled=false;},
  checkQuiz:function(){
    var step=NODES[this.nIdx].steps[this.sIdx],q=step.q,opt=q.opts[this.selOpt];this.answered=true;
    var opts=document.querySelectorAll('.quiz-opt');for(var i=0;i<opts.length;i++){opts[i].style.pointerEvents='none';if(q.opts[i].c)opts[i].classList.add('correct');else if(i===this.selOpt&&!opt.c)opts[i].classList.add('wrong');}
    var fb=document.getElementById('qf');
    if(opt.c){fb.innerHTML='<div class="feedback ok">✓ Correct! +5 XP</div>';this.streak++;this.awardXP(5);this.updateStats();playTone('correct');fireConfetti(20);document.getElementById('continueBtn').textContent='Continue →';}
    else{this.streak=0;this.updateStats();playTone('wrong');var m=opt.m?'<div class="misconception">'+rt('⚠ '+opt.m,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'')+'</div>':'';fb.innerHTML='<div class="feedback no">✗ Not quite.</div>'+m;document.getElementById('continueBtn').textContent='Try again';var self=this;this.retryTimer=setTimeout(function(){self.answered=false;self.selOpt=null;for(var i=0;i<opts.length;i++){opts[i].classList.remove('selected','correct','wrong');opts[i].style.pointerEvents='';}fb.innerHTML='';document.getElementById('continueBtn').textContent='Check';document.getElementById('continueBtn').disabled=true;},5000);}
  },

  // ── Progress / Milestone ──
  renderProgress:function(step,node,cb){
    this.coins+=step.tokens;bumpStat('statCoins');
    this.xp+=(step.xp||20);bumpStat('statXp');
    this.streak++;this.updateStats();this.checkLevelUp();this.checkBadges();this.save();
    if(step.next){
      document.getElementById('screen').innerHTML='<div style="text-align:center"><div class="milestone-icon">'+node.icon+'</div><div class="milestone-text">'+rt(step.text,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'')+'</div><div class="milestone-reward">+'+step.tokens+' 🪙 · +'+(step.xp||20)+' ⭐</div><div class="milestone-next">Next: '+step.next+'</div></div>';
      document.getElementById('bottomBar').style.display='block';cb.textContent='Next Concept →';cb.className='btn btn-green';cb.disabled=false;
      playTone('correct');fireConfetti(25);
    }else{
      var chips='';for(var i=0;i<NODES.length;i++)chips+='<div class="chip" style="background:'+NODES[i].color+'20;color:'+NODES[i].color+'">'+NODES[i].icon+' ✓</div>';
      document.getElementById('screen').innerHTML='<div style="text-align:center"><div class="complete-icon">🎉</div><div class="complete-title">Chapter Complete!</div><div class="complete-coins">🪙 '+this.coins+' · ⭐ '+this.xp+'</div><p style="color:var(--muted);font-size:.9rem;font-weight:600">Level '+this.level+': '+LEVELS[this.level-1].name+'</p><div class="star-row"><span>⭐</span><span>⭐</span><span>⭐</span></div><div style="margin-top:10px;display:flex;gap:4px;justify-content:center;flex-wrap:wrap">'+chips+'</div></div>';
      document.getElementById('progressFill').style.width='100%';
      document.getElementById('bottomBar').style.display='block';cb.textContent='Done 🎉';cb.className='btn btn-amber';cb.disabled=false;
      playTone('complete');fireConfetti(120);
    }
  },

  // ── Navigation ──
  next:function(){
    var step=NODES[this.nIdx].steps[this.sIdx];
    if(step.t==='worked'&&this.weStepIdx<step.we.steps.length){this.showNextWE(step.we,document.getElementById('continueBtn'));return;}
    if(step.t==='solve'){var sl=step.sl;if(this.solveStepIdx>=sl.steps.length){this.advance();return;}if(!this.solveAnswered){this.checkSolve();return;}var sStep=sl.steps[this.solveStepIdx],wasCorrect=false;if(sStep.type==='mcq'&&this.selOpt!=null)wasCorrect=sStep.opts[this.selOpt].c;else if(sStep.type==='input'){var inp=document.getElementById('slInput');wasCorrect=inp&&(inp.value.trim()===sStep.answer||inp.value.trim()===sStep.answer.replace(/\s/g,''));}if(!wasCorrect)return;this.solveStepIdx++;this.showSolveStep(sl,document.getElementById('continueBtn'));return;}
    if(step.t==='quiz'&&!this.answered){this.checkQuiz();return;}
    if(step.t==='quiz'&&this.answered){var opt=step.q.opts[this.selOpt];if(!opt||!opt.c)return;}
    if(step.t==='vq'&&!this.answered){this.checkVQ();return;}
    if(step.t==='vq'&&this.answered){var opt2=step.q.opts[this.selOpt];if(!opt2||!opt2.c)return;}
    this.advance();
  },
  advance:function(){this.sIdx++;if(this.sIdx>=NODES[this.nIdx].steps.length){this.nIdx++;this.sIdx=0;this.tapCount=0;this.tapped={};if(this.nIdx>=NODES.length){this.nIdx=NODES.length-1;this.sIdx=NODES[this.nIdx].steps.length-1;return;}}this.save();this.render();}
};
App.init();
</script>
</body>
</html>
