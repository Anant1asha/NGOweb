.rf-opt.wrong{border-color:var(--red);background:#fee2e2}

function rt(text,sm){
  if(!text)return "";
  var html=text;var keys=Object.keys(CONN).sort(function(a,b){return b.length-a.length});
  var connCount=0,result="",i=0;
  while(i<html.length){
    var ch=html[i];
    if(ch==="."||ch==="!"||ch==="?"){connCount=0;result+=ch;i++;continue;}
    if(ch===" "){result+=" ";i++;continue;}
    if(ch==="<"){var ci=html.indexOf(">",i);if(ci>=0){result+=html.substring(i,ci+1);i=ci+1;continue;}}
    var matched=false;
    if(i===0||!/[a-zA-Z]/.test(html[i-1])){
      for(var k=0;k<keys.length;k++){
        var c=keys[k];var sub=html.substring(i,i+c.length);
        if(sub.toLowerCase()===c.toLowerCase()){
          var ai=i+c.length;if(ai<html.length&&/[a-zA-Z]/.test(html[ai]))continue;
          var hi=CONN[c];connCount++;
          if(connCount<=3){result+='<span class="cn" data-w="'+sub+'" data-h="'+hi+'">'+sub+' <span class="ch">('+hi+')</span></span>';}
          else{result+='<span class="wd" data-w="'+sub.toLowerCase()+'" data-h="'+hi+'">'+sub+'</span>';}
          i+=c.length;matched=true;break;
        }
      }
    }
    if(matched)continue;
    if(/[a-zA-Z]/.test(ch)){
      var ws=i;while(i<html.length&&/[a-zA-Z]/.test(html[i]))i++;
      var word=html.substring(ws,i);var cw=word.toLowerCase();
      if(!cw){result+=word;continue;}
      var hi2=WM[cw];
      if(hi2)result+='<span class="wd" data-w="'+cw+'" data-h="'+hi2+'">'+word+'</span>';
      else result+='<span class="wd" data-w="'+cw+'" data-h="">'+word+'</span>';
    }else{result+=ch;i++;}
  }
  return result;
}

  var els=document.querySelectorAll(sels);

    var el=els[i];if(el.querySelector(".wd")||el.querySelector(".cn"))continue;
    if(el.tagName==="BUTTON"||el.tagName==="INPUT")continue;

}

{t:"text",title:"What is a Square Number?",body:"A square number is the product of a number multiplied by itself. For example, 4 \u00d7 4 = 16, so 16 is a square number. In geometry, a square has all four sides equal. Therefore, a square area is found by multiplying side by side: side \u00d7 side = side\u00b2. The numbers 1, 4, 9, 16, 25, 36, 49, 64, 81, 100 are perfect squares because they are the squares of 1, 2, 3, 4, 5, 6, 7, 8, 9, and 10 respectively."},
{t:"text",title:"Square Root - The Inverse",body:"The square root of a number is a value that, when multiplied by itself, gives the original number. For example, the square root of 9 is 3, because 3 \u00d7 3 = 9. Squaring a number means multiplying it by itself, while finding the square root means determining which number was squared to get the given number. These are inverse operations."},

{type:"input",prompt:"Prime factorize 1500. What is 1500 as a product of primes? (Use format like 2x2x3x5)",answer:"2x2x3x5x5x5",m:"1500 = 2 \u00d7 750 = 2 \u00d7 2 \u00d7 375 = 2 \u00d7 2 \u00d7 3 \u00d7 125 = 2 \u00d7 2 \u00d7 3 \u00d7 5 \u00d7 5 \u00d7 5. Write as 2x2x3x5x5x5.",correctMethod:"1500 = 2 \u00d7 2 \u00d7 3 \u00d7 5 \u00d7 5 \u00d7 5"},
{type:"input",prompt:"Which prime factor does NOT occur in a pair? (Enter the number)",answer:"3",m:"Looking at 2x2x3x5x5x5: the factor 2 appears twice (pair), 5 appears three times (not a pair), and 3 appears once (not a pair). The factor 3 appears only once.",correctMethod:"3 appears only once. 5 appears 3 times (one pair + one extra). To make pairs, we need one more 3 and one more 5."},
{type:"input",prompt:"So 1500 must be multiplied by what number to make all factors pair up? (Hint: 3 \u00d7 5 = ?)",answer:"15",m:"3 appears once (need one more) and 5 appears 3 times (need one more to make 2 pairs). So multiply by 3 \u00d7 5 = 15.",correctMethod:"Multiply by 15: 1500 \u00d7 15 = 22500 = 2\u00b2\u00d73\u00b2\u00d75\u2074 = (2\u00d73\u00d75\u00b2)\u00b2 = 150\u00b2. \u221a22500 = 150."}
]},
{t:"solve",q:"Find the smallest number by which 25200 must be divided so that the quotient is a perfect square.",steps:[
{type:"input",prompt:"Prime factorize 25200. Which prime factor appears an odd number of times? (Enter the number)",answer:"7",m:"25200 = 2\u2074 \u00d7 3\u00b2 \u00d7 5\u00b2 \u00d7 7. The factor 7 appears only once (odd), so it breaks the pairing. Divide by 7 to remove it.",correctMethod:"25200 = 2 \u00d7 2 \u00d7 2 \u00d7 2 \u00d7 3 \u00d7 3 \u00d7 5 \u00d7 5 \u00d7 7. Factor 7 appears once. Divide by 7."},
{type:"input",prompt:"After dividing by 7, what is the quotient? (Enter the number)",answer:"3600",m:"25200 \u00f7 7 = 3600. Check: 3600 = 60\u00b2, which is a perfect square.",correctMethod:"25200 \u00f7 7 = 3600 = 2\u2074 \u00d7 3\u00b2 \u00d7 5\u00b2 = (2\u00b2\u00d73\u00d75)\u00b2 = 60\u00b2. \u221a3600 = 60."}
]},
{t:"truefalse",q:"The square of an odd number is always odd.",ans:true,m:"Actually, the square of an odd number IS always odd. For example, 3\u00b2 = 9 (odd), 5\u00b2 = 25 (odd), 7\u00b2 = 49 (odd). Odd \u00d7 Odd = Odd.",correctMethod:"Odd \u00d7 Odd = Odd. So squaring an odd number (multiplying it by itself) always gives an odd result.",explain:"Odd \u00d7 Odd = Odd. Example: 7\u00b2 = 49 (odd)."},
{t:"truefalse",q:"A number ending in 2 can be a perfect square.",ans:false,m:"Correct! A perfect square can NEVER end in 2. The unit digit of a perfect square can only be 0, 1, 4, 5, 6, or 9.",correctMethod:"Check all possible unit digits: 0\u00b2=0, 1\u00b2=1, 2\u00b2=4, 3\u00b2=9, 4\u00b2=16(ends 6), 5\u00b2=25(ends 5), 6\u00b2=36(ends 6), 7\u00b2=49(ends 9), 8\u00b2=64(ends 4), 9\u00b2=81(ends 1). No square ends in 2.",explain:"Square numbers end only with 0, 1, 4, 5, 6, or 9."},
{t:"truefalse",q:"If a number has n zeros at the end, its square has 2n zeros at the end.",ans:true,m:"Actually this IS true! For example, 10 has 1 zero, 10\u00b2 = 100 has 2 zeros. 100 has 2 zeros, 100\u00b2 = 10000 has 4 zeros. Squaring doubles the trailing zeros.",correctMethod:"If N ends with n zeros, then N = M \u00d7 10\u207f. So N\u00b2 = M\u00b2 \u00d7 10\u00b2\u207f, which has 2n trailing zeros.",explain:"10\u00b2=100 (1\u21922), 100\u00b2=10000 (2\u21924), 1000\u00b2=1000000 (3\u21926)."},
{t:"quiz",q:"What is the side of a square whose area is 144 sq cm?",opts:[
{t:"12 cm",c:true},
{t:"14 cm",c:false,m:"Check: 14\u00b2 = 196, not 144. The side is \u221a144 = 12. Remember: side = \u221aarea.",correctMethod:"Side = \u221a144 = 12 cm. Verify: 12 \u00d7 12 = 144."},
{t:"16 cm",c:false,m:"Check: 16\u00b2 = 256, not 144. The side is \u221a144 = 12.",correctMethod:"Side = \u221a144 = 12 cm."},
{t:"72 cm",c:false,m:"You divided 144 by 2 instead of taking the square root. Side = \u221aarea = \u221a144 = 12, not 144\u00f72.",correctMethod:"Side = \u221a144 = 12 cm. The square root gives the side, not division by 2."}
]},
{t:"quiz",q:"Find the square root of 625.",opts:[
{t:"25",c:true},
{t:"15",c:false,m:"15\u00b2 = 225, not 625. Factorize: 625 = 5\u00d75\u00d75\u00d75 = 5\u2074. \u221a625 = 5\u00b2 = 25.",correctMethod:"625 = 5 \u00d7 125 = 5 \u00d7 5 \u00d7 25 = 5 \u00d7 5 \u00d7 5 \u00d7 5. \u221a625 = 5 \u00d7 5 = 25."},
{t:"35",c:false,m:"35\u00b2 = 1225, not 625. The correct answer is 25\u00b2 = 625.",correctMethod:"625 = 5\u2074. \u221a625 = 5\u00b2 = 25."},
{t:"125",c:false,m:"125\u00b2 = 15625, way too large. \u221a625 = 25 because 25 \u00d7 25 = 625.",correctMethod:"\u221a625 = 25. Verify: 25\u00b2 = 625."}
]},
{t:"quiz",q:"Find the square root of 1296.",opts:[
{t:"36",c:true},
{t:"26",c:false,m:"26\u00b2 = 676, not 1296. Factorize: 1296 = 2\u2074 \u00d7 3\u2074. \u221a1296 = 2\u00b2 \u00d7 3\u00b2 = 4 \u00d7 9 = 36.",correctMethod:"1296 = 2\u00d72\u00d72\u00d72\u00d73\u00d73\u00d73\u00d73. Pairs: (2,2),(2,2),(3,3),(3,3). \u221a1296 = 2\u00d72\u00d73\u00d73 = 36."},

{t:"we",q:"Find the square root of 1444 by long division method.",steps:[
{text:"Group digits in pairs from right: \u030414\u0304 \u030444\u0304"},
{text:"Find largest number whose square \u2264 14: that is 3 (3\u00b2=9). Write 3 as divisor and quotient. Subtract: 14-9=5"},
{text:"Bring down 44, making 544. Double the quotient (3\u00d72=6). Find digit x so that 6x \u00d7 x \u2264 544."},
{text:"Try x=8: 68 \u00d7 8 = 544. Perfect! Write 8 in quotient. Remainder = 0."},
{text:"Quotient = 38. So \u221a1444 = 38."}
],answer:"\u221a1444 = 38"},

{t:"Yes, \u221a1000 = 10",c:false,m:"10\u00b2 = 100, not 1000. Factorize: 1000 = 2\u00b3\u00d75\u00b3. Factors appear 3 times each (odd), so not a perfect square.",correctMethod:"1000 = 2\u00b3 \u00d7 5\u00b3. Since exponents are odd, NOT a perfect square."},

{t:"text",title:"Applications: Diagonal of a Square",body:"The diagonal of a square can be found using the Pythagoras theorem. A diagonal divides the square into two right triangles. If the side is s, then: diagonal\u00b2 = s\u00b2 + s\u00b2 = 2s\u00b2. So diagonal = \u221a(2s\u00b2) = s\u221a2. For example, if side = 8 cm, diagonal = 8\u221a2 \u2248 11.31 cm. If area = 128 sq cm, then side = \u221a128, and diagonal\u00b2 = 128 + 128 = 256, so diagonal = \u221a256 = 16 cm."},

{type:"input",prompt:"The diagonal = \u221a288. Simplify: 288 = 144 \u00d7 2 = 12\u00b2 \u00d7 2. What is \u221a288 in simplified form? (Enter like 12\u221a2)",answer:"12\u221a2",m:"288 = 144 \u00d7 2 = 12\u00b2 \u00d7 2. So \u221a288 = \u221a(12\u00b2\u00d72) = 12\u221a2.",correctMethod:"\u221a288 = \u221a(144\u00d72) = 12\u221a2 \u2248 16.97 m."}

var App={
  idx:0,xp:0,coins:0,level:1,streak:0,answered:false,selOpt:null,

      if(s.level)this.level=s.level;if(s.idx)this.idx=s.idx;

    var lc=document.getElementById("luClose");

  save:function(){

  },
  updateStats:function(){
    var sl=document.getElementById("statLvl");if(sl)sl.textContent="Lv "+this.level;
    var sx=document.getElementById("statXp");if(sx)sx.textContent=this.xp;
    var sc=document.getElementById("statCoins");if(sc)sc.textContent=this.coins;
    var pf=document.getElementById("progressFill");
    if(pf)pf.style.width=Math.round((this.idx/(STEPS.length-1))*100)+"%";
    this.save();
  },
  checkLevelUp:function(){
    var nl=1;if(this.xp>=300)nl=4;else if(this.xp>=150)nl=3;else if(this.xp>=50)nl=2;
    if(nl>this.level){
      this.level=nl;
      var names=["","Beginner","Scholar","Expert","Champion"];
      var d=document.getElementById("levelUpDialog");
      var lt=document.getElementById("luTitle");
      var ls=document.getElementById("luSub");
      if(lt)lt.textContent="Level Up! "+names[nl];
      if(ls)ls.textContent="You are now Level "+nl+" ("+names[nl]+")";
      if(d)d.showModal();
      this.fireConfetti();
    }
  },
  fireConfetti:function(){
    var canvas=document.getElementById("confetti");
    if(!canvas)return;
    var ctx=canvas.getContext("2d");
    canvas.width=window.innerWidth;canvas.height=window.innerHeight;
    var parts=[];
    for(var i=0;i<80;i++){
      parts.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height-canvas.height,
        vx:(Math.random()-0.5)*4,vy:Math.random()*3+2,
        c:["#1e40af","#3b82f6","#10b981","#f59e0b","#a855f7","#ec4899"][Math.floor(Math.random()*6)],
        s:Math.random()*4+2});
    }
    var frames=0;
    function animate(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      for(var i=0;i<parts.length;i++){
        var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;
        ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);
      }
      frames++;if(frames<120)requestAnimationFrame(animate);
      else ctx.clearRect(0,0,canvas.width,canvas.height);
    }
    animate();
  },
  render:function(){
    if(this.idx>=STEPS.length)this.idx=STEPS.length-1;
    if(this.idx<0)this.idx=0;
    var step=STEPS[this.idx];
    var screen=document.getElementById("screen");
    if(!screen)return;
    var cb=document.getElementById("continueBtn");
    if(!cb)return;
    this.answered=false;this.selOpt=null;this.selTF=null;this.solveIdx=0;
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    var html="";
    switch(step.t){
      case"intro":html=this.renderIntro(step);break;
      case"text":html=this.renderText(step);break;
      case"formula":html=this.renderFormula(step);break;
      case"discovery":html=this.renderDiscovery(step);break;
      case"ix_square":html=this.renderSquareSim(step);break;
      case"ix_odd":html=this.renderOddSim(step);break;
      case"ix_pythag":html=this.renderPythagSim(step);break;
      case"ix_factor":html=this.renderFactorSim(step);break;
      case"quiz":html=this.renderQuiz(step);break;
      case"truefalse":html=this.renderTF(step);break;
      case"we":html=this.renderWE(step);break;
      case"solve":html=this.renderSolve(step);break;
      case"rapid_fire":html=this.renderRF(step);break;
      case"memory_match":html=this.renderMM(step);break;
      case"milestone":html=this.renderMilestone(step);break;
      case"complete":html=this.renderComplete(step);break;
    }
    screen.innerHTML=html;
    setTimeout(function(){applyLLE();App.postRender(step);},50);
    this.updateStats();
  },
  postRender:function(step){
    if(step.t==="ix_square")this.initSquareSim();
    else if(step.t==="ix_odd")this.initOddSim();
    else if(step.t==="ix_pythag")this.initPythagSim();
    else if(step.t==="ix_factor")this.initFactorSim();
    else if(step.t==="quiz")this.initQuiz();
    else if(step.t==="truefalse")this.initTF();
    else if(step.t==="solve")this.initSolve();
    else if(step.t==="rapid_fire")this.initRF(step);
    else if(step.t==="memory_match")this.initMM(step);
  },

  renderSquareSim:function(s){

    h+='<div class="ix-box"><div class="ix-title">Square Builder</div>';
    h+='<canvas class="ix-canvas" id="sqCanvas"></canvas>';
    h+='<div class="ix-controls"><input type="range" class="ix-slider" id="sqSlider" min="1" max="12" value="4"></div>';
    h+='<div class="ix-info" id="sqInfo">Side = 4, Area = 4 \u00d7 4 = 16</div></div>';
    return h;
  },
  initSquareSim:function(){
    var slider=document.getElementById("sqSlider");
    var canvas=document.getElementById("sqCanvas");
    var info=document.getElementById("sqInfo");
    if(!slider||!canvas||!info)return;
    var ctx=canvas.getContext("2d");
    function draw(){
      var side=parseInt(slider.value);
      canvas.width=canvas.offsetWidth;canvas.height=260;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      var sz=side*18;var x=(canvas.width-sz)/2;var y=(canvas.height-sz)/2;
      // Draw grid
      ctx.strokeStyle="#e2e8f0";ctx.lineWidth=1;
      for(var i=0;i<=side;i++){
        ctx.beginPath();ctx.moveTo(x+i*18,y);ctx.lineTo(x+i*18,y+sz);ctx.stroke();
        ctx.beginPath();ctx.moveTo(x,y+i*18);ctx.lineTo(x+sz,y+i*18);ctx.stroke();
      }
      // Draw filled squares
      ctx.fillStyle="rgba(59,130,246,0.3)";
      ctx.fillRect(x,y,sz,sz);
      // Draw border
      ctx.strokeStyle="#1e40af";ctx.lineWidth=3;
      ctx.strokeRect(x,y,sz,sz);
      // Labels
      ctx.fillStyle="#1e40af";ctx.font="bold 14px system-ui";ctx.textAlign="center";
      ctx.fillText("Side = "+side,canvas.width/2,y+sz+25);
      ctx.fillText("Area = "+side+" \u00d7 "+side+" = "+(side*side),canvas.width/2,25);
      info.innerHTML="Side = "+side+", Area = "+side+" \u00d7 "+side+" = "+(side*side);
    }
    slider.addEventListener("input",draw);
    draw();

  initOddSim:function(){
    var canvas=document.getElementById("oddCanvas");
    var addBtn=document.getElementById("oddAdd");
    var resetBtn=document.getElementById("oddReset");
    var info=document.getElementById("oddInfo");
    if(!canvas||!addBtn)return;
    var ctx=canvas.getContext("2d");
    var odds=[];var currentOdd=1;var colors=["#3b82f6","#10b981","#f59e0b","#a855f7","#ec4899","#ef4444","#06b6d4","#8b5cf6"];
    function draw(){
      canvas.width=canvas.offsetWidth;canvas.height=260;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      var total=odds.reduce(function(a,b){return a+b},0);
      var n=odds.length;
      if(n===0){ctx.fillStyle="#64748b";ctx.font="14px system-ui";ctx.textAlign="center";ctx.fillText("Tap Add to see the pattern!",canvas.width/2,130);return;}
      // Draw the L-shaped layers
      var cellSize=Math.min(18,Math.floor((canvas.width-40)/Math.max(n,3)));
      var gridSize=n*cellSize;var startX=(canvas.width-gridSize)/2;var startY=40;
      // Draw the full square grid
      ctx.strokeStyle="#e2e8f0";ctx.lineWidth=1;
      for(var i=0;i<=n;i++){
        ctx.beginPath();ctx.moveTo(startX+i*cellSize,startY);ctx.lineTo(startX+i*cellSize,startY+gridSize);ctx.stroke();
        ctx.beginPath();ctx.moveTo(startX,startY+i*cellSize);ctx.lineTo(startX+gridSize,startY+i*cellSize);ctx.stroke();
      }
      // Fill previous cells
      var filled=0;
      for(var layer=0;layer<n&&filled<total;layer++){
        ctx.fillStyle=colors[layer%colors.length]+"60";
        // Top row
        for(var i=0;i<layer+1&&filled<total;i++){
          ctx.fillRect(startX+i*cellSize+1,startY+layer*cellSize+1,cellSize-2,cellSize-2);
          filled++;
        }
        // Right column (excluding corner already filled)
        for(var i=0;i<layer&&filled<total;i++){
          ctx.fillRect(startX+layer*cellSize+1,startY+i*cellSize+1,cellSize-2,cellSize-2);
          filled++;
        }
      }
      // Draw numbers
      ctx.fillStyle="#1e293b";ctx.font="bold 10px system-ui";ctx.textAlign="center";
      filled=0;
      for(var layer=0;layer<n&&filled<total;layer++){
        for(var i=0;i<layer+1&&filled<total;i++){
          ctx.fillText(odds[filled],startX+i*cellSize+cellSize/2,startY+layer*cellSize+cellSize/2+3);
          filled++;
        }
        for(var i=0;i<layer&&filled<total;i++){
          ctx.fillText(odds[filled],startX+layer*cellSize+cellSize/2,startY+i*cellSize+cellSize/2+3);
          filled++;
        }
      }
      // Summary
      var sumStr=odds.join(" + ")+" = "+total;
      ctx.fillStyle="#1e40af";ctx.font="bold 13px system-ui";
      ctx.fillText(sumStr,canvas.width/2,startY+gridSize+25);
      ctx.fillStyle="#10b981";ctx.font="bold 16px system-ui";
      ctx.fillText("= "+n+"\u00b2 = "+n+"\u00d7"+n+" = "+total,canvas.width/2,startY+gridSize+48);
      info.innerHTML=odds.join(" + ")+" = "+total+" = "+n+"\u00b2";
    }
    addBtn.addEventListener("click",function(){
      if(odds.length<10){odds.push(currentOdd);currentOdd+=2;draw();}
    });
    if(resetBtn)resetBtn.addEventListener("click",function(){odds=[];currentOdd=1;draw();});
    draw();
  },

  initPythagSim:function(){
    var input=document.getElementById("pyInput");
    var canvas=document.getElementById("pyCanvas");
    var info=document.getElementById("pyInfo");
    if(!input||!canvas||!info)return;
    var ctx=canvas.getContext("2d");
    function draw(){
      var m=parseInt(input.value)||2;if(m<2)m=2;if(m>10)m=10;
      var a=2*m;var b=m*m-1;var c=m*m+1;
      canvas.width=canvas.offsetWidth;canvas.height=260;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      var maxSide=Math.max(a,b,c);
      var scale=Math.min(160/maxSide,18);
      var w=a*scale;var hgt=b*scale;
      var ox=(canvas.width-w)/2;var oy=200-hgt;
      // Draw triangle
      ctx.strokeStyle="#1e40af";ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+w,oy);ctx.lineTo(ox,oy+hgt);ctx.closePath();ctx.stroke();
      // Fill
      ctx.fillStyle="rgba(59,130,246,0.1)";ctx.fill();
      // Draw squares on each side
      ctx.fillStyle="rgba(59,130,246,0.2)";ctx.strokeStyle="#3b82f6";ctx.lineWidth=2;
      // Square on side a (bottom)
      ctx.fillRect(ox,oy,w,w);ctx.strokeRect(ox,oy,w,w);
      // Square on side b (left)
      ctx.fillStyle="rgba(16,185,129,0.2)";
      ctx.fillRect(ox-w,oy,w,w);ctx.strokeRect(ox-w,oy,w,w);
      // Wait, let's draw squares outside the triangle properly
      ctx.clearRect(0,0,canvas.width,canvas.height);
      // Redraw triangle with squares
      var pad=20;var ts=Math.min(15,Math.floor(180/maxSide));
      var sa=2*m*ts;var sb=(m*m-1)*ts;var sc=(m*m+1)*ts;
      ox=(canvas.width-sa)/2;oy=200-sb;
      // Triangle
      ctx.fillStyle="rgba(168,85,247,0.15)";ctx.strokeStyle="#a855f7";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+sa,oy);ctx.lineTo(ox,oy+sb);ctx.closePath();ctx.fill();ctx.stroke();
      // Square on side a (bottom, going down)
      ctx.fillStyle="rgba(59,130,246,0.2)";ctx.strokeStyle="#3b82f6";
      ctx.fillRect(ox,oy,sa,sa);ctx.strokeRect(ox,oy,sa,sa);
      // Square on side b (left, going left)
      ctx.fillStyle="rgba(16,185,129,0.2)";ctx.strokeStyle="#10b981";
      ctx.fillRect(ox-sb,oy,sb,sb);ctx.strokeRect(ox-sb,oy,sb,sb);
      // Right angle mark
      ctx.strokeStyle="#ef4444";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(ox,oy+10);ctx.lineTo(ox+10,oy+10);ctx.lineTo(ox+10,oy);ctx.stroke();
      // Labels
      ctx.fillStyle="#1e40af";ctx.font="bold 12px system-ui";ctx.textAlign="center";
      ctx.fillText("a="+a,ox+sa/2,oy+sa+18);
      ctx.fillStyle="#10b981";
      ctx.save();ctx.translate(ox-sb-15,oy+sb/2);ctx.rotate(-Math.PI/2);
      ctx.fillText("b="+b,0,0);ctx.restore();
      // Formula
      ctx.fillStyle="#1e293b";ctx.font="bold 11px system-ui";ctx.textAlign="center";
      ctx.fillText("a\u00b2+b\u00b2=c\u00b2: "+(a*a)+"+"+(b*b)+"="+(c*c),canvas.width/2,250);
      info.innerHTML="m="+m+": Triplet = (2m, m\u00b2-1, m\u00b2+1) = ("+a+", "+b+", "+c+"). Check: "+a+"\u00b2+"+b+"\u00b2="+(a*a)+"+"+(b*b)+"="+(a*a+b*b)+"="+(c*c)+"="+(c)+"\u00b2";
    }
    input.addEventListener("input",draw);
    draw();
  },

  initFactorSim:function(){
    var input=document.getElementById("faInput");
    var btn=document.getElementById("faBtn");
    var info=document.getElementById("faInfo");
    if(!input||!btn||!info)return;
    function factorize(){
      var n=parseInt(input.value);
      if(!n||n<2){info.innerHTML="Enter a number greater than 1";return;}
      var factors=[];var num=n;
      for(var d=2;d*d<=num;d++){
        while(num%d===0){factors.push(d);num/=d;}
      }
      if(num>1)factors.push(num);
      // Check pairs
      var counts={};
      for(var i=0;i<factors.length;i++){counts[factors[i]]=(counts[factors[i]]||0)+1;}
      var isPerfect=true;
      var pairs=[];var singles=[];
      for(var key in counts){
        var c=counts[key];
        while(c>=2){pairs.push(key+"\u00d7"+key);c-=2;}
        while(c>0){singles.push(key);c--;}
      }
      for(var key in counts){if(counts[key]%2!==0)isPerfect=false;}
      var html="<div style='font-size:.85rem'>";
      html+="<strong>"+n+"</strong> = "+factors.join(" \u00d7 ")+"<br>";
      if(pairs.length>0)html+="Pairs: "+pairs.join(", ")+"<br>";
      if(singles.length>0)html+="Unpaired: "+singles.join(", ")+"<br>";
      if(isPerfect){
        var root=factors.filter(function(f,i){return factors.indexOf(f)===i||factors.indexOf(f,i)!==-1;});
        // Calculate actual sqrt
        var prod=1;var seen={};
        for(var i=0;i<factors.length;i++){
          if(!seen[factors[i]]){seen[factors[i]]=true;prod*=factors[i];}
        }
        html+="<span style='color:#10b981;font-weight:bold'>\u2713 Perfect square! \u221a"+n+" = "+prod+"</span>";
      }else{
        html+="<span style='color:#ef4444;font-weight:bold'>\u2717 NOT a perfect square (some factors are unpaired)</span>";
      }
      html+="</div>";
      info.innerHTML=html;
      applyLLE();
    }
    btn.addEventListener("click",factorize);
    factorize();
  },

  initMM:function(step){

      var h="";

          if(flipped.length===2){
            busy=true;
            var a=fllipped[0],b=flipped[1];

              cards[a].matched=true;cards[b].matched=true;matched++;flipped=[];

  },
  renderMilestone:function(s){
    var h='<div class="milestone-card"><div class="milestone-icon">'+(s.icon||"")+'</div>';
    h+='<div class="milestone-title">'+rt(s.title)+'</div>';
    if(s.xp)h+='<div class="milestone-xp">+'+s.xp+' XP earned!</div>';
    if(s.next)h+='<div class="milestone-next">'+rt(s.next)+'</div>';
    h+='</div>';
    if(s.xp){this.xp+=s.xp;this.updateStats();this.checkLevelUp();this.fireConfetti();}
    return h;
  },
  renderComplete:function(s){
    var h='<div class="complete-card"><div class="complete-icon">'+(s.icon||"")+'</div>';
    h+='<div class="complete-title">'+rt(s.title)+'</div>';
    if(s.sub)h+='<div class="complete-sub">'+rt(s.sub)+'</div>';
    h+='<div style="margin-top:20px"><div class="stat lvl" style="font-size:1rem;padding:8px 16px">Level '+this.level+'</div> ';
    h+='<div class="stat xp" style="font-size:1rem;padding:8px 16px">'+this.xp+' XP</div> ';
    h+='<div class="stat coins" style="font-size:1rem;padding:8px 16px">'+this.coins+' coins</div></div>';
    h+='</div>';
    var cb=document.getElementById("continueBtn");
    if(cb){cb.textContent="Restart";cb.className="btn btn-green";cb.disabled=false;}
    this.fireConfetti();
    return h;
  },
  next:function(){
    var step=STEPS[this.idx];
    var cb=document.getElementById("continueBtn");
    if(!cb)return;
    if(cb.textContent==="Restart"){
      this.idx=0;this.xp=0;this.coins=0;this.level=1;this.streak=0;
      this.save();this.render();return;
    }
    if(step.t==="quiz"&&!this.answered){this.checkQuiz();return;}
    if(step.t==="quiz"&&this.answered){
      var opt=step.opts[this.selOpt];if(opt&&opt.c){this.idx++;this.render();return;}return;
    }
    if(step.t==="truefalse"&&!this.answered)return;
    if(step.t==="truefalse"&&this.answered){
      if(this.selTF===step.ans){this.idx++;this.render();return;}return;
    }
    if(step.t==="solve"&&!this.answered){this.checkSolve();return;}
    if(step.t==="solve"&&this.answered){this.idx++;this.render();return;}
    if(step.t==="rapid_fire"&&!this.answered)return;
    if(step.t==="memory_match"&&!this.answered)return;
    this.idx++;this.render();
  },
  back:function(){
    this.idx--;if(this.idx<0)this.idx=0;this.render();
  }
};

document.addEventListener("DOMContentLoaded",function(){App.init();});

</script>
</body>
</html>
