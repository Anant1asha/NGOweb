.quiz-radio{width:22px;height:22px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;margin-top:1px;transition:all .2s}
.quiz-opt.selected .quiz-radio{border-color:var(--brand);background:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.2)}
.quiz-opt.correct .quiz-radio{border-color:var(--green);background:var(--green)}.quiz-opt.wrong .quiz-radio{border-color:var(--red);background:var(--red)}
.quiz-opt-text{flex:1;font-size:.8rem}

.feedback.ok{background:linear-gradient(135deg,#d1fae5,#a7f3d0);border:1px solid #6ee7b7;color:#065f46;font-weight:700}

.btn-green{background:linear-gradient(135deg,var(--green),#34d399);color:#fff;box-shadow:0 3px 10px rgba(16,185,129,.3)}
.btn-back{background:#f1f5f9;color:#475569;border:2px solid #cbd5e1;padding:10px 16px;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;flex-shrink:0}

dialog{border:none;border-radius:18px;padding:24px;max-width:300px;width:100%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.15)}

.mm-card-front{background:linear-gradient(135deg,var(--bl),var(--pi));border:2px solid var(--bl);color:#fff;font-size:1.4rem;box-shadow:0 3px 8px rgba(99,102,241,.3)}

@keyframes tpulse{50%{opacity:.5}}

function rt(text,sm){
  if(!text)return "";
  var html=text;var keys=Object.keys(CONN).sort(function(a,b){return b.length-a.length});
  var connCount=0,result="",i=0;
  while(i<html.length){
    var ch=html[i];
    if(ch==="."||ch==="!"||ch==="?"||ch===","){connCount=0;result+=ch;i++;continue;}
    if(ch===" "){result+=" ";i++;continue;}
    if(ch==="<"){var ci=html.indexOf(">",i);if(ci>=0){result+=html.substring(i,ci+1);i=ci+1;continue;}}
    var matched=false;
    if(i===0||!/[a-zA-Z]/.test(html[i-1])){
      for(var k=0;k<keys.length;k++){
        var c=keys[k];var sub=html.substring(i,i+c.length);
        if(sub.toLowerCase()===c.toLowerCase()){
          var ai=i+c.length;if(ai<html.length&&/[a-zA-Z]/.test(html[ai]))continue;
          var hi=CONN[c];connCount++;
          if(connCount<=4){result+='<span class="cn" data-w="'+sub+'" data-h="'+hi+'">'+sub+' <span class="ch">('+hi+')</span></span>';}
          else{result+='<span class="wd" data-w="'+sub.toLowerCase()+'" data-h="'+hi+'">'+sub+'</span>';}
          i+=c.length;matched=true;break;
        }
      }
    }
    if(matched)continue;
    if(/[a-zA-Z]/.test(ch)){
      var ws=i;while(i<html.length&&/[a-zA-Z]/.test(html[i]))i++;
      var word=html.substring(ws,i);var cw=word.toLowerCase();
      if(!cw){result+=word;continue;}
      var hi2=WM[cw];
      if(hi2)result+='<span class="wd" data-w="'+cw+'" data-h="'+hi2+'">'+word+'</span>';
      else result+='<span class="wd" data-w="'+cw+'" data-h="">'+word+'</span>';
    }else{result+=ch;i++;}
  }
  return result;
}

function applyLLE(){
  var sels=".bt,.we-question,.we-step,.quiz-opt-text,.instruction,.hint,.formula-box,.f-label,.f-expr,.f-note,.misconception,.correct-method,.feedback,.milestone-text,.milestone-next,.discovery-box .d-text,.discovery-box .d-title,.intro-title,.intro-sub,.complete-title,.complete-sub,.rf-question,.rf-opt-text,.we-tag,.visual-title,.tutor-box,.real-example";
  var els=document.querySelectorAll(sels);
  for(var i=0;i<els.length;i++){
    var el=els[i];if(el.querySelector(".wd")||el.querySelector(".cn"))continue;
    if(el.tagName==="BUTTON"||el.tagName==="INPUT")continue;
    var h=el.innerHTML;if(!h||h.trim().length<3)continue;
    var textOnly=h.replace(/<[^>]+>/g,"");if(textOnly.trim().length<3)continue;
    try{el.innerHTML=rt(h)}catch(e){}
  }
}

function showWord(w,h,d){
  var dlg=document.getElementById("wordDialog");if(!dlg)return;
  document.getElementById("dlgWord").textContent=w;
  document.getElementById("dlgHindi").textContent=h||"—";
  document.getElementById("dlgDesc").textContent=d||"";
  if(!dlg.open)dlg.showModal();
}

});

var STEPS=[{"t": "intro", "icon": "🔬", "title": "The Invisible Living World", "sub": "Class 8 Science — Chapter 2", "intro": "The human eye can only see objects above a certain size. For a long time, many tiny things around us remained unknown. The invention of the microscope opened a fascinating hidden world filled with tiny living creatures. In this chapter, we will explore cells — the basic unit of life — learn about microorganisms like bacteria, fungi, and protozoa, discover how microbes help clean our environment and make our food, and understand why the cell is considered the basic unit of life. Let us begin!"}, {"t": "tutor", "icon": "🔬", "title": "The Discovery of the Microscope", "body": "Long ago, people discovered that a curved piece of glass could make small things look bigger. The piece of glass was shaped like a lentil seed — thick in the middle and thin at the edge — hence they called it a lens. Over time, lenses were improved to become more powerful. Each new tool, from simple magnifying glasses to microscopes, helped humans see what their eyes could not. The invention of the microscope opened a fascinating hidden world filled with tiny living creatures."}, {"t": "tutor", "icon": "📖", "title": "Robert Hooke and the First Cells", "body": "In 1665, a scientist named Robert Hooke published a book called Micrographia. He was a careful observer and a skilled artist. In this book, he showed detailed drawings of tiny things that people had never seen before — things he saw using a tool we now call a microscope. His microscope made things look 200 to 300 times bigger. One day, he looked at a thin slice of cork and saw it was made of many small, empty spaces. These compartments reminded him of a honeycomb. He called each small space a cell. This was the first time the word cell was used in science to describe the basic unit of life."}, {"t": "tutor", "icon": "🔍", "title": "Antonie van Leeuwenhoek — Father of Microbiology", "body": "Around the same time in the 1660s, Antonie van Leeuwenhoek, a Dutch scientist, made better lenses that allowed him to build more useful microscopes. He was the first person to clearly see and describe tiny living things like bacteria and blood cells. Because of this, he is known as the Father of Microbiology."}, {"t": "quiz", "q": "Quick Check: Who first used the word 'cell' in science?", "diff": "easy", "opts": [{"t": "Robert Hooke", "c": true}, {"t": "Antonie van Leeuwenhoek", "c": false, "m": "Leeuwenhoek was the first to see bacteria, but Hooke named the cell.", "correctMethod": "Robert Hooke coined the word 'cell' in 1665 when he looked at cork under a microscope."}, {"t": "Albert Einstein", "c": false, "m": "Einstein was a physicist, not a microbiologist.", "correctMethod": "Robert Hooke, not Einstein, discovered cells by looking at cork."}, {"t": "Charles Darwin", "c": false, "m": "Darwin studied evolution, not cells under a microscope.", "correctMethod": "Robert Hooke was the one who first used the word 'cell'."}]}, {"t": "formula", "title": "Key Terms: The Microscope", "formulas": [{"label": "Lens", "expr": "A curved piece of glass that makes small things look bigger", "note": "Shaped like a lentil seed — thick in the middle, thin at the edge"}, {"label": "Microscope", "expr": "A tool that magnifies objects 100 to 400 times", "note": "Opened the hidden world of tiny living creatures"}, {"label": "Electron Microscope", "expr": "Magnifies the cell about 10,00,000 times", "note": "Used to see structures inside cells"}]}, {"t": "tutor", "icon": "🧱", "title": "What is a Cell?", "body": "All living beings are made up of cells. In Activity 2.2, when you observe an onion peel under a microscope, you see nearly rectangular structures. These are the cells of the onion peel, which are closely arranged without any space between them. In Activity 2.3, when you observe human cheek cells, you see polygon-shaped structures. Cells have three main parts: the cell membrane, the cytoplasm, and the nucleus. Some cells, like onion peel cells, have an extra outer layer called the cell wall."}, {"t": "ix_cell", "instruction": "Tap on the parts of the cell to learn what each one does! Explore the cell membrane, cytoplasm, nucleus, and cell wall."}, {"t": "formula", "title": "Parts of a Cell", "formulas": [{"label": "Cell Membrane", "expr": "Outer layer that encloses the cytoplasm and nucleus", "note": "Porous — allows entry of useful materials and exit of waste"}, {"label": "Cytoplasm", "expr": "Jelly-like substance between cell membrane and nucleus", "note": "Contains compounds like carbohydrates, proteins, fats, and mineral salts"}, {"label": "Nucleus", "expr": "Round structure in the middle, covered by a thin membrane", "note": "Regulates all activities of the cell and controls growth"}, {"label": "Cell Wall", "expr": "Extra outer layer in plant cells (not animal cells)", "note": "Provides rigidity and strength to plants"}]}, {"t": "quiz", "q": "Quick Check: Which part of the cell regulates all activities and controls growth?", "diff": "easy", "opts": [{"t": "Nucleus", "c": true}, {"t": "Cell membrane", "c": false, "m": "The cell membrane controls entry and exit of materials, not all activities.", "correctMethod": "The nucleus regulates all activities of the cell and controls growth."}, {"t": "Cytoplasm", "c": false, "m": "Cytoplasm contains compounds and is where life processes take place, but it does not regulate activities.", "correctMethod": "The nucleus is the control center of the cell."}, {"t": "Cell wall", "c": false, "m": "The cell wall provides rigidity, not control of activities.", "correctMethod": "The nucleus regulates all cell activities."}]}, {"t": "truefalse", "q": "The cell membrane is porous and allows the entry of useful materials and the exit of waste.", "ans": true, "explain": "Correct! The cell membrane is porous — it lets useful materials in and waste materials out.", "m": "Think about what 'porous' means — it allows things to pass through."}, {"t": "tutor", "icon": "🌿", "title": "Plant vs Animal Cells", "body": "Plant and animal cells differ in structure. Plant cells have an extra outer layer called the cell wall, which provides rigidity and strength. Plant cells also have tiny rod-shaped structures called plastids. Some plastids, like chloroplasts, contain chlorophyll, which makes them green and helps in photosynthesis. Plant cells have a large space called a vacuole that stores important substances and helps maintain the shape of the cell. In animal cells, vacuoles are usually not present, or if present, they are usually small."}, {"t": "ix_cell_compare", "instruction": "Tap the buttons to switch between plant and animal cells. Tap on each labeled part to learn its function!"}, {"t": "quiz", "q": "Quick Check: Which of these is found ONLY in plant cells, not in animal cells?", "diff": "medium", "opts": [{"t": "Cell wall and chloroplasts", "c": true}, {"t": "Nucleus", "c": false, "m": "Both plant and animal cells have a nucleus.", "correctMethod": "The cell wall and chloroplasts are found only in plant cells. Both cell types have a nucleus."}, {"t": "Cell membrane", "c": false, "m": "Both plant and animal cells have a cell membrane.", "correctMethod": "The cell wall and chloroplasts are unique to plant cells."}, {"t": "Cytoplasm", "c": false, "m": "Both plant and animal cells have cytoplasm.", "correctMethod": "The cell wall and chloroplasts are found only in plant cells."}]}, {"t": "tutor", "icon": "🔀", "title": "Why Do Cells Have Different Shapes?", "body": "Cells come in many shapes! A muscle cell is shaped like a spindle, while a nerve cell (neuron) is very long and has branches. Some cells are round, while others are long and thin. The unique shape, size, and structure of cells help them carry out their specific functions. For example, nerve cells carry messages in our body. Their elongated shape and branched structure help them reach different parts of the body and pass on messages quickly. In plants, some cells form long tubes that help carry water throughout the plant."}, {"t": "real_example", "icon": "💪", "title": "How Cell Shape Relates to Function", "body": "Think about your digestive system. A group of muscle cells in the food pipe contract and relax in a wave-like manner, pushing food down to the stomach. This movement is possible because muscle cells are thin, flexible, and spindle-shaped. The stomach has different types of cells: muscle cells in the stomach wall help churn the food, while other cells in the inner lining produce digestive juices and acid that help break down the food. All these cells work together to make digestion possible."}, {"t": "milestone", "icon": "🧱", "title": "Cells Mastered!", "xp": 50, "next": "Now: Levels of Organisation in Living Beings!"}, {"t": "tutor", "icon": "🏗️", "title": "Levels of Organisation in the Body", "body": "The body of a living organism is organised in a complex way. A cell is the basic unit of life, just like a brick is the basic unit of a wall. A group of similar cells forms a tissue. Different tissues are organised to form an organ. Several organs work together to form an organ system that performs a major function of the body. All the organ systems together make up a complete organism — like a plant or an animal. So, the levels of organisation are: Cell → Tissue → Organ → Organ System → Organism."}, {"t": "ix_levels", "instruction": "Tap each level to see how cells build up into a complete organism! Start from the cell and work your way up to the organism."}, {"t": "formula", "title": "Levels of Organisation", "formulas": [{"label": "Level 1", "expr": "Cell — the basic unit of life", "note": "Like a single brick"}, {"label": "Level 2", "expr": "Tissue — a group of similar cells", "note": "Like many bricks arranged together"}, {"label": "Level 3", "expr": "Organ — different tissues organised together", "note": "Like a wall with windows and doors"}, {"label": "Level 4", "expr": "Organ System — several organs working together", "note": "Like a whole room"}, {"label": "Level 5", "expr": "Organism — all organ systems together", "note": "Like a complete building!"}]}, {"t": "quiz", "q": "Quick Check: What is a tissue?", "diff": "easy", "opts": [{"t": "A group of similar cells that work together", "c": true}, {"t": "A single cell that does everything", "c": false, "m": "A single cell is just a cell, not a tissue.", "correctMethod": "A tissue is a GROUP of similar cells working together."}, {"t": "An organ like the heart", "c": false, "m": "An organ is made of tissues, not the other way around.", "correctMethod": "A tissue is a group of similar cells. An organ is made of different tissues."}, {"t": "A type of microorganism", "c": false, "m": "Tissues are found in multicellular organisms, not microbes.", "correctMethod": "A tissue is a group of similar cells working together."}]}, {"t": "truefalse", "q": "Multicellular organisms are made up of many cells, while unicellular organisms are made of just one cell.", "ans": true, "explain": "Correct! Multicellular organisms like humans and plants have many cells. Unicellular organisms like bacteria and Amoeba have just one cell that carries out all life functions.", "m": "Remember: 'multi' means many, 'uni' means one."}, {"t": "milestone", "icon": "🏗️", "title": "Organisation Mastered!", "xp": 50, "next": "Now: What Are Microorganisms?"}, {"t": "tutor", "icon": "🦠", "title": "What Are Microorganisms?", "body": "Some living organisms are made up of just one or very few cells. They are so small that they cannot be seen with the naked eye. These are called microorganisms. Some microorganisms, like bacteria and Amoeba, are made of just one cell (unicellular). Others, like some fungi and algae, have many cells (multicellular). They are found all around us — in water, soil, air, and even inside our body! To observe microorganisms, we need a microscope which magnifies their size and makes them visible to us."}, {"t": "ix_microbes", "instruction": "Tap on each type of microorganism to learn about it! Explore bacteria, protozoa, fungi, algae, and viruses."}, {"t": "formula", "title": "Types of Microorganisms", "formulas": [{"label": "Bacteria", "expr": "Unicellular — spherical, rod, comma, or spiral shaped", "note": "Have a nucleoid instead of a well-defined nucleus"}, {"label": "Protozoa", "expr": "Unicellular — e.g. Amoeba, Paramecium", "note": "Single cell that moves and feeds"}, {"label": "Fungi", "expr": "Can be unicellular (yeast) or multicellular (mould)", "note": "Have cell wall but no chloroplasts — cannot make their own food"}, {"label": "Algae", "expr": "Can be unicellular or multicellular", "note": "Contain chlorophyll — can make their own food using sunlight"}, {"label": "Viruses", "expr": "Microscopic and acellular — not truly living", "note": "Multiply only inside a living host cell"}]}, {"t": "quiz", "q": "Quick Check: Which microorganism does NOT have a well-defined nucleus?", "diff": "medium", "opts": [{"t": "Bacteria", "c": true}, {"t": "Yeast", "c": false, "m": "Yeast is a fungus and has a well-defined nucleus.", "correctMethod": "Bacteria do not have a well-defined nucleus. Instead, they have a nucleoid region."}, {"t": "Amoeba", "c": false, "m": "Amoeba is a protozoan and has a well-defined nucleus.", "correctMethod": "Only bacteria lack a well-defined nucleus — they have a nucleoid instead."}, {"t": "Algae", "c": false, "m": "Algae have a well-defined nucleus.", "correctMethod": "Bacteria are unique among microorganisms in lacking a well-defined nucleus."}]}, {"t": "truefalse", "q": "Viruses are microscopic and acellular — they can multiply only inside a living host cell.", "ans": true, "explain": "Correct! Viruses are not true cells (acellular). They can only reproduce when they enter a living cell. They may infect plants, animals, or bacteria.", "m": "Remember: viruses are acellular and need a host to multiply."}, {"t": "tutor", "icon": "♻️", "title": "Microbes Clean the Environment", "body": "Microorganisms can be found everywhere — in water, soil, air, and even in some food items. Some microorganisms, like fungi and bacteria, act on plant and animal waste and slowly break it down into simpler, nutrient-rich manure. This process is called decomposition. The nutrients go back to the soil and help plants grow better. Microorganisms also decompose bodies of dead animals. So, microbes help recycle waste and return important nutrients to nature. Without microorganisms, waste would pile up and nutrients would not be recycled!"}, {"t": "real_example", "icon": "🌱", "title": "Making Manure with Microbes", "body": "In Activity 2.7, students fill a container with garden soil, add fruit and vegetable peels, and cover it with soil. After 2-3 weeks, the peels have turned into a dark-coloured material — manure! This happens because microorganisms in the soil break down the plant waste into nutrient-rich manure. Gardeners collect dry leaves and plant waste in pits for the same reason — to make natural manure using the power of microbes."}, {"t": "quiz", "q": "Quick Check: What is the process by which microorganisms break down complex substances into simpler nutrient-rich substances?", "diff": "medium", "opts": [{"t": "Decomposition", "c": true}, {"t": "Fermentation", "c": false, "m": "Fermentation is about converting sugar to alcohol or acid (like in yeast making bread rise).", "correctMethod": "Decomposition is the breakdown of complex substances into simpler ones by microorganisms."}, {"t": "Photosynthesis", "c": false, "m": "Photosynthesis is how plants make food using sunlight.", "correctMethod": "Decomposition is the correct term for microbes breaking down waste."}, {"t": "Respiration", "c": false, "m": "Respiration is how organisms release energy from food.", "correctMethod": "Decomposition is the process of breaking down waste into nutrients."}]}, {"t": "tutor", "icon": "🍞", "title": "Yeast Makes Bread Rise!", "body": "Yeast is a type of microorganism that belongs to the fungi group. Yeast grows well in warm conditions. Like other organisms, yeast respires and breaks down food to release energy. During this process, carbon dioxide is released, which forms bubbles that make the dough soft and fluffy. Yeast also produces a small amount of alcohol, which gives the dough a slightly different smell. This special property of yeast is used in making breads, cakes, and pastries! Some bacteria, like Lactobacillus, help in fermentation of batter for making idli and dosa, and dough for making bhatura."}, {"t": "ix_fermentation", "instruction": "Toggle between the bowl WITH yeast and the bowl WITHOUT yeast. Watch what happens to the dough over time!"}, {"t": "quiz", "q": "Quick Check: Why does dough rise when yeast is added?", "diff": "medium", "opts": [{"t": "Yeast releases carbon dioxide gas which forms bubbles in the dough", "c": true}, {"t": "Yeast produces heat which expands the dough", "c": false, "m": "Yeast does not produce heat to expand dough.", "correctMethod": "Yeast releases carbon dioxide during respiration, which forms bubbles that make the dough fluffy."}, {"t": "Yeast adds water to the dough", "c": false, "m": "Yeast does not add water.", "correctMethod": "Carbon dioxide released by yeast creates bubbles that make dough rise."}, {"t": "Yeast changes the flour into a different substance", "c": false, "m": "Yeast does not transform flour into a different substance.", "correctMethod": "The carbon dioxide gas from yeast respiration makes the dough rise."}]}, {"t": "tutor", "icon": "🥛", "title": "How Curd is Made", "body": "Curd contains several types of bacteria. One of them is Lactobacillus. This bacterium feeds on the sugar in milk (lactose), multiplies, and ferments the milk to form curd. Instead of producing alcohol (like yeast), these bacteria produce lactic acid, which makes curd sour. These bacteria grow well in warm conditions. That is why curd forms in a warm place but not in a cold place like a refrigerator. This is why we add a small spoonful of curd to warm milk to make more curd!"}, {"t": "truefalse", "q": "Lactobacillus bacteria produce lactic acid which makes curd sour.", "ans": true, "explain": "Correct! Lactobacillus ferments the lactose sugar in milk, producing lactic acid. This acid is what gives curd its sour taste.", "m": "Think about what makes curd taste different from milk — it is the acid produced by bacteria."}, {"t": "tutor", "icon": "🌱", "title": "Rhizobium — The Nitrogen Helper", "body": "Some bacteria, like Rhizobium, live in the root nodules of legumes such as beans, peas, and lentils. These bacteria trap nitrogen from the air and make it useful for the plants. This helps plants grow better without chemical fertilisers. That is why farmers grow legumes in rotation with other crops — it naturally increases the nitrogen in the soil and keeps it healthy for the next crop."}, {"t": "tutor", "icon": "🌊", "title": "Amazing Microalgae", "body": "Microalgae are microscopic plant-like organisms that live in water, soil, air, and even on trees. They make their own food using sunlight. While doing this, they also release oxygen and produce more than half of the Earth's oxygen supply! They are rich in nutrients and serve as a food source for many aquatic animals. Some, like Spirulina, Chlorella, and Diatoms, are used by humans as health supplements and medicines. Spirulina is called a superfood because it is rich in protein — more than 60% of its body weight!"}, {"t": "milestone", "icon": "🍞", "title": "Microbes and Food Mastered!", "xp": 60, "next": "Now: Why is the Cell the Basic Unit of Life?"}, {"t": "tutor", "icon": "🔬", "title": "Why is the Cell the Basic Unit of Life?", "body": "The body of all living organisms is made up of tiny building blocks called cells. A single cell contains various components that help organisms perform their functions and survive. All plants and animals are made up of many cells (multicellular). Some microorganisms, like bacteria and protozoa, are made up of just one cell (unicellular). They carry out all functions necessary for survival in a single cell. Other microbes, like algae and fungi, can be made of one or more cells. For example, yeast is a unicellular fungus while mould is a multicellular fungus."}, {"t": "quiz", "q": "Quick Check: Which of the following is a UNICELLULAR organism?", "diff": "easy", "opts": [{"t": "Bacteria", "c": true}, {"t": "Human", "c": false, "m": "Humans are multicellular — made of billions of cells.", "correctMethod": "Bacteria are unicellular — made of just one cell."}, {"t": "Mango tree", "c": false, "m": "Plants are multicellular.", "correctMethod": "Bacteria are unicellular organisms."}, {"t": "Mould (fungi)", "c": false, "m": "Mould is a multicellular fungus. Yeast is the unicellular fungus.", "correctMethod": "Bacteria are unicellular. Mould is multicellular."}]}, {"t": "truefalse", "q": "Bacteria have a nucleoid instead of a well-defined nucleus, which distinguishes them from cells of yeast, protozoa, algae, fungi, plants, and animals.", "ans": true, "explain": "Correct! The absence of a well-defined nucleus and nuclear membrane is the key feature that distinguishes bacteria from all other cell types.", "m": "Remember: bacteria have a nucleoid, not a nucleus. This is what makes them unique."}, {"t": "rapid_fire", "qs": [{"q": "Who is known as the Father of Microbiology?", "opts": ["Antonie van Leeuwenhoek", "Robert Hooke", "Charles Darwin", "Albert Einstein"], "ans": 0}, {"q": "What is the basic unit of life?", "opts": ["Cell", "Atom", "Molecule", "Tissue"], "ans": 0}, {"q": "Which part of the cell controls all activities?", "opts": ["Nucleus", "Cell membrane", "Cytoplasm", "Cell wall"], "ans": 0}, {"q": "Which microorganism makes bread rise?", "opts": ["Yeast", "Bacteria", "Virus", "Algae"], "ans": 0}, {"q": "Which bacterium helps form curd?", "opts": ["Lactobacillus", "Rhizobium", "Amoeba", "Paramecium"], "ans": 0}, {"q": "What is the process of breaking down waste by microbes called?", "opts": ["Decomposition", "Fermentation", "Photosynthesis", "Respiration"], "ans": 0}, {"q": "Which bacteria live in root nodules of legumes?", "opts": ["Rhizobium", "Lactobacillus", "Yeast", "Spirulina"], "ans": 0}, {"q": "What do microalgae produce that is more than half of Earth's supply?", "opts": ["Oxygen", "Carbon dioxide", "Nitrogen", "Methane"], "ans": 0}]}, {"t": "memory_match", "pairs": [{"en": "Cell", "hi": "कोशिका"}, {"en": "Nucleus", "hi": "केंद्रक"}, {"en": "Cytoplasm", "hi": "कोशिका द्रव्य"}, {"en": "Bacteria", "hi": "जीवाणु"}, {"en": "Fungi", "hi": "कवक"}, {"en": "Microorganism", "hi": "सूक्ष्मजीव"}, {"en": "Fermentation", "hi": "किण्वन"}, {"en": "Tissue", "hi": "पबसत"}]}, {"t": "quiz", "q": "Exercise Q2(i): Aanandi added yeast to sugar solution in test tube B and attached a balloon. After 3-4 hours, the balloon was inflated. What is the explanation?", "diff": "hard", "opts": [{"t": "Yeast produced a gas (carbon dioxide) inside the test tube which inflated the balloon", "c": true}, {"t": "Water evaporated and filled the balloon with water vapour", "c": false, "m": "The balloon inflated due to gas produced by yeast, not water vapour.", "correctMethod": "Yeast respires and releases carbon dioxide gas, which inflated the balloon."}, {"t": "The warm atmosphere expanded the air inside the test tube", "c": false, "m": "While warmth helps yeast grow, the inflation is from the gas yeast produces.", "correctMethod": "Yeast produces carbon dioxide during respiration, inflating the balloon."}, {"t": "Sugar reacted with warm air to produce gas", "c": false, "m": "Sugar alone does not react with air — yeast is needed.", "correctMethod": "Yeast breaks down sugar and releases carbon dioxide gas."}]}, {"t": "quiz", "q": "Exercise Q5(i): Identify the microorganism: 'I live in every kind of environment, and inside your gut.'", "diff": "easy", "opts": [{"t": "Bacteria", "c": true}, {"t": "Yeast", "c": false, "m": "Yeast is used in baking, not typically found in the gut.", "correctMethod": "Bacteria live in every kind of environment, including inside our gut where they help in digestion."}, {"t": "Rhizobium", "c": false, "m": "Rhizobium lives in root nodules of legumes, not in the gut.", "correctMethod": "Bacteria are found everywhere, including inside our gut."}, {"t": "Spirulina", "c": false, "m": "Spirulina is a microalga found in water, not typically in the gut.", "correctMethod": "Bacteria are the microorganisms that live in every environment and inside our gut."}]}, {"t": "quiz", "q": "Exercise Q5(ii): Identify the microorganism: 'I make bread and cakes soft and fluffy.'", "diff": "easy", "opts": [{"t": "Yeast", "c": true}, {"t": "Bacteria", "c": false, "m": "Bacteria like Lactobacillus make curd, not bread.", "correctMethod": "Yeast produces carbon dioxide which makes dough soft and fluffy — used in bread and cake making."}, {"t": "Rhizobium", "c": false, "m": "Rhizobium helps plants get nitrogen, not make bread.", "correctMethod": "Yeast is the microorganism that makes bread and cakes soft and fluffy."}, {"t": "Virus", "c": false, "m": "Viruses do not help in food preparation.", "correctMethod": "Yeast is used in making bread, cakes, and pastries."}]}, {"t": "quiz", "q": "Exercise Q5(iii): Identify the microorganism: 'I live in the roots of pulse crops and provide nutrients for their growth.'", "diff": "easy", "opts": [{"t": "Rhizobium", "c": true}, {"t": "Yeast", "c": false, "m": "Yeast is used in baking, not in root nodules.", "correctMethod": "Rhizobium bacteria live in the root nodules of legumes and trap nitrogen from the air for plants."}, {"t": "Lactobacillus", "c": false, "m": "Lactobacillus helps make curd, not fix nitrogen in roots.", "correctMethod": "Rhizobium lives in root nodules and provides nitrogen to pulse crops."}, {"t": "Spirulina", "c": false, "m": "Spirulina is a microalga, not found in roots.", "correctMethod": "Rhizobium is the bacterium that lives in the roots of pulse crops."}]}, {"t": "truefalse", "q": "Exercise Q3 reasoning: A farmer growing beans does not need to add nitrogen fertiliser because Rhizobium bacteria in the root nodules trap nitrogen from the air for the plant.", "ans": true, "explain": "Correct! Rhizobium bacteria in the root nodules of legumes (like beans) convert atmospheric nitrogen into a form the plant can use. This is why farmers rotate legume crops with other crops — it naturally enriches the soil with nitrogen.", "m": "Think about why legumes are special — they have Rhizobium in their roots!"}, {"t": "quiz", "q": "Exercise: Which of these correctly describes the levels of organisation from simplest to most complex?", "diff": "medium", "opts": [{"t": "Cell → Tissue → Organ → Organ System → Organism", "c": true}, {"t": "Organism → Organ System → Organ → Tissue → Cell", "c": false, "m": "This is the reverse order — from complex to simple.", "correctMethod": "The correct order from simplest to most complex is: Cell → Tissue → Organ → Organ System → Organism."}, {"t": "Tissue → Cell → Organ → Organism → Organ System", "c": false, "m": "Tissue comes after cell, and organism comes after organ system.", "correctMethod": "Cell → Tissue → Organ → Organ System → Organism is the correct order."}, {"t": "Cell → Organ → Tissue → Organism → Organ System", "c": false, "m": "Organ comes after tissue, not before.", "correctMethod": "Cell → Tissue → Organ → Organ System → Organism is the correct order."}]}, {"t": "complete", "icon": "🔬", "title": "Chapter 2 Complete!", "sub": "The Invisible Living World: Beyond Our Naked Eye — Mastered!"}];

  nIdx:0,sIdx:0,xp:0,coins:0,streak:0,level:1,
  answered:false,selOpt:null,solveStepIdx:0,solveAnswered:false,selTf:null,

  init:function(){
    var self=this;
    var cb=document.getElementById("continueBtn");
    if(cb)cb.addEventListener("click",function(){
      var step=STEPS[self.sIdx];if(!step)return;
      if(step.t==="quiz"&&!self.answered){self.checkQuiz(step,cb);return;}
      if(step.t==="truefalse"&&!self.answered){self.checkTrueFalse(step,cb);return;}
      if(step.t==="solve"&&!self.solveAnswered){self.checkSolve(step,cb);return;}
      if(step.t==="we"&&self.weStepIdx!==undefined&&self.weStepIdx<step.steps.length){
        self.weStepIdx++;if(self.weStepIdx>=step.steps.length){self.weStepIdx=0;self.next();return;}self.render();return;}
      self.next();
    });
    var bb=document.getElementById("backBtn");
    if(bb)bb.addEventListener("click",function(){self.back();});
    var lc=document.getElementById("luClose");
    if(lc)lc.addEventListener("click",function(){var d=document.getElementById("levelUpDialog");if(d){if(d.open)d.close();else d.removeAttribute("open");}});
    var dc=document.getElementById("dlgClose");
    if(dc)dc.addEventListener("click",function(){var d=document.getElementById("wordDialog");if(d){if(d.open)d.close();else d.removeAttribute("open");}});
    this.render();
  },
  render:function(){
    var step=STEPS[this.sIdx];if(!step)return;
    var cb=document.getElementById("continueBtn");if(!cb)return;
    cb.style.display="";cb.disabled=false;cb.className="btn btn-primary";
    var bb=document.getElementById("backBtn");if(bb)bb.disabled=this.sIdx===0;
    var pf=document.getElementById("progressFill");
    if(pf)pf.style.width=Math.round((this.sIdx/(STEPS.length-1))*100)+"%";
    this.answered=false;this.selOpt=null;this.selTf=null;this.shuffledOpts=null;
    if(this._prevSIdx!==this.sIdx){this.solveStepIdx=0;this.solveAnswered=false;this.weStepIdx=0;this._prevSIdx=this.sIdx;}
    if(this.rfTimer){clearInterval(this.rfTimer);this.rfTimer=null;}
    switch(step.t){
      case"intro":this.renderIntro(step,cb);break;

    var parts={
      "cellwall":{"title":"Cell Wall","info":"The extra outer layer in plant cells. It provides rigidity and strength to plants. This is why plant cells look firm and are arranged compactly. Animal cells do NOT have a cell wall."},
      "membrane":{"title":"Cell Membrane","info":"The outer layer that encloses the cytoplasm and nucleus. It is porous and allows the entry of materials essential for life processes and the exit of waste material. It separates one cell from another."},
      "cytoplasm":{"title":"Cytoplasm","info":"The jelly-like substance between the cell membrane and nucleus. It contains other components of the cell and compounds like carbohydrates, proteins, fats, and mineral salts. Most life processes take place here."},
      "nucleus":{"title":"Nucleus","info":"The round structure in the middle, covered by a thin membrane. It regulates ALL activities that occur within the cell. It also regulates growth. It is the control center of the cell!"}

      // Nucleus

      ctx.fillText("Cell Wall",150,30);
      ctx.fillText("Cell Membrane",150,50);
      ctx.fillText("Cytoplasm",80,75);
      ctx.fillStyle="#fff";ctx.fillText("Nucleus",150,143);
      // Vacuole (hint)
      ctx.strokeStyle="#64748b";ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(220,100,25,35,0,0,2*Math.PI);ctx.stroke();
      ctx.fillStyle="#64748b";ctx.font="7px sans-serif";ctx.fillText("Vacuole",220,100);

      "chloroplast":{"title":"Chloroplast","plantInfo":"Found in plant cells. Contains chlorophyll — makes plants green and helps in photosynthesis.","animalInfo":"NOT present in animal cells. Animals cannot make their own food."},

        document.getElementById("ccInfo").textContent=info;
        for(var j=0;j<partBtns.length;j++)partBtns[j].classList.remove("active");

  /* SIM 3: Microbe Gallery */
  renderIxMicrobes:function(step,cb){

    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    var microbes={
      "bacteria":{"title":"Bacteria","info":"Unicellular organisms that are spherical, rod, comma, or spiral shaped. They do NOT have a well-defined nucleus — instead they have a nucleoid region. Bacteria are found everywhere: in water, soil, air, and even inside our gut!"},
      "protozoa":{"title":"Protozoa","info":"Unicellular organisms like Amoeba and Paramecium. They are single cells that can move and feed. Amoeba has an irregular shape and moves using pseudopodia. Paramecium moves using tiny hair-like structures called cilia."},
      "fungi":{"title":"Fungi","info":"Can be unicellular (like yeast) or multicellular (like mould). Fungi have a cell wall but do NOT have chloroplasts, so they cannot make their own food through photosynthesis. Yeast is used in baking bread. Mould grows on bread and fruits."},
      "algae":{"title":"Algae","info":"Can be unicellular or multicellular. They contain chlorophyll, so they CAN make their own food using sunlight (photosynthesis). Microalgae produce more than half of Earth's oxygen supply! Spirulina is a superfood rich in protein."},
      "virus":{"title":"Viruses","info":"Microscopic and acellular — they are NOT true cells. They can multiply ONLY inside a living host cell. They may infect plants, animals, or bacteria and may cause diseases. Viruses are different from all other microorganisms."}
    };
    function draw(){
      var c=document.getElementById("mgCanvas");if(!c)return;var ctx=c.getContext("2d");if(!ctx)return;
      ctx.clearRect(0,0,280,220);

      }
      ctx.fillStyle="#4f46e5";ctx.font="bold 11px sans-serif";ctx.textAlign="center";
      ctx.fillText(selected.toUpperCase(),140,20);

        ctx.fillStyle="#10b981";ctx.fillRect(80,60,50,25);ctx.beginPath();ctx.arc(80,72,12,0,2*Math.PI);ctx.fill();ctx.beginPath();ctx.arc(130,72,12,0,2*Math.PI);ctx.fill();
        // Spiral
        ctx.strokeStyle="#10b981";ctx.lineWidth=3;ctx.beginPath();
        for(var i=0;i<60;i++){var x=80+i;var y=110+Math.sin(i*0.3)*8;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();
        // Spherical
        ctx.fillStyle="#10b981";ctx.beginPath();ctx.arc(140,170,15,0,2*Math.PI);ctx.fill();
        ctx.fillStyle="#fff";ctx.font="8px sans-serif";ctx.fillText("Rod",105,75);ctx.fillText("Spiral",110,100);ctx.fillText("Spherical",140,173);
      }else if(selected==="protozoa"){
        // Amoeba (irregular)
        ctx.fillStyle="#a855f7";ctx.beginPath();
        ctx.moveTo(100,80);ctx.quadraticCurveTo(70,60,80,100);ctx.quadraticCurveTo(60,130,100,120);
        ctx.quadraticCurveTo(130,140,150,120);ctx.quadraticCurveTo(190,130,180,90);
        ctx.quadraticCurveTo(200,60,160,70);ctx.quadraticCurveTo(130,50,100,80);ctx.fill();

        ctx.fillStyle="#fff";ctx.font="8px sans-serif";ctx.fillText("Amoeba",130,100);
      }else if(selected==="fungi"){
        // Bread mould - branched filaments
        ctx.strokeStyle="#6b7280";ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(140,180);ctx.lineTo(140,120);ctx.stroke();
        ctx.beginPath();ctx.moveTo(140,140);ctx.lineTo(100,110);ctx.stroke();
        ctx.beginPath();ctx.moveTo(140,130);ctx.lineTo(180,100);ctx.stroke();
        // Sporangia (sac-like)
        ctx.fillStyle="#6b7280";ctx.beginPath();ctx.arc(140,110,15,0,2*Math.PI);ctx.fill();
        ctx.beginPath();ctx.arc(100,110,10,0,2*Math.PI);ctx.fill();
        ctx.beginPath();ctx.arc(180,100,10,0,2*Math.PI);ctx.fill();
        ctx.fillStyle="#4f46e5";ctx.font="8px sans-serif";ctx.fillText("Mould",140,112);
      }else if(selected==="algae"){
        // Spirogyra/green algae
        ctx.fillStyle="#10b981";ctx.beginPath();ctx.arc(140,80,30,0,2*Math.PI);ctx.fill();
        ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(140,80,20,0,2*Math.PI);ctx.fill();
        ctx.fillStyle="#10b981";ctx.beginPath();ctx.arc(140,80,10,0,2*Math.PI);ctx.fill();
        // Chlorophyll dots
        ctx.fillStyle="#059669";
        for(var i=0;i<6;i++){ctx.beginPath();ctx.arc(120+i*8,75+Math.sin(i)*10,3,0,2*Math.PI);ctx.fill();}
        ctx.fillStyle="#4f46e5";ctx.font="8px sans-serif";ctx.fillText("Green Algae",140,130);
        ctx.fillText("(has chlorophyll)",140,145);
      }else if(selected==="virus"){
        // Virus - geometric shape
        ctx.fillStyle="#ef4444";
        ctx.beginPath();
        for(var i=0;i<8;i++){var angle=i*Math.PI/4;var r=35;var x=140+Math.cos(angle)*r;var y=100+Math.sin(angle)*r;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.closePath();ctx.fill();
        // Inner circle
        ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(140,100,15,0,2*Math.PI);ctx.fill();
        ctx.fillStyle="#ef4444";ctx.beginPath();ctx.arc(140,100,8,0,2*Math.PI);ctx.fill();
        ctx.fillStyle="#4f46e5";ctx.font="8px sans-serif";ctx.fillText("Virus",140,103);
        ctx.fillText("(acellular)",140,160);
      }
    }
    var btns=document.querySelectorAll(".mg-btn");
    for(var i=0;i<btns.length;i++){

  /* SIM 4: Levels of Organisation Builder */
  renderIxLevels:function(step,cb){
    var selected="";
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Levels of Organisation</div><canvas id="loCanvas" width="280" height="260" style="display:block;margin:0 auto;border-radius:8px;background:#fff"></canvas><div style="text-align:center;margin-top:6px"><button class="shape-btn lo-btn" data-part="cell">Cell</button><button class="shape-btn lo-btn" data-part="tissue">Tissue</button><button class="shape-btn lo-btn" data-part="organ">Organ</button><button class="shape-btn lo-btn" data-part="system">Organ System</button><button class="shape-btn lo-btn" data-part="organism">Organism</button></div><div class="discovery-box" style="margin-top:8px"><div class="d-title" id="loTitle">Tap a level to explore!</div><div class="d-text" id="loInfo">Cells build up to form tissues, organs, organ systems, and finally a complete organism.</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    var levels={
      "cell":{"title":"Cell \u2014 Level 1","info":"The basic unit of life, just like a single brick. All living beings are made up of cells. A cell contains a cell membrane, cytoplasm, and nucleus."},
      "tissue":{"title":"Tissue \u2014 Level 2","info":"A group of similar cells that work together to perform a specific function. Like many bricks arranged together to form a layer."},
      "organ":{"title":"Organ \u2014 Level 3","info":"Different tissues organised together to form an organ. Examples: heart, stomach, leaf. Like a wall with windows and doors."},
      "system":{"title":"Organ System \u2014 Level 4","info":"Several organs working together to perform a major function. Example: digestive system (mouth, food pipe, stomach, intestines). Like a whole room in a building."},
      "organism":{"title":"Organism \u2014 Level 5","info":"All organ systems together make up a complete organism \u2014 like a plant or an animal. Like a complete building! Humans, trees, and animals are all organisms."}
    };
    function draw(){
      var c=document.getElementById("loCanvas");if(!c)return;var ctx=c.getContext("2d");if(!ctx)return;
      ctx.clearRect(0,0,280,260);

        ctx.fillStyle="#64748b";ctx.font="bold 11px sans-serif";ctx.textAlign="center";

      }

        ctx.strokeStyle="#4f46e5";ctx.lineWidth=2;ctx.strokeRect(100,100,80,60);
        ctx.fillStyle="#7c3aed";ctx.beginPath();ctx.arc(140,130,15,0,2*Math.PI);ctx.fill();
        ctx.fillStyle="#4f46e5";ctx.font="bold 10px sans-serif";ctx.fillText("1 Cell",140,180);
      }else if(selected==="tissue"){
        // Group of cells
        ctx.fillStyle="#a7f3d0";
        for(var r=0;r<3;r++){for(var c2=0;c2<4;c2++){ctx.fillRect(60+c2*45,70+r*45,40,35);}}
        ctx.strokeStyle="#4f46e5";ctx.lineWidth=1;
        for(var r=0;r<3;r++){for(var c2=0;c2<4;c2++){ctx.strokeRect(60+c2*45,70+r*45,40,35);}}
        ctx.fillStyle="#4f46e5";ctx.font="bold 10px sans-serif";ctx.fillText("Many Cells = Tissue",140,220);
      }else if(selected==="organ"){
        // Organ (heart shape)
        ctx.fillStyle="#ef4444";
        ctx.beginPath();ctx.moveTo(140,90);ctx.bezierCurveTo(100,60,70,100,100,130);
        ctx.bezierCurveTo(110,150,130,160,140,180);ctx.bezierCurveTo(150,160,170,150,180,130);
        ctx.bezierCurveTo(210,100,180,60,140,90);ctx.fill();
        ctx.fillStyle="#4f46e5";ctx.font="bold 10px sans-serif";ctx.fillText("Organ (Heart)",140,210);
      }else if(selected==="system"){
        // Digestive system simplified
        ctx.fillStyle="#fbbf24";ctx.beginPath();ctx.arc(140,60,15,0,2*Math.PI);ctx.fill();
        ctx.fillStyle="#4f46e5";ctx.font="7px sans-serif";ctx.fillText("Mouth",140,63);
        ctx.strokeStyle="#fbbf24";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(140,75);ctx.lineTo(140,110);ctx.stroke();
        ctx.fillText("Food Pipe",170,90);
        ctx.fillStyle="#f59e0b";ctx.beginPath();ctx.ellipse(140,130,25,20,0,0,2*Math.PI);ctx.fill();
        ctx.fillText("Stomach",140,133);
        ctx.strokeStyle="#fbbf24";ctx.lineWidth=4;ctx.beginPath();
        ctx.moveTo(140,150);ctx.lineTo(130,170);ctx.lineTo(150,190);ctx.lineTo(135,210);ctx.stroke();
        ctx.fillText("Intestines",160,190);
        ctx.fillStyle="#4f46e5";ctx.font="bold 10px sans-serif";ctx.fillText("Organ System",140,240);
      }else if(selected==="organism"){
        // Complete organism (stick figure)
        ctx.fillStyle="#4f46e5";
        ctx.beginPath();ctx.arc(140,60,15,0,2*Math.PI);ctx.fill();
        ctx.strokeStyle="#4f46e5";ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(140,75);ctx.lineTo(140,140);ctx.stroke();
        ctx.beginPath();ctx.moveTo(120,100);ctx.lineTo(160,100);ctx.stroke();
        ctx.beginPath();ctx.moveTo(140,140);ctx.lineTo(125,175);ctx.stroke();
        ctx.beginPath();ctx.moveTo(140,140);ctx.lineTo(155,175);ctx.stroke();
        ctx.font="bold 10px sans-serif";ctx.fillText("Organism",140,205);
        ctx.font="7px sans-serif";ctx.fillText("(Complete Living Being)",140,220);
      }
    }
    var btns=document.querySelectorAll(".lo-btn");
    for(var i=0;i<btns.length;i++){
      btns[i].addEventListener("click",function(){
        selected=this.getAttribute("data-part");
        var l=levels[selected];
        document.getElementById("loTitle").textContent=l.title;
        document.getElementById("loInfo").textContent=l.info;
        for(var j=0;j<btns.length;j++)btns[j].classList.remove("active");
        this.classList.add("active");
        draw();
      });
    }
    draw();
  },

  /* SIM 5: Fermentation Demo */
  renderIxFermentation:function(step,cb){
    var bowl="A";var stage=0; // 0=start, 1=after 2hrs, 2=after 4hrs
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Yeast Fermentation Demo</div><canvas id="fdCanvas" width="280" height="220" style="display:block;margin:0 auto;border-radius:8px;background:#fff"></canvas><div style="text-align:center;margin-top:6px"><button class="shape-btn fd-bowl-btn active" data-bowl="A">Bowl A (with yeast)</button><button class="shape-btn fd-bowl-btn" data-bowl="B">Bowl B (no yeast)</button></div><div style="text-align:center;margin-top:6px"><button class="shape-btn" id="fdStage">Advance Time \u2192</button></div><div class="discovery-box" style="margin-top:8px"><div class="d-title" id="fdTitle">Bowl A \u2014 Start</div><div class="d-text" id="fdInfo">Dough with yeast, sugar, and warm water. Tap to advance time!</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    function draw(){
      var c=document.getElementById("fdCanvas");if(!c)return;var ctx=c.getContext("2d");if(!ctx)return;
      ctx.clearRect(0,0,280,220);
      // Draw bowl
      ctx.strokeStyle="#64748b";ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(140,140,80,0,Math.PI);ctx.stroke();
      ctx.beginPath();ctx.moveTo(60,140);ctx.lineTo(60,160);ctx.stroke();
      ctx.beginPath();ctx.moveTo(220,140);ctx.lineTo(220,160);ctx.stroke();
      // Dough level depends on bowl and stage
      var doughHeight=60;var hasBubbles=false;
      if(bowl==="A"){
        if(stage===0){doughHeight=60;hasBubbles=false;}
        else if(stage===1){doughHeight=75;hasBubbles=true;}
        else if(stage===2){doughHeight=95;hasBubbles=true;}
      }else{
        doughHeight=60;hasBubbles=false;
      }
      // Draw dough
      ctx.fillStyle=bowl==="A"?"#fef3c7":"#fde68a";
      ctx.beginPath();ctx.arc(140,140,doughHeight,0,Math.PI);ctx.fill();
      // Bubbles
      if(hasBubbles){
        ctx.fillStyle="rgba(255,255,255,0.6)";
        for(var i=0;i<8;i++){
          var bx=100+Math.random()*80;var by=120+Math.random()*(doughHeight-30);
          var br=3+Math.random()*5;
          ctx.beginPath();ctx.arc(bx,by,br,0,2*Math.PI);ctx.fill();
        }
      }
      // Labels
      ctx.fillStyle="#4f46e5";ctx.font="bold 10px sans-serif";ctx.textAlign="center";
      ctx.fillText("Bowl "+bowl,140,30);
      if(bowl==="A"){
        ctx.fillStyle="#a855f7";ctx.font="8px sans-serif";
        if(stage===0)ctx.fillText("Dough just made",140,45);
        else if(stage===1)ctx.fillText("After 2 hours \u2014 dough rising!",140,45);
        else ctx.fillText("After 4 hours \u2014 dough is fluffy!",140,45);
        // Yeast icon
        ctx.fillStyle="#ef4444";ctx.font="7px sans-serif";
        ctx.fillText("+ yeast",100,100);
      }else{
        ctx.fillStyle="#64748b";ctx.font="8px sans-serif";
        ctx.fillText("No yeast \u2014 dough stays flat",140,45);
      }
    }
    function updateInfo(){
      if(bowl==="A"){
        if(stage===0){document.getElementById("fdTitle").textContent="Bowl A \u2014 Start";document.getElementById("fdInfo").textContent="Dough with yeast, sugar, and warm water. Yeast is starting to respire and release carbon dioxide.";}
        else if(stage===1){document.getElementById("fdTitle").textContent="Bowl A \u2014 After 2 Hours";document.getElementById("fdInfo").textContent="The dough has risen! Yeast released carbon dioxide gas, forming bubbles that make the dough soft and fluffy. A slightly different smell comes from the alcohol produced.";}
        else{document.getElementById("fdTitle").textContent="Bowl A \u2014 After 4 Hours";document.getElementById("fdInfo").textContent="The dough is now fully risen and fluffy! This is how bread and cakes are made. The carbon dioxide from yeast makes the dough rise.";}
      }else{
        document.getElementById("fdTitle").textContent="Bowl B \u2014 No Yeast";
        document.getElementById("fdInfo").textContent="Without yeast, the dough stays flat and does NOT rise. No carbon dioxide is produced. The dough does not become fluffy. This is why yeast is essential for making bread!";
      }
    }
    var bowlBtns=document.querySelectorAll(".fd-bowl-btn");
    for(var i=0;i<bowlBtns.length;i++){
      bowlBtns[i].addEventListener("click",function(){
        bowl=this.getAttribute("data-bowl");stage=0;
        for(var j=0;j<bowlBtns.length;j++)bowlBtns[j].classList.remove("active");
        this.classList.add("active");
        updateInfo();draw();
      });
    }
    var stageBtn=document.getElementById("fdStage");
    if(stageBtn)stageBtn.addEventListener("click",function(){
      if(bowl==="A"){stage++;if(stage>2)stage=0;}
      else{stage=0;}
      updateInfo();draw();
    });
    draw();
  }
};

App.init();

</script>
