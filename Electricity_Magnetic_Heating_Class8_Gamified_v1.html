function rt(text,sm){
  if(!text)return "";
  var html=text;var keys=Object.keys(CONN).sort(function(a,b){return b.length-a.length});
  var connCount=0,result="",i=0;
  while(i<html.length){
    var ch=html[i];
    if(ch==="."||ch==="!"||ch==="?"||ch===","){connCount=0;result+=ch;i++;continue;}
    if(ch===" "){result+=" ";i++;continue;}
    if(ch==="<"){var ci=html.indexOf(">",i);if(ci>=0){result+=html.substring(i,ci+1);i=ci+1;continue;}}
    var matched=false;
    if(i===0||!/[a-zA-Z]/.test(html[i-1])){
      for(var k=0;k<keys.length;k++){
        var c=keys[k];var sub=html.substring(i,i+c.length);
        if(sub.toLowerCase()===c.toLowerCase()){
          var ai=i+c.length;if(ai<html.length&&/[a-zA-Z]/.test(html[ai]))continue;
          var hi=CONN[c];connCount++;
          if(connCount<=4){result+='<span class="cn" data-w="'+sub+'" data-h="'+hi+'">'+sub+' <span class="ch">('+hi+')</span></span>';}
          else{result+='<span class="wd" data-w="'+sub.toLowerCase()+'" data-h="'+hi+'">'+sub+'</span>';}
          i+=c.length;matched=true;break;
        }
      }
    }
    if(matched)continue;
    if(/[a-zA-Z]/.test(ch)){
      var ws=i;while(i<html.length&&/[a-zA-Z]/.test(html[i]))i++;
      var word=html.substring(ws,i);var cw=word.toLowerCase();
      if(!cw){result+=word;continue;}
      var hi2=WM[cw];
      if(hi2)result+='<span class="wd" data-w="'+cw+'" data-h="'+hi2+'">'+word+'</span>';
      else result+='<span class="wd" data-w="'+cw+'" data-h="">'+word+'</span>';
    }else{result+=ch;i++;}
  }
  return result;
}

function applyLLE(){
  var sels=".bt,.we-question,.we-step,.quiz-opt-text,.instruction,.hint,.formula-box,.f-label,.f-expr,.f-note,.misconception,.correct-method,.feedback,.milestone-text,.milestone-next,.discovery-box .d-text,.discovery-box .d-title,.intro-title,.intro-sub,.complete-title,.complete-sub,.rf-question,.rf-opt-text,.we-tag,.visual-title,.tutor-box,.real-example";
  var els=document.querySelectorAll(sels);
  for(var i=0;i<els.length;i++){
    var el=els[i];if(el.querySelector(".wd")||el.querySelector(".cn"))continue;
    if(el.tagName==="BUTTON"||el.tagName==="INPUT")continue;
    var h=el.innerHTML;if(!h||h.trim().length<3)continue;
    var textOnly=h.replace(/<[^>]+>/g,"");if(textOnly.trim().length<3)continue;
    try{el.innerHTML=rt(h)}catch(e){}
  }
}

function showWord(w,h,d){
  var dlg=document.getElementById("wordDialog");if(!dlg)return;
  document.getElementById("dlgWord").textContent=w;
  document.getElementById("dlgHindi").textContent=h||"—";
  document.getElementById("dlgDesc").textContent=d||"";
  if(!dlg.open)dlg.showModal();
}

document.addEventListener("click",function(e){

});

"Only magnetic materials like iron strengthen the electromagnet."}]}, {"t": "truefalse", "q": "An electromagnet has two poles — North and South — just like a bar magnet.", "ans": true, "explain": "Yes! Just like a bar magnet, an electromagnet has two poles. The poles can be reversed by changing the direction of the current.", "m": "Think about what you learned in Activity 4.4 — the compass showed opposite attraction at each end."}, {"t": "tutor", "icon": "🚂", "title": "Earth as a Giant Magnet", "body": "Do you remember learning that a freely suspended magnet rests along the north-south direction because our Earth itself behaves like a giant magnet? But why does Earth behave like a magnet? Deep inside the Earth, the movement of liquid iron in the core creates electric currents, which generate a magnetic field. Many migratory birds, fish, and animals use this field to navigate across continents and oceans. The Earth's magnetic field also acts as a shield, blocking harmful particles from space, and helps protect life on Earth."}, {"t": "tutor", "icon": "🏗️", "title": "Lifting Electromagnets in Real Life", "body": "Lifting electromagnets are strong electromagnets that may be hung from cranes. The crane operator can control the magnet by switching the current ON and OFF. When the current is turned ON, the electromagnet lifts iron and steel objects. When the current is switched OFF, the magnetic field disappears, and the objects are released. Lifting electromagnets are widely used in factories and scrap yards to move, lift, and sort heavy metal items efficiently."}, {"t": "milestone", "icon": "🏆", "title": "Magnetic Effect Mastered!", "xp": 50, "next": "Now: The Heating Effect of Electric Current!"}, {"t": "tutor", "icon": "🔥", "title": "Does a Current-Carrying Wire Get Hot?", "body": "When electric current flows through a conductor, it faces some opposition or resistance to its flow. Different conductors offer different levels of resistance. A nichrome wire, for example, offers higher resistance compared to a copper wire of the same size and length. This resistance causes some of the electrical energy to be converted into heat energy. When an electric current passes through a conductor, it gets heated. This warming is known as the heating effect of electric current."}, {"t": "formula", "title": "Heating Effect — Key Facts", "formulas": [{"label": "Heating Effect", "expr": "Current flows through a conductor → Conductor gets heated", "note": "Electrical energy is converted to heat energy"}, {"label": "Resistance", "expr": "Opposition to the flow of electric current", "note": "Higher resistance = more heat generated"}, {"label": "Heat depends on", "expr": "Material, thickness, length of wire + magnitude of current + duration", "note": "More current or longer duration = more heat"}]}, {"t": "ix_heating", "instruction": "Move the slider to increase or decrease the current. Watch the wire change color — from cool blue to glowing red as more current flows through it!"}, {"t": "quiz", "q": "Quick Check: Why does a nichrome wire get warmer than a copper wire of the same size when the same current flows?", "diff": "medium", "opts": [{"t": "Nichrome has higher resistance, so more heat is generated", "c": true}, {"t": "Nichrome is a better conductor, so it heats up faster", "c": false, "m": "Nichrome is NOT a better conductor — it has higher resistance.", "correctMethod": "Higher resistance means more electrical energy is converted to heat. Nichrome has higher resistance than copper."}, {"t": "Copper generates more heat than nichrome", "c": false, "m": "Copper has lower resistance, so it generates less heat.", "correctMethod": "Nichrome has higher resistance, which is why it generates more heat for the same current."}, {"t": "Nichrome is thicker than copper", "c": false, "m": "The question says same size — thickness is the same.", "correctMethod": "With the same size, nichrome's higher resistance causes more heat."}]}, {"t": "real_example", "icon": "🍳", "title": "Heating Effect in Everyday Appliances", "body": "Many household appliances work on the heating effect of electric current. Electric room heaters, electric stoves, electric kettles, electric irons, water heating immersion rods, and hair dryers all contain a rod or coil of wire called a heating element. In some appliances where this element is visible, it can be seen glowing red hot. The incandescent lamp glows because its filament is heated by an electric current. All these devices convert electrical energy into heat energy."}, {"t": "tutor", "icon": "⚠️", "title": "Safety and Problems with Heating Effect", "body": "The heating effect of electric current is useful in many appliances, but sometimes it can cause problems. Overheating in appliances may cause damage to plugs and sockets where plastic parts may melt, or even lead to fires. To prevent unnecessary heating in household switchboards, it is important to use appropriate wires, plugs, and sockets that are rated for the specified electric current. In household circuits, there are safety devices placed in the circuit to minimise such incidents."}, {"t": "truefalse", "q": "The heat generated in a wire depends on the material, thickness, length of the wire, and the duration for which current flows.", "ans": true, "explain": "Correct! All these factors affect how much heat is generated — the material's resistance, the wire's thickness and length, and how long current flows.", "m": "Think about the different factors that affect resistance and heat generation."}, {"t": "quiz", "q": "Nichrome wire is commonly used in electrical heating devices because it:", "diff": "medium", "opts": [{"t": "Generates more heat for a given current due to its high resistance", "c": true}, {"t": "Is a good conductor of electricity", "c": false, "m": "If it were a good conductor, it would generate less heat.", "correctMethod": "Nichrome has high resistance, which converts more electrical energy into heat — that is why it is used in heating devices."}, {"t": "Is cheaper than copper", "c": false, "m": "Cost is not the reason — it is about resistance properties.", "correctMethod": "The reason is its high resistance, not cost."}, {"t": "Is an insulator of electricity", "c": false, "m": "An insulator would not allow current to flow at all.", "correctMethod": "Nichrome is a conductor with high resistance, not an insulator."}]}, {"t": "we", "q": "Worked Example: An electric iron uses a nichrome wire as its heating element. The wire offers high resistance to current flow. When connected to a battery, the wire gets hot and the iron can press clothes. If 2 cells are used instead of 1, what happens to the heat generated?", "steps": [{"text": "Step 1: Recall that heat generated depends on the magnitude of electric current flowing through the wire."}, {"text": "Step 2: A battery with more cells gives a larger current compared to a single cell."}, {"text": "Step 3: Larger current means more electrical energy is converted to heat energy."}, {"text": "Step 4: Therefore, with 2 cells, the wire heats up MORE than with 1 cell. The heat generated is more with 2 cells."}], "answer": "More heat is generated with 2 cells because larger current flows through the wire."}, {"t": "milestone", "icon": "🔥", "title": "Heating Effect Mastered!", "xp": 50, "next": "Now: How Does a Battery Generate Electricity?"}, {"t": "tutor", "icon": "🔋", "title": "How Does a Battery Generate Electricity?", "body": "Portable sources of electricity, such as cells and batteries, are fascinating. Using these, we could light up a small lamp, make a magnet, and heat up a wire. But what is inside these cells and batteries that produces electricity? Let us explore the Voltaic cell, the dry cell, and rechargeable batteries."}, {"t": "tutor", "icon": "⚗️", "title": "The Voltaic Cell", "body": "A Voltaic cell, also known as a Galvanic cell, contains two metal rods made of different materials and a liquid called an electrolyte, placed in a glass or plastic container. The rods, called electrodes, are partly dipped in the electrolyte, which is usually a weak acid or salt solution. A chemical reaction between the rods and the electrolyte produces electricity. When the circuit is connected, electric current flows from the positive terminal through the circuit to the negative terminal. Over time, the chemicals get used up, and the cell stops working. It is then called dead and cannot supply any more electricity."}, {"t": "ix_voltaic", "instruction": "Tap on the different parts of the Voltaic cell to learn what each component does! Tap Electrode 1, Electrode 2, Electrolyte, and the connecting wire."}, {"t": "formula", "title": "Voltaic Cell — Key Parts", "formulas": [{"label": "Electrodes", "expr": "Two metal rods made of DIFFERENT materials", "note": "Example: copper and zinc"}, {"label": "Electrolyte", "expr": "A liquid (weak acid or salt solution) that conducts electricity", "note": "Example: lemon juice or salt water"}, {"label": "How it works", "expr": "Chemical reaction between electrodes and electrolyte → electricity", "note": "When chemicals are used up, the cell is dead"}]}, {"t": "quiz", "q": "Quick Check: What is the liquid used in a Voltaic cell called?", "diff": "easy", "opts": [{"t": "Electrolyte", "c": true}, {"t": "Electrode", "c": false, "m": "Electrodes are the metal rods, not the liquid.", "correctMethod": "The liquid is called the electrolyte. Electrodes are the solid metal rods."}, {"t": "Filament", "c": false, "m": "A filament is part of a lamp, not a Voltaic cell.", "correctMethod": "The liquid in a Voltaic cell is called the electrolyte."}, {"t": "Insulator", "c": false, "m": "An insulator blocks current — the liquid conducts it.", "correctMethod": "The liquid that conducts electricity is called the electrolyte."}]}, {"t": "tutor", "icon": "🍋", "title": "Make Your Own Voltaic Cell with Lemons!", "body": "In Activity 4.6, you can make your own Voltaic cell using lemons! Insert a copper wire and an iron nail in a lemon. Repeat for several lemons. Join the copper wires and nails in series. Connect an LED between the copper wire of the first lemon and the iron nail of the last lemon. The LED glows! In this cell, the metal electrodes are the copper wires and iron nails. The electrolyte is the lemon juice, which helps conduct electricity. You may also use salt solutions instead of lemon juice. Common metal pairs for Voltaic cells include zinc/copper, aluminium/copper, and iron/copper."}, {"t": "tutor", "icon": "🔋", "title": "The Dry Cell", "body": "Voltaic cells were an important discovery, but they are not convenient for everyday use. Instead, dry cells are one of the most widely used electric cells today. They are called dry because the electrolyte is not a liquid but a thick moist paste. A dry cell consists of a zinc container which acts as the negative terminal and a carbon rod at the centre covered with a metal cap that acts as the positive terminal. The carbon rod is surrounded by the paste-like electrolyte. The dry cell is a single-use cell — once it is used up, it has to be disposed of."}, {"t": "ix_drycell", "instruction": "Tap on the parts of the dry cell to explore its internal structure — the zinc container, carbon rod, electrolyte paste, and metal cap!"}, {"t": "truefalse", "q": "Dry cells are called 'dry' because they contain no electrolyte at all.", "ans": false, "explain": "Dry cells are called 'dry' because the electrolyte is not a liquid but a thick moist paste — they still have an electrolyte, just not in liquid form!", "m": "Remember — the electrolyte is a paste, not absent. Dry cells DO have electrolyte, just in paste form."}, {"t": "tutor", "icon": "📱", "title": "Rechargeable Batteries", "body": "Rechargeable batteries can be recharged and reused multiple times. This prevents wastage and saves money over time. There are many different kinds — from small batteries used in watches and phones to bigger batteries that run inverters or drive electric vehicles. However, rechargeable batteries also do not last forever. After being charged and used many times, they slowly wear out. Today, the lithium-ion (Li-ion) battery is the most common type of rechargeable battery. Scientists are also working on solid-state batteries, which would be much safer, charge faster, and last longer."}, {"t": "quiz", "q": "Quick Check: Which type of battery is the most common rechargeable battery used today?", "diff": "easy", "opts": [{"t": "Lithium-ion (Li-ion)", "c": true}, {"t": "Voltaic cell", "c": false, "m": "Voltaic cells are the earliest type and are not rechargeable.", "correctMethod": "Lithium-ion batteries are the most common rechargeable batteries today."}, {"t": "Dry cell", "c": false, "m": "Dry cells are single-use and cannot be recharged.", "correctMethod": "Lithium-ion batteries are rechargeable and used in phones, laptops, and EVs."}, {"t": "Lemon cell", "c": false, "m": "Lemon cells are homemade and not practical for daily use.", "correctMethod": "Lithium-ion batteries are the standard rechargeable batteries."}]}, {"t": "milestone", "icon": "🔋", "title": "Batteries Mastered!", "xp": 60, "next": "Now: Let's test everything with Rapid Fire!"}, {"t": "rapid_fire", "qs": [{"q": "When electric current flows through a wire, what does it produce around the wire?", "opts": ["Magnetic field", "Heat only", "Light", "Sound"], "ans": 0}, {"q": "A current-carrying coil that behaves as a magnet is called?", "opts": ["Electromagnet", "Voltaic cell", "Dry cell", "Insulator"], "ans": 0}, {"q": "Which wire offers higher resistance — nichrome or copper?", "opts": ["Nichrome", "Copper", "Both are equal", "Neither"], "ans": 0}, {"q": "What is the liquid in a Voltaic cell called?", "opts": ["Electrolyte", "Electrode", "Filament", "Terminal"], "ans": 0}, {"q": "What acts as the negative terminal in a dry cell?", "opts": ["Zinc container", "Carbon rod", "Metal cap", "Electrolyte paste"], "ans": 0}, {"q": "What type of battery can be recharged and reused?", "opts": ["Rechargeable battery", "Dry cell", "Voltaic cell", "Lemon cell"], "ans": 0}, {"q": "Deep inside the Earth, movement of which metal creates electric currents?", "opts": ["Liquid iron", "Copper", "Aluminium", "Zinc"], "ans": 0}, {"q": "The heat generated in a wire depends on the magnitude of what?", "opts": ["Electric current", "Voltage", "Resistance only", "Wire color"], "ans": 0}]}, {"t": "memory_match", "pairs": [{"en": "Electromagnet", "hi": "विद्युत चुंबक"}, {"en": "Magnetic Field", "hi": "चुंबकीय क्षेत्र"}, {"en": "Resistance", "hi": "प्रतिरोध"}, {"en": "Electrolyte", "hi": "विद्युत् अपघट्य"}, {"en": "Electrode", "hi": "इलेक्ट्रोड"}, {"en": "Heating Effect", "hi": "ऊष्मीय प्रभाव"}, {"en": "Dry Cell", "hi": "शुष्क सेल"}, {"en": "Conductor", "hi": "चालक"}]}, {"t": "quiz", "q": "Exercise Q3: An electric current flows through a nichrome wire for a short time. (i) The wire becomes warm. (ii) A magnetic compass placed below the wire is deflected. Which is correct?", "diff": "medium", "opts": [{"t": "Both (i) and (ii) are correct", "c": true}, {"t": "Only (i) is correct", "c": false, "m": "The compass IS also deflected because current produces a magnetic field.", "correctMethod": "Current through a wire produces both heat (heating effect) AND a magnetic field (magnetic effect). So both statements are correct."}, {"t": "Only (ii) is correct", "c": false, "m": "The wire DOES become warm — the heating effect is also present.", "correctMethod": "Both effects occur: the wire gets warm AND the compass deflects."}, {"t": "Both are not correct", "c": false, "m": "Both effects do occur when current flows.", "correctMethod": "Both the heating effect and magnetic effect occur simultaneously."}]}, {"t": "truefalse", "q": "Exercise Q2(i): Dry cells are less portable compared to Voltaic cells.", "ans": false, "explain": "Dry cells are MORE portable than Voltaic cells. Dry cells use a paste electrolyte, making them compact and easy to carry, while Voltaic cells use liquid electrolyte which can spill.", "m": "Think about which cell you use in your remote control and torch — is it a dry cell or a Voltaic cell?"}, {"t": "truefalse", "q": "Exercise Q2(ii): A coil becomes an electromagnet only when electric current flows through it.", "ans": true, "explain": "Correct! A coil only behaves as a magnet (electromagnet) when current flows through it. When current stops, the magnetic effect disappears.", "m": "Remember what happened in the activities — the clips fell off when the current was stopped."}, {"t": "truefalse", "q": "Exercise Q2(iii): An electromagnet using a single cell attracts more iron clips than the same electromagnet with a battery of 2 cells.", "ans": false, "explain": "Wrong! A battery with 2 cells gives MORE current, creating a STRONGER magnetic field, so it attracts MORE clips, not fewer. A single cell provides less current, so fewer clips are attracted.", "m": "More cells = more current = stronger electromagnet = more clips."}, {"t": "quiz", "q": "Exercise Q5: Nichrome wire is commonly used in electrical heating devices because it:", "diff": "medium", "opts": [{"t": "Generates more heat for a given current", "c": true}, {"t": "Is a good conductor of electricity", "c": false, "m": "A good conductor would generate less heat, not more.", "correctMethod": "Nichrome has high resistance, which generates more heat for the same current — that is why it is used in heating devices."}, {"t": "Is cheaper than copper", "c": false, "m": "Cost is not the reason for using nichrome in heating devices.", "correctMethod": "The reason is its high resistance, not its cost."}, {"t": "Is an insulator of electricity", "c": false, "m": "An insulator would not allow current to flow.", "correctMethod": "Nichrome is a conductor with high resistance, not an insulator."}]}, {"t": "quiz", "q": "Exercise Q11: Four coils of similar shape and size are made from iron, copper, aluminium, and nichrome. When current is passed through them, compass needles placed near the coils will show deflection in:", "diff": "hard", "opts": [{"t": "All four circuits", "c": true}, {"t": "Only in the iron circuit", "c": false, "m": "All metals conduct electricity and produce a magnetic field.", "correctMethod": "All four coils carry current, so ALL produce a magnetic field and deflect the compass. The material affects resistance and heat, not whether a magnetic field is produced."}, {"t": "Only in circuits with iron and copper", "c": false, "m": "Aluminium and nichrome also conduct electricity.", "correctMethod": "Any current-carrying conductor produces a magnetic field, regardless of the metal."}, {"t": "Only in the nichrome circuit", "c": false, "m": "All four metals conduct electricity and produce magnetic fields.", "correctMethod": "All four coils carry current, so all four produce magnetic fields and deflect the compass."}]}, {"t": "complete", "icon": "⚡", "title": "Chapter 4 Complete!", "sub": "Electricity: Magnetic and Heating Effects — Mastered!"}];

var App={
  nIdx:0,sIdx:0,xp:0,coins:0,streak:0,level:1,
  answered:false,selOpt:null,solveStepIdx:0,solveAnswered:false,selTf:null,
  rfIdx:0,rfScore:0,rfTimer:null,rfTime:30,
  mmFlipped:[],mmMatched:0,mmBusy:false,
  selTheme:'default',ownedThemes:[],badges:[],retryTimer:null,
  init:function(){
    var self=this;
    var cb=document.getElementById("continueBtn");
    if(cb)cb.addEventListener("click",function(){
      var step=STEPS[self.sIdx];if(!step)return;
      if(step.t==="quiz"&&!self.answered){self.checkQuiz(step,cb);return;}
      if(step.t==="truefalse"&&!self.answered){self.checkTrueFalse(step,cb);return;}
      if(step.t==="solve"&&!self.solveAnswered){self.checkSolve(step,cb);return;}
      if(step.t==="we"&&self.weStepIdx!==undefined&&self.weStepIdx<step.steps.length){
        self.weStepIdx++;if(self.weStepIdx>=step.steps.length){self.weStepIdx=0;self.next();return;}self.render();return;}
      self.next();
    });
    var bb=document.getElementById("backBtn");
    if(bb)bb.addEventListener("click",function(){self.back();});
    var lc=document.getElementById("luClose");
    if(lc)lc.addEventListener("click",function(){var d=document.getElementById("levelUpDialog");if(d){if(d.open)d.close();else d.removeAttribute("open");}});
    var dc=document.getElementById("dlgClose");
    if(dc)dc.addEventListener("click",function(){var d=document.getElementById("wordDialog");if(d){if(d.open)d.close();else d.removeAttribute("open");}});
    this.render();
  },
  render:function(){
    var step=STEPS[this.sIdx];if(!step)return;
    var cb=document.getElementById("continueBtn");if(!cb)return;
    cb.style.display="";cb.disabled=false;cb.className="btn btn-primary";
    var bb=document.getElementById("backBtn");if(bb)bb.disabled=this.sIdx===0;
    var pf=document.getElementById("progressFill");
    if(pf)pf.style.width=Math.round((this.sIdx/(STEPS.length-1))*100)+"%";
    this.answered=false;this.selOpt=null;this.selTf=null;this.shuffledOpts=null;
    if(this._prevSIdx!==this.sIdx){this.solveStepIdx=0;this.solveAnswered=false;this.weStepIdx=0;this._prevSIdx=this.sIdx;}
    if(this.rfTimer){clearInterval(this.rfTimer);this.rfTimer=null;}
    switch(step.t){
      case"intro":this.renderIntro(step,cb);break;
      case"text":this.renderText(step,cb);break;
      case"tutor":this.renderTutor(step,cb);break;
      case"real_example":this.renderRealExample(step,cb);break;
      case"formula":this.renderFormula(step,cb);break;
      case"ix_compass":this.renderIxCompass(step,cb);break;
      case"ix_electromagnet":this.renderIxElectromagnet(step,cb);break;
      case"ix_heating":this.renderIxHeating(step,cb);break;
      case"ix_voltaic":this.renderIxVoltaic(step,cb);break;
      case"ix_drycell":this.renderIxDryCell(step,cb);break;
      case"quiz":this.renderQuiz(step,cb);break;
      case"truefalse":this.renderTrueFalse(step,cb);break;
      case"we":this.renderWE(step,cb);break;
      case"solve":this.renderSolve(step,cb);break;
      case"rapid_fire":this.renderRapidFire(step,cb);break;
      case"memory_match":this.renderMemoryMatch(step,cb);break;
      case"milestone":this.renderMilestone(step,cb);break;
      case"complete":this.renderComplete(step,cb);break;
    }
    setTimeout(function(){applyLLE();},50);
    this.updateStats();
  },
  updateStats:function(){
    var sl=document.getElementById("statLvl");if(sl)sl.textContent="Lv "+this.level;
    var sc=document.getElementById("statCoins");if(sc)sc.textContent=this.coins;
    var sx=document.getElementById("statXp");if(sx)sx.textContent=this.xp;
  },
  checkLevelUp:function(){
    var th=[0,50,120,200,300,450];var nm=["Beginner","Learner","Scholar","Expert","Master","Champion"];
    for(var i=th.length-1;i>=0;i--){if(this.xp>=th[i]){if(this.level<i+1){this.level=i+1;this.showLevelUp(nm[i]);}break;}}
  },
  showLevelUp:function(name){
    var dlg=document.getElementById("levelUpDialog");if(!dlg)return;
    var ti=dlg.querySelector("div:nth-child(2)");if(ti)ti.textContent="Level Up! You are now a "+name+"!";
    if(dlg&&!dlg.open){try{dlg.showModal();}catch(e){}}
    this.fireConfetti();
  },
  fireConfetti:function(){
    var c=document.getElementById("confetti");if(!c)return;c.style.display="block";
    var ctx=c.getContext("2d");if(!ctx)return;
    c.width=window.innerWidth;c.height=window.innerHeight;
    var parts=[];
    for(var i=0;i<80;i++){parts.push({x:Math.random()*c.width,y:-20,vx:(Math.random()-0.5)*4,vy:Math.random()*3+2,c:["#7c3aed","#a855f7","#10b981","#f59e0b","#ec4899"][Math.floor(Math.random()*5)],s:Math.random()*6+3});}
    var t=0;
    function anim(){ctx.clearRect(0,0,c.width,c.height);for(var i=0;i<parts.length;i++){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);}t++;if(t<120)requestAnimationFrame(anim);else c.style.display="none";}
    anim();
  },
  next:function(){
    var step=STEPS[this.sIdx];if(!step)return;
    if((step.t==="quiz"||step.t==="truefalse")&&!this.answered)return;
    if(step.t==="solve"&&!this.solveAnswered)return;
    if(step.t==="rapid_fire"&&this.rfIdx<step.qs.length)return;
    if(step.t==="memory_match"&&this.mmMatched<step.pairs.length)return;
    this.sIdx++;if(this.sIdx>=STEPS.length)this.sIdx=STEPS.length-1;this.render();
  },
  back:function(){if(this.sIdx>0){this.sIdx--;if(this.rfTimer){clearInterval(this.rfTimer);this.rfTimer=null;}this.render();}},

      '<div class="bt" style="padding:14px;background:linear-gradient(135deg,#fff,#eef2ff);border-radius:14px;border:2px solid var(--bl);max-width:400px;box-shadow:0 4px 12px rgba(79,70,229,.08)">'+rt(introText)+'</div>'+
      '<div class="hint">Tap any word for Hindi meaning. Connecting words show Hindi automatically.</div>';
    cb.textContent="Start Learning";cb.className="btn btn-primary";cb.disabled=false;

    document.getElementById("screen").innerHTML=
      '<div class="instruction">'+rt(step.title)+'</div>'+
      '<div class="bt" style="padding:14px;background:linear-gradient(135deg,#fff,#f5f3ff);border-radius:14px;border:2px solid var(--border);max-width:400px;box-shadow:0 4px 12px rgba(0,0,0,.05)">'+rt(step.body)+'</div>';
    cb.textContent="Continue \u2192";cb.className="btn btn-primary";cb.disabled=false;
  },
  renderTutor:function(step,cb){
    document.getElementById("screen").innerHTML=

  /* SIM 1: Compass Deflection - Toggle switch to see compass needle deflect */
  renderIxCompass:function(step,cb){
    var isOn=false;
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Compass Deflection</div><canvas id="cpCanvas" width="300" height="240" style="display:block;margin:0 auto;border-radius:8px;background:#fff"></canvas><div style="text-align:center;margin-top:8px"><button class="shape-btn" id="cpSwitch">Turn Current ON</button></div><div class="discovery-box" style="margin-top:8px"><div class="d-title" id="cpTitle">Current is OFF</div><div class="d-text" id="cpInfo">The compass needle points north. No magnetic field from the wire.</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    var c=document.getElementById("cpCanvas");if(!c)return;var ctx=c.getContext("2d");if(!ctx)return;
    function draw(){
      ctx.clearRect(0,0,300,240);
      // Draw wire
      ctx.strokeStyle=isOn?"#ef4444":"#64748b";ctx.lineWidth=4;
      ctx.beginPath();ctx.moveTo(20,80);ctx.lineTo(280,80);ctx.stroke();
      // Draw switch
      ctx.fillStyle=isOn?"#10b981":"#64748b";
      ctx.beginPath();ctx.arc(150,80,8,0,2*Math.PI);ctx.fill();
      ctx.font="bold 10px sans-serif";ctx.textAlign="center";
      ctx.fillText(isOn?"ON":"OFF",150,100);
      // Draw battery
      ctx.fillStyle="#4f46e5";ctx.fillRect(20,70,20,20);
      ctx.fillStyle="#fff";ctx.font="bold 8px sans-serif";ctx.fillText("+",30,84);
      // Draw compass
      var cx=150,cy=160,radius=40;
      ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(cx,cy,radius,0,2*Math.PI);ctx.fill();
      ctx.strokeStyle="#64748b";ctx.lineWidth=2;ctx.stroke();
      // Compass needle
      var angle=isOn?Math.PI/4:0; // deflect when current on
      ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);
      ctx.fillStyle="#ef4444";ctx.beginPath();ctx.moveTo(0,-radius+5);ctx.lineTo(5,0);ctx.lineTo(0,radius-5);ctx.lineTo(-5,0);ctx.closePath();ctx.fill();
      ctx.fillStyle="#4f46e5";ctx.beginPath();ctx.moveTo(0,-radius+5);ctx.lineTo(-5,0);ctx.lineTo(0,radius-5);ctx.lineTo(5,0);ctx.closePath();ctx.fill();
      ctx.restore();
      // N label
      ctx.fillStyle="#64748b";ctx.font="bold 10px sans-serif";ctx.textAlign="center";
      ctx.fillText("N",cx,cy-radius-5);
      // Labels
      ctx.fillStyle="#4f46e5";ctx.font="bold 9px sans-serif";
      ctx.fillText("Wire",250,75);
      ctx.fillText("Compass",cx,cy+radius+15);
      if(isOn){
        ctx.fillStyle="#ef4444";ctx.font="bold 11px sans-serif";
        ctx.fillText("Current flowing!",cx,30);
        // Draw field lines
        ctx.strokeStyle="rgba(239,68,68,0.3)";ctx.lineWidth=2;
        for(var i=0;i<3;i++){
          ctx.beginPath();ctx.arc(150,80,30+i*20,0,Math.PI);ctx.stroke();
        }
      }
    }
    document.getElementById("cpSwitch").addEventListener("click",function(){
      isOn=!isOn;
      var btn=document.getElementById("cpSwitch");
      btn.textContent=isOn?"Turn Current OFF":"Turn Current ON";
      btn.className=isOn?"shape-btn active":"shape-btn";
      if(isOn){
        document.getElementById("cpTitle").textContent="Current is ON — Needle Deflected!";
        document.getElementById("cpInfo").textContent="The compass needle deflects because the current-carrying wire produces a magnetic field around it!";
      }else{
        document.getElementById("cpTitle").textContent="Current is OFF";
        document.getElementById("cpInfo").textContent="The compass needle returns to its original direction. The magnetic field has disappeared.";
      }
      draw();
    });
    draw();
  },

  /* SIM 2: Electromagnet Strength - Adjust cells and turns */
  renderIxElectromagnet:function(step,cb){
    var cells=1,turns=20;
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Electromagnet Strength Explorer</div><canvas id="emCanvas" width="300" height="260" style="display:block;margin:0 auto;border-radius:8px;background:#fff"></canvas><div style="margin-top:8px"><label style="font-size:.78rem;font-weight:700;color:var(--brand)">Cells: <span id="emCells" style="color:var(--pi)">1</span></label><br><input type="range" id="emCellSlider" min="1" max="4" step="1" value="1" style="width:100%;max-width:280px"></div><div style="margin-top:6px"><label style="font-size:.78rem;font-weight:700;color:var(--brand)">Coil Turns: <span id="emTurns" style="color:var(--pi)">20</span></label><br><input type="range" id="emTurnSlider" min="10" max="100" step="10" value="20" style="width:100%;max-width:280px"></div><div class="discovery-box" style="margin-top:8px"><div class="d-title" id="emTitle">Strength: Weak</div><div class="d-text" id="emInfo">1 cell, 20 turns. Lifts 1 clip.</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    var c=document.getElementById("emCanvas");if(!c)return;var ctx=c.getContext("2d");if(!ctx)return;
    function draw(){
      ctx.clearRect(0,0,300,260);
      // Calculate strength
      var strength=cells*turns;var clips=Math.min(Math.floor(strength/20),8);
      var strengthLabel=strength<40?"Weak":strength<100?"Medium":strength<200?"Strong":"Very Strong!";
      // Draw battery
      for(var i=0;i<cells;i++){
        ctx.fillStyle="#4f46e5";ctx.fillRect(30+i*15,100,12,30);
        ctx.fillStyle="#fff";ctx.font="bold 8px sans-serif";ctx.textAlign="center";
        ctx.fillText("+",36+i*15,108);
      }
      ctx.strokeStyle="#64748b";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(30+cells*15,115);ctx.lineTo(100,115);ctx.stroke();
      // Draw coil/nail
      ctx.strokeStyle="#4f46e5";ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(100,115);ctx.lineTo(100,80);ctx.stroke();
      // Draw nail (vertical)
      ctx.fillStyle="#64748b";ctx.fillRect(120,50,8,100);
      // Draw coil wraps
      var wrapCount=Math.min(Math.floor(turns/5),12);
      ctx.strokeStyle="#a855f7";ctx.lineWidth=2;
      for(var i=0;i<wrapCount;i++){
        var y=55+i*7;
        ctx.beginPath();ctx.ellipse(124,y,18,5,0,0,2*Math.PI);ctx.stroke();
      }
      // Draw wire back to battery
      ctx.strokeStyle="#4f46e5";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(142,80);ctx.lineTo(200,80);ctx.lineTo(200,115);ctx.lineTo(30,115);ctx.stroke();
      // Draw clips hanging
      ctx.fillStyle="#64748b";
      for(var i=0;i<clips;i++){
        var cy=155+Math.floor(i/4)*15;
        var cx=100+(i%4)*15;
        ctx.beginPath();ctx.arc(cx,cy,3,0,2*Math.PI);ctx.fill();
        ctx.strokeStyle="#64748b";ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(cx,150);ctx.lineTo(cx,cy);ctx.stroke();
      }
      // Labels
      ctx.fillStyle="#4f46e5";ctx.font="bold 9px sans-serif";ctx.textAlign="center";
      ctx.fillText("Iron Nail",124,42);
      ctx.fillText(cells+" Cell"+(cells>1?"s":""),36+cells*7,148);
      // Update discovery box
      document.getElementById("emCells").textContent=cells;
      document.getElementById("emTurns").textContent=turns;
      document.getElementById("emTitle").textContent="Strength: "+strengthLabel;
      document.getElementById("emInfo").textContent=cells+" cell"+(cells>1?"s":"")+", "+turns+" turns. Lifts "+clips+" clip"+(clips!=1?"s":"")+".";
    }
    document.getElementById("emCellSlider").addEventListener("input",function(){cells=parseInt(this.value);draw();});
    document.getElementById("emTurnSlider").addEventListener("input",function(){turns=parseInt(this.value);draw();});
    draw();
  },

  /* SIM 3: Heating Effect - Slider for current, wire changes color */
  renderIxHeating:function(step,cb){
    var current=1;
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Heating Effect Demo</div><canvas id="htCanvas" width="300" height="200" style="display:block;margin:0 auto;border-radius:8px;background:#fff"></canvas><div style="margin-top:8px"><label style="font-size:.78rem;font-weight:700;color:var(--brand)">Current: <span id="htCurrent" style="color:var(--pi)">1</span> (arbitrary units)</label><br><input type="range" id="htSlider" min="0" max="10" step="1" value="1" style="width:100%;max-width:280px"></div><div class="discovery-box" style="margin-top:8px"><div class="d-title" id="htTitle">Wire is cool</div><div class="d-text" id="htInfo">Low current means little heat is generated.</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    var c=document.getElementById("htCanvas");if(!c)return;var ctx=c.getContext("2d");if(!ctx)return;
    function draw(){
      ctx.clearRect(0,0,300,200);
      // Determine color based on current
      var heatLevel=current/10;
      var r=Math.floor(59+heatLevel*196);
      var g=Math.floor(100-heatLevel*100);
      var b=Math.floor(229-heatLevel*229);
      var wireColor="rgb("+r+","+g+","+b+")";
      // Draw wire (nichrome)
      ctx.strokeStyle=wireColor;ctx.lineWidth=8;
      ctx.beginPath();ctx.moveTo(30,100);ctx.lineTo(270,100);ctx.stroke();
      // Draw nails
      ctx.fillStyle="#64748b";
      ctx.fillRect(25,70,10,60);ctx.fillRect(265,70,10,60);
      // Draw battery
      ctx.fillStyle="#4f46e5";ctx.fillRect(30,140,20,20);
      ctx.strokeStyle="#64748b";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(40,140);ctx.lineTo(40,130);ctx.lineTo(270,130);ctx.lineTo(270,130);ctx.stroke();
      ctx.beginPath();ctx.moveTo(50,150);ctx.lineTo(270,150);ctx.stroke();
      // Draw heat waves if current is high
      if(current>=4){
        ctx.strokeStyle="rgba(239,68,68,0.5)";ctx.lineWidth=2;
        for(var i=0;i<3;i++){
          var yOff=100-20-i*15;
          ctx.beginPath();
          ctx.moveTo(80+i*50,yOff);
          ctx.quadraticCurveTo(95+i*50,yOff-10,110+i*50,yOff);
          ctx.stroke();
        }
      }
      // Glow effect for high current
      if(current>=7){
        ctx.shadowColor="rgba(255,100,0,0.5)";ctx.shadowBlur=20;
        ctx.strokeStyle="rgba(255,100,0,0.3)";ctx.lineWidth=8;
        ctx.beginPath();ctx.moveTo(30,100);ctx.lineTo(270,100);ctx.stroke();
        ctx.shadowBlur=0;
      }
      // Labels
      ctx.fillStyle="#4f46e5";ctx.font="bold 9px sans-serif";ctx.textAlign="center";
      ctx.fillText("Nichrome Wire",150,65);
      ctx.fillText("Battery",40,175);
      // Update discovery box
      document.getElementById("htCurrent").textContent=current;
      var label,info;
      if(current<=2){label="Wire is cool";info="Low current means little heat is generated.";}
      else if(current<=5){label="Wire is warm";info="Moderate current — the wire is getting warm due to resistance.";}
      else if(current<=8){label="Wire is HOT!";info="High current — lots of heat generated! The wire glows red.";}
      else{label="Wire is GLOWING RED HOT!";info="Very high current — maximum heat! This is how heating elements work.";}
      document.getElementById("htTitle").textContent=label;
      document.getElementById("htInfo").textContent=info;
    }
    document.getElementById("htSlider").addEventListener("input",function(){current=parseInt(this.value);draw();});
    draw();
  },

  /* SIM 4: Voltaic Cell Explorer - Interactive labeled diagram */
  renderIxVoltaic:function(step,cb){
    var selected="";
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Voltaic Cell Explorer</div><canvas id="vcCanvas" width="300" height="280" style="display:block;margin:0 auto;border-radius:8px;background:#fff;cursor:pointer"></canvas><div style="text-align:center;margin-top:6px"><button class="shape-btn vc-btn" data-part="electrode1">Electrode 1</button><button class="shape-btn vc-btn" data-part="electrode2">Electrode 2</button><button class="shape-btn vc-btn" data-part="electrolyte">Electrolyte</button><button class="shape-btn vc-btn" data-part="wire">Wire + Lamp</button></div><div class="discovery-box" style="margin-top:8px"><div class="d-title" id="vcTitle">Tap a part to explore!</div><div class="d-text" id="vcInfo">The Voltaic cell converts chemical energy into electrical energy.</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    var parts={
      "electrode1":{"title":"Electrode 1 (e.g. Copper)","info":"A metal rod dipped in the electrolyte. Acts as the positive terminal. Different metals are used for the two electrodes."},
      "electrode2":{"title":"Electrode 2 (e.g. Zinc)","info":"A different metal rod dipped in the electrolyte. Acts as the negative terminal. The difference between the two metals creates the electric current."},
      "electrolyte":{"title":"Electrolyte (Liquid)","info":"A weak acid or salt solution that conducts electricity. It reacts chemically with the electrodes to produce electricity. Lemon juice or salt water can be used!"},
      "wire":{"title":"Connecting Wire + Lamp","info":"Electric current flows from the positive terminal through the wire to the negative terminal. The lamp glows when current flows, showing the cell is working!"}
    };
    function draw(){
      var c=document.getElementById("vcCanvas");if(!c)return;var ctx=c.getContext("2d");if(!ctx)return;
      ctx.clearRect(0,0,300,280);
      // Container
      ctx.strokeStyle="#64748b";ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(80,100);ctx.lineTo(80,240);ctx.lineTo(220,240);ctx.lineTo(220,100);ctx.stroke();
      // Electrolyte
      ctx.fillStyle=selected==="electrolyte"?"rgba(245,158,11,0.4)":"rgba(99,102,241,0.2)";
      ctx.fillRect(82,130,136,108);
      // Electrode 1 (left - copper)
      ctx.fillStyle=selected==="electrode1"?"#f59e0b":"#b87333";
      ctx.fillRect(110,60,12,170);
      // Electrode 2 (right - zinc)
      ctx.fillStyle=selected==="electrode2"?"#f59e0b":"#a0a0a0";
      ctx.fillRect(178,60,12,170);
      // Wire connecting top of electrodes with lamp
      ctx.strokeStyle=selected==="wire"?"#f59e0b":"#4f46e5";ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(116,60);ctx.lineTo(116,40);ctx.lineTo(184,40);ctx.lineTo(184,60);ctx.stroke();
      // Lamp
      ctx.fillStyle=selected==="wire"?"#f59e0b":"#fbbf24";
      ctx.beginPath();ctx.arc(150,40,10,0,2*Math.PI);ctx.fill();
      ctx.strokeStyle="#64748b";ctx.lineWidth=1;ctx.stroke();
      // Labels
      ctx.fillStyle="#4f46e5";ctx.font="bold 9px sans-serif";ctx.textAlign="center";
      ctx.fillText("Cu",116,55);
      ctx.fillText("Zn",184,55);
      ctx.fillText("Electrolyte",150,200);
      ctx.fillText("(Liquid)",150,212);
      ctx.fillText("Glass Container",150,255);
    }
    var btns=document.querySelectorAll(".vc-btn");
    for(var i=0;i<btns.length;i++){
      btns[i].addEventListener("click",function(){
        selected=this.getAttribute("data-part");
        var p=parts[selected];
        document.getElementById("vcTitle").textContent=p.title;
        document.getElementById("vcInfo").textContent=p.info;
        for(var j=0;j<btns.length;j++)btns[j].classList.remove("active");
        this.classList.add("active");
        draw();
      });
    }
    draw();
  },

  /* SIM 5: Dry Cell Explorer - Interactive labeled diagram */
  renderIxDryCell:function(step,cb){
    var selected="";
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Dry Cell Explorer</div><canvas id="dcCanvas" width="280" height="280" style="display:block;margin:0 auto;border-radius:8px;background:#fff"></canvas><div style="text-align:center;margin-top:6px"><button class="shape-btn dc-btn" data-part="zinc">Zinc Container</button><button class="shape-btn dc-btn" data-part="carbon">Carbon Rod</button><button class="shape-btn dc-btn" data-part="electrolyte">Electrolyte Paste</button><button class="shape-btn dc-btn" data-part="cap">Metal Cap</button></div><div class="discovery-box" style="margin-top:8px"><div class="d-title" id="dcTitle">Tap a part to explore!</div><div class="d-text" id="dcInfo">A dry cell converts chemical energy into electrical energy using a paste electrolyte.</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    var parts={
      "zinc":{"title":"Zinc Container","info":"The outer container of the dry cell. It acts as the NEGATIVE terminal. Zinc is used because it reacts with the electrolyte to produce electricity."},
      "carbon":{"title":"Carbon Rod","info":"A rod at the centre of the cell. It acts as the POSITIVE terminal. It is surrounded by the electrolyte paste."},
      "electrolyte":{"title":"Electrolyte Paste","info":"A thick moist paste (not liquid!) that conducts electricity. This is why it is called a 'dry' cell — the electrolyte is a paste, not a liquid."},
      "cap":{"title":"Metal Cap","info":"The metal cap on top of the carbon rod. This is the positive terminal that connects to the external circuit."}
    };
    function draw(){
      var c=document.getElementById("dcCanvas");if(!c)return;var ctx=c.getContext("2d");if(!ctx)return;
      ctx.clearRect(0,0,280,280);
      // Zinc container (outer)
      ctx.fillStyle=selected==="zinc"?"#f59e0b":"#a0a0a0";
      ctx.fillRect(90,60,100,200);
      // Electrolyte paste (inner)
      ctx.fillStyle=selected==="electrolyte"?"#f59e0b":"rgba(99,102,241,0.3)";
      ctx.fillRect(105,75,70,170);
      // Carbon rod (center)
      ctx.fillStyle=selected==="carbon"?"#f59e0b":"#333333";
      ctx.fillRect(130,80,20,160);
      // Metal cap (top)
      ctx.fillStyle=selected==="cap"?"#f59e0b":"#b87333";
      ctx.fillRect(125,50,30,20);
      // Labels with arrows
      ctx.fillStyle="#4f46e5";ctx.font="bold 9px sans-serif";ctx.textAlign="left";
      // Zinc container label
      ctx.fillText("Zinc",195,100);ctx.fillText("Container",195,112);
      ctx.strokeStyle="#64748b";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(190,105);ctx.lineTo(165,105);ctx.stroke();
      // Carbon rod label
      ctx.fillText("Carbon",195,160);ctx.fillText("Rod",195,172);
      ctx.beginPath();ctx.moveTo(190,165);ctx.lineTo(155,165);ctx.stroke();
      // Electrolyte label
      ctx.fillStyle="#4f46e5";
      ctx.fillText("Electrolyte",10,160);ctx.fillText("Paste",10,172);
      ctx.beginPath();ctx.moveTo(55,165);ctx.lineTo(100,165);ctx.stroke();
      // Metal cap label
      ctx.fillText("Metal",195,55);ctx.fillText("Cap",195,67);
      ctx.beginPath();ctx.moveTo(190,60);ctx.lineTo(160,60);ctx.stroke();
      // + and - signs
      ctx.fillStyle="#ef4444";ctx.font="bold 14px sans-serif";ctx.textAlign="center";
      ctx.fillText("+",140,42);
      ctx.fillText("\u2212",90,270);
      ctx.fillStyle="#64748b";ctx.font="8px sans-serif";
      ctx.fillText("(Positive)",140,28);
      ctx.fillText("(Negative)",90,280);
    }
    var btns=document.querySelectorAll(".dc-btn");
    for(var i=0;i<btns.length;i++){
      btns[i].addEventListener("click",function(){
        selected=this.getAttribute("data-part");
        var p=parts[selected];
        document.getElementById("dcTitle").textContent=p.title;
        document.getElementById("dcInfo").textContent=p.info;
        for(var j=0;j<btns.length;j++)btns[j].classList.remove("active");
        this.classList.add("active");
        draw();
      });
    }
    draw();
  }
};
