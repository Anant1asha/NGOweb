<head>
<meta charset="UTF-8">

<title>Aasha — Polynomials | Class 10</title>
<style>

:root{--brand:#1e40af;--bl:#3b82f6;--surface:#f8fafc;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--green:#10b981;--red:#ef4444;--gold:#f59e0b;--pi:#ec4899;--purple:#a855f7;--amb:#fef3c7}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--surface);color:var(--text);line-height:1.5;font-size:16px;overscroll-behavior:none;max-width:600px;margin:0 auto;min-height:100vh}
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:100}
.hdr-logo{width:40px;height:40px;border-radius:8px;flex-shrink:0}
.hdr-name{font-size:.95rem;font-weight:800;color:var(--brand);line-height:1.2}
.hdr-hi{font-size:.72rem;color:var(--muted)}
.hdr-tag{font-size:.65rem;color:var(--gold);font-weight:600}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:62px;z-index:99}
.progress-track{flex:1;height:10px;background:var(--border);border-radius:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--purple));border-radius:10px;transition:width .4s;width:0}
.stat{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:700;padding:3px 7px;border-radius:16px;white-space:nowrap}
.stat.coins{color:var(--gold);background:var(--amb)}
.stat.xp{color:var(--purple);background:#ede9fe}
.stat.lvl{color:var(--brand);background:#dbeafe}
.profile-bar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:#fff;border-bottom:1px solid var(--border)}
.profile-avatar{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800}
.profile-name{font-size:.78rem;font-weight:600}
.profile-swap{margin-left:auto;padding:3px 8px;background:var(--border);border:none;border-radius:6px;font-size:.68rem;cursor:pointer}
.screen{padding:14px;min-height:400px;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
.intro-icon{font-size:3rem;margin-bottom:8px;text-align:center}
.intro-title{font-size:1.2rem;font-weight:800;text-align:center;margin-bottom:4px}
.intro-sub{color:var(--muted);font-size:.82rem;font-weight:600;text-align:center;margin-bottom:12px}
.instruction{text-align:center;font-size:.88rem;font-weight:700;color:var(--brand);margin:8px auto;padding:8px 14px;background:#dbeafe;border-radius:10px;max-width:400px}
.hint{font-size:.7rem;color:var(--muted);text-align:center;margin:6px 0}
.bt{font-size:1.05rem;line-height:2.6;color:var(--text);max-width:380px;margin:0 auto;text-align:left;font-weight:700}
.bts{font-size:.88rem;line-height:2.2;color:var(--text);max-width:360px;margin:0 auto;text-align:left;font-weight:600}
.wd{cursor:pointer;border-radius:3px;padding:0 1px;transition:background .15s;font-weight:700}
.wd:hover{background:#e0e7ff}
.cn{color:var(--brand);font-weight:800;cursor:pointer;border-bottom:2px dotted var(--bl);padding:0 1px}
.card{background:#fff;border:2px solid var(--border);border-radius:14px;padding:14px;max-width:400px;width:100%;margin:0 auto 8px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card-caption{text-align:center;font-size:.75rem;color:var(--muted);margin-top:6px;line-height:1.4}
.canvas-visual{display:block;margin:0 auto;border-radius:8px}
.game-card{background:#fff;border:2px solid var(--border);border-radius:14px;padding:14px;max-width:400px;width:100%;margin:0 auto;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.game-card canvas{display:block;margin:0 auto;cursor:crosshair;border-radius:8px;touch-action:none}
.we-card{background:#fff;border:2px solid var(--border);border-radius:14px;padding:14px;max-width:400px;width:100%;margin:0 auto 8px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.we-tag{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--brand);margin-bottom:6px}
.we-question{font-size:.92rem;font-weight:600;margin-bottom:10px}
.we-step{padding:10px 12px;background:#dbeafe;border-left:3px solid var(--brand);border-radius:0 8px 8px 0;margin-bottom:6px;animation:stepReveal .3s ease;font-size:.82rem}
.we-step.green{background:#d1fae5;border-left-color:var(--green)}
.we-step.amber{background:#fef3c7;border-left-color:var(--gold)}
.we-step.final{padding:10px;background:#d1fae5;border:2px solid var(--green);border-radius:10px;margin-top:6px;text-align:center;font-weight:700;color:#065f46}
.we-num{display:inline-block;width:20px;height:20px;background:var(--brand);color:#fff;border-radius:50%;text-align:center;font-size:.65rem;font-weight:700;line-height:20px;margin-right:6px}
.we-step.green .we-num{background:var(--green)}.we-step.amber .we-num{background:var(--gold)}
@keyframes stepReveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.quiz-opt{display:flex;align-items:flex-start;gap:10px;padding:12px;margin-bottom:7px;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all .15s;background:#fff}
.quiz-opt:hover{border-color:var(--bl)}
.quiz-opt.selected{border-color:var(--brand);background:#dbeafe}
.quiz-opt.correct{border-color:var(--green);background:#d1fae5}
.quiz-opt.wrong{border-color:var(--red);background:#fee2e2}
.quiz-radio{width:20px;height:20px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;margin-top:1px;transition:all .15s}
.quiz-opt.selected .quiz-radio{border-color:var(--brand);background:var(--brand)}
.quiz-opt.correct .quiz-radio{border-color:var(--green);background:var(--green)}
.quiz-opt.wrong .quiz-radio{border-color:var(--red);background:var(--red)}
.quiz-opt-text{flex:1;font-size:.82rem}
.feedback{padding:12px;border-radius:12px;margin:8px auto;max-width:400px;font-size:.85rem;text-align:center;line-height:1.4}
.feedback.ok{background:#d1fae5;border:1px solid #86efac;color:#065f46}
.feedback.no{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}
.misconception{background:#fffbeb;border:1px solid #f59e0b;border-radius:10px;padding:12px;margin:8px auto;max-width:400px;font-size:.78rem;color:#92400e;line-height:1.5}
.misconception strong{color:#991b1b}
.correct-method{background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:12px;margin:8px auto;max-width:400px;font-size:.78rem;color:#065f46;line-height:1.5}
.correct-method strong{color:#047857}
input[type=text]{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-size:1rem;margin-bottom:8px}
input[type=text]:focus{border-color:var(--brand);outline:none}
input[type=range]{width:100%;max-width:260px;accent-color:var(--brand);height:6px}
.angle-display{font-size:1.4rem;font-weight:800;text-align:center;margin:6px 0}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.milestone-icon{font-size:3.5rem;margin-bottom:6px;animation:pop .5s ease}
.milestone-text{font-size:1.1rem;font-weight:700;text-align:center}
.milestone-reward{font-size:1.8rem;font-weight:800;color:var(--gold);margin:6px 0}
.milestone-next{font-size:.78rem;color:var(--muted);margin-top:10px}
.complete-icon{font-size:4rem;margin-bottom:8px}
.complete-title{font-size:1.3rem;font-weight:800;margin-bottom:6px}
.complete-coins{font-size:2.5rem;font-weight:800;color:var(--gold);margin:10px 0}
.star-row{display:flex;gap:4px;justify-content:center;margin:8px 0}
.star-row span{font-size:1.8rem}
.chip{padding:3px 8px;border-radius:20px;font-size:.65rem;font-weight:600}
.badge-toast{position:fixed;top:100px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:12px 20px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:95;text-align:center;animation:pop .4s ease}
.badge-toast-icon{font-size:2rem}.badge-toast-name{font-size:.8rem;font-weight:800;color:var(--gold)}.badge-toast-desc{font-size:.68rem;color:var(--muted)}
.bottom-bar{position:sticky;bottom:0;left:0;right:0;background:#fff;padding:10px 16px;box-shadow:0 -1px 3px rgba(0,0,0,.06);z-index:50}
.btn{width:100%;padding:13px;border:none;border-radius:13px;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:#1e3a8a}.btn-primary:disabled{background:#cbd5e1;cursor:not-allowed;color:#fff}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#059669}
.btn-amber{background:var(--gold);color:#fff}
.btn-back{background:#f1f5f9;color:#475569;border:2px solid #cbd5e1;padding:10px 16px;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .15s;flex-shrink:0}
.btn-back:active{transform:scale(.95);background:#e2e8f0}
.btn-back:disabled{opacity:.3;cursor:not-allowed}
.btn-restart{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border:none;padding:12px 24px;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:12px}
.bottom-bar{display:flex;gap:8px;align-items:center;justify-content:center}
.bottom-bar .btn-primary{flex:1;max-width:300px}
dialog{border:none;border-radius:18px;padding:24px;max-width:300px;width:100%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.15);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.4);backdrop-filter:blur(2px)}
.prop-box{background:#f0fdf4;border-left:4px solid var(--green);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.78rem;margin:6px 0}
.formula-box{background:#eff6ff;border:2px solid var(--bl);border-radius:10px;padding:10px;margin:8px 0;text-align:center}
.formula-box .f-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;font-weight:600}
.formula-box .f-expr{font-size:1.1rem;font-weight:800;color:var(--brand);margin:4px 0}
.discovery-box{background:linear-gradient(135deg,#dbeafe,#ede9fe);border:2px solid var(--bl);border-radius:14px;padding:14px;margin:8px 0;text-align:center}
.discovery-box .d-title{font-size:.85rem;font-weight:800;color:var(--brand);margin-bottom:4px}
.discovery-box .d-text{font-size:.78rem;color:var(--text)}
.interactive-hint{font-size:.72rem;color:var(--purple);text-align:center;font-weight:600;margin:4px 0;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.tf-btn{display:flex;gap:10px;max-width:380px;margin:0 auto 8px}
.tf-opt{flex:1;padding:14px;border:2px solid var(--border);border-radius:12px;cursor:pointer;text-align:center;font-weight:700;font-size:1rem;transition:all .15s;background:#fff}
.tf-opt:hover{border-color:var(--bl)}
.tf-opt.sel-true{border-color:var(--green);background:#d1fae5;color:#065f46}
.tf-opt.sel-false{border-color:var(--red);background:#fee2e2;color:#991b1b}
.fb-input{width:100%;max-width:380px;margin:0 auto 8px;display:block;padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-size:1rem}
.fb-input:focus{border-color:var(--brand);outline:none}
.diff-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-left:6px}
.diff-easy{background:#d1fae5;color:#065f46}
.diff-medium{background:#fef3c7;color:#92400e}
.diff-hard{background:#fee2e2;color:#991b1b}
.mm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:320px;margin:0 auto;padding:8px 0}
.mm-card{aspect-ratio:1;perspective:600px;cursor:pointer}
.mm-card-inner{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mm-card.flipped .mm-card-inner{transform:rotateY(180deg)}
.mm-card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:.65rem;font-weight:700;text-align:center;padding:3px;line-height:1.2}
.mm-card-front{background:linear-gradient(135deg,var(--bl),var(--purple));border:2px solid var(--bl);color:#fff;font-size:1.2rem}
.mm-card-back{background:#fff;border:2px solid var(--border);transform:rotateY(180deg);color:var(--text)}
.mm-card.matched .mm-card-back{background:#d1fae5;border-color:var(--green);color:#065f46}
.mm-card.matched{pointer-events:none}
.mm-info{text-align:center;font-size:.8rem;color:var(--muted);margin:4px 0}
.timer-bar-container{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0 2px;max-width:380px;margin-left:auto;margin-right:auto}
.timer-bar{height:100%;background:var(--green);border-radius:3px;transition:width 1s linear}
.timer-bar.danger{background:var(--red);animation:tpulse .5s infinite}
@keyframes tpulse{50%{opacity:.5}}
.rf-header{text-align:center;margin:4px 0}
.rf-q-num{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:300;display:none}
.hint-btn{background:#fef3c7;border:2px solid #f59e0b;color:#92400e;padding:5px 10px;border-radius:6px;font-size:.72rem;font-weight:700;cursor:pointer;display:inline-block;margin:4px 0}
.hint-btn:disabled{opacity:.3;cursor:not-allowed}
.hint-btn:active{transform:scale(.95)}
.shop-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:9998;display:flex;align-items:center;justify-content:center;padding:16px}
.shop-modal{background:#fff;border-radius:16px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;padding:16px}
.shop-title{font-size:1.1rem;font-weight:900;color:var(--brand);text-align:center;margin-bottom:4px}
.shop-coins{font-size:.85rem;color:var(--gold);font-weight:800;text-align:center;margin-bottom:12px}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.shop-item{padding:12px 8px;border:2px solid var(--border);border-radius:10px;text-align:center;background:var(--surface);transition:all .15s}
.shop-item.owned{opacity:.5}
.shop-item-icon{font-size:1.8rem}
.shop-item-name{font-size:.72rem;font-weight:700;margin:4px 0}
.shop-item-cost{font-size:.85rem;color:var(--gold);font-weight:800}
.shop-buy-btn{margin-top:6px;padding:5px 10px;font-size:.72rem;border:none;border-radius:6px;color:#fff;background:var(--brand);font-weight:700;cursor:pointer}
.shop-buy-btn:disabled{opacity:.4;cursor:not-allowed}
.shop-close{text-align:center;margin-top:12px}
body.theme-ocean{--brand:#0ea5e9;--bl:#06b6d4;--green:#14b8a6;--gold:#f59e0b}
body.theme-forest{--brand:#16a34a;--bl:#15803d;--green:#22c55e;--gold:#ca8a04}
body.theme-sunset{--brand:#f97316;--bl:#ec4899;--green:#f59e0b;--gold:#f97316}

.ch{color:#a855f7;font-size:.85em;font-weight:700}
</style>

function rt(text,sm){
  var html=text;var keys=Object.keys(CONN).sort(function(a,b){return b.length-a.length});
  var connCount=0,result="",i=0;
  while(i<html.length){
    var ch=html[i];
    if(ch==="."||ch==="!"||ch==="?"){connCount=0;result+=ch;i++;continue;}
    if(ch===" "){result+=" ";i++;continue;}
    if(ch==="<"){var ci=html.indexOf(">",i);if(ci>=0){result+=html.substring(i,ci+1);i=ci+1;continue;}}
    var matched=false;
    if(i===0||!/[a-zA-Z]/.test(html[i-1])){
      for(var k=0;k<keys.length;k++){
        var c=keys[k];var sub=html.substring(i,i+c.length);
        if(sub.toLowerCase()===c.toLowerCase()){
          var ai=i+c.length;if(ai<html.length&&/[a-zA-Z]/.test(html[ai]))continue;
          var hi=CONN[c];connCount++;
          if(connCount<=3){result+='<span class="cn" data-w="'+sub+'" data-h="'+hi+'">'+sub+' <span class="ch">('+hi+')</span></span>';}
          else{result+='<span class="wd" data-w="'+sub.toLowerCase()+'" data-h="'+hi+'">'+sub+'</span>';}
          i+=c.length;matched=true;break;
        }
      }
    }
    if(matched)continue;
    if(/[a-zA-Z]/.test(ch)){
      var ws=i;while(i<html.length&&/[a-zA-Z]/.test(html[i]))i++;
      var word=html.substring(ws,i);var cw=word.toLowerCase();
      if(!cw){result+=word;continue;}
      var hi2=WM[cw];
      if(hi2)result+='<span class="wd" data-w="'+cw+'" data-h="'+hi2+'">'+word+'</span>';
      else result+='<span class="wd" data-w="'+cw+'" data-h="">'+word+'</span>';
    }else{result+=ch;i++;}
  }
  return result;
}

function applyLLE(){
  var sels=".bt,.bts,.we-question,.we-step,.quiz-opt-text,.instruction,.hint,.card-caption,.prop-box,.formula-box,.f-label,.f-expr,.f-note,.misconception,.correct-method,.feedback,.milestone-text,.milestone-next,.discovery-box .d-text,.discovery-box .d-title,.intro-title,.intro-sub,.complete-title,.complete-sub,.rf-question,.rf-opt-text,.lle-sentence";
  var els=document.querySelectorAll(sels);
  for(var i=0;i<els.length;i++){
    var el=els[i];if(el.querySelector(".wd")||el.querySelector(".cn"))continue;
    if(el.tagName==="BUTTON"||el.tagName==="INPUT")continue;
    var h=el.innerHTML;if(!h||h.trim().length<3)continue;
    var textOnly=h.replace(/<[^>]+>/g,"");if(textOnly.trim().length<3)continue;
    try{el.innerHTML=rt(h)}catch(e){}
  }
}

function showWord(w,h,d){
  var dlg=document.getElementById("wordDialog");if(!dlg)return;
  document.getElementById("dlgWord").textContent=w;
  document.getElementById("dlgHindi").textContent=h||"—";
  document.getElementById("dlgDesc").textContent=d||"";
  if(!dlg.open)dlg.showModal();
}

document.addEventListener("click",function(e){
  var el=e.target.closest(".cn");if(el){showWord(el.getAttribute("data-w"),el.getAttribute("data-h"),"Connecting word");return}
  el=e.target.closest(".wd");if(el){showWord(el.getAttribute("data-w"),el.getAttribute("data-h")||"—",el.getAttribute("data-h")?"":"Hindi meaning not available");return}
});

    var step=STEPS[this.sIdx];

    var cb=document.getElementById("continueBtn");
    if(!cb)return;
    var bb=document.getElementById("backBtn");
    if(bb)bb.disabled=this.sIdx===0;

      case"text":this.renderText(step,cb);break;
      case"formula":this.renderFormula(step,cb);break;
      case"ix_slider":this.renderIxSlider(step,cb);break;

      case"discovery":this.renderDiscovery(step,cb);break;

      case"memory_match":this.renderMemoryMatch(step,cb);break;
      case"milestone":this.renderMilestone(step,cb);break;

  updateStats:function(){

    var sx=document.getElementById("statXp");
    if(sx)sx.textContent=this.xp;
  },
  checkLevelUp:function(){
    var thresholds=[0,50,120,200,300,450];
    var names=["Beginner","Learner","Scholar","Expert","Master","Champion"];
    for(var i=thresholds.length-1;i>=0;i--){
      if(this.xp>=thresholds[i]){
        if(this.level<i+1){
          this.level=i+1;
          this.showLevelUp(names[i]);
        }
        break;
      }
    }
  },
  showLevelUp:function(name){
    var dlg=document.getElementById("levelUpDialog");
    if(!dlg)return;
    var ti=document.getElementById("luTitle");
    if(ti)ti.textContent="Level Up! You are now a "+name+"!";
    if(dlg&&!dlg.open){try{dlg.showModal();}catch(e){}}
    this.fireConfetti();
  },
  fireConfetti:function(){
    var c=document.getElementById("confetti");
    if(!c)return;
    c.style.display="block";
    var ctx=c.getContext("2d");
    if(!ctx)return;
    c.width=window.innerWidth;
    c.height=window.innerHeight;
    var parts=[];
    for(var i=0;i<80;i++){
      parts.push({x:Math.random()*c.width,y:-20,vx:(Math.random()-0.5)*4,vy:Math.random()*3+2,c:["#3b82f6","#a855f7","#10b981","#f59e0b","#ec4899"][Math.floor(Math.random()*5)],s:Math.random()*6+3});
    }
    var t=0;
    function anim(){
      ctx.clearRect(0,0,c.width,c.height);
      for(var i=0;i<parts.length;i++){
        var p=parts[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;
        ctx.fillStyle=p.c;
        ctx.fillRect(p.x,p.y,p.s,p.s);
      }
      t++;
      if(t<120)requestAnimationFrame(anim);
      else c.style.display="none";
    }
    anim();
  },
  next:function(){
    var step=STEPS[this.sIdx];
    if(!step)return;
    if((step.t==="quiz"||step.t==="truefalse")&&!this.answered)return;
    if(step.t==="solve"&&!this.solveAnswered)return;
    if(step.t==="rapid_fire"&&this.rfIdx<step.qs.length)return;
    if(step.t==="memory_match"&&this.mmMatched<step.pairs.length)return;
    this.sIdx++;
    if(this.sIdx>=STEPS.length)this.sIdx=STEPS.length-1;
    this.render();
  },
  back:function(){
    if(this.sIdx>0){
      this.sIdx--;
      if(this.rfTimer){clearInterval(this.rfTimer);this.rfTimer=null;}
      this.render();
    }
  },

      ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(0,120);ctx.lineTo(360,120);ctx.stroke();
      ctx.beginPath();ctx.moveTo(180,0);ctx.lineTo(180,240);ctx.stroke();
      ctx.strokeStyle="#3b82f6";
      ctx.lineWidth=2;
      ctx.beginPath();
      var started=false;
      for(var px=-180;px<=180;px+=2){
        var x=px/30;
        var y=a*x*x+b*x+c_val;
        var py=120-y*8;
        if(py<0||py>240){started=false;continue;}
        if(!started){ctx.moveTo(180+px,py);started=true;}
        else ctx.lineTo(180+px,py);
      }
      ctx.stroke();
      var disc=b*b-4*a*c_val;
      var info="p(x) = "+(a||"")+"x² + "+(b||"")+"x + "+(c_val||"")+"<br>";
      if(a!==0){
        var sum=-b/a;
        var prod=c_val/a;
        info+="<b>Sum of zeroes (α+β) = -b/a = "+(-b/a).toFixed(2)+"</b><br>";
        info+="<b>Product of zeroes (αβ) = c/a = "+(c_val/a).toFixed(2)+"</b><br>";
        if(disc>0)info+="Discriminant = b²-4ac = "+disc+" → <b>2 distinct real zeroes</b>";
        else if(disc===0)info+="Discriminant = b²-4ac = "+disc+" → <b>2 equal zeroes</b>";
        else info+="Discriminant = b²-4ac = "+disc+" → <b>no real zeroes</b>";
      }
      document.getElementById("ixInfo").innerHTML=info;
    }
    document.getElementById("slA").addEventListener("input",draw);
    document.getElementById("slB").addEventListener("input",draw);
    document.getElementById("slC").addEventListener("input",draw);
    draw();
  },
  renderIxGraph:function(step,cb){
    var self=this;
    document.getElementById("screen").innerHTML=
      '<div class="instruction">'+rt(step.instruction)+'</div>'+
      '<div class="game-card">'+
      '<canvas id="ixGraphCanvas" width="360" height="240" style="background:#fff"></canvas>'+
      '<div class="interactive-hint">👆 Click where the curve crosses the x-axis!</div>'+
      '</div>'+
      '<div class="discovery-box" id="ixGraphDisc" style="display:none">'+
      '<div class="d-title">You found a zero!</div>'+
      '<div class="d-text" id="ixGraphInfo"></div>'+
      '</div>'+
      '<div class="hint">The zeroes are the x-coordinates where the graph meets the x-axis.</div>';
    cb.textContent="Continue →";
    cb.className="btn btn-primary";
    cb.disabled=false;
    var c=document.getElementById("ixGraphCanvas");
    if(!c)return;
    var ctx=c.getContext("2d");
    if(!ctx)return;
    var a=step.a||1,b=step.b||0,cc=step.c||0;
    var zeroes=[];
    var disc=b*b-4*a*cc;
    if(disc>=0){
      var r1=(-b+Math.sqrt(disc))/(2*a);
      var r2=(-b-Math.sqrt(disc))/(2*a);
      if(Math.abs(r1-r2)<0.01){zeroes=[r1];}
      else zeroes=[r1,r2];
    }
    function draw(clickX){
      ctx.fillStyle="#f8fafc";
      ctx.fillRect(0,0,360,240);
      ctx.strokeStyle="#cbd5e1";
      ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(0,120);ctx.lineTo(360,120);ctx.stroke();
      ctx.beginPath();ctx.moveTo(180,0);ctx.lineTo(180,240);ctx.stroke();
      ctx.fillStyle="#92400e";
      ctx.font="10px sans-serif";
      for(var i=-5;i<=5;i++){
        if(i===0)continue;
        ctx.fillText(i,180+i*30-5,132);
        ctx.fillText(i,170,120-i*30+4);
      }
      ctx.strokeStyle="#3b82f6";
      ctx.lineWidth=2.5;
      ctx.beginPath();
      var started=false;
      for(var px=-180;px<=180;px+=2){
        var x=px/30;
        var y=a*x*x+b*x+cc;
        var py=120-y*8;
        if(py<-50||py>290){started=false;continue;}
        if(!started){ctx.moveTo(180+px,py);started=true;}
        else ctx.lineTo(180+px,py);
      }
      ctx.stroke();
      for(var z=0;z<zeroes.length;z++){
        var zx=180+zeroes[z]*30;
        ctx.fillStyle="#10b981";
        ctx.beginPath();ctx.arc(zx,120,6,0,Math.PI*2);ctx.fill();
        ctx.fillStyle="#065f46";
        ctx.font="bold 11px sans-serif";
        ctx.fillText("x="+zeroes[z].toFixed(2),zx-20,110);
      }
      if(clickX!==undefined){
        var cv=(clickX-180)/30;
        var found=false;
        for(var z=0;z<zeroes.length;z++){
          if(Math.abs(cv-zeroes[z])<0.5){
            found=true;
            var disc=document.getElementById("ixGraphDisc");
            if(disc){
              disc.style.display="block";
              document.getElementById("ixGraphInfo").innerHTML="You found x = "+zeroes[z].toFixed(2)+"! This is a zero because p("+zeroes[z].toFixed(2)+") = 0";
            }
            break;
          }
        }
        if(!found){
          var disc=document.getElementById("ixGraphDisc");
          if(disc){
            disc.style.display="block";
            document.getElementById("ixGraphInfo").innerHTML="That's not a zero. The curve must cross the x-axis at that point. Try again!";
          }
        }
      }
    }
    c.addEventListener("click",function(e){
      var rect=c.getBoundingClientRect();
      var sx=(e.clientX-rect.left)*c.width/rect.width;
      draw(sx);
    });
    draw();
  },

  renderMemoryMatch:function(step,cb){

    var cards=[];
    for(var i=0;i<pairs.length;i++){
      cards.push({text:pairs[i].en,match:i});
      cards.push({text:pairs[i].hi,match:i});
    }
    cards.sort(function(){return Math.random()-0.5;});
    var html='<div class="instruction">Match English words with Hindi meanings!</div>';
    html+='<div class="mm-info">Matched: <b id="mmScore">0</b> / '+pairs.length+'</div>';
    html+='<div class="mm-grid">';
    for(var i=0;i<cards.length;i++){
      html+='<div class="mm-card" data-mm-idx="'+i+'" data-mm-match="'+cards[i].match+'"><div class="mm-card-inner"><div class="mm-card-face mm-card-front">?</div><div class="mm-card-face mm-card-back">'+cards[i].text+'</div></div></div>';
    }
    html+='</div>';
    document.getElementById("screen").innerHTML=html;
    cb.textContent="Skip";cb.disabled=false;
    var els=document.querySelectorAll("[data-mm-idx]");
    for(var i=0;i<els.length;i++){
      els[i].addEventListener("click",function(){
        if(self.mmBusy)return;
        if(this.classList.contains("flipped")||this.classList.contains("matched"))return;
        this.classList.add("flipped");
        self.mmFlipped.push(this);
        if(self.mmFlipped.length===2){
          self.mmBusy=true;
          var c1=self.mmFlipped[0],c2=self.mmFlipped[1];
          if(c1.getAttribute("data-mm-match")===c2.getAttribute("data-mm-match")){
            setTimeout(function(){
              c1.classList.add("matched");c2.classList.add("matched");
              self.mmMatched++;
              document.getElementById("mmScore").textContent=self.mmMatched;
              self.xp+=5;self.updateStats();
              self.mmFlipped=[];self.mmBusy=false;
              if(self.mmMatched>=pairs.length){
                cb.textContent="Continue →";cb.className="btn btn-green";cb.disabled=false;
                self.checkLevelUp();
              }
            },500);
          }else{

  renderShop:function(){

      {id:"ocean",name:"Ocean",icon:"🌊",cost:50},
      {id:"forest",name:"Forest",icon:"🌲",cost:80},

        html+='<button class="shop-buy-btn" data-apply="'+th.id+'">Apply</button>';

      html+='</div>';

// Override next() to handle checking
App._origNext=App.next;
App.next=function(){
  var step=STEPS[this.sIdx];
  if(!step)return;
  if(step.t==="quiz"){
    if(!this.answered&&this.selOpt!==null){
      this.checkQuiz(step,document.getElementById("continueBtn"));
      return;
    }
    if(!this.answered)return;
    if(this.answered){
      var opt=step.opts[this.selOpt];
      if(opt&&!opt.c)return;
    }
  }
  if(step.t==="truefalse"){
    if(!this.answered&&this.selTf!==null){
      this.checkTrueFalse(step,document.getElementById("continueBtn"));
      return;
    }
    if(!this.answered)return;
  }
  if(step.t==="solve"){
    if(!this.solveAnswered&&this.selOpt!==null){
      this.checkSolve(step,document.getElementById("continueBtn"));
      return;
    }
    if(!this.solveAnswered)return;
  }
  this._origNext();
};

formulas:[
{label:"Sum of zeroes",expr:"α + β + γ = -b/a",note:"MINUS (same as quadratic)"},
{label:"Sum of products (pairs)",expr:"αβ + βγ + γα = c/a",note:"PLUS (no minus)"},
{label:"Product of all three",expr:"αβγ = -d/a",note:"MINUS again"}
]},
{t:"discovery",title:"Sign Pattern: Minus, Plus, Minus",
discoveryTitle:"Memory Trick",
body:"For cubic ax³+bx²+cx+d: the sign alternates starting with MINUS. Sum = -b/a (minus), Pairwise = +c/a (plus), Product = -d/a (minus). Pattern: −, +, −",
prop:"This mirrors the quadratic pattern (−, +) extended by one more term with alternating sign."},
{t:"quiz",q:"Exercise 2.1 Q5: If one zero of ax³ + bx² + cx + d is 0, what is the product of the other two zeroes?",
opts:[
{t:"-c/a",c:false,m:"The product of ALL three zeroes is -d/a, not -c/a. If one zero is 0, then αβγ = 0 × (product of other two) = 0. But the pairwise sum formula gives αβ+βγ+γα = c/a. With γ=0: αβ = c/a.",correctMethod:"Pairwise sum: αβ + βγ + γα = c/a. If γ=0, this becomes αβ + 0 + 0 = c/a. So the product of the other two zeroes = c/a."},
{t:"c/a",c:true},
{t:"0",c:false,m:"The product of ALL three zeroes is 0 (since one is 0), but the question asks for the product of the OTHER TWO zeroes, not all three. The other two are α and β, and their product αβ = c/a.",correctMethod:"αβγ = -d/a. With γ=0: 0 = -d/a, so d=0. The pairwise sum αβ+βγ+γα = c/a becomes αβ = c/a when γ=0."},
{t:"-b/a",c:false,m:"-b/a is the SUM of all three zeroes, not the product of two. The question asks for the product of the other two zeroes, which is αβ = c/a.",correctMethod:"-b/a = α+β+γ (sum). The product of two zeroes αβ is found from the pairwise sum formula: αβ+βγ+γα = c/a. With γ=0: αβ = c/a."}
]},
{t:"quiz",q:"Exercise 2.1 Q6: If one zero of x³ + ax² + bx + c is -1, what is the product of the other two zeroes?",
opts:[
{t:"b - a + 1",c:true},
{t:"b - a - 1",c:false,m:"If γ=-1, then αβγ = (-1)(αβ) = -αβ = -d/a = -c/1 = -c. So αβ = c. Also αβ + βγ + γα = c/a... wait, here a=1 (coefficient of x³), so: αβ+β(-1)+(-1)α = b/1. So αβ - β - α = b. Also α+β+(-1) = -a, so α+β = -a+1. Then αβ = b + (α+β) = b + (-a+1) = b-a+1. You likely made a sign error in the expansion.",correctMethod:"From sum: α+β = -a+1 (since γ=-1). From pairwise: αβ-α-β = b, so αβ = b+α+β = b+(-a+1) = b-a+1."},
{t:"a - b + 1",c:false,m:"You have the terms in the wrong order or got the sign wrong. Using α+β+γ = -a with γ=-1: α+β = 1-a. Using αβ+βγ+γα = b: αβ-(α+β) = b, so αβ = b+(α+β) = b+(1-a) = b-a+1.",correctMethod:"αβ = b + (α+β) = b + (1-a) = b - a + 1. The answer is b-a+1."},
{t:"a - b - 1",c:false,m:"Sign errors in the derivation. γ=-1, so α+β = -a-(-1) = -a+1. Then αβ = b + (α+β) = b + (-a+1) = b-a+1.",correctMethod:"Correct derivation: α+β = 1-a, αβ = b + (1-a) = b-a+1. Answer: b-a+1."}
]},

// ── NODE 8: TRUE/FALSE REASONING (Exercise 2.2) ──
{t:"text",title:"Reasoning Questions",
body:"Now let's test your understanding with True/False questions that require you to reason about the properties of polynomials. For each, think about WHY the answer is correct or incorrect."},
{t:"truefalse",q:"If the zeroes of ax² + bx + c are both positive, then a, b and c all have the same sign.",
ans:false,
m:"If both zeroes are positive: sum = -b/a > 0 means b/a < 0 (b and a have OPPOSITE signs). Product = c/a > 0 means c and a have the SAME sign. So b has a different sign from a and c — they do NOT all have the same sign.",
correctMethod:"Both positive zeroes: α+β = -b/a > 0 → b/a < 0 (opposite signs). αβ = c/a > 0 → same sign. So a and c same sign, but b opposite. They do NOT all have the same sign. Answer: FALSE.",
explain:"FALSE. Both positive zeroes means -b/a > 0 (so b/a < 0, b opposite to a) and c/a > 0 (c same as a). So b has a different sign — they can't all be the same."},
{t:"truefalse",q:"If the graph of a polynomial intersects the x-axis at only one point, it cannot be a quadratic polynomial.",
ans:false,
m:"A quadratic CAN intersect at one point if it touches (tangential to) the x-axis — this means equal zeroes (discriminant = 0). Example: y = x² - 6x + 9 = (x-3)² touches at x = 3 only.",
correctMethod:"A quadratic with discriminant b²-4ac = 0 has equal zeroes and its graph touches the x-axis at exactly one point. Example: y = (x-3)² touches at x=3. So it CAN be quadratic. Answer: FALSE.",
explain:"FALSE. A quadratic with equal zeroes (discriminant = 0) touches the x-axis at one point. Example: y = x²-6x+9 = (x-3)² touches at x = 3."},
{t:"truefalse",q:"If two zeroes of a cubic polynomial are 0, then it does not have linear and constant terms.",
ans:true,
m:"If α=0 and β=0, then αβγ = 0 = -d/a, so d=0 (no constant term). And αβ+βγ+γα = 0 = c/a, so c=0 (no linear term). The cubic reduces to ax³+bx² = x²(ax+b).",
correctMethod:"Two zeroes are 0: αβγ = 0×0×γ = 0 = -d/a → d=0 (no constant). αβ+βγ+γα = 0+0+0 = 0 = c/a → c=0 (no linear term). So the polynomial is ax³+bx². Answer: TRUE.",
explain:"TRUE. With two zeroes as 0: product αβγ=0 means d=0, and pairwise sum=0 means c=0. The polynomial becomes ax³+bx² = x²(ax+b)."},
{t:"truefalse",q:"Can x² + kx + k have equal zeroes for some odd integer k > 1?",
ans:false,
m:"For equal zeroes, discriminant = k² - 4k = 0 → k(k-4) = 0 → k = 0 or k = 4. Neither 0 nor 4 is an odd integer > 1. So no odd integer k > 1 gives equal zeroes.",
correctMethod:"Equal zeroes requires discriminant = 0: k² - 4(1)(k) = k²-4k = k(k-4) = 0. So k=0 or k=4. Neither is an odd integer > 1. Answer: FALSE.",
explain:"FALSE. Equal zeroes need discriminant k²-4k = 0, giving k=0 or k=4. Neither is an odd integer > 1."},

{t:"solve",q:"Find the zeroes of 2x² + (7/2)x + 3/4.",
steps:[
{type:"input",prompt:"Multiply through by 4 to clear fractions: 4 × (2x² + 7/2 x + 3/4) = ? (ax²+bx+c form)",answer:"8x²+14x+3",m:"4 × 2x² = 8x², 4 × 7/2 x = 14x, 4 × 3/4 = 3. Common mistake: not multiplying each term by 4, or making arithmetic errors.",correctMethod:"Multiply all terms by 4: 8x² + 14x + 3. Now factor this. a×c = 8×3 = 24, b = 14. Numbers that multiply to 24 and add to 14: 12 and 2."},
{type:"input",prompt:"Factor 8x² + 14x + 3. Split 14x as 12x + 2x: 8x²+12x+2x+3 = 4x(2x+3)+1(2x+3). What are the factors?",answer:"(4x+1)(2x+3)",m:"4x(2x+3) + 1(2x+3) = (4x+1)(2x+3). Common mistake: not recognizing the common factor (2x+3), or mixing up the grouping.",correctMethod:"8x²+12x+2x+3 = 4x(2x+3)+1(2x+3) = (4x+1)(2x+3). Zeroes: x = -1/4 and x = -3/2."}
]},

// ── NODE 10: DIVISION ALGORITHM ──
{t:"text",title:"Division Algorithm for Polynomials",
body:"Given any polynomial p(x) and a non-zero polynomial g(x), there exist unique polynomials q(x) and r(x) such that p(x) = g(x)·q(x) + r(x), where r(x) = 0 or degree of r(x) < degree of g(x)."},
{t:"formula",title:"Division Algorithm",
formulas:[
{label:"The Algorithm",expr:"p(x) = g(x) · q(x) + r(x)",note:"p = dividend, g = divisor, q = quotient, r = remainder"},
{label:"Condition on remainder",expr:"r(x) = 0 OR deg(r) < deg(g)",note:"Remainder must be smaller degree than divisor"},
{label:"Factor check",expr:"If r(x) = 0, then g(x) is a factor of p(x)",note:"No remainder means exact division"}
]},
{t:"quiz",q:"Can x - 1 be the remainder on division of p(x) by 2x + 3?",
opts:[
{t:"Yes",c:false,m:"The remainder must have degree LESS than the divisor. deg(x-1) = 1 and deg(2x+3) = 1. Since they're equal, x-1 CANNOT be the remainder.",correctMethod:"Division algorithm requires deg(r) < deg(g). Here deg(x-1) = 1 = deg(2x+3) = 1. Since the degrees are equal, x-1 cannot be the remainder. Answer: NO."},
{t:"No",c:true}
]},
{t:"we",q:"If the remainder on division of x³ + 2x² + kx + 3 by x - 3 is 21, find k and the zeroes.",
steps:[
{text:"p(3) = 27 + 18 + 3k + 3 = 21",color:""},
{text:"48 + 3k = 21 → 3k = -27 → k = -9",color:"green"},
{text:"Polynomial: x³ + 2x² - 9x + 3. Divide by (x-3): quotient = x² + 5x + 6",color:""},
{text:"Factor: x² + 5x + 6 = (x+2)(x+3)",color:""},
{text:"Zeroes: x = 3, x = -2, x = -3",color:"final"}
],
answer:"k = -9, zeroes: 3, -2, -3"},

// ── NODE 11: LONG ANSWER (Exercise 2.4) ──
{t:"solve",q:"Exercise 2.4 Q2: Zeroes of x³ - 6x² + 3x + 10 are of the form a, a+b, a+2b. Find a and b.",
steps:[
{type:"input",prompt:"Sum of zeroes = a + (a+b) + (a+2b) = 3a + 3b. This equals -(-6)/1 = 6. So 3a+3b = 6, which simplifies to a+b = ?",answer:"2",m:"3a+3b = 6, divide both sides by 3: a+b = 2. Common mistake: not dividing by 3, or getting 3(a+b)=6 wrong.",correctMethod:"Sum = 3a+3b = 6 (from -b/a = 6/1). Divide by 3: a+b = 2."},
{type:"input",prompt:"Product of zeroes = a(a+b)(a+2b) = -d/a = -10/1 = -10. Since a+b=2, substitute: a×2×(a+2b) = -10. So 2a(a+2b) = -10, meaning a(a+2b) = ?",answer:"-5",m:"2a(a+2b) = -10, divide by 2: a(a+2b) = -5. Since a+b=2, we have b=2-a, so a+2b = a+2(2-a) = a+4-2a = 4-a. So a(4-a) = -5 → 4a-a² = -5 → a²-4a-5=0 → (a-5)(a+1)=0 → a=5 or a=-1. If a=5, b=2-5=-3, zeroes: 5,2,-1 (but sum=6 ✓, product=5×2×(-1)=-10 ✓). If a=-1, b=3, zeroes: -1,2,5 (sum=6 ✓, product=-1×2×5=-10 ✓). The standard answer is a=-1, b=3.",correctMethod:"From a+b=2: b=2-a. a+2b = a+2(2-a) = 4-a. So a(4-a) = -5 → a²-4a-5=0 → (a-5)(a+1)=0. a=-1 gives b=3, zeroes: -1,2,5."},
{type:"mcq",prompt:"What are the values of a and b?",opts:[
{t:"a = -1, b = 3",c:true},
{t:"a = 5, b = -3",c:false,m:"a=5, b=-3 gives zeroes 5, 2, -1 which also works mathematically, but the standard convention takes a as the smallest zero, giving a=-1, b=3 with zeroes -1, 2, 5 in ascending order.",correctMethod:"Both a=-1,b=3 (zeroes -1,2,5) and a=5,b=-3 (zeroes 5,2,-1) give the same set of zeroes. The standard answer is a=-1, b=3."},
{t:"a = 2, b = 1",c:false,m:"a=2, b=1 gives sum 3(2)+3(1)=9≠6 and product 2×3×4=24≠-10. This doesn't satisfy either condition.",correctMethod:"Check: 3a+3b = 3(2)+3(1) = 9 ≠ 6. So a=2, b=1 is wrong. The correct answer is a=-1, b=3."},
{t:"a = 1, b = 2",c:false,m:"a=1, b=2 gives sum 3(1)+3(2)=9≠6 and product 1×3×5=15≠-10. Neither condition is satisfied.",correctMethod:"Check: 3(1)+3(2)=9≠6. Wrong. The correct answer is a=-1, b=3 (sum=6, product=-10)."}
]}
]},

// ── NODE 12: PRACTICE PAPER — SECTION A (MCQs) ──
{t:"text",title:"Practice Paper — Section A",
body:"Now let's tackle the KV Practice Paper questions. These are exam-style MCQs that test your understanding of all the concepts we've learned."},
{t:"quiz",q:"Q3: Zeroes of a polynomial can be determined graphically. No. of zeroes = no. of points where the graph intersects the ___?",
opts:[
{t:"y-axis",c:false,m:"The y-axis is where x = 0. Zeroes are values of x where p(x) = 0, which happens where the graph meets the x-axis (where y = 0), not the y-axis.",correctMethod:"Zeroes are x-values where p(x) = 0. On a graph, p(x) = 0 means y = 0, which is the x-axis. So count x-axis intersections."},
{t:"x-axis",c:true},
{t:"y-axis or x-axis",c:false,m:"It's specifically the x-axis (where y = 0). The y-axis (where x = 0) gives the y-intercept, not the zeroes. A polynomial's zeroes are where y = p(x) = 0.",correctMethod:"Zeroes are where p(x) = 0, meaning y = 0, which is the x-axis. The y-axis gives the y-intercept (value of p(0)), not the zeroes."},
{t:"none of these",c:false,m:"The correct answer IS available: the x-axis. Zeroes correspond to x-axis intersections because p(x) = 0 means y = 0.",correctMethod:"Zeroes = x-axis intersections. This IS one of the options (option b)."}
]},
{t:"quiz",q:"Q5: If p(x) = ax² + bx + c and a + b + c = 0, then one zero is:",
opts:[
{t:"-b/a",c:false,m:"-b/a is the SUM of both zeroes, not a single zero. If a+b+c=0, then p(1) = a(1)²+b(1)+c = a+b+c = 0. So x = 1 is a zero. But that's not the right form — the OTHER zero would be c/a (since product = c/a and one zero is 1, the other is c/a).",correctMethod:"a+b+c=0 means p(1) = a+b+c = 0, so x=1 is a zero. The other zero = (c/a)/1 = c/a. So c/a is the other zero. Answer: c/a."},
{t:"c/a",c:true},
{t:"b/c",c:false,m:"b/c has no meaning in this context. The correct approach: p(1)=a+b+c=0, so x=1 is a zero. Product of zeroes = c/a. If one zero is 1, the other = (c/a) ÷ 1 = c/a.",correctMethod:"Since p(1) = 0, x=1 is a zero. Product = c/a, so other zero = (c/a)/1 = c/a."},
{t:"none of these",c:false,m:"The answer c/a IS available as option (b). If a+b+c=0, then x=1 is a zero, and the other zero is c/a (from product = c/a and one zero being 1).",correctMethod:"p(1) = 0 → x=1 is a zero. Product = c/a → other zero = c/a. Answer: c/a (option b)."}
]},
{t:"quiz",q:"Q7: The quadratic polynomial whose sum of zeroes is -5 and product is 6:",
opts:[
{t:"x² + 5x + 6",c:true},
{t:"x² - 5x + 6",c:false,m:"This has sum = 5 (not -5). The formula is x² - Sx + P. With S = -5: x² - (-5)x + 6 = x² + 5x + 6. You forgot to apply the minus sign to S.",correctMethod:"p(x) = x² - (sum)x + (product) = x² - (-5)x + 6 = x² + 5x + 6. The sum is -5, so -(-5) = +5."},
{t:"x² - 5x - 6",c:false,m:"This has sum = 5 and product = -6. Neither matches. The sum should be -5 and product should be +6. You got both signs wrong.",correctMethod:"Sum = -5, Product = 6. p(x) = x² - (-5)x + 6 = x² + 5x + 6. Check: sum = -5 ✓, product = 6 ✓."},
{t:"-x² + 5x + 6",c:false,m:"This has a = -1, which changes the signs. Sum = -b/a = -5/(-1) = 5 ≠ -5. The standard form has a = 1.",correctMethod:"With a=1: p(x) = x² - (sum)x + product = x² - (-5)x + 6 = x² + 5x + 6. The leading coefficient should be 1 (or positive)."}
]},
{t:"quiz",q:"Q8: If zeroes of p(x) = 2x² - 7x + k are reciprocals of each other, find k.",
opts:[
{t:"1",c:false,m:"If zeroes are reciprocals, αβ = 1 (product of a number and its reciprocal is 1). Here αβ = c/a = k/2. So k/2 = 1 → k = 2, not 1. You set k = 1 directly instead of solving k/2 = 1.",correctMethod:"Reciprocal zeroes means αβ = 1. Since αβ = c/a = k/2, we get k/2 = 1, so k = 2."},
{t:"2",c:true},
{t:"3",c:false,m:"If αβ = k/2 and reciprocals mean αβ = 1, then k/2 = 1 → k = 2, not 3. You may have confused product with sum.",correctMethod:"Reciprocal zeroes → product = 1. Product = c/a = k/2. So k/2 = 1 → k = 2."},
{t:"4",c:false,m:"k/2 = 1 gives k = 2, not 4. You may have set k = 2α or made an arithmetic error.",correctMethod:"αβ = c/a = k/2. Reciprocals: αβ = 1. So k/2 = 1 → k = 2."}
]},
{t:"quiz",q:"Q9 (Assertion-Reason): A: x² + 4x + 5 has two real zeroes. R: A quadratic polynomial can have at most two zeroes.",
opts:[
{t:"Both A and R true, R explains A",c:false,m:"R is true (a quadratic can have at most 2 zeroes), but A is FALSE: discriminant = 16-20 = -4 < 0, so x²+4x+5 has NO real zeroes. If A is false, R can't explain it.",correctMethod:"Check A: discriminant = 4²-4(1)(5) = 16-20 = -4 < 0, so NO real zeroes. A is false. R is true (at most 2). Since A is false, the answer is (d): A false, R true."},
{t:"Both A and R true, R does not explain A",c:false,m:"A is actually FALSE (discriminant = -4 < 0 means no real zeroes). So this option doesn't apply. You need to check the discriminant first.",correctMethod:"A is false (disc < 0, no real zeroes). R is true. Since A is false and R is true, answer is (d)."},
{t:"A true, R false",c:false,m:"A is false (x²+4x+5 has discriminant 16-20=-4<0, so no real zeroes). R is true. You got both the assertion and the analysis wrong.",correctMethod:"A is FALSE (no real zeroes, discriminant < 0). R is TRUE. Answer: (d) A false, R true."},
{t:"A false, R true",c:true}
]},

// ── NODE 13: PRACTICE PAPER — SECTION B (2 marks) ──
{t:"text",title:"Practice Paper — Section B (2 marks each)",
body:"These are 2-mark questions requiring you to find zeroes or form polynomials. Show your working!"},
{t:"solve",q:"Q11: Find the zeroes of √3x² + 10x + 7√3.",
steps:[
{type:"input",prompt:"a×c = √3 × 7√3 = ? (simplify the product)",answer:"21",m:"√3 × 7√3 = 7 × (√3)² = 7 × 3 = 21. Common mistake: not recognizing that √3 × √3 = 3, or leaving the answer as 7√9.",correctMethod:"√3 × 7√3 = 7 × 3 = 21. Find two numbers with product 21 and sum 10: 3 and 7."},
{type:"input",prompt:"Factor: √3x² + 3x + 7x + 7√3 = √3x(x+√3) + 7(x+√3) = (?)(x+√3). What is the first factor?",answer:"√3x+7",m:"√3x(x+√3) + 7(x+√3) = (√3x+7)(x+√3). Common mistake: not factoring out the common (x+√3) correctly, or getting √3 wrong.",correctMethod:"(√3x+7)(x+√3) = 0. Zeroes: x = -7/√3 = -7√3/3 and x = -√3."}
]},
{t:"solve",q:"Q13: If sum of zeroes of ky² + 2y - 3k equals twice their product, find k.",
steps:[
{type:"input",prompt:"Sum of zeroes = -b/a = -2/k. Product = c/a = -3k/k = -3. The condition: sum = 2 × product. So -2/k = 2 × (-3) = ?",answer:"-6",m:"2 × (-3) = -6. So the condition is -2/k = -6. Common mistake: computing 2 × (-3) as +6.",correctMethod:"Sum = -2/k, Product = -3. Condition: Sum = 2×Product → -2/k = 2×(-3) = -6."},
{type:"input",prompt:"-2/k = -6. Solve for k.",answer:"1/3",m:"-2/k = -6 → -2 = -6k → k = 2/6 = 1/3. Common mistake: getting k = -1/3 by sign error, or k = 3 by inverting wrong.",correctMethod:"-2/k = -6 → k = -2/(-6) = 2/6 = 1/3. Answer: k = 1/3."}
]},
{t:"solve",q:"Q14: If product of zeroes of ax² - 6x - 6 is 4, find a and the sum of zeroes.",
steps:[
{type:"input",prompt:"Product of zeroes = c/a = -6/a. This equals 4. So -6/a = 4. Find a.",answer:"-3/2",m:"-6/a = 4 → a = -6/4 = -3/2. Common mistake: getting a = 3/2 by ignoring the negative sign, or a = -2/3 by inverting.",correctMethod:"-6/a = 4 → a = -6/4 = -3/2."},
{type:"input",prompt:"Sum of zeroes = -b/a = -(-6)/(-3/2) = 6/(-3/2) = ?",answer:"-4",m:"6 ÷ (-3/2) = 6 × (-2/3) = -4. Common mistake: getting +4 by not handling the division by a negative fraction correctly.",correctMethod:"Sum = -b/a = -(-6)/(-3/2) = 6/(-3/2) = 6 × (-2/3) = -4. Answer: a = -3/2, sum = -4."}
]},

// ── NODE 14: PRACTICE PAPER — SECTION C (3 marks) ──
{t:"text",title:"Practice Paper — Section C (3 marks each)",
body:"These 3-mark questions require verification and multi-step working."},
{t:"we",q:"Q15: Find zeroes of 4x² + 24x + 36 and verify relationship with coefficients.",
steps:[
{text:"4x² + 24x + 36 = 4(x² + 6x + 9) = 4(x + 3)²",color:""},
{text:"Zero: x = -3 (repeated/equal zero)",color:"green"},
{text:"Verify: Sum = -3 + (-3) = -6. And -b/a = -24/4 = -6 ✓",color:"amber"},
{text:"Product = (-3)×(-3) = 9. And c/a = 36/4 = 9 ✓",color:"final"}
],
answer:"x = -3 (double zero). Verified."},
{t:"solve",q:"Q16: If α, β are zeroes of 4x² + 4x + 1, form a quadratic whose zeroes are 2α, 2β.",
steps:[
{type:"input",prompt:"Original sum = α+β = -b/a = -4/4 = ?",answer:"-1",m:"α+β = -b/a = -4/4 = -1. Common mistake: getting +1 by forgetting the minus sign in the formula.",correctMethod:"Sum of original zeroes: α+β = -b/a = -4/4 = -1."},
{type:"input",prompt:"Original product = αβ = c/a = 1/4 = ?",answer:"1/4",m:"αβ = c/a = 1/4. Common mistake: getting 1 or 4 by not dividing c by a.",correctMethod:"Product = c/a = 1/4."},
{type:"input",prompt:"New zeroes are 2α, 2β. New sum = 2(α+β) = 2×(-1) = ? And new product = 4(αβ) = 4×(1/4) = ?",answer:"-2 and 1",m:"New sum = 2(α+β) = 2×(-1) = -2. New product = (2α)(2β) = 4αβ = 4×(1/4) = 1. Common mistake: forgetting to SQUARE the 2 for the product (product scales by the square, not linearly).",correctMethod:"New sum = 2S = 2(-1) = -2. New product = 4P = 4(1/4) = 1. New polynomial: x² - (-2)x + 1 = x² + 2x + 1 = (x+1)²."},
{type:"mcq",prompt:"What is the new polynomial?",opts:[
{t:"x² + 2x + 1",c:true},

{type:"input",prompt:"First find S = α+β = -b/a = -5/5 = ? And P = αβ = c/a = 1/5 = ?",answer:"-1 and 1/5",m:"Sum S = -b/a = -5/5 = -1. Product P = c/a = 1/5. Common mistake: getting sum = 1 (forgetting minus) or product = 5.",correctMethod:"S = α+β = -5/5 = -1. P = αβ = 1/5."},
{type:"input",prompt:"(i) α² + β² = (α+β)² - 2αβ = S² - 2P = (-1)² - 2(1/5) = ?",answer:"3/5",m:"S² - 2P = 1 - 2/5 = 5/5 - 2/5 = 3/5. Common mistake: computing 1 - 2/5 as 1/5 (subtracting wrong) or forgetting to square S.",correctMethod:"α²+β² = S²-2P = 1 - 2/5 = 5/5 - 2/5 = 3/5."},
{type:"input",prompt:"(ii) 1/α + 1/β = (α+β)/(αβ) = S/P = (-1)/(1/5) = ?",answer:"-5",m:"(-1)/(1/5) = (-1)×5 = -5. Common mistake: getting -1/5 by not flipping the fraction, or +5 by sign error.",correctMethod:"1/α+1/β = (α+β)/(αβ) = S/P = (-1)/(1/5) = -1 × 5 = -5."},
{type:"input",prompt:"(iii) α³ + β³ = (α+β)³ - 3αβ(α+β) = S³ - 3PS = (-1)³ - 3(1/5)(-1) = ?",answer:"-2/5",m:"(-1)³ = -1. -3(1/5)(-1) = +3/5. So -1 + 3/5 = -5/5 + 3/5 = -2/5. Common mistake: getting -8/5 by cubing wrong, or +2/5 by sign error.",correctMethod:"α³+β³ = S³ - 3PS = (-1) - 3(1/5)(-1) = -1 + 3/5 = -5/5 + 3/5 = -2/5."}
