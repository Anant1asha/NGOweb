function rt(text,sm){
  if(!text)return "";
  var html=text;var keys=Object.keys(CONN).sort(function(a,b){return b.length-a.length});
  var connCount=0,result="",i=0;
  while(i<html.length){
    var ch=html[i];
    if(ch==="."||ch==="!"||ch==="?"||ch===","){connCount=0;result+=ch;i++;continue;}
    if(ch===" "){result+=" ";i++;continue;}
    if(ch==="<"){var ci=html.indexOf(">",i);if(ci>=0){result+=html.substring(i,ci+1);i=ci+1;continue;}}
    var matched=false;
    if(i===0||!/[a-zA-Z]/.test(html[i-1])){
      for(var k=0;k<keys.length;k++){
        var c=keys[k];var sub=html.substring(i,i+c.length);
        if(sub.toLowerCase()===c.toLowerCase()){
          var ai=i+c.length;if(ai<html.length&&/[a-zA-Z]/.test(html[ai]))continue;
          var hi=CONN[c];connCount++;
          if(connCount<=4){result+='<span class="cn" data-w="'+sub+'" data-h="'+hi+'">'+sub+' <span class="ch">('+hi+')</span></span>';}
          else{result+='<span class="wd" data-w="'+sub.toLowerCase()+'" data-h="'+hi+'">'+sub+'</span>';}
          i+=c.length;matched=true;break;
        }
      }
    }
    if(matched)continue;
    if(/[a-zA-Z]/.test(ch)){
      var ws=i;while(i<html.length&&/[a-zA-Z]/.test(html[i]))i++;
      var word=html.substring(ws,i);var cw=word.toLowerCase();
      if(!cw){result+=word;continue;}
      var hi2=WM[cw];
      if(hi2)result+='<span class="wd" data-w="'+cw+'" data-h="'+hi2+'">'+word+'</span>';
      else result+='<span class="wd" data-w="'+cw+'" data-h="">'+word+'</span>';
    }else{result+=ch;i++;}
  }
  return result;
}

function applyLLE(){
  var sels=".bt,.we-question,.we-step,.quiz-opt-text,.instruction,.hint,.prop-box,.formula-box,.f-label,.f-expr,.f-note,.misconception,.correct-method,.feedback,.milestone-text,.milestone-next,.discovery-box .d-text,.discovery-box .d-title,.intro-title,.intro-sub,.complete-title,.complete-sub,.rf-question,.rf-opt-text,.prop-table th,.prop-table td,.we-tag,.visual-title,.tutor-box,.real-example";
  var els=document.querySelectorAll(sels);
  for(var i=0;i<els.length;i++){
    var el=els[i];if(el.querySelector(".wd")||el.querySelector(".cn"))continue;
    if(el.tagName==="BUTTON"||el.tagName==="INPUT")continue;
    var h=el.innerHTML;if(!h||h.trim().length<3)continue;
    var textOnly=h.replace(/<[^>]+>/g,"");if(textOnly.trim().length<3)continue;
    try{el.innerHTML=rt(h)}catch(e){}
  }
}

function showWord(w,h,d){
  var dlg=document.getElementById("wordDialog");if(!dlg)return;
  document.getElementById("dlgWord").textContent=w;
  document.getElementById("dlgHindi").textContent=h||"—";
  document.getElementById("dlgDesc").textContent=d||"";
  if(!dlg.open)dlg.showModal();
}

document.addEventListener("click",function(e){
  var el=e.target.closest(".cn");if(el){showWord(el.getAttribute("data-w"),el.getAttribute("data-h"),"Connecting word");return}
  el=e.target.closest(".wd");if(el){showWord(el.getAttribute("data-w"),el.getAttribute("data-h")||"—",el.getAttribute("data-h")?"":"Hindi meaning not available");return}
});

var STEPS=[{"t":"intro","icon":"🔢","title":"Algebraic Expressions and Identities","sub":"Class 8 Math — Chapter 9","intro":"Algebra is like a language where letters stand for numbers. You have already seen expressions like x + 3, 2y - 5, and 4xy + 7. In this chapter, we will go deeper — we will learn about terms, factors, and coefficients, classify expressions as monomials, binomials, and polynomials, multiply algebraic expressions step by step, and discover powerful tools called identities that make complex calculations simple. Let us begin!"},{"t":"tutor","icon":"💡","title":"What are Expressions?","body":"An algebraic expression is formed from variables and constants. For example, 2y - 5 is formed from the variable y and constants 2 and 5. The value of an expression changes with the value of the variable. When y = 2, 2y - 5 = 2(2) - 5 = -1. When y = 0, 2y - 5 = 2(0) - 5 = -5. Variables can take any value, so expressions have countless possible values. On a number line, x + 5 means 5 units to the right of x, and x - 4 means 4 units to the left."},{"t":"ix_expr_eval","instruction":"Enter a value for x and tap Evaluate. Watch how the expression 3x + 7 changes as x changes. Try positive, negative, and zero values!"},{"t":"formula","title":"Key Concepts — Expressions","formulas":[{"label":"Expression","expr":"Variables + Constants combined","note":"Example: 4xy + 7"},{"label":"Variable","expr":"A letter representing unknown","note":"x, y, z, p, etc."},{"label":"Constant","expr":"A fixed number","note":"2, 5, -3, 100, etc."}]},{"t":"quiz","q":"Quick Check: What is the value of 2x - 3 when x = 5?","diff":"easy","opts":[{"t":"7 (since 2(5) - 3 = 10 - 3 = 7)","c":true},{"t":"13","c":false,"m":"2(5) = 10, not 10 + 3. Subtract: 10 - 3 = 7.","correctMethod":"2(5) - 3 = 10 - 3 = 7."},{"t":"10","c":false,"m":"That is 2x, not 2x - 3. Subtract 3: 10 - 3 = 7.","correctMethod":"2(5) - 3 = 7."},{"t":"8","c":false,"m":"Check: 2 x 5 = 10, then 10 - 3 = 7.","correctMethod":"7."}]},{"t":"tutor","icon":"💡","title":"Terms, Factors and Coefficients","body":"An expression is made up of terms. The expression 4x + 5 has two terms: 4x and 5. Terms are added to form expressions. Each term can be a product of factors. The term 4x is the product of factors 4 and x. The numerical factor of a term is called its coefficient. In the term 7xy, the coefficient is 7. In the term -5x, the coefficient is -5. So when you see an expression like 3x squared y minus 10x y plus 5, the coefficients are 3, -10, and 5."},{"t":"formula","title":"Terms, Factors, Coefficients","formulas":[{"label":"Term","expr":"A part of an expression separated by + or -","note":"4x + 5 has terms 4x and 5"},{"label":"Factor","expr":"A number/variable that multiplies to form a term","note":"4x = 4 x x"},{"label":"Coefficient","expr":"The numerical factor of a term","note":"In 7xy, coefficient = 7"}]},{"t":"tutor","icon":"💡","title":"Monomials, Binomials and Polynomials","body":"Expressions are classified by how many terms they have. A monomial has ONE term: examples are 4x squared, 3xy, -7z. A binomial has TWO terms: examples are a + b, 4l + 5m, 5 - 3xy. A trinomial has THREE terms: examples are a + b + c, 2x + 3y - 5. In general, an expression with one or more terms (with non-negative integer exponents) is called a polynomial. A polynomial can have any number of terms."},{"t":"quiz","q":"Quick Check: How many terms does the expression 3x + 2y - 7 have? What type is it?","diff":"easy","opts":[{"t":"3 terms, trinomial","c":true},{"t":"2 terms, binomial","c":false,"m":"Count carefully: 3x, 2y, and -7 are three separate terms.","correctMethod":"3 terms (3x, 2y, -7), so it is a trinomial."},{"t":"1 term, monomial","c":false,"m":"3x, 2y, -7 are three separate terms separated by + and -.","correctMethod":"3 terms, trinomial."},{"t":"3 terms, polynomial only","c":false,"m":"It IS a polynomial, but more specifically, 3 terms = trinomial.","correctMethod":"3 terms, trinomial."}]},{"t":"tutor","icon":"💡","title":"Like and Unlike Terms","body":"Like terms have the same variables with the same powers. For example, 7x, 14x, and -13x are like terms. 5x squared and -9x squared are like terms. 7xy and -5yx are like terms (since xy = yx). But 7x and 7y are NOT like terms (different variables). 7x and 7xy are NOT like (different variables). 7x and 5x squared are NOT like (different powers). Only like terms can be added or subtracted."},{"t":"tutor","icon":"💡","title":"Adding and Subtracting Expressions","body":"To add or subtract algebraic expressions, we combine like terms. Write each expression in a row with like terms below each other. For example, add 7x squared - 4x + 5 and 9x - 10. The x-squared term stays, -4x + 9x = 5x, and 5 + (-10) = -5. Result: 7x squared + 5x - 5. For subtraction, change the signs of the second expression and add. Subtracting -3 is the same as adding +3."},{"t":"we","q":"Example 1: Add 7xy + 5yz - 3zx, 4yz + 9zx - 4y, and -3xz + 5x - 2xy.","steps":[{"text":"Write like terms below each other: xy terms: 7xy - 2xy = 5xy. yz terms: 5yz + 4yz = 9yz."},{"text":"zx terms: -3zx + 9zx - 3xz = 3zx (note: xz = zx)."},{"text":"Remaining terms: -4y and 5x (no like terms)."},{"text":"Sum = 5xy + 9yz + 3zx + 5x - 4y."}],"answer":"5xy + 9yz + 3zx + 5x - 4y"},{"t":"text","title":"Exercise 9.1","body":"Try these assessment questions — each different from the examples!"},{"t":"solve","q":"Ex 9.1 Q3(i): Add ab - bc, bc - ca, and ca - ab.","steps":[{"type":"input","prompt":"ab - ab cancels. bc - bc cancels. ca - ca cancels. Sum = ? ","answer":"0","m":"All terms cancel out! Sum = 0.","correctMethod":"Sum = 0."}]},{"t":"solve","q":"Ex 9.1 Q4(a): Subtract 4a - 7ab + 3b + 12 from 12a - 9ab + 5b - 3.","steps":[{"type":"input","prompt":"12a - 4a = 8a. -9ab - (-7ab) = -2ab. 5b - 3b = ? ","answer":"2","m":"5b - 3b = 2b. -3 - 12 = -15. Result: 8a - 2ab + 2b - 15.","correctMethod":"8a - 2ab + 2b - 15."}]},{"t":"solve","q":"Ex 9.1 Q4(b): Subtract 3xy + 5yz - 7zx from 5xy - 2yz - 2zx + 10xyz.","steps":[{"type":"input","prompt":"5xy - 3xy = 2xy. -2yz - 5yz = -7yz. -2zx - (-7zx) = ? ","answer":"5","m":"-2zx + 7zx = 5zx. Result: 2xy - 7yz + 5zx + 10xyz.","correctMethod":"2xy - 7yz + 5zx + 10xyz."}]},{"t":"tutor","icon":"💡","title":"Multiplying Monomials","body":"To multiply two monomials, multiply the coefficients and add the powers of the same variables. For example, 5x times 3y = (5 x 3)(x x y) = 15xy. 5x times 4x squared = (5 x 4)(x x x squared) = 20x cubed. 5x times (-4xyz) = (5 x -4)(x x xyz) = -20x squared yz. Remember: x times x squared = x cubed (add the powers). The product of monomials is always a monomial."},{"t":"formula","title":"Multiplying Monomials","formulas":[{"label":"Product of coefficients","expr":"Multiply the numbers","note":"5x * 3y: 5*3 = 15"},{"label":"Product of variables","expr":"Add powers of same variable","note":"x * x^2 = x^3"},{"label":"Result","expr":"Always a monomial","note":"5x * 3y = 15xy"}]},{"t":"text","title":"Exercise 9.2","body":"Practice multiplying monomials — all unique questions!"},{"t":"solve","q":"Ex 9.2 Q1(ii): Find the product of -4p and 7p.","steps":[{"type":"input","prompt":"(-4) x 7 = -28. p x p = p^2. Product = -28p^? ","answer":"2","m":"-28p^2.","correctMethod":"-4p * 7p = -28p^2."}]},{"t":"solve","q":"Ex 9.2 Q1(iv): Find the product of 4p^3 and -3p.","steps":[{"type":"input","prompt":"4 x (-3) = -12. p^3 x p = p^4. Product = -12p^? ","answer":"4","m":"-12p^4.","correctMethod":"4p^3 * -3p = -12p^4."}]},{"t":"solve","q":"Ex 9.2 Q5(i): Find the product of xy, yz, and zx.","steps":[{"type":"input","prompt":"xy * yz = xy^2z. xy^2z * zx = x^? y^2 z^2 ","answer":"2","m":"x^2 y^2 z^2.","correctMethod":"xy * yz * zx = x^2 y^2 z^2."}]},{"t":"tutor","icon":"💡","title":"Multiplying a Monomial by a Polynomial","body":"We use the distributive law. Multiply the monomial by each term of the polynomial. Example: 3x times (5y + 2) = (3x times 5y) + (3x times 2) = 15xy + 6x. For a trinomial: 3p times (4p squared + 5p + 7) = 12p cubed + 15p squared + 21p. Each term of the polynomial gets multiplied by the monomial. This is the distributive law in action!"},{"t":"we","q":"Example 5(i): Simplify x(x - 3) + 2 and evaluate for x = 1.","steps":[{"text":"Expand: x(x - 3) + 2 = x squared - 3x + 2."},{"text":"Substitute x = 1: (1) squared - 3(1) + 2 = 1 - 3 + 2."},{"text":"1 - 3 + 2 = 0."}],"answer":"Value = 0"},{"t":"quiz","q":"Quick Check: What is 2x(3x + 5)?","diff":"medium","opts":[{"t":"6x^2 + 10x (distributive law: 2x*3x + 2x*5)","c":true},{"t":"6x + 10","c":false,"m":"2x * 3x = 6x^2, not 6x. Multiply the variables too.","correctMethod":"2x*3x + 2x*5 = 6x^2 + 10x."},{"t":"5x + 6","c":false,"m":"Use distributive law: 2x multiplies each term inside the bracket.","correctMethod":"6x^2 + 10x."},{"t":"30x^2","c":false,"m":"Don't multiply everything at once. Use distributive law term by term.","correctMethod":"6x^2 + 10x."}]},{"t":"text","title":"Exercise 9.3","body":"Multiply monomials by polynomials — unique questions!"},{"t":"solve","q":"Ex 9.3 Q1(i): Multiply 4p and (q + r).","steps":[{"type":"input","prompt":"4p * q + 4p * r = 4pq + ? ","answer":"4pr","m":"4pq + 4pr.","correctMethod":"4p(q + r) = 4pq + 4pr."}]},{"t":"solve","q":"Ex 9.3 Q1(ii): Multiply ab and (a - b).","steps":[{"type":"input","prompt":"ab * a - ab * b = a^2b - ? ","answer":"ab2","m":"a^2b - ab^2.","correctMethod":"ab(a - b) = a^2b - ab^2."}]},{"t":"solve","q":"Ex 9.3 Q5(a): Simplify 3x(4x - 5) + 3 and find value for x = 3.","steps":[{"type":"input","prompt":"3x(4x-5) + 3 = 12x^2 - 15x + 3. For x=3: 12(9) - 15(3) + 3 = 108 - 45 + 3 = ? ","answer":"66","m":"108 - 45 + 3 = 66.","correctMethod":"Value = 66."}]},{"t":"tutor","icon":"💡","title":"Multiplying a Binomial by a Binomial","body":"Every term in the first binomial multiplies every term in the second. For example, (2a + 3b) times (3a + 4b) = 2a times 3a + 2a times 4b + 3b times 3a + 3b times 4b = 6a squared + 8ab + 9ba + 12b squared = 6a squared + 17ab + 12b squared. We combine like terms (ab = ba). In general, multiplying two binomials gives 4 terms, which may reduce when like terms are combined. This is the FOIL method: First, Outer, Inner, Last!"},{"t":"ix_binomial_mult","instruction":"Enter the coefficients for (ax + b)(cx + d). Tap Multiply to see each step of the FOIL method in action!"},{"t":"we","q":"Example 8(i): Multiply (x - 4) and (2x + 3).","steps":[{"text":"x * (2x + 3) = 2x squared + 3x."},{"text":"-4 * (2x + 3) = -8x - 12."},{"text":"Combine: 2x squared + 3x - 8x - 12 = 2x squared - 5x - 12."}],"answer":"2x^2 - 5x - 12"},{"t":"text","title":"Exercise 9.4","body":"Multiply binomials and polynomials — all unique!"},{"t":"solve","q":"Ex 9.4 Q1(i): Multiply (2x + 5) and (4x - 3).","steps":[{"type":"input","prompt":"2x*4x = 8x^2. 2x*(-3) = -6x. 5*4x = 20x. 5*(-3) = -15. Combine: 8x^2 + 14x - ? ","answer":"15","m":"8x^2 + 14x - 15.","correctMethod":"8x^2 + 14x - 15."}]},{"t":"solve","q":"Ex 9.4 Q1(iv): Multiply (2.5l - 0.5m) and (2.5l + 0.5m).","steps":[{"type":"input","prompt":"This is (a-b)(a+b) = a^2 - b^2. a=2.5l, b=0.5m. Result = 6.25l^2 - ?m^2 ","answer":"0.25","m":"6.25l^2 - 0.25m^2.","correctMethod":"6.25l^2 - 0.25m^2."}]},{"t":"solve","q":"Ex 9.4 Q2(i): Find the product (x + 7y)(7x - y).","steps":[{"type":"input","prompt":"x*7x = 7x^2. x*(-y) = -xy. 7y*7x = 49xy. 7y*(-y) = -7y^2. Combine: 7x^2 + 48xy - ?y^2 ","answer":"7","m":"7x^2 + 48xy - 7y^2.","correctMethod":"7x^2 + 48xy - 7y^2."}]},{"t":"tutor","icon":"💡","title":"What is an Identity?","body":"An identity is an equality that is true for EVERY value of the variable. For example, (a + 1)(a + 2) = a squared + 3a + 2 is an identity because it works for any value of a. Check: a = 10 gives 11 x 12 = 132 on LHS, and 100 + 30 + 2 = 132 on RHS. An equation is true only for certain values, but an identity is true for ALL values. Identities are powerful shortcuts for multiplication."},{"t":"formula","title":"The Four Standard Identities","formulas":[{"label":"Identity I","expr":"(a + b)^2 = a^2 + 2ab + b^2","note":"Square of a sum"},{"label":"Identity II","expr":"(a - b)^2 = a^2 - 2ab + b^2","note":"Square of a difference"},{"label":"Identity III","expr":"(a + b)(a - b) = a^2 - b^2","note":"Product of sum and difference"},{"label":"Identity IV","expr":"(x + a)(x + b) = x^2 + (a+b)x + ab","note":"General form — the others are special cases"}]},{"t":"we","q":"Example 11(ii): Use Identity I to find 103 squared.","steps":[{"text":"103 = 100 + 3. So 103 squared = (100 + 3) squared."},{"text":"Apply Identity I: (100 + 3) squared = 100 squared + 2(100)(3) + 3 squared."},{"text":"= 10000 + 600 + 9 = 10609."}],"answer":"103^2 = 10609"},{"t":"we","q":"Example 12(ii): Use Identity II to find 4.9 squared.","steps":[{"text":"4.9 = 5.0 - 0.1. So 4.9 squared = (5.0 - 0.1) squared."},{"text":"Apply Identity II: (5 - 0.1) squared = 5 squared - 2(5)(0.1) + 0.1 squared."},{"text":"= 25 - 1.0 + 0.01 = 24.01."}],"answer":"4.9^2 = 24.01"},{"t":"quiz","q":"Quick Check: Use Identity III to find 52 x 48.","diff":"medium","opts":[{"t":"2496 (since (50+2)(50-2) = 2500 - 4 = 2496)","c":true},{"t":"2498","c":false,"m":"52 = 50+2, 48 = 50-2. (50+2)(50-2) = 50^2 - 2^2 = 2500-4 = 2496.","correctMethod":"2496."},{"t":"2500","c":false,"m":"That is 50^2. But 52 x 48 = (50+2)(50-2) = 2500 - 4 = 2496.","correctMethod":"2496."},{"t":"2096","c":false,"m":"Apply Identity III: (50+2)(50-2) = 2500 - 4 = 2496.","correctMethod":"2496."}]},{"t":"text","title":"Identities Practice","body":"Apply the standard identities — each question is unique!"},{"t":"solve","q":"Use Identity I to find (2x + 3y) squared.","steps":[{"type":"input","prompt":"a=2x, b=3y. (a+b)^2 = a^2 + 2ab + b^2 = 4x^2 + 12xy + ?y^2 ","answer":"9","m":"4x^2 + 12xy + 9y^2.","correctMethod":"4x^2 + 12xy + 9y^2."}]},{"t":"solve","q":"Use Identity II to find (4p - 3q) squared.","steps":[{"type":"input","prompt":"a=4p, b=3q. (a-b)^2 = a^2 - 2ab + b^2 = 16p^2 - 24pq + ?q^2 ","answer":"9","m":"16p^2 - 24pq + 9q^2.","correctMethod":"16p^2 - 24pq + 9q^2."}]},{"t":"solve","q":"Use Identity III to find 194 x 206.","steps":[{"type":"input","prompt":"194 = 200-6, 206 = 200+6. (200-6)(200+6) = 200^2 - 6^2 = 40000 - ? ","answer":"36","m":"40000 - 36 = 39964.","correctMethod":"194 x 206 = 39964."}]},{"t":"solve","q":"Use Identity IV to find (x + 3)(x + 7).","steps":[{"type":"input","prompt":"(x+a)(x+b) = x^2 + (a+b)x + ab. Here a=3, b=7. x^2 + 10x + ? ","answer":"21","m":"x^2 + 10x + 21.","correctMethod":"x^2 + 10x + 21."}]},{"t":"milestone","icon":"🎓","title":"Full Chapter Mastered!","xp":100,"next":"Final assessment — Rapid Fire and Memory Match!"},{"t":"rapid_fire","qs":[{"q":"(a+b)^2 = ?","opts":["a^2+2ab+b^2","a^2+b^2","a^2-2ab+b^2","2a+2b"],"ans":0},{"q":"(a-b)(a+b) = ?","opts":["a^2-b^2","a^2+b^2","a^2-2ab","2ab"],"ans":0},{"q":"Number of terms in 3x+5?","opts":["2","1","3","0"],"ans":0},{"q":"5x * 3y = ?","opts":["15xy","8xy","15x+y","8x"],"ans":0},{"q":"(a-b)^2 = ?","opts":["a^2-2ab+b^2","a^2+2ab+b^2","a^2-b^2","a^2+b^2"],"ans":0},{"q":"Coefficient of x in 7xy?","opts":["7","7y","7x","1"],"ans":0},{"q":"Like terms have same?","opts":["Variables and powers","Coefficients","Signs","Values"],"ans":0},{"q":"103^2 using Identity I?","opts":["10609","10600","10009","10300"],"ans":0}]},{"t":"memory_match","pairs":[{"en":"Monomial","hi":"एकपदी"},{"en":"Binomial","hi":"द्विपद"},{"en":"Polynomial","hi":"बहुपद"},{"en":"Coefficient","hi":"गुणांक"},{"en":"Identity","hi":"सर्वसमिका"},{"en":"Variable","hi":"चर"},{"en":"Like Terms","hi":"समान पद"},{"en":"Distributive Law","hi":"वितरण नियम"}]},{"t":"complete","icon":"🔢","title":"Chapter 9 Complete!","sub":"Algebraic Expressions and Identities — Mastered! Class 8"}];

var App={
  nIdx:0,sIdx:0,xp:0,coins:0,streak:0,level:1,
  answered:false,selOpt:null,solveStepIdx:0,solveAnswered:false,selTf:null,
  rfIdx:0,rfScore:0,rfTimer:null,rfTime:30,
  mmFlipped:[],mmMatched:0,mmBusy:false,
  selTheme:'default',ownedThemes:[],badges:[],retryTimer:null,
  init:function(){
    var self=this;
    var cb=document.getElementById("continueBtn");
    if(cb)cb.addEventListener("click",function(){
      var step=STEPS[self.sIdx];if(!step)return;
      if(step.t==="quiz"&&!self.answered){self.checkQuiz(step,cb);return;}
      if(step.t==="truefalse"&&!self.answered){self.checkTrueFalse(step,cb);return;}
      if(step.t==="solve"&&!self.solveAnswered){self.checkSolve(step,cb);return;}
      if(step.t==="we"&&self.weStepIdx!==undefined&&self.weStepIdx<step.steps.length){
        self.weStepIdx++;if(self.weStepIdx>=step.steps.length){self.weStepIdx=0;self.next();return;}self.render();return;}
      self.next();
    });
    var bb=document.getElementById("backBtn");
    if(bb)bb.addEventListener("click",function(){self.back();});
    var lc=document.getElementById("luClose");
    if(lc)lc.addEventListener("click",function(){var d=document.getElementById("levelUpDialog");if(d){if(d.open)d.close();else d.removeAttribute("open");}});
    var dc=document.getElementById("dlgClose");
    if(dc)dc.addEventListener("click",function(){var d=document.getElementById("wordDialog");if(d){if(d.open)d.close();else d.removeAttribute("open");}});
    this.render();
  },
  render:function(){
    var step=STEPS[this.sIdx];if(!step)return;
    var cb=document.getElementById("continueBtn");if(!cb)return;
    /* CRITICAL FIX: Always reset button */
    cb.style.display="";cb.disabled=false;cb.className="btn btn-primary";
    var bb=document.getElementById("backBtn");if(bb)bb.disabled=this.sIdx===0;
    var pf=document.getElementById("progressFill");
    if(pf)pf.style.width=Math.round((this.sIdx/(STEPS.length-1))*100)+"%";
    this.answered=false;this.selOpt=null;this.selTf=null;this.shuffledOpts=null;
    if(this._prevSIdx!==this.sIdx){this.solveStepIdx=0;this.solveAnswered=false;this.weStepIdx=0;this._prevSIdx=this.sIdx;}
    if(this.rfTimer){clearInterval(this.rfTimer);this.rfTimer=null;}
    switch(step.t){
      case"intro":this.renderIntro(step,cb);break;
      case"text":this.renderText(step,cb);break;
      case"tutor":this.renderTutor(step,cb);break;
      case"real_example":this.renderRealExample(step,cb);break;
      case"formula":this.renderFormula(step,cb);break;
      case"ix_numbersets":this.renderIxNumberSets(step,cb);break;
      case"ix_numberline":this.renderIxNumberLine(step,cb);break;
      case"ix_properties":this.renderIxProperties(step,cb);break;
      case"ix_reciprocal":this.renderIxReciprocal(step,cb);break;
      case"ix_between":this.renderIxBetween(step,cb);break;
      case"discovery":this.renderDiscovery(step,cb);break;
      case"quiz":this.renderQuiz(step,cb);break;
      case"truefalse":this.renderTrueFalse(step,cb);break;
      case"we":this.renderWE(step,cb);break;
      case"solve":this.renderSolve(step,cb);break;
      case"rapid_fire":this.renderRapidFire(step,cb);break;
      case"memory_match":this.renderMemoryMatch(step,cb);break;
      case"milestone":this.renderMilestone(step,cb);break;
      case"complete":this.renderComplete(step,cb);break;
    }
    setTimeout(function(){applyLLE();},50);
    this.updateStats();
  },
  updateStats:function(){
    var sl=document.getElementById("statLvl");if(sl)sl.textContent="Lv "+this.level;
    var sc=document.getElementById("statCoins");if(sc)sc.textContent=this.coins;
    var sx=document.getElementById("statXp");if(sx)sx.textContent=this.xp;
  },
  checkLevelUp:function(){
    var th=[0,50,120,200,300,450];var nm=["Beginner","Learner","Scholar","Expert","Master","Champion"];
    for(var i=th.length-1;i>=0;i--){if(this.xp>=th[i]){if(this.level<i+1){this.level=i+1;this.showLevelUp(nm[i]);}break;}}
  },
  showLevelUp:function(name){
    var dlg=document.getElementById("levelUpDialog");if(!dlg)return;
    var ti=dlg.querySelector("div:nth-child(2)");if(ti)ti.textContent="Level Up! You are now a "+name+"!";
    if(dlg&&!dlg.open){try{dlg.showModal();}catch(e){}}
    this.fireConfetti();
  },
  fireConfetti:function(){
    var c=document.getElementById("confetti");if(!c)return;c.style.display="block";
    var ctx=c.getContext("2d");if(!ctx)return;
    c.width=window.innerWidth;c.height=window.innerHeight;
    var parts=[];
    for(var i=0;i<80;i++){parts.push({x:Math.random()*c.width,y:-20,vx:(Math.random()-0.5)*4,vy:Math.random()*3+2,c:["#7c3aed","#a855f7","#10b981","#f59e0b","#ec4899"][Math.floor(Math.random()*5)],s:Math.random()*6+3});}
    var t=0;
    function anim(){ctx.clearRect(0,0,c.width,c.height);for(var i=0;i<parts.length;i++){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);}t++;if(t<120)requestAnimationFrame(anim);else c.style.display="none";}
    anim();
  },
  next:function(){
    var step=STEPS[this.sIdx];if(!step)return;
    if((step.t==="quiz"||step.t==="truefalse")&&!this.answered)return;
    if(step.t==="solve"&&!this.solveAnswered)return;
    if(step.t==="rapid_fire"&&this.rfIdx<step.qs.length)return;
    if(step.t==="memory_match"&&this.mmMatched<step.pairs.length)return;
    this.sIdx++;if(this.sIdx>=STEPS.length)this.sIdx=STEPS.length-1;this.render();
  },
  back:function(){if(this.sIdx>0){this.sIdx--;if(this.rfTimer){clearInterval(this.rfTimer);this.rfTimer=null;}this.render();}},
  /* ===== SIMPLE STEPS (Continue always enabled) ===== */
  renderIntro:function(step,cb){
    var introText=step.intro||"Welcome! Let us begin learning.";
    document.getElementById("screen").innerHTML=
      '<div style="text-align:center"><div class="intro-icon">'+step.icon+'</div><div class="intro-title">'+rt(step.title)+'</div><div class="intro-sub">'+rt(step.sub)+'</div></div>'+
      '<div class="bt" style="padding:14px;background:linear-gradient(135deg,#fff,#eef2ff);border-radius:14px;border:2px solid var(--bl);max-width:400px;box-shadow:0 4px 12px rgba(79,70,229,.08)">'+rt(introText)+'</div>'+
      '<div class="hint">Tap any word for Hindi meaning. Connecting words show Hindi automatically.</div>';
    cb.textContent="Start Learning";cb.className="btn btn-primary";cb.disabled=false;
  },
  renderText:function(step,cb){

  calcBetween:function(){
    function pf(s){s=s.trim();if(s.indexOf("/")>=0){var p=s.split("/");return parseInt(p[0])/parseInt(p[1]);}return parseFloat(s);}
    function tf(d){for(var i=1;i<=100;i++){var n=Math.round(d*i);if(Math.abs(n/i-d)<0.001)return n+"/"+i;}return d.toFixed(4);}
    var a=pf(document.getElementById("ixA").value);var b=pf(document.getElementById("ixB").value);
    if(isNaN(a)||isNaN(b)){document.getElementById("ixBetDisc").style.display="block";document.getElementById("ixBetTitle").textContent="Galat!";document.getElementById("ixBetInfo").innerHTML="Sahi fraction daalo jaise 1/4";return;}
    var mid=(a+b)/2;var aF=document.getElementById("ixA").value.trim();var bF=document.getElementById("ixB").value.trim();var mF=tf(mid);
    var lo=Math.min(a,b),hi=Math.max(a,b);
    var canvas=document.getElementById("betCanvas");if(!canvas)return;var ctx=canvas.getContext("2d");if(!ctx)return;
    ctx.clearRect(0,0,340,120);var cy=60;var m=30;var pad=(hi-lo)*0.2;var min=lo-pad,max=hi+pad;var sc=(340-2*m)/(max-min);
    ctx.strokeStyle="#475569";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m,cy);ctx.lineTo(340-m,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(340-m,cy);ctx.lineTo(333-m,cy-5);ctx.lineTo(333-m,cy+5);ctx.closePath();ctx.fillStyle="#475569";ctx.fill();
    var xa=m+(a-min)*sc;ctx.fillStyle="#8b5cf6";ctx.beginPath();ctx.arc(xa,cy,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle="#8b5cf6";ctx.font="bold 11px sans-serif";ctx.textAlign="center";ctx.fillText(aF,xa,cy-15);
    var xb=m+(b-min)*sc;ctx.fillStyle="#ec4899";ctx.beginPath();ctx.arc(xb,cy,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.stroke();
    ctx.fillStyle="#ec4899";ctx.fillText(bF,xb,cy-15);
    var xm=m+(mid-min)*sc;var gg=ctx.createRadialGradient(xm,cy,2,xm,cy,18);gg.addColorStop(0,"rgba(16,185,129,0.4)");gg.addColorStop(1,"rgba(16,185,129,0)");

    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Quadrilateral Explorer</div><canvas id="qeCanvas" width="300" height="200" style="display:block;margin:0 auto;border-radius:8px;background:#fff"></canvas><div style="text-align:center;margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center"><button class="shape-btn" data-shape="trapezium">Trapezium</button><button class="shape-btn" data-shape="kite">Kite</button><button class="shape-btn active" data-shape="parallelogram">Parallelogram</button><button class="shape-btn" data-shape="rhombus">Rhombus</button><button class="shape-btn" data-shape="rectangle">Rectangle</button><button class="shape-btn" data-shape="square">Square</button></div><div class="discovery-box" style="margin-top:8px"><div class="d-title" id="qeName">Parallelogram</div><div class="d-text" id="qeDesc">Both pairs of opposite sides parallel</div><div class="d-text" id="qeProps" style="margin-top:4px;font-weight:600">Opposite sides equal | Opposite angles equal | Diagonals bisect</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;var c=document.getElementById("qeCanvas");if(!c)return;var ctx=c.getContext("2d");if(!ctx)return;
    function draw(){var s=shapes[shape];ctx.clearRect(0,0,300,200);ctx.fillStyle=s.color+"20";ctx.strokeStyle=s.color;ctx.lineWidth=2.5;ctx.beginPath();
      if(shape==="trapezium"){ctx.moveTo(60,50);ctx.lineTo(240,50);ctx.lineTo(200,150);ctx.lineTo(100,150);}
      else if(shape==="kite"){ctx.moveTo(150,30);ctx.lineTo(240,100);ctx.lineTo(150,170);ctx.lineTo(60,100);}
      else if(shape==="parallelogram"){ctx.moveTo(70,50);ctx.lineTo(230,50);ctx.lineTo(200,150);ctx.lineTo(40,150);}
      else if(shape==="rhombus"){ctx.moveTo(150,30);ctx.lineTo(250,100);ctx.lineTo(150,170);ctx.lineTo(50,100);}
      else if(shape==="rectangle"){ctx.moveTo(60,40);ctx.lineTo(240,40);ctx.lineTo(240,160);ctx.lineTo(60,160);}
      else if(shape==="square"){ctx.moveTo(70,35);ctx.lineTo(230,35);ctx.lineTo(230,165);ctx.lineTo(70,165);}
      ctx.closePath();ctx.fill();ctx.stroke();document.getElementById("qeName").textContent=s.name;document.getElementById("qeDesc").textContent=s.desc;document.getElementById("qeProps").textContent=props[shape];}
    var btns=document.querySelectorAll("[data-shape]");for(var i=0;i<btns.length;i++){btns[i].addEventListener("click",function(){for(var j=0;j<btns.length;j++)btns[j].classList.remove("active");this.classList.add("active");shape=this.getAttribute("data-shape");draw();});}draw();
  },
  renderIxBalanceSim:function(step,cb){
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Balance Scale: 3x + 2 = 11</div><canvas id="blCanvas" width="320" height="240" style="display:block;margin:0 auto;border-radius:8px;background:#fff"></canvas><div style="margin-top:10px"><label style="font-size:.78rem;font-weight:700;color:var(--brand)">x = <span id="blX" style="color:var(--pi);font-size:1.2rem">3</span></label><input type="range" id="blSlider" min="-2" max="8" step="1" value="3" style="width:100%;max-width:280px"></div><div class="discovery-box" style="margin-top:8px"><div class="d-title" id="blTitle">Balanced!</div><div class="d-text" id="blInfo">LHS = 3(3)+2 = 11. RHS = 11.</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;var c=document.getElementById("blCanvas");if(!c)return;var ctx=c.getContext("2d");if(!ctx)return;
    function draw(){var x=parseInt(document.getElementById("blSlider").value);document.getElementById("blX").textContent=x;ctx.clearRect(0,0,320,240);var lhs=3*x+2,rhs=11,balanced=(lhs===rhs),cx=160,baseY=200;ctx.fillStyle="#64748b";ctx.beginPath();ctx.moveTo(cx-15,baseY);ctx.lineTo(cx+15,baseY);ctx.lineTo(cx,baseY-35);ctx.closePath();ctx.fill();ctx.strokeStyle="#64748b";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,baseY-35);ctx.lineTo(cx,60);ctx.stroke();var tilt=balanced?0:(lhs>rhs?-0.15:0.15);ctx.save();ctx.translate(cx,60);ctx.rotate(tilt);ctx.strokeStyle="#4f46e5";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-100,0);ctx.lineTo(100,0);ctx.stroke();ctx.fillStyle=balanced?"#10b981":"#64748b";ctx.beginPath();ctx.arc(-80,0,6,0,2*Math.PI);ctx.fill();ctx.beginPath();ctx.arc(80,0,6,0,2*Math.PI);ctx.fill();ctx.strokeStyle="#64748b";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-80,6);ctx.lineTo(-80,30);ctx.moveTo(80,6);ctx.lineTo(80,30);ctx.stroke();ctx.fillStyle="#4f46e5";ctx.font="bold 10px sans-serif";ctx.textAlign="center";ctx.fillText("3x+2",-80,45);ctx.fillText("11",80,45);ctx.fillStyle="#7c3aed";ctx.font="bold 12px sans-serif";ctx.fillText("= "+lhs,-80,20);ctx.fillText("= "+rhs,80,20);if(balanced){ctx.fillStyle="#10b981";ctx.font="bold 14px sans-serif";ctx.fillText("BALANCED!",0,-15);}else{ctx.fillStyle="#ef4444";ctx.font="bold 12px sans-serif";ctx.fillText("Not balanced",0,-15);}ctx.restore();ctx.fillStyle="#64748b";ctx.font="10px sans-serif";ctx.textAlign="center";ctx.fillText("LHS = 3("+x+")+2 = "+lhs+"  |  RHS = "+rhs,cx,230);
      if(balanced){document.getElementById("blTitle").textContent="Balanced! x = "+x+" is the solution!";document.getElementById("blInfo").textContent="LHS = 3("+x+")+2 = "+lhs+". RHS = "+rhs+". Both sides equal!";}
      else{document.getElementById("blTitle").textContent="Not balanced (LHS="+lhs+", RHS="+rhs+")";document.getElementById("blInfo").textContent="LHS = 3("+x+")+2 = "+lhs+" but RHS = "+rhs+". Try a different value of x!";}}
    document.getElementById("blSlider").addEventListener("input",draw);draw();
  },
  renderIxWordProblemSim:function(step,cb){
    var wpStep=0;var wpSteps=[{title:"Step 1: Read the problem",text:"Rahul's father is 3 times as old as Rahul. After 10 years, the sum of their ages will be 70. Find their present ages."},{title:"Step 2: Choose a variable",text:"Let Rahul's present age = x years. Then father's age = 3x years."},{title:"Step 3: Express future ages",text:"After 10 years: Rahul = x + 10, Father = 3x + 10."},{title:"Step 4: Form the equation",text:"Sum of future ages = 70. So (x+10) + (3x+10) = 70. Simplify: 4x + 20 = 70."},{title:"Step 5: Solve!",text:"4x = 50. x = 12.5. Rahul = 12.5 years, Father = 37.5 years."}];
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Word Problem Builder</div><div id="wpProgress" style="text-align:center"></div><div class="sim-step-text active" id="wpStepText" style="min-height:60px"></div><div style="text-align:center;margin-top:8px"><button class="shape-btn" id="wpPrev">Prev</button><button class="shape-btn" id="wpNext">Next</button></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    var prog="";for(var i=0;i<wpSteps.length;i++){prog+='<span class="sim-dot" id="wpDot'+i+'" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#e2e8f0;margin:0 2px"></span>';}document.getElementById("wpProgress").innerHTML=prog;
    function draw(){for(var i=0;i<wpSteps.length;i++){var dot=document.getElementById("wpDot"+i);if(dot){dot.style.background=i<wpStep?"#10b981":(i===wpStep?"#4f46e5":"#e2e8f0");}}var s=wpSteps[wpStep];document.getElementById("wpStepText").innerHTML="<b>"+s.title+"</b><br>"+s.text;}
    document.getElementById("wpPrev").addEventListener("click",function(){if(wpStep>0){wpStep--;draw();}});document.getElementById("wpNext").addEventListener("click",function(){if(wpStep<wpSteps.length-1){wpStep++;draw();}});draw();
  },

  renderIxExprEval:function(step,cb){
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Expression Evaluator</div><div style="text-align:center;margin:10px 0;font-size:1.1rem;font-weight:800;color:#4f46e5">3x + 7</div><div style="margin:8px 0"><label style="font-size:.75rem;font-weight:600">Enter value of x:</label><input type="number" id="eeInput" value="2" style="width:100%;padding:8px;border:2px solid #e2e8f0;border-radius:8px;font-size:.9rem;text-align:center"></div><button class="shape-btn" id="eeCalc" style="background:#4f46e5;color:#fff;border:none">Evaluate</button><div class="discovery-box" id="eeResult" style="margin-top:8px"><div class="d-title">Enter x and tap Evaluate</div><div class="d-text">See how 3x + 7 changes with x!</div></div><div style="margin:8px 0;font-size:.7rem;color:#64748b">Try: x = -3, 0, 5, 100</div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    document.getElementById("eeCalc").addEventListener("click",function(){
      var x=parseFloat(document.getElementById("eeInput").value);
      if(isNaN(x)){document.getElementById("eeResult").innerHTML='<div class="d-title">Enter a valid number</div>';return;}
      var val=3*x+7;
      document.getElementById("eeResult").innerHTML='<div class="d-title">3('+x+') + 7 = '+val+'</div><div class="d-text">When x = '+x+', the expression 3x + 7 equals '+val+'. Try different values to see how it changes!</div>';
    });
  },
  renderIxBinomialMult:function(step,cb){
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Binomial Multiplier (FOIL)</div><div style="margin:8px 0;display:flex;gap:6px;justify-content:center;align-items:center"><input type="number" id="bmA" value="2" style="width:50px;padding:6px;border:2px solid #e2e8f0;border-radius:6px;text-align:center;font-size:.85rem"><span style="font-weight:700">x +</span><input type="number" id="bmB" value="5" style="width:50px;padding:6px;border:2px solid #e2e8f0;border-radius:6px;text-align:center;font-size:.85rem"><span style="font-weight:700">)(</span><input type="number" id="bmC" value="4" style="width:50px;padding:6px;border:2px solid #e2e8f0;border-radius:6px;text-align:center;font-size:.85rem"><span style="font-weight:700">x +</span><input type="number" id="bmD" value="3" style="width:50px;padding:6px;border:2px solid #e2e8f0;border-radius:6px;text-align:center;font-size:.85rem"><span style="font-weight:700">)</span></div><button class="shape-btn" id="bmCalc" style="background:#4f46e5;color:#fff;border:none">Multiply</button><div id="bmSteps" style="margin:10px 0"></div><div class="discovery-box" id="bmResult"><div class="d-title">Enter values and tap Multiply</div><div class="d-text">See the FOIL method step by step!</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    document.getElementById("bmCalc").addEventListener("click",function(){
      var a=parseFloat(document.getElementById("bmA").value);var b=parseFloat(document.getElementById("bmB").value);var c=parseFloat(document.getElementById("bmC").value);var d=parseFloat(document.getElementById("bmD").value);
      if(isNaN(a)||isNaN(b)||isNaN(c)||isNaN(d)){document.getElementById("bmResult").innerHTML='<div class="d-title">Enter valid values</div>';return;}
      var f=a*c,fo=a*d,oi=b*c,l=b*d;
      var x2=f,x1=fo+oi,con=l;
      var stepsHtml='<div style="font-size:.76rem;line-height:1.8"><strong>FOIL Method:</strong><br>First: '+a+'x * '+c+'x = '+(a*c)+'x^2<br>Outer: '+a+'x * '+d+' = '+(a*d)+'x<br>Inner: '+b+' * '+c+'x = '+(b*c)+'x<br>Last: '+b+' * '+d+' = '+(b*d)+'</div>';
      stepsHtml+='<div style="margin-top:6px;font-size:.76rem"><strong>Combine like terms:</strong><br>'+(a*c)+'x^2 + '+(a*d)+'x + '+(b*c)+'x + '+(b*d)+'</div>';
      var result=(a*c)+'x^2 + '+x1+'x + '+con;
      stepsHtml+='<div style="margin-top:6px;font-weight:800;color:#4f46e5">Result: '+result+'</div>';
      document.getElementById("bmSteps").innerHTML=stepsHtml;
      document.getElementById("bmResult").innerHTML='<div class="d-title">Result: '+result+'</div><div class="d-text">'+x1+'x comes from combining '+(a*d)+'x + '+(b*c)+'x (like terms).</div>';
    });
  },
renderShop:function(){
    var self=this;var themes=[{id:"default",name:"Purple",icon:"🟣",cost:0},{id:"ocean",name:"Ocean",icon:"🌊",cost:50},{id:"forest",name:"Forest",icon:"🌲",cost:80},{id:"sunset",name:"Sunset",icon:"🌅",cost:100}];
    var html='<div class="shop-overlay" id="shopOv" onclick="if(event.target===this)document.getElementById(\'shopOv\').remove()"><div class="shop-modal"><div class="shop-title">🛒 Shop</div><div class="shop-coins">🪙 '+this.coins+'</div><div class="shop-grid">';
    for(var i=0;i<themes.length;i++){var th=themes[i];var owned=this.ownedThemes.indexOf(th.id)>=0||th.cost===0;var active=this.selTheme===th.id;
      html+='<div class="shop-item'+(owned?' owned':'')+'"><div class="shop-item-icon">'+th.icon+'</div><div class="shop-item-name">'+th.name+'</div>';
      if(!owned){html+='<div class="shop-item-cost">🪙 '+th.cost+'</div><button class="shop-buy-btn" data-buy="'+th.id+'" data-cost="'+th.cost+'">Buy</button>';}
      else if(active){html+='<div style="font-size:.7rem;color:var(--green);font-weight:700">✓ Active</div>';}
      else{html+='<button class="shop-buy-btn" data-apply="'+th.id+'">Apply</button>';}
      html+='</div>';}
    html+='</div><div style="text-align:center;margin-top:12px"><button class="btn btn-primary" style="max-width:200px" onclick="document.getElementById(\'shopOv\').remove()">Close</button></div></div></div>';
    var ex=document.getElementById("shopOv");if(ex)ex.remove();var div=document.createElement("div");div.innerHTML=html;document.body.appendChild(div.firstChild);
    var bb=document.querySelectorAll("[data-buy]");for(var i=0;i<bb.length;i++){bb[i].addEventListener("click",function(){var id=this.getAttribute("data-buy");var cost=parseInt(this.getAttribute("data-cost"));if(self.coins>=cost){self.coins-=cost;self.ownedThemes.push(id);self.selTheme=id;document.body.className="theme-"+id;self.updateStats();self.renderShop();}});}
    var ab=document.querySelectorAll("[data-apply]");for(var i=0;i<ab.length;i++){ab[i].addEventListener("click",function(){var id=this.getAttribute("data-apply");self.selTheme=id;document.body.className="theme-"+id;self.renderShop();});}
  }
};
