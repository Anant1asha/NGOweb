          if(connCount<=4){result+='<span class="cn" data-w="'+sub+'" data-h="'+hi+'">'+sub+' <span class="ch">('+hi+')</span></span>';}
          else{result+='<span class="wd" data-w="'+sub.toLowerCase()+'" data-h="'+hi+'">'+sub+'</span>';}
          i+=c.length;matched=true;break;
        }
      }
    }
    if(matched)continue;
    if(/[a-zA-Z]/.test(ch)){
      var ws=i;while(i<html.length&&/[a-zA-Z]/.test(html[i]))i++;
      var word=html.substring(ws,i);var cw=word.toLowerCase();
      if(!cw){result+=word;continue;}
      var hi2=WM[cw];
      if(hi2)result+='<span class="wd" data-w="'+cw+'" data-h="'+hi2+'">'+word+'</span>';
      else result+='<span class="wd" data-w="'+cw+'" data-h="">'+word+'</span>';
    }else{result+=ch;i++;}
  }
  return result;
}

  var els=document.querySelectorAll(sels);

    var el=els[i];if(el.querySelector(".wd")||el.querySelector(".cn"))continue;
    if(el.tagName==="BUTTON"||el.tagName==="INPUT")continue;
    var h=el.innerHTML;if(!h||h.trim().length<3)continue;
    var textOnly=h.replace(/<[^>]+>/g,"");if(textOnly.trim().length<3)continue;
    try{el.innerHTML=rt(h)}catch(e){}
  }
}

var STEPS=[{"t": "intro", "icon": "🏥", "title": "Health: The Ultimate Treasure", "sub": "Class 8 Science — Chapter 3", "intro": "What does it mean to be healthy? Is it just about not falling sick? The World Health Organization defines health as a state of complete physical, mental, and social well-being — not merely the absence of disease. In this chapter, we will explore what health truly means, how to stay healthy, the causes and types of diseases (communicable and non-communicable), how pathogens spread, our body’s immune system, vaccines, antibiotics, and the growing problem of antibiotic resistance. Let us begin!"}, {"t": "tutor", "icon": "💡", "title": "What Is Health?", "body": "Health is not just about not having diseases. Health also includes feeling good physically, staying positive, and having strong relationships. A healthy person takes care of their body, maintains a positive mindset, and enjoys social life. As per the World Health Organization (WHO), health is defined as a state of complete physical, mental, and social well-being, and not merely the absence of disease. A healthy person can generally perform various tasks more efficiently and cope well in different and difficult situations."}, {"t": "formula", "title": "Three Aspects of Health (WHO Definition)", "formulas": [{"label": "Physical Health", "expr": "Taking care of the body — nutrition, exercise, sleep, hygiene", "note": "Feeling good physically"}, {"label": "Mental Health", "expr": "Maintaining a positive mindset, managing stress, staying happy", "note": "Feeling good mentally and emotionally"}, {"label": "Social Health", "expr": "Having strong relationships, enjoying social life", "note": "Getting along with peers and society"}]}, {"t": "ix_health_triangle", "instruction": "Tap on each aspect of health — Physical, Mental, and Social — to learn what it means and see examples!"}, {"t": "quiz", "q": "Quick Check: According to WHO, health is defined as:", "diff": "easy", "opts": [{"t": "A state of complete physical, mental, and social well-being", "c": true}, {"t": "Just not having any disease", "c": false, "m": "Not having disease is only part of health — WHO’s definition is broader.", "correctMethod": "WHO defines health as complete physical, mental, AND social well-being — not merely the absence of disease."}, {"t": "Being physically strong and muscular", "c": false, "m": "Physical strength is only one aspect of health.", "correctMethod": "Health includes physical, mental, and social well-being together."}, {"t": "Never visiting a doctor", "c": false, "m": "Not visiting a doctor does not mean you are healthy.", "correctMethod": "Health is about complete well-being, not just absence of disease."}]}, {"t": "tutor", "icon": "🥗", "title": "How Can We Stay Healthy?", "body": "For staying healthy we must eat nutritious food, maintain hygiene, stay in a clean place, exercise regularly, get proper sleep, spend time with family and friends, and have a positive attitude. We should eat a balanced diet with plenty of fruits, vegetables, and whole grains. We should avoid processed, fatty, or sugary food. We should stay physically active, limit screen time, get enough sleep, practice yoga or pranayama regularly, and say NO to harmful substances like tobacco, alcohol, and addictive drugs."}, {"t": "real_example", "icon": "🧘", "title": "Ayurveda and Holistic Health", "body": "Ayurveda teaches us that true health is a balance of body, mind, and surroundings. Following dinacharya (daily routine) and ritucharya (seasonal routine) helps maintain this balance. Eating fresh, wholesome food suited to one’s prakriti (body constitution) is essential. Regular exercise, cleanliness, restful sleep, and a calm mind support overall well-being. This can also be achieved through practices like yoga, meditation, and mindfulness."}, {"t": "milestone", "icon": "🏆", "title": "Health Basics Mastered!", "xp": 50, "next": "Now: How Do We Know We Are Unwell?"}, {"t": "tutor", "icon": "🤒", "title": "How Do We Know That We Are Unwell?", "body": "Our body usually works in a certain way to keep us healthy. When we feel unwell, it means something inside us may not be working as it should. We may have symptoms, such as pain, tiredness, or dizziness, and signs like fever, rash, high blood pressure, or swelling that indicate we are unwell. A symptom is what we feel (like pain), while a sign is something that can be seen or measured (like high body temperature when we have fever). These help doctors understand what might be making us unwell."}, {"t": "formula", "title": "Symptoms vs Signs", "formulas": [{"label": "Symptom", "expr": "What the patient FEELS — pain, tiredness, dizziness", "note": "Subjective — only the patient can describe it"}, {"label": "Sign", "expr": "What can be SEEN or MEASURED — fever, rash, swelling, high BP", "note": "Objective — a doctor or instrument can detect it"}]}, {"t": "quiz", "q": "Quick Check: Which of these is a SIGN (not a symptom)?", "diff": "medium", "opts": [{"t": "Fever measured with a thermometer", "c": true}, {"t": "Feeling tired", "c": false, "m": "Tiredness is what the patient feels — it is a symptom.", "correctMethod": "A sign can be measured. Fever measured with a thermometer is a sign. Tiredness is a symptom."}, {"t": "Having a headache", "c": false, "m": "A headache is what the patient feels — it is a symptom.", "correctMethod": "A sign is something measurable like fever, rash, or blood pressure."}, {"t": "Feeling dizzy", "c": false, "m": "Dizziness is what the patient feels — it is a symptom.", "correctMethod": "Signs are measurable. Dizziness is a symptom."}]}, {"t": "milestone", "icon": "🤒", "title": "Symptoms and Signs Mastered!", "xp": 50, "next": "Now: Diseases — Causes and Types!"}, {"t": "tutor", "icon": "🦠", "title": "What Are Diseases?", "body": "A disease is a condition that affects the normal working of the body or mind. It can happen when one or more organs or organ systems stop functioning properly. Some diseases are caused by germs like bacteria, viruses, fungi, worms, or even by protozoa. These disease-causing organisms are called pathogens. Other diseases may result from poor nutrition or an unhealthy lifestyle. Diseases can be grouped into two major types: communicable diseases and non-communicable diseases."}, {"t": "formula", "title": "Two Types of Diseases", "formulas": [{"label": "Communicable Diseases", "expr": "Caused by pathogens — CAN spread from person to person", "note": "Examples: typhoid, dengue, flu, chickenpox, COVID-19"}, {"label": "Non-Communicable Diseases", "expr": "NOT caused by pathogens — do NOT spread from person to person", "note": "Examples: cancer, diabetes, asthma — linked to lifestyle, diet, environment"}, {"label": "Pathogens", "expr": "Disease-causing organisms: bacteria, viruses, fungi, worms, protozoa", "note": "They enter the body through air, food, water, or insect bites"}]}, {"t": "ix_disease_spread", "instruction": "Tap each method of disease transmission to see how pathogens spread! Explore: By Air, Direct Contact, Indirect Contact, By Food/Water, and By Insects (vectors)."}, {"t": "quiz", "q": "Quick Check: Which of these is a COMMUNICABLE disease?", "diff": "easy", "opts": [{"t": "Chickenpox", "c": true}, {"t": "Diabetes", "c": false, "m": "Diabetes is a non-communicable disease linked to lifestyle.", "correctMethod": "Chickenpox is caused by a virus (pathogen) and spreads from person to person — it is communicable."}, {"t": "Asthma", "c": false, "m": "Asthma is a non-communicable disease linked to environment and lifestyle.", "correctMethod": "Chickenpox is communicable — it spreads through air and contact."}, {"t": "Cancer", "c": false, "m": "Cancer is a non-communicable disease.", "correctMethod": "Chickenpox is a communicable disease caused by a virus."}]}, {"t": "truefalse", "q": "Non-communicable diseases like diabetes and heart disease are the most common cause of death in India today.", "ans": true, "explain": "Correct! Non-communicable diseases (NCDs) have become more common due to changes in lifestyle — eating more processed food, getting less exercise, and living longer. Today, most deaths in India are caused by NCDs.", "m": "Think about the news clippings at the start of the chapter — diabetes, heart disease, obesity are all NCDs."}, {"t": "tutor", "icon": "🦮", "title": "How Do Communicable Diseases Spread?", "body": "Pathogens can enter our body through the air we breathe, by consuming contaminated food or water, through direct contact like shaking hands, or indirectly by sharing personal items. Some pathogens are spread by insects like mosquitoes and houseflies — these insects are called vectors. Malaria is spread by mosquitoes carrying protozoa. Dengue is spread by mosquitoes carrying a virus. Cholera and typhoid spread through contaminated water and food."}, {"t": "formula", "title": "Common Disease Transmission Methods", "formulas": [{"label": "By Air", "expr": "Infected person coughs or sneezes → pathogens in air", "note": "Examples: common cold, flu, TB, measles"}, {"label": "By Direct Contact", "expr": "Touching, shaking hands, or close contact with infected person", "note": "Examples: chickenpox"}, {"label": "By Contaminated Food/Water", "expr": "Consuming food or water with pathogens", "note": "Examples: cholera, typhoid, hepatitis A"}, {"label": "By Insects (Vectors)", "expr": "Mosquitoes and flies carry pathogens", "note": "Examples: malaria (protozoa), dengue (virus)"}]}, {"t": "ix_pathogens", "instruction": "Tap on each type of pathogen to learn about it! Explore: Bacteria, Viruses, Fungi, Protozoa, and Worms."}, {"t": "quiz", "q": "Quick Check: Malaria is caused by which pathogen and spread by which vector?", "diff": "medium", "opts": [{"t": "Protozoa spread by mosquitoes", "c": true}, {"t": "Bacteria spread by flies", "c": false, "m": "Malaria is not caused by bacteria.", "correctMethod": "Malaria is caused by protozoa and spread by mosquitoes (which are the vectors)."}, {"t": "Virus spread by mosquitoes", "c": false, "m": "Dengue is caused by a virus spread by mosquitoes. Malaria is caused by protozoa.", "correctMethod": "Malaria is caused by protozoa, not viruses. Dengue is the viral disease spread by mosquitoes."}, {"t": "Fungi spread through water", "c": false, "m": "Malaria is not caused by fungi.", "correctMethod": "Malaria is caused by protozoa and transmitted by mosquitoes."}]}, {"t": "tutor", "icon": "💊", "title": "Non-Communicable Diseases and Deficiency Diseases", "body": "Non-communicable diseases like cancer, diabetes, and asthma are linked to lifestyle, diet, and environment. They are the most common cause of death in India. In Grade 6, you learnt about diseases like scurvy, anaemia, and goitre, which are caused by a lack of specific nutrients in the diet. These are called deficiency diseases and are also non-communicable. Diseases such as cancer, diabetes, and asthma may often persist for a long time (more than 3 months) and are referred to as chronic diseases. Diabetes is becoming more prevalent due to hormonal imbalances, unhealthy eating habits, lack of physical activity, and being overweight."}, {"t": "quiz", "q": "Exercise Q2: Which of the following are NON-communicable diseases? (i) Typhoid (ii) Asthma (iii) Diabetes (iv) Measles", "diff": "medium", "opts": [{"t": "(ii) Asthma and (iii) Diabetes", "c": true}, {"t": "(i) Typhoid and (ii) Asthma", "c": false, "m": "Typhoid is communicable — caused by bacteria and spreads through contaminated food/water.", "correctMethod": "Asthma and Diabetes are non-communicable. Typhoid and Measles are communicable (caused by pathogens)."}, {"t": "(i) Typhoid and (iv) Measles", "c": false, "m": "Both typhoid and measles are communicable diseases caused by pathogens.", "correctMethod": "Asthma and Diabetes are the non-communicable diseases in this list."}, {"t": "(ii) Asthma and (iv) Measles", "c": false, "m": "Measles is communicable — caused by a virus.", "correctMethod": "Asthma and Diabetes are non-communicable. Typhoid and Measles are communicable."}]}, {"t": "milestone", "icon": "🦠", "title": "Diseases Mastered!", "xp": 60, "next": "Now: Prevention, Immunity, and Vaccines!"}, {"t": "tutor", "icon": "🛡", "title": "How to Prevent and Control Diseases", "body": "Prevention is better than cure. Simple precautions can greatly reduce the spread of communicable diseases: keeping ourselves and our surroundings clean, practising basic hygiene, washing hands with soap and water, covering our mouth and nose while coughing or sneezing, wearing a mask in crowded places, avoiding sharing personal items, and keeping our home, food, and water clean. Staying at home and resting when unwell helps the body recover and minimises spreading disease to others."}, {"t": "tutor", "icon": "🛡", "title": "What Is Immunity?", "body": "The natural ability of our body to fight diseases is known as immunity. Our body has a special system called the immune system that helps fight against diseases. You might have taken some drops or injections in your childhood to protect yourself from certain diseases, such as polio, measles, tetanus, and hepatitis. These are vaccines that help prevent serious infections caused by viruses and bacteria."}, {"t": "ix_immunity", "instruction": "Tap to explore how immunity works! See how vaccines train your immune system. Tap: Natural Immunity, Vaccine (Acquired Immunity), and How Vaccines Work."}, {"t": "tutor", "icon": "💉", "title": "Edward Jenner and the First Vaccine", "body": "Smallpox was a deadly disease that caused blisters and killed millions. A milder disease called cowpox, seen in cows, could also infect humans. In the late 1700s, English doctor Edward Jenner discovered that people who had cowpox did not get smallpox. He tested this by injecting cowpox sap into a boy, who later showed no illness when exposed to smallpox. This led to the invention of the first vaccine and helped protect people from smallpox. Mass vaccination eventually helped eradicate smallpox worldwide."}, {"t": "tutor", "icon": "🔬", "title": "Our Scientific Heritage: Variolation in India", "body": "Long before modern vaccines, India had a traditional method called variolation to protect against smallpox. It involved using material from a smallpox sore to scratch the skin and create a mild infection and build immunity. People who performed this practice were known as teekedaars. This shows that the idea of building immunity through controlled exposure was practiced in India long before modern medicine."}, {"t": "quiz", "q": "Quick Check: A vaccine helps our body by:", "diff": "medium", "opts": [{"t": "Training the immune system to recognise and attack harmful germs", "c": true}, {"t": "Killing all bacteria in the body directly", "c": false, "m": "Vaccines do not kill bacteria directly — they train the immune system.", "correctMethod": "Vaccines train the immune system to recognise and fight pathogens before they cause disease."}, {"t": "Curing the disease after someone is already sick", "c": false, "m": "Vaccines are preventive, not curative. They work before you get sick.", "correctMethod": "Vaccines are preventive — they train the immune system in advance, not cure after infection."}, {"t": "Providing nutrition to the body", "c": false, "m": "Vaccines do not provide nutrition.", "correctMethod": "Vaccines work by training the immune system to recognise pathogens."}]}, {"t": "truefalse", "q": "Vaccines are preventive, not curative — they help prevent diseases before they happen, but do not treat them once someone is already sick.", "ans": true, "explain": "Correct! Vaccines are preventive. They train the immune system in advance. Once someone is already sick, vaccines cannot cure the disease — medicines or other treatments are needed.", "m": "Think about the difference between preventing a disease and curing it."}, {"t": "tutor", "icon": "🌍", "title": "India’s Role in Vaccine Production", "body": "India is one of the world’s largest vaccine producers. It manufactures vaccines on a massive scale and supplies them to many countries. Indian vaccine companies played a key role during the COVID-19 pandemic and continue to support global health efforts. Maharaj Kishan Bhan was a well-known Indian doctor and scientist who played a key role in developing the Rotavirus vaccine, which protects children from diarrhoea."}, {"t": "milestone", "icon": "💉", "title": "Immunity and Vaccines Mastered!", "xp": 60, "next": "Now: Antibiotics and Treatment!"}, {"t": "tutor", "icon": "💊", "title": "Antibiotics — Treatment for Bacterial Infections", "body": "If our immune system fails to protect us against an infectious disease, we fall ill and need to visit a doctor. The doctor may give us medicines called antibiotics, which kill the bacteria that might have caused the disease. Antibiotics work only against bacterial infections because they target parts of bacterial cells that are different from human or other animal cells. They do not work against viruses or diseases caused by protozoa."}, {"t": "tutor", "icon": "🔬", "title": "Discovery of Penicillin — The First Antibiotic", "body": "Penicillin was discovered in 1928 by Alexander Fleming, a bacteriologist from London. While studying harmful bacteria, he noticed that a mould on a discarded petri dish stopped the bacteria from growing. He realized the mould released a substance that killed the bacteria. This chance discovery led to the discovery of penicillin, the first antibiotic used to treat bacterial infections."}, {"t": "ix_antibiotic", "instruction": "Tap to explore how antibiotic resistance happens! See the difference between correct use and misuse of antibiotics. Tap: Correct Use, Misuse, and Resistance Develops."}, {"t": "quiz", "q": "Quick Check: Antibiotics are effective against which type of infection?", "diff": "easy", "opts": [{"t": "Bacterial infections only", "c": true}, {"t": "Viral infections like cold and flu", "c": false, "m": "Antibiotics do NOT work against viruses.", "correctMethod": "Antibiotics work only against bacterial infections. They do not work against viruses or protozoa."}, {"t": "All types of infections", "c": false, "m": "Antibiotics are not effective against all infections — only bacterial ones.", "correctMethod": "Antibiotics target bacterial cells specifically. They do not work against viruses."}, {"t": "Fungal infections", "c": false, "m": "Antibiotics are designed for bacteria, not fungi.", "correctMethod": "Antibiotics work only against bacterial infections."}]}, {"t": "truefalse", "q": "Exercise Q9: It is recommended that we should NOT take an antibiotic for a viral infection like a cold, cough, or flu.", "ans": true, "explain": "Correct! Antibiotics work only against bacteria, not viruses. Taking antibiotics for viral infections is ineffective and contributes to antibiotic resistance — where bacteria evolve to survive the antibiotic, making future infections harder to treat.", "m": "Remember: antibiotics kill bacteria, not viruses. Using them wrongly causes antibiotic resistance."}, {"t": "quiz", "q": "Exercise Q6: Saniya says ‘Antibiotics can cure any infection.’ Why is this statement incorrect?", "diff": "hard", "opts": [{"t": "Antibiotics only work against bacterial infections, not viral or fungal infections", "c": true}, {"t": "Antibiotics can cure all diseases including cancer", "c": false, "m": "Antibiotics cannot cure cancer or other non-communicable diseases.", "correctMethod": "Antibiotics are limited to bacterial infections only. They do not work against viruses, protozoa, or non-communicable diseases."}, {"t": "Antibiotics work against viruses too", "c": false, "m": "Antibiotics do NOT work against viruses.", "correctMethod": "Antibiotics only target bacteria. They do not work against viruses, protozoa, or non-infectious diseases."}, {"t": "Antibiotics can prevent all diseases", "c": false, "m": "Antibiotics treat, they do not prevent all diseases.", "correctMethod": "Antibiotics are treatment for bacterial infections, not a cure-all or preventive for everything."}]}, {"t": "quiz", "q": "Exercise Q10: Which disease(s) may spread if drinking water gets contaminated by excreta from an infected person?", "diff": "hard", "opts": [{"t": "Hepatitis A and Cholera", "c": true}, {"t": "Tuberculosis and Chickenpox", "c": false, "m": "TB spreads through air, not contaminated water. Chickenpox spreads through direct contact.", "correctMethod": "Hepatitis A and Cholera spread through contaminated water. TB spreads through air, and chickenpox through contact."}, {"t": "Poliomyelitis and Measles", "c": false, "m": "Measles spreads through air, not water. Polio can spread through contaminated water but the main answer from the list is Hepatitis A and Cholera.", "correctMethod": "Hepatitis A and Cholera are the diseases that spread through contaminated drinking water."}, {"t": "All of the above", "c": false, "m": "Not all these diseases spread through contaminated water.", "correctMethod": "Hepatitis A and Cholera are the water-borne diseases from this list."}]}, {"t": "tutor", "icon": "⚠", "title": "Antibiotic Resistance — A Growing Problem", "body": "Antibiotic resistance is a phenomenon where bacteria that were earlier killed by a given antibiotic are found to survive and multiply despite treatment with that antibiotic. This makes common infections harder to treat and increases the risk of complications, prolonged illness, and even death. To tackle this problem, we must use antibiotics wisely — only when prescribed by a doctor, in the correct dose, and for the right duration. Avoiding unnecessary use helps prevent the rise of resistant bacteria and keeps antibiotics effective for future generations."}, {"t": "real_example", "icon": "🏥", "title": "Community Sanitation in Odisha", "body": "In Bhadrak district, Odisha, a community sanitation campaign helped more people build and use toilets. This reduced open defecation significantly, and improved child health, with fewer cases of diarrhoea and infections. This shows that simple steps like good sanitation can greatly reduce the spread of communicable diseases. Community-level action can have a big impact on public health."}, {"t": "rapid_fire", "qs": [{"q": "Health is defined as complete physical, mental, and ___ well-being?", "opts": ["Social", "Financial", "Spiritual", "Academic"], "ans": 0}, {"q": "Which type of disease spreads from person to person?", "opts": ["Communicable", "Non-communicable", "Chronic", "Deficiency"], "ans": 0}, {"q": "What are disease-causing organisms called?", "opts": ["Pathogens", "Vectors", "Antibiotics", "Vaccines"], "ans": 0}, {"q": "Which insect is a vector for dengue?", "opts": ["Mosquito", "Housefly", "Ant", "Cockroach"], "ans": 0}, {"q": "What is the body’s natural ability to fight diseases called?", "opts": ["Immunity", "Infection", "Resistance", "Pathology"], "ans": 0}, {"q": "Who discovered the first vaccine (smallpox)?", "opts": ["Edward Jenner", "Alexander Fleming", "Robert Hooke", "Louis Pasteur"], "ans": 0}, {"q": "What medicine kills bacteria but NOT viruses?", "opts": ["Antibiotics", "Vaccines", "Painkillers", "Antiseptics"], "ans": 0}, {"q": "What is it called when bacteria survive despite antibiotic treatment?", "opts": ["Antibiotic resistance", "Immunity", "Vaccination", "Infection"], "ans": 0}]}, {"t": "memory_match", "pairs": [{"en": "Pathogen", "hi": "रोगजनक"}, {"en": "Immunity", "hi": "प्रतिरक्षा"}, {"en": "Vaccine", "hi": "टीका"}, {"en": "Antibiotic", "hi": "प्रतिजैविक"}, {"en": "Communicable", "hi": "संक्रामक"}, {"en": "Vector", "hi": "वाहक"}, {"en": "Disease", "hi": "रोग"}, {"en": "Symptom", "hi": "लक्षण"}]}, {"t": "complete", "icon": "🏥", "title": "Chapter 3 Complete!", "sub": "Health: The Ultimate Treasure — Mastered!"}];

  renderIxDiseaseSpread:function(step,cb){

        for(var i=0;i<4;i++){ctx.strokeStyle="rgba(239,68,68,0.4)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(150,60,20+i*12,-0.5,0.5);ctx.stroke();}

      }else if(sel==="indirect"){drawPerson(80,130,"#64748b","Infected");drawPerson(220,130,"#10b981","Healthy");

      }else if(sel==="food"){ctx.fillStyle="#4f46e5";ctx.beginPath();ctx.arc(100,80,25,0,2*Math.PI);ctx.fill();
        ctx.fillStyle="#fff";ctx.font="bold 8px sans-serif";ctx.fillText("glass",100,84);
        ctx.fillStyle="#a855f7";ctx.font="bold 9px sans-serif";ctx.fillText("\u26a0 pathogens",100,115);
        drawPerson(220,100,"#10b981","Healthy");
        ctx.strokeStyle="#ef4444";ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(125,80);ctx.lineTo(200,100);ctx.stroke();ctx.setLineDash([]);
      }else if(sel==="insect"){ctx.fillStyle="#64748b";ctx.font="bold 12px sans-serif";ctx.fillText("\ud83e\udeb0",150,80);
        ctx.strokeStyle="#ef4444";ctx.lineWidth=2;ctx.beginPath();ctx.arc(150,75,30,0,2*Math.PI);ctx.stroke();
        drawPerson(80,140,"#64748b","Infected");drawPerson(220,140,"#10b981","Healthy");
        ctx.strokeStyle="#a855f7";ctx.lineWidth=1;ctx.setLineDash([2,2]);ctx.beginPath();ctx.moveTo(130,85);ctx.lineTo(90,125);ctx.moveTo(170,85);ctx.lineTo(210,125);ctx.stroke();ctx.setLineDash([]);
      }
    }
    var btns=document.querySelectorAll(".ds-btn");
    for(var i=0;i<btns.length;i++){btns[i].addEventListener("click",function(){sel=this.getAttribute("data-part");var p=parts[sel];document.getElementById("dsTitle").textContent=p.title;document.getElementById("dsInfo").textContent=p.info;for(var j=0;j<btns.length;j++)btns[j].classList.remove("active");this.classList.add("active");draw();});}
    draw();

  renderIxPathogens:function(step,cb){

        ctx.fillStyle="#f59e0b";ctx.beginPath();ctx.arc(cx-50,cy-30,6,0,2*Math.PI);ctx.fill();
        ctx.beginPath();ctx.arc(cx,cy-30,6,0,2*Math.PI);ctx.fill();

      }else if(sel==="protozoa"){ctx.fillStyle="#10b981";
