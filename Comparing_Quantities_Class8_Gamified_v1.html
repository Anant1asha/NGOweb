.card{background:#fff;border:2px solid var(--border);border-radius:14px;padding:16px;max-width:400px;width:100%;margin:0 auto 8px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.game-card{background:#fff;border:2px solid var(--border);border-radius:14px;padding:14px;max-width:400px;width:100%;margin:0 auto;box-shadow:0 4px 12px rgba(0,0,0,.05)}

.we-step.green .we-num{background:var(--green)}.we-step.amber .we-num{background:var(--gold)}

function rt(text,sm){
  if(!text)return "";
  var html=text;var keys=Object.keys(CONN).sort(function(a,b){return b.length-a.length});
  var connCount=0,result="",i=0;
  while(i<html.length){
    var ch=html[i];
    if(ch==="."||ch==="!"||ch==="?"||ch===","){connCount=0;result+=ch;i++;continue;}
    if(ch===" "){result+=" ";i++;continue;}
    if(ch==="<"){var ci=html.indexOf(">",i);if(ci>=0){result+=html.substring(i,ci+1);i=ci+1;continue;}}
    var matched=false;
    if(i===0||!/[a-zA-Z]/.test(html[i-1])){
      for(var k=0;k<keys.length;k++){
        var c=keys[k];var sub=html.substring(i,i+c.length);
        if(sub.toLowerCase()===c.toLowerCase()){
          var ai=i+c.length;if(ai<html.length&&/[a-zA-Z]/.test(html[ai]))continue;
          var hi=CONN[c];connCount++;
          if(connCount<=4){result+='<span class="cn" data-w="'+sub+'" data-h="'+hi+'">'+sub+' <span class="ch">('+hi+')</span></span>';}
          else{result+='<span class="wd" data-w="'+sub.toLowerCase()+'" data-h="'+hi+'">'+sub+'</span>';}
          i+=c.length;matched=true;break;
        }
      }
    }
    if(matched)continue;
    if(/[a-zA-Z]/.test(ch)){
      var ws=i;while(i<html.length&&/[a-zA-Z]/.test(html[i]))i++;
      var word=html.substring(ws,i);var cw=word.toLowerCase();
      if(!cw){result+=word;continue;}
      var hi2=WM[cw];
      if(hi2)result+='<span class="wd" data-w="'+cw+'" data-h="'+hi2+'">'+word+'</span>';
      else result+='<span class="wd" data-w="'+cw+'" data-h="">'+word+'</span>';
    }else{result+=ch;i++;}
  }
  return result;
}

function applyLLE(){
  var sels=".bt,.we-question,.we-step,.quiz-opt-text,.instruction,.hint,.prop-box,.formula-box,.f-label,.f-expr,.f-note,.misconception,.correct-method,.feedback,.milestone-text,.milestone-next,.discovery-box .d-text,.discovery-box .d-title,.intro-title,.intro-sub,.complete-title,.complete-sub,.rf-question,.rf-opt-text,.prop-table th,.prop-table td,.we-tag,.visual-title,.tutor-box,.real-example";
  var els=document.querySelectorAll(sels);
  for(var i=0;i<els.length;i++){
    var el=els[i];if(el.querySelector(".wd")||el.querySelector(".cn"))continue;
    if(el.tagName==="BUTTON"||el.tagName==="INPUT")continue;
    var h=el.innerHTML;if(!h||h.trim().length<3)continue;
    var textOnly=h.replace(/<[^>]+>/g,"");if(textOnly.trim().length<3)continue;
    try{el.innerHTML=rt(h)}catch(e){}
  }
}

function showWord(w,h,d){
  var dlg=document.getElementById("wordDialog");if(!dlg)return;
  document.getElementById("dlgWord").textContent=w;
  document.getElementById("dlgHindi").textContent=h||"—";
  document.getElementById("dlgDesc").textContent=d||"";
  if(!dlg.open)dlg.showModal();
}

document.addEventListener("click",function(e){
  var el=e.target.closest(".cn");if(el){showWord(el.getAttribute("data-w"),el.getAttribute("data-h"),"Connecting word");return}
  el=e.target.closest(".wd");if(el){showWord(el.getAttribute("data-w"),el.getAttribute("data-h")||"—",el.getAttribute("data-h")?"":"Hindi meaning not available");return}
});

var STEPS=[{"t":"intro","icon":"📊","title":"Comparing Quantities","sub":"Class 8 Math — Chapter 8","intro":"Imagine you go shopping and see a sign: 20% off! Or you hear that petrol prices went up by 10%. Percentages are everywhere in our daily lives — discounts, taxes, profit, loss, interest on loans. In this chapter, we will learn how to compare quantities using ratios and percentages, find discounts, calculate profit and loss, understand GST, and master the powerful concept of compound interest. Let us begin!"},{"t":"tutor","icon":"💡","title":"Recalling Ratios and Percentages","body":"A ratio compares two quantities. If a basket has 20 apples and 5 oranges, the ratio of oranges to apples is 5:20 = 1:4. We can also express this as a percentage. There are 5 oranges out of 25 total fruits. So percentage of oranges = (5/25) x 100 = 20%. Percentage of apples = 100 - 20 = 80%. Remember: percentage means per hundred, so we always make the denominator 100."},{"t":"ix_percent_explorer","instruction":"Drag the sliders to change the number of apples and oranges. Watch the percentage bars update live. See how ratios convert to percentages!"},{"t":"formula","title":"Key Formulas — Ratios and Percentages","formulas":[{"label":"Ratio","expr":"a : b = a/b","note":"Simplify to lowest form"},{"label":"Percentage","expr":"(Part/Whole) x 100","note":"5 out of 25 = 20%"},{"label":"Convert ratio to %","expr":"(a/b) x 100 %","note":"3:4 = 75%"}]},{"t":"quiz","q":"Quick Check: A shop has 15 pens, 5 are red. What percentage of pens are red?","diff":"easy","opts":[{"t":"33.33% (since 5/15 x 100 = 33.33)","c":true},{"t":"50%","c":false,"m":"5 out of 15 is not half. Calculate 5/15 x 100.","correctMethod":"5/15 x 100 = 33.33%."},{"t":"25%","c":false,"m":"5 out of 20 would be 25%, but total is 15.","correctMethod":"5/15 x 100 = 33.33%."},{"t":"15%","c":false,"m":"5 out of 15 is not 15%. Use (5/15) x 100.","correctMethod":"5/15 x 100 = 33.33%."}]},{"t":"we","q":"Example 1: Girls are 60% of total students and are 18 in number. Find the ratio of girls to boys.","steps":[{"text":"Let total students = x. Then 60% of x = 18. So (60/100) x x = 18. Therefore x = (18 x 100)/60 = 30."},{"text":"Number of boys = 30 - 18 = 12."},{"text":"Ratio of girls to boys = 18:12 = 3:2."}],"answer":"Ratio of girls to boys = 3:2"},{"t":"text","title":"Exercise 8.1","body":"Now try these assessment questions — each different from the examples!"},{"t":"solve","q":"Ex 8.1 Q1(a): Find the ratio of speed of cycle 15 km/h to scooter 30 km/h.","steps":[{"type":"input","prompt":"Ratio = 15:30 = 1:? ","answer":"2","m":"15:30 simplifies to 1:2.","correctMethod":"Ratio = 1:2."}]},{"t":"solve","q":"Ex 8.1 Q2(a): Convert the ratio 3:4 to percentage.","steps":[{"type":"input","prompt":"3:4 = 3/4. Multiply by 100: (3/4) x 100 = ? % ","answer":"75","m":"3/4 x 100 = 75%.","correctMethod":"3:4 = 75%."}]},{"t":"solve","q":"Ex 8.1 Q3: 72% of 25 students are interested in math. How many are NOT interested?","steps":[{"type":"input","prompt":"72% of 25 = 18 students. Not interested = 25 - 18 = ? ","answer":"7","m":"25 - 18 = 7 students.","correctMethod":"7 students are not interested."}]},{"t":"solve","q":"Ex 8.1 Q5: Chameli had Rs 600 left after spending 75% of her money. How much did she have in the beginning?","steps":[{"type":"input","prompt":"If 75% spent, 25% remains. 25% of total = 600. Total = (600 x 100)/25 = ? ","answer":"2400","m":"600/0.25 = Rs 2400.","correctMethod":"Chameli had Rs 2400 in the beginning."}]},{"t":"tutor","icon":"💡","title":"Finding Increase or Decrease Percent","body":"When a price increases by 20%, the new price = old price + 20% of old price. For example, a scooter was Rs 34,000. Price increased by 20%. Increase = 20% of 34,000 = Rs 6,800. New price = 34,000 + 6,800 = Rs 40,800. Shortcut: if price increases by 20%, new price = 120% of old price = (120/100) x 34,000 = Rs 40,800. Similarly, a decrease of 5% means new price = 95% of old price."},{"t":"formula","title":"Increase/Decrease Formulas","formulas":[{"label":"Increase","expr":"New = Old + (R% of Old)","note":"Or New = (100+R)% of Old"},{"label":"Decrease","expr":"New = Old - (R% of Old)","note":"Or New = (100-R)% of Old"},{"label":"Percent change","expr":"((New-Old)/Old) x 100%","note":"Positive = increase, negative = decrease"}]},{"t":"quiz","q":"Quick Check: A price increases from Rs 200 to Rs 250. What is the percentage increase?","diff":"easy","opts":[{"t":"25% (since increase = 50, 50/200 x 100 = 25)","c":true},{"t":"20%","c":false,"m":"Increase is 50 on original 200. 50/200 x 100 = 25%, not 20%.","correctMethod":"(50/200) x 100 = 25%."},{"t":"50%","c":false,"m":"50 is the increase, not the percentage. Divide by original: 50/200 x 100 = 25%.","correctMethod":"25% increase."},{"t":"10%","c":false,"m":"10% of 200 = 20, but increase is 50. 50/200 x 100 = 25%.","correctMethod":"25% increase."}]},{"t":"tutor","icon":"💡","title":"Finding Discounts","body":"A discount is a reduction given on the Marked Price (MP). Discount = MP - Sale Price (SP). For example, an item marked at Rs 840 is sold for Rs 714. Discount = 840 - 714 = Rs 126. Discount percentage = (126/840) x 100 = 15%. To find sale price when discount% is given: if discount is 20% on MP of Rs 220, discount = 20% of 220 = Rs 44. Sale price = 220 - 44 = Rs 176."},{"t":"ix_discount_calc","instruction":"Enter the marked price and discount percentage. Tap Calculate to see the discount amount and final sale price. Try different values!"},{"t":"we","q":"Example 4: The list price of a frock is Rs 220. A discount of 20% is announced. Find the discount amount and sale price.","steps":[{"text":"Discount = 20% of Rs 220 = (20/100) x 220 = Rs 44."},{"text":"Sale price = MP - Discount = 220 - 44 = Rs 176."}],"answer":"Discount = Rs 44, Sale Price = Rs 176"},{"t":"text","title":"Exercise 8.2","body":"Assessment questions on increase/decrease, discounts, profit, loss, and tax — all unique!"},{"t":"solve","q":"Ex 8.2 Q1: A man got a 10% increase in salary. New salary is Rs 1,54,000. Find original salary.","steps":[{"type":"input","prompt":"110% of original = 154000. Original = (154000 x 100)/110 = ? ","answer":"140000","m":"154000/1.1 = Rs 1,40,000.","correctMethod":"Original salary = Rs 1,40,000."}]},{"t":"solve","q":"Ex 8.2 Q2: On Sunday 845 people went to the Zoo. On Monday 169 went. Find the percent decrease.","steps":[{"type":"input","prompt":"Decrease = 845 - 169 = 676. Percent decrease = (676/845) x 100 = ? % ","answer":"80","m":"676/845 x 100 = 80%.","correctMethod":"80% decrease."}]},{"t":"solve","q":"Ex 8.2 Q6: A shop offers 10% discount. Find cost of jeans (Rs 1450) + 2 shirts (Rs 850 each).","steps":[{"type":"input","prompt":"Total MP = 1450 + 2 x 850 = 3150. 10% discount. Pay 90% of 3150 = ? ","answer":"2835","m":"0.9 x 3150 = Rs 2835.","correctMethod":"Customer pays Rs 2835."}]},{"t":"tutor","icon":"💡","title":"Profit and Loss","body":"When you buy something and sell it, you either make a profit or a loss. Cost Price (CP) is what you pay, including overhead expenses like repairs and transport. Selling Price (SP) is what you sell it for. If SP > CP, you make a profit = SP - CP. Profit% = (Profit/CP) x 100. If SP < CP, you make a loss = CP - SP. Loss% = (Loss/CP) x 100. Remember: profit and loss are always calculated on CP, never on SP."},{"t":"formula","title":"Profit and Loss Formulas","formulas":[{"label":"Profit","expr":"SP - CP (when SP > CP)","note":"Profit% = (Profit/CP) x 100"},{"label":"Loss","expr":"CP - SP (when CP > SP)","note":"Loss% = (Loss/CP) x 100"},{"label":"Overhead CP","expr":"CP = Buying price + Overhead expenses","note":"Repairs, transport, etc."},{"label":"SP when profit%","expr":"SP = CP x (100 + P%)/100","note":"SP = CP x (100 - L%)/100 for loss"}]},{"t":"we","q":"Example 5: Sohan bought a refrigerator for Rs 2,500, spent Rs 500 on repairs, sold it for Rs 3,300. Find profit%.","steps":[{"text":"CP = 2500 + 500 (overhead) = Rs 3,000."},{"text":"SP = Rs 3,300. Profit = 3300 - 3000 = Rs 300."},{"text":"Profit% = (300/3000) x 100 = 10%."}],"answer":"Profit = 10%"},{"t":"quiz","q":"Quick Check: A shopkeeper buys a pen for Rs 10 and sells it for Rs 12. What is his profit%?","diff":"easy","opts":[{"t":"20% (since profit = 2, 2/10 x 100 = 20)","c":true},{"t":"16.67%","c":false,"m":"Profit% is on CP, not SP. 2/10 x 100 = 20%, not 2/12.","correctMethod":"(2/10) x 100 = 20%."},{"t":"2%","c":false,"m":"Rs 2 is the profit amount, not the percentage. (2/10) x 100 = 20%.","correctMethod":"20% profit."},{"t":"12%","c":false,"m":"12 is the selling price. Profit = 2 on CP of 10. (2/10) x 100 = 20%.","correctMethod":"20% profit."}]},{"t":"tutor","icon":"💡","title":"Sales Tax, VAT and GST","body":"Sales tax is charged by the government on the sale of an item, collected by the shopkeeper from the customer. It is always on the selling price. From July 1, 2017, India introduced GST (Goods and Services Tax), levied on supply of goods or services. Example: An item costs Rs 450 with 5% sales tax. Tax = 5% of 450 = Rs 22.50. Bill = 450 + 22.50 = Rs 472.50. When tax is included in the price, we work backwards: if Rs 3300 includes 10% VAT, original price = (3300 x 100)/110 = Rs 3000."},{"t":"formula","title":"Tax Formulas","formulas":[{"label":"Sales tax","expr":"Tax% of Selling Price","note":"Bill = Price + Tax"},{"label":"GST","expr":"GST% of price","note":"Added to the bill"},{"label":"Original price (tax included)","expr":"Price / (1 + Tax%/100)","note":"Rs 784 includes 12% GST => 784/1.12 = Rs 700"}]},{"t":"solve","q":"Ex 8.2 Q8: Price of a TV is Rs 13,000. Sales tax is 12%. Find the amount to pay.","steps":[{"type":"input","prompt":"Tax = 12% of 13000 = ? ","answer":"1560","m":"Tax = Rs 1560. Total = 13000 + 1560 = Rs 14,560.","correctMethod":"Amount = Rs 14,560."}]},{"t":"solve","q":"Ex 8.2 Q10: I purchased a hair-dryer for Rs 5,400 including 8% VAT. Find the price before VAT.","steps":[{"type":"input","prompt":"108% of original = 5400. Original = (5400 x 100)/108 = ? ","answer":"5000","m":"5400/1.08 = Rs 5000.","correctMethod":"Price before VAT = Rs 5000."}]},{"t":"milestone","icon":"🏆","title":"Percentages, Discounts, P&L Mastered!","xp":60,"next":"Now: Compound Interest!"},{"t":"tutor","icon":"💡","title":"What is Compound Interest?","body":"Compound interest is interest calculated on the amount of the previous year. Unlike simple interest where the principal stays the same, in compound interest the principal grows each year because interest is added to it. Example: Rs 20,000 at 8% compounded annually for 2 years. Year 1: Interest = 8% of 20,000 = Rs 1,600. Amount = 21,600. Year 2: Interest = 8% of 21,600 = Rs 1,728. Amount = 23,328. Total CI = 1,600 + 1,728 = Rs 3,328. Under simple interest it would have been Rs 3,200. The difference is Rs 128 — that is the power of compounding!"},{"t":"ix_ci_si_compare","instruction":"Enter principal, rate, and years. Watch compound interest and simple interest grow side by side. See how CI pulls ahead over time!"},{"t":"formula","title":"Compound Interest Formula","formulas":[{"label":"Amount (annual)","expr":"A = P x (1 + R/100)^n","note":"P=principal, R=rate%, n=years"},{"label":"CI","expr":"CI = A - P","note":"Compound Interest = Amount - Principal"},{"label":"Half-yearly","expr":"A = P x (1 + R/200)^(2n)","note":"Rate halved, periods doubled"}]},{"t":"we","q":"Example 11: Find CI on Rs 12,600 for 2 years at 10% per annum compounded annually.","steps":[{"text":"A = 12600 x (1 + 10/100)^2 = 12600 x (11/10)^2 = 12600 x 121/100 = Rs 15,246."},{"text":"CI = A - P = 15,246 - 12,600 = Rs 2,646."}],"answer":"CI = Rs 2,646"},{"t":"quiz","q":"Quick Check: What is the amount on Rs 10,000 at 10% CI for 2 years?","diff":"medium","opts":[{"t":"Rs 12,100 (10000 x 1.1 x 1.1)","c":true},{"t":"Rs 12,000","c":false,"m":"That would be simple interest. CI adds interest on interest: 10000 x 1.1^2 = 12100.","correctMethod":"10000 x (1.1)^2 = Rs 12,100."},{"t":"Rs 11,000","c":false,"m":"That is 1 year. For 2 years: 10000 x 1.1 x 1.1 = 12100.","correctMethod":"Rs 12,100."},{"t":"Rs 11,500","c":false,"m":"Use formula: A = 10000 x (1+10/100)^2 = 10000 x 1.21 = 12100.","correctMethod":"Rs 12,100."}]},{"t":"tutor","icon":"💡","title":"Compounded Half-Yearly","body":"When interest is compounded half-yearly (semi-annually), there are 2 conversion periods per year. The rate becomes half (R/2) and the number of periods becomes 2n. So A = P x (1 + R/200)^(2n). Example: Rs 12000 at 10% compounded half-yearly for 1.5 years. Rate per half-year = 5%, periods = 3. A = 12000 x (1.05)^3 = Rs 13,891.50. The key insight: compounding more frequently gives slightly more interest."},{"t":"we","q":"Example 12: Find amount on Rs 12,000 for 1.5 years at 10% compounded half-yearly.","steps":[{"text":"1.5 years = 3 half-years. Rate per half-year = 10/2 = 5%."},{"text":"A = 12000 x (1 + 5/100)^3 = 12000 x (21/20)^3 = 12000 x 9261/8000 = Rs 13,891.50."}],"answer":"Amount = Rs 13,891.50"},{"t":"tutor","icon":"💡","title":"Applications of Compound Interest","body":"The CI formula is not just for bank interest! It applies to: (1) Population growth — if population grows at 5% per year, it compounds. (2) Bacteria growth — bacteria multiply, so growth is compounded. (3) Depreciation — value of items like cars, TVs decreases. For depreciation, we use A = P x (1 - R/100)^n. Example: A TV bought for Rs 21,000 depreciates at 5% per year. Value after 1 year = 21000 x (1 - 5/100) = 21000 x 0.95 = Rs 19,950."},{"t":"text","title":"Exercise 8.3","body":"Compound Interest assessment questions — all different from worked examples!"},{"t":"solve","q":"Ex 8.3 Q1(a): Find amount and CI on Rs 10,800 for 3 years at 12.5% per annum compounded annually.","steps":[{"type":"input","prompt":"A = 10800 x (1 + 12.5/100)^3 = 10800 x (9/8)^3 = 10800 x 729/512 = ? ","answer":"15377.34","m":"A = Rs 15,377.34. CI = 15377.34 - 10800 = Rs 4,577.34.","correctMethod":"Amount = Rs 15,377.34, CI = Rs 4,577.34."}]},{"t":"solve","q":"Ex 8.3 Q1(b): Find amount and CI on Rs 18,000 for 2.5 years at 10% per annum compounded annually.","steps":[{"type":"input","prompt":"A for 2 years = 18000 x (11/10)^2 = 21780. SI for half year = 10% of 21780 for 0.5 yr = ? ","answer":"1089","m":"SI = 21780 x 0.05 = Rs 1089. A = 21780+1089 = Rs 22869. CI = 4869.","correctMethod":"Amount = Rs 22,869, CI = Rs 4,869."}]},{"t":"solve","q":"Ex 8.3 Q3: Fabina borrows Rs 12,500 at 12% SI for 3 years. Radha borrows same at 10% CI for 3 years. Who pays more and by how much?","steps":[{"type":"input","prompt":"Fabina SI = (12500 x 12 x 3)/100 = 4500. Radha CI = 12500 x (1.1)^3 - 12500 = ? ","answer":"4137.50","m":"Radha CI = Rs 4,137.50. Fabina pays more by 4500 - 4137.50 = Rs 362.50.","correctMethod":"Fabina pays more by Rs 362.50."}]},{"t":"solve","q":"Ex 8.3 Q12: A scooter was bought at Rs 42,000. Its value depreciated at 8% per annum. Find value after one year.","steps":[{"type":"input","prompt":"Value = 42000 x (1 - 8/100) = 42000 x 0.92 = ? ","answer":"38640","m":"42000 x 0.92 = Rs 38,640.","correctMethod":"Value after 1 year = Rs 38,640."}]},{"t":"milestone","icon":"🎓","title":"Full Chapter Mastered!","xp":100,"next":"Final assessment — Rapid Fire and Memory Match!"},{"t":"rapid_fire","qs":[{"q":"Discount = ?","opts":["MP - SP","SP - MP","CP - SP","MP + SP"],"ans":0},{"q":"Profit is calculated on?","opts":["CP","SP","MP","None"],"ans":0},{"q":"CI formula: A = ?","opts":["P(1+R/100)^n","P x R x N","P + R + N","P(1-R/100)"],"ans":0},{"q":"If 20% discount on Rs 500, sale price?","opts":["400","100","450","250"],"ans":0},{"q":"GST stands for?","opts":["Goods and Services Tax","General Sales Tax","Goods and Sales Tax","Government Sales Tax"],"ans":0},{"q":"CI on Rs 1000 at 10% for 2 years?","opts":["210","200","100","220"],"ans":0},{"q":"Depreciation uses which sign?","opts":["Minus (-)","Plus (+)","Multiply","None"],"ans":0},{"q":"Half-yearly compounding: rate becomes?","opts":["Half","Double","Same","Quarter"],"ans":0}]},{"t":"memory_match","pairs":[{"en":"Discount","hi":"छूट"},{"en":"Profit","hi":"लाभ"},{"en":"Loss","hi":"हानि"},{"en":"Percentage","hi":"प्रतिशत"},{"en":"Compound Interest","hi":"चक्रवृद्धि ब्याज"},{"en":"Marked Price","hi":"अंकित मूल्य"},{"en":"Depreciation","hi":"मूल्यह्रास"},{"en":"Tax","hi":"कर"}]},{"t":"complete","icon":"📊","title":"Chapter 8 Complete!","sub":"Comparing Quantities — Mastered! Class 8"}];

var App={
  nIdx:0,sIdx:0,xp:0,coins:0,streak:0,level:1,
  answered:false,selOpt:null,solveStepIdx:0,solveAnswered:false,selTf:null,
  rfIdx:0,rfScore:0,rfTimer:null,rfTime:30,
  mmFlipped:[],mmMatched:0,mmBusy:false,
  selTheme:'default',ownedThemes:[],badges:[],retryTimer:null,
  init:function(){
    var self=this;
    var cb=document.getElementById("continueBtn");
    if(cb)cb.addEventListener("click",function(){
      var step=STEPS[self.sIdx];if(!step)return;
      if(step.t==="quiz"&&!self.answered){self.checkQuiz(step,cb);return;}
      if(step.t==="truefalse"&&!self.answered){self.checkTrueFalse(step,cb);return;}
      if(step.t==="solve"&&!self.solveAnswered){self.checkSolve(step,cb);return;}
      if(step.t==="we"&&self.weStepIdx!==undefined&&self.weStepIdx<step.steps.length){
        self.weStepIdx++;if(self.weStepIdx>=step.steps.length){self.weStepIdx=0;self.next();return;}self.render();return;}
      self.next();
    });
    var bb=document.getElementById("backBtn");
    if(bb)bb.addEventListener("click",function(){self.back();});
    var lc=document.getElementById("luClose");
    if(lc)lc.addEventListener("click",function(){var d=document.getElementById("levelUpDialog");if(d){if(d.open)d.close();else d.removeAttribute("open");}});
    var dc=document.getElementById("dlgClose");
    if(dc)dc.addEventListener("click",function(){var d=document.getElementById("wordDialog");if(d){if(d.open)d.close();else d.removeAttribute("open");}});
    this.render();
  },
  render:function(){
    var step=STEPS[this.sIdx];if(!step)return;
    var cb=document.getElementById("continueBtn");if(!cb)return;
    /* CRITICAL FIX: Always reset button */
    cb.style.display="";cb.disabled=false;cb.className="btn btn-primary";
    var bb=document.getElementById("backBtn");if(bb)bb.disabled=this.sIdx===0;
    var pf=document.getElementById("progressFill");
    if(pf)pf.style.width=Math.round((this.sIdx/(STEPS.length-1))*100)+"%";
    this.answered=false;this.selOpt=null;this.selTf=null;this.shuffledOpts=null;
    if(this._prevSIdx!==this.sIdx){this.solveStepIdx=0;this.solveAnswered=false;this.weStepIdx=0;this._prevSIdx=this.sIdx;}
    if(this.rfTimer){clearInterval(this.rfTimer);this.rfTimer=null;}
    switch(step.t){
      case"intro":this.renderIntro(step,cb);break;
      case"text":this.renderText(step,cb);break;
      case"tutor":this.renderTutor(step,cb);break;
      case"real_example":this.renderRealExample(step,cb);break;
      case"formula":this.renderFormula(step,cb);break;
      case"ix_numbersets":this.renderIxNumberSets(step,cb);break;
      case"ix_numberline":this.renderIxNumberLine(step,cb);break;
      case"ix_properties":this.renderIxProperties(step,cb);break;
      case"ix_reciprocal":this.renderIxReciprocal(step,cb);break;
      case"ix_between":this.renderIxBetween(step,cb);break;
      case"discovery":this.renderDiscovery(step,cb);break;
      case"quiz":this.renderQuiz(step,cb);break;
      case"truefalse":this.renderTrueFalse(step,cb);break;
      case"we":this.renderWE(step,cb);break;
      case"solve":this.renderSolve(step,cb);break;
      case"rapid_fire":this.renderRapidFire(step,cb);break;
      case"memory_match":this.renderMemoryMatch(step,cb);break;
      case"milestone":this.renderMilestone(step,cb);break;
      case"complete":this.renderComplete(step,cb);break;
    }
    setTimeout(function(){applyLLE();},50);
    this.updateStats();
  },
  updateStats:function(){
    var sl=document.getElementById("statLvl");if(sl)sl.textContent="Lv "+this.level;
    var sc=document.getElementById("statCoins");if(sc)sc.textContent=this.coins;
    var sx=document.getElementById("statXp");if(sx)sx.textContent=this.xp;
  },
  checkLevelUp:function(){
    var th=[0,50,120,200,300,450];var nm=["Beginner","Learner","Scholar","Expert","Master","Champion"];
    for(var i=th.length-1;i>=0;i--){if(this.xp>=th[i]){if(this.level<i+1){this.level=i+1;this.showLevelUp(nm[i]);}break;}}
  },
  showLevelUp:function(name){
    var dlg=document.getElementById("levelUpDialog");if(!dlg)return;
    var ti=dlg.querySelector("div:nth-child(2)");if(ti)ti.textContent="Level Up! You are now a "+name+"!";
    if(dlg&&!dlg.open){try{dlg.showModal();}catch(e){}}
    this.fireConfetti();
  },
  fireConfetti:function(){
    var c=document.getElementById("confetti");if(!c)return;c.style.display="block";
    var ctx=c.getContext("2d");if(!ctx)return;
    c.width=window.innerWidth;c.height=window.innerHeight;
    var parts=[];
    for(var i=0;i<80;i++){parts.push({x:Math.random()*c.width,y:-20,vx:(Math.random()-0.5)*4,vy:Math.random()*3+2,c:["#7c3aed","#a855f7","#10b981","#f59e0b","#ec4899"][Math.floor(Math.random()*5)],s:Math.random()*6+3});}
    var t=0;
    function anim(){ctx.clearRect(0,0,c.width,c.height);for(var i=0;i<parts.length;i++){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);}t++;if(t<120)requestAnimationFrame(anim);else c.style.display="none";}
    anim();
  },
  next:function(){
    var step=STEPS[this.sIdx];if(!step)return;
    if((step.t==="quiz"||step.t==="truefalse")&&!this.answered)return;
    if(step.t==="solve"&&!this.solveAnswered)return;
    if(step.t==="rapid_fire"&&this.rfIdx<step.qs.length)return;
    if(step.t==="memory_match"&&this.mmMatched<step.pairs.length)return;
    this.sIdx++;if(this.sIdx>=STEPS.length)this.sIdx=STEPS.length-1;this.render();
  },
  back:function(){if(this.sIdx>0){this.sIdx--;if(this.rfTimer){clearInterval(this.rfTimer);this.rfTimer=null;}this.render();}},
  /* ===== SIMPLE STEPS (Continue always enabled) ===== */
  renderIntro:function(step,cb){
    var introText=step.intro||"Welcome! Let us begin learning.";
    document.getElementById("screen").innerHTML=
      '<div style="text-align:center"><div class="intro-icon">'+step.icon+'</div><div class="intro-title">'+rt(step.title)+'</div><div class="intro-sub">'+rt(step.sub)+'</div></div>'+
      '<div class="bt" style="padding:14px;background:linear-gradient(135deg,#fff,#eef2ff);border-radius:14px;border:2px solid var(--bl);max-width:400px;box-shadow:0 4px 12px rgba(79,70,229,.08)">'+rt(introText)+'</div>'+
      '<div class="hint">Tap any word for Hindi meaning. Connecting words show Hindi automatically.</div>';
    cb.textContent="Start Learning";cb.className="btn btn-primary";cb.disabled=false;
  },
  renderText:function(step,cb){
    document.getElementById("screen").innerHTML=
      '<div class="instruction">'+rt(step.title)+'</div>'+
      '<div class="bt" style="padding:14px;background:linear-gradient(135deg,#fff,#f5f3ff);border-radius:14px;border:2px solid var(--border);max-width:400px;box-shadow:0 4px 12px rgba(0,0,0,.05)">'+rt(step.body)+'</div>';
    cb.textContent="Continue →";cb.className="btn btn-primary";cb.disabled=false;
  },
  renderTutor:function(step,cb){
    document.getElementById("screen").innerHTML=
      '<div class="instruction">'+rt("Tutor Tip")+'</div>'+
      '<div class="tutor-box"><span class="tutor-icon">'+step.icon+'</span>'+rt(step.title)+'</div>'+
      '<div class="bt" style="padding:14px;background:#fff;border-radius:14px;border:2px solid var(--gold);max-width:400px;font-size:.85rem;line-height:1.7;margin:0 auto;box-shadow:0 4px 12px rgba(245,158,11,.08)">'+rt(step.body)+'</div>';
    cb.textContent="Continue →";cb.className="btn btn-primary";cb.disabled=false;
  },

  calcBetween:function(){
    function pf(s){s=s.trim();if(s.indexOf("/")>=0){var p=s.split("/");return parseInt(p[0])/parseInt(p[1]);}return parseFloat(s);}
    function tf(d){for(var i=1;i<=100;i++){var n=Math.round(d*i);if(Math.abs(n/i-d)<0.001)return n+"/"+i;}return d.toFixed(4);}
    var a=pf(document.getElementById("ixA").value);var b=pf(document.getElementById("ixB").value);
    if(isNaN(a)||isNaN(b)){document.getElementById("ixBetDisc").style.display="block";document.getElementById("ixBetTitle").textContent="Galat!";document.getElementById("ixBetInfo").innerHTML="Sahi fraction daalo jaise 1/4";return;}
    var mid=(a+b)/2;var aF=document.getElementById("ixA").value.trim();var bF=document.getElementById("ixB").value.trim();var mF=tf(mid);
    var lo=Math.min(a,b),hi=Math.max(a,b);
    var canvas=document.getElementById("betCanvas");if(!canvas)return;var ctx=canvas.getContext("2d");if(!ctx)return;
    ctx.clearRect(0,0,340,120);var cy=60;var m=30;var pad=(hi-lo)*0.2;var min=lo-pad,max=hi+pad;var sc=(340-2*m)/(max-min);
    ctx.strokeStyle="#475569";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m,cy);ctx.lineTo(340-m,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(340-m,cy);ctx.lineTo(333-m,cy-5);ctx.lineTo(333-m,cy+5);ctx.closePath();ctx.fillStyle="#475569";ctx.fill();
    var xa=m+(a-min)*sc;ctx.fillStyle="#8b5cf6";ctx.beginPath();ctx.arc(xa,cy,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle="#8b5cf6";ctx.font="bold 11px sans-serif";ctx.textAlign="center";ctx.fillText(aF,xa,cy-15);
    var xb=m+(b-min)*sc;ctx.fillStyle="#ec4899";ctx.beginPath();ctx.arc(xb,cy,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.stroke();
    ctx.fillStyle="#ec4899";ctx.fillText(bF,xb,cy-15);
    var xm=m+(mid-min)*sc;var gg=ctx.createRadialGradient(xm,cy,2,xm,cy,18);gg.addColorStop(0,"rgba(16,185,129,0.4)");gg.addColorStop(1,"rgba(16,185,129,0)");
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(xm,cy,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#10b981";ctx.beginPath();ctx.arc(xm,cy,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.stroke();
    ctx.fillStyle="#065f46";ctx.font="bold 12px sans-serif";ctx.fillText(mF,xm,cy+25);
    document.getElementById("ixBetDisc").style.display="block";
    document.getElementById("ixBetTitle").textContent="Mean = ("+aF+" + "+bF+") ÷ 2 = "+mF;
    document.getElementById("ixBetInfo").innerHTML=lo.toFixed(4)+" < "+mid.toFixed(4)+" < "+hi.toFixed(4)+". Toh "+mF+" beech mein hai! Aur aise hi aur nikal sakte ho!";
  },

    function draw(){var s=shapes[shape];ctx.clearRect(0,0,300,200);ctx.fillStyle=s.color+"20";ctx.strokeStyle=s.color;ctx.lineWidth=2.5;ctx.beginPath();
      if(shape==="trapezium"){ctx.moveTo(60,50);ctx.lineTo(240,50);ctx.lineTo(200,150);ctx.lineTo(100,150);}
      else if(shape==="kite"){ctx.moveTo(150,30);ctx.lineTo(240,100);ctx.lineTo(150,170);ctx.lineTo(60,100);}
      else if(shape==="parallelogram"){ctx.moveTo(70,50);ctx.lineTo(230,50);ctx.lineTo(200,150);ctx.lineTo(40,150);}
      else if(shape==="rhombus"){ctx.moveTo(150,30);ctx.lineTo(250,100);ctx.lineTo(150,170);ctx.lineTo(50,100);}
      else if(shape==="rectangle"){ctx.moveTo(60,40);ctx.lineTo(240,40);ctx.lineTo(240,160);ctx.lineTo(60,160);}
      else if(shape==="square"){ctx.moveTo(70,35);ctx.lineTo(230,35);ctx.lineTo(230,165);ctx.lineTo(70,165);}
      ctx.closePath();ctx.fill();ctx.stroke();document.getElementById("qeName").textContent=s.name;document.getElementById("qeDesc").textContent=s.desc;document.getElementById("qeProps").textContent=props[shape];}
    var btns=document.querySelectorAll("[data-shape]");for(var i=0;i<btns.length;i++){btns[i].addEventListener("click",function(){for(var j=0;j<btns.length;j++)btns[j].classList.remove("active");this.classList.add("active");shape=this.getAttribute("data-shape");draw();});}draw();
  },
  renderIxBalanceSim:function(step,cb){
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Balance Scale: 3x + 2 = 11</div><canvas id="blCanvas" width="320" height="240" style="display:block;margin:0 auto;border-radius:8px;background:#fff"></canvas><div style="margin-top:10px"><label style="font-size:.78rem;font-weight:700;color:var(--brand)">x = <span id="blX" style="color:var(--pi);font-size:1.2rem">3</span></label><input type="range" id="blSlider" min="-2" max="8" step="1" value="3" style="width:100%;max-width:280px"></div><div class="discovery-box" style="margin-top:8px"><div class="d-title" id="blTitle">Balanced!</div><div class="d-text" id="blInfo">LHS = 3(3)+2 = 11. RHS = 11.</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;var c=document.getElementById("blCanvas");if(!c)return;var ctx=c.getContext("2d");if(!ctx)return;
    function draw(){var x=parseInt(document.getElementById("blSlider").value);document.getElementById("blX").textContent=x;ctx.clearRect(0,0,320,240);var lhs=3*x+2,rhs=11,balanced=(lhs===rhs),cx=160,baseY=200;ctx.fillStyle="#64748b";ctx.beginPath();ctx.moveTo(cx-15,baseY);ctx.lineTo(cx+15,baseY);ctx.lineTo(cx,baseY-35);ctx.closePath();ctx.fill();ctx.strokeStyle="#64748b";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,baseY-35);ctx.lineTo(cx,60);ctx.stroke();var tilt=balanced?0:(lhs>rhs?-0.15:0.15);ctx.save();ctx.translate(cx,60);ctx.rotate(tilt);ctx.strokeStyle="#4f46e5";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-100,0);ctx.lineTo(100,0);ctx.stroke();ctx.fillStyle=balanced?"#10b981":"#64748b";ctx.beginPath();ctx.arc(-80,0,6,0,2*Math.PI);ctx.fill();ctx.beginPath();ctx.arc(80,0,6,0,2*Math.PI);ctx.fill();ctx.strokeStyle="#64748b";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-80,6);ctx.lineTo(-80,30);ctx.moveTo(80,6);ctx.lineTo(80,30);ctx.stroke();ctx.fillStyle="#4f46e5";ctx.font="bold 10px sans-serif";ctx.textAlign="center";ctx.fillText("3x+2",-80,45);ctx.fillText("11",80,45);ctx.fillStyle="#7c3aed";ctx.font="bold 12px sans-serif";ctx.fillText("= "+lhs,-80,20);ctx.fillText("= "+rhs,80,20);if(balanced){ctx.fillStyle="#10b981";ctx.font="bold 14px sans-serif";ctx.fillText("BALANCED!",0,-15);}else{ctx.fillStyle="#ef4444";ctx.font="bold 12px sans-serif";ctx.fillText("Not balanced",0,-15);}ctx.restore();ctx.fillStyle="#64748b";ctx.font="10px sans-serif";ctx.textAlign="center";ctx.fillText("LHS = 3("+x+")+2 = "+lhs+"  |  RHS = "+rhs,cx,230);
      if(balanced){document.getElementById("blTitle").textContent="Balanced! x = "+x+" is the solution!";document.getElementById("blInfo").textContent="LHS = 3("+x+")+2 = "+lhs+". RHS = "+rhs+". Both sides equal!";}
      else{document.getElementById("blTitle").textContent="Not balanced (LHS="+lhs+", RHS="+rhs+")";document.getElementById("blInfo").textContent="LHS = 3("+x+")+2 = "+lhs+" but RHS = "+rhs+". Try a different value of x!";}}
    document.getElementById("blSlider").addEventListener("input",draw);draw();
  },
  renderIxWordProblemSim:function(step,cb){
    var wpStep=0;var wpSteps=[{title:"Step 1: Read the problem",text:"Rahul's father is 3 times as old as Rahul. After 10 years, the sum of their ages will be 70. Find their present ages."},{title:"Step 2: Choose a variable",text:"Let Rahul's present age = x years. Then father's age = 3x years."},{title:"Step 3: Express future ages",text:"After 10 years: Rahul = x + 10, Father = 3x + 10."},{title:"Step 4: Form the equation",text:"Sum of future ages = 70. So (x+10) + (3x+10) = 70. Simplify: 4x + 20 = 70."},{title:"Step 5: Solve!",text:"4x = 50. x = 12.5. Rahul = 12.5 years, Father = 37.5 years."}];
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Word Problem Builder</div><div id="wpProgress" style="text-align:center"></div><div class="sim-step-text active" id="wpStepText" style="min-height:60px"></div><div style="text-align:center;margin-top:8px"><button class="shape-btn" id="wpPrev">Prev</button><button class="shape-btn" id="wpNext">Next</button></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    var prog="";for(var i=0;i<wpSteps.length;i++){prog+='<span class="sim-dot" id="wpDot'+i+'" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#e2e8f0;margin:0 2px"></span>';}document.getElementById("wpProgress").innerHTML=prog;
    function draw(){for(var i=0;i<wpSteps.length;i++){var dot=document.getElementById("wpDot"+i);if(dot){dot.style.background=i<wpStep?"#10b981":(i===wpStep?"#4f46e5":"#e2e8f0");}}var s=wpSteps[wpStep];document.getElementById("wpStepText").innerHTML="<b>"+s.title+"</b><br>"+s.text;}
    document.getElementById("wpPrev").addEventListener("click",function(){if(wpStep>0){wpStep--;draw();}});document.getElementById("wpNext").addEventListener("click",function(){if(wpStep<wpSteps.length-1){wpStep++;draw();}});draw();
  },

  renderIxPercentExplorer:function(step,cb){
    var apples=20,oranges=5;
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Percentage Explorer</div><div style="margin:8px 0"><label style="font-size:.75rem;font-weight:600">Apples: <span id="peA">20</span></label><br><input type="range" id="peSliderA" min="0" max="50" value="20" style="width:90%"></div><div style="margin:8px 0"><label style="font-size:.75rem;font-weight:600">Oranges: <span id="peO">5</span></label><br><input type="range" id="peSliderO" min="0" max="50" value="5" style="width:90%"></div><div id="peBars" style="margin:10px 0"></div><div class="discovery-box" id="peResult"><div class="d-title">20 apples, 5 oranges</div><div class="d-text">Total: 25 fruits. Apples: 80%, Oranges: 20%</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    function update(){
      apples=parseInt(document.getElementById("peSliderA").value);oranges=parseInt(document.getElementById("peSliderO").value);
      var total=apples+oranges;
      document.getElementById("peA").textContent=apples;document.getElementById("peO").textContent=oranges;
      var pa=total===0?0:Math.round(apples/total*100);var po=total===0?0:Math.round(oranges/total*100);
      document.getElementById("peBars").innerHTML='<div style="margin:4px 0"><span style="font-size:.7rem;color:#4f46e5">Apples '+pa+'%</span><div style="height:20px;background:#e2e8f0;border-radius:10px;overflow:hidden"><div style="height:100%;width:'+pa+'%;background:linear-gradient(90deg,#4f46e5,#6366f1);border-radius:10px;transition:width .3s"></div></div></div><div style="margin:4px 0"><span style="font-size:.7rem;color:#ec4899">Oranges '+po+'%</span><div style="height:20px;background:#e2e8f0;border-radius:10px;overflow:hidden"><div style="height:100%;width:'+po+'%;background:linear-gradient(90deg,#ec4899,#f472b6);border-radius:10px;transition:width .3s"></div></div></div>';
      document.getElementById("peResult").innerHTML='<div class="d-title">'+apples+' apples, '+oranges+' oranges</div><div class="d-text">Total: '+total+' fruits. Apples: '+pa+'%, Oranges: '+po+'%. Ratio A:O = '+apples+':'+oranges+'</div>';
    }
    document.getElementById("peSliderA").addEventListener("input",update);document.getElementById("peSliderO").addEventListener("input",update);update();
  },
  renderIxDiscountCalc:function(step,cb){
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">Discount Calculator</div><div style="margin:8px 0"><label style="font-size:.75rem;font-weight:600">Marked Price (Rs):</label><input type="number" id="dcMP" value="840" style="width:100%;padding:8px;border:2px solid #e2e8f0;border-radius:8px;font-size:.9rem"></div><div style="margin:8px 0"><label style="font-size:.75rem;font-weight:600">Discount %:</label><input type="number" id="dcPct" value="15" style="width:100%;padding:8px;border:2px solid #e2e8f0;border-radius:8px;font-size:.9rem"></div><button class="shape-btn" id="dcCalc" style="background:#4f46e5;color:#fff;border:none;margin-top:4px">Calculate</button><div class="discovery-box" id="dcResult" style="margin-top:8px"><div class="d-title">Enter values and tap Calculate</div><div class="d-text">Discount and sale price will appear here.</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    document.getElementById("dcCalc").addEventListener("click",function(){
      var mp=parseFloat(document.getElementById("dcMP").value);var pct=parseFloat(document.getElementById("dcPct").value);
      if(isNaN(mp)||isNaN(pct)||mp<0){document.getElementById("dcResult").innerHTML='<div class="d-title">Enter valid values</div>';return;}
      var disc=mp*pct/100;var sp=mp-disc;
      document.getElementById("dcResult").innerHTML='<div class="d-title">Discount: Rs '+disc.toFixed(2)+'</div><div class="d-text">Sale Price = Rs '+sp.toFixed(2)+' (You save Rs '+disc.toFixed(2)+')</div>';
    });
  },
  renderIxCiSiCompare:function(step,cb){
    document.getElementById("screen").innerHTML='<div class="instruction">'+rt(step.instruction)+'</div><div class="visual-card"><div class="visual-title">CI vs SI Comparator</div><div style="margin:6px 0"><label style="font-size:.72rem;font-weight:600">Principal (Rs):</label><input type="number" id="ciP" value="10000" style="width:100%;padding:6px;border:2px solid #e2e8f0;border-radius:8px;font-size:.85rem"></div><div style="margin:6px 0"><label style="font-size:.72rem;font-weight:600">Rate (%):</label><input type="number" id="ciR" value="10" style="width:100%;padding:6px;border:2px solid #e2e8f0;border-radius:8px;font-size:.85rem"></div><div style="margin:6px 0"><label style="font-size:.72rem;font-weight:600">Years:</label><input type="number" id="ciN" value="3" min="1" max="20" style="width:100%;padding:6px;border:2px solid #e2e8f0;border-radius:8px;font-size:.85rem"></div><button class="shape-btn" id="ciCalc" style="background:#4f46e5;color:#fff;border:none">Compare</button><div id="ciChart" style="margin:10px 0"></div><div class="discovery-box" id="ciResult"><div class="d-title">Enter values and tap Compare</div><div class="d-text">See how compound interest grows faster!</div></div></div>';
    cb.textContent="Continue";cb.className="btn btn-primary";cb.disabled=false;
    document.getElementById("ciCalc").addEventListener("click",function(){
      var P=parseFloat(document.getElementById("ciP").value);var R=parseFloat(document.getElementById("ciR").value);var N=parseInt(document.getElementById("ciN").value);
      if(isNaN(P)||isNaN(R)||isNaN(N)||P<=0||N<=0){document.getElementById("ciResult").innerHTML='<div class="d-title">Enter valid values</div>';return;}
      var si=P*R*N/100;var ciAmt=P*Math.pow(1+R/100,N);var ci=ciAmt-P;var diff=ci-si;
      var maxVal=Math.max(si,ci);var chart='<div style="margin:6px 0"><span style="font-size:.7rem;color:#10b981;font-weight:600">SI: Rs '+si.toFixed(2)+'</span><div style="height:18px;background:#e2e8f0;border-radius:9px;overflow:hidden"><div style="height:100%;width:'+(si/maxVal*100)+'%;background:linear-gradient(90deg,#10b981,#34d399);border-radius:9px;transition:width .3s"></div></div></div>';
      chart+='<div style="margin:6px 0"><span style="font-size:.7rem;color:#4f46e5;font-weight:600">CI: Rs '+ci.toFixed(2)+'</span><div style="height:18px;background:#e2e8f0;border-radius:9px;overflow:hidden"><div style="height:100%;width:'+(ci/maxVal*100)+'%;background:linear-gradient(90deg,#4f46e5,#6366f1);border-radius:9px;transition:width .3s"></div></div></div>';
      document.getElementById("ciChart").innerHTML=chart;
      document.getElementById("ciResult").innerHTML='<div class="d-title">CI is Rs '+diff.toFixed(2)+' more than SI!</div><div class="d-text">After '+N+' years: SI = Rs '+si.toFixed(2)+', CI = Rs '+ci.toFixed(2)+'. Amount under CI = Rs '+ciAmt.toFixed(2)+'.</div>';
    });
  },
renderShop:function(){
    var self=this;var themes=[{id:"default",name:"Purple",icon:"🟣",cost:0},{id:"ocean",name:"Ocean",icon:"🌊",cost:50},{id:"forest",name:"Forest",icon:"🌲",cost:80},{id:"sunset",name:"Sunset",icon:"🌅",cost:100}];
    var html='<div class="shop-overlay" id="shopOv" onclick="if(event.target===this)document.getElementById(\'shopOv\').remove()"><div class="shop-modal"><div class="shop-title">🛒 Shop</div><div class="shop-coins">🪙 '+this.coins+'</div><div class="shop-grid">';
    for(var i=0;i<themes.length;i++){var th=themes[i];var owned=this.ownedThemes.indexOf(th.id)>=0||th.cost===0;var active=this.selTheme===th.id;
      html+='<div class="shop-item'+(owned?' owned':'')+'"><div class="shop-item-icon">'+th.icon+'</div><div class="shop-item-name">'+th.name+'</div>';
      if(!owned){html+='<div class="shop-item-cost">🪙 '+th.cost+'</div><button class="shop-buy-btn" data-buy="'+th.id+'" data-cost="'+th.cost+'">Buy</button>';}
      else if(active){html+='<div style="font-size:.7rem;color:var(--green);font-weight:700">✓ Active</div>';}
      else{html+='<button class="shop-buy-btn" data-apply="'+th.id+'">Apply</button>';}
      html+='</div>';}
    html+='</div><div style="text-align:center;margin-top:12px"><button class="btn btn-primary" style="max-width:200px" onclick="document.getElementById(\'shopOv\').remove()">Close</button></div></div></div>';
    var ex=document.getElementById("shopOv");if(ex)ex.remove();var div=document.createElement("div");div.innerHTML=html;document.body.appendChild(div.firstChild);
    var bb=document.querySelectorAll("[data-buy]");for(var i=0;i<bb.length;i++){bb[i].addEventListener("click",function(){var id=this.getAttribute("data-buy");var cost=parseInt(this.getAttribute("data-cost"));if(self.coins>=cost){self.coins-=cost;self.ownedThemes.push(id);self.selTheme=id;document.body.className="theme-"+id;self.updateStats();self.renderShop();}});}
    var ab=document.querySelectorAll("[data-apply]");for(var i=0;i<ab.length;i++){ab[i].addEventListener("click",function(){var id=this.getAttribute("data-apply");self.selTheme=id;document.body.className="theme-"+id;self.renderShop();});}
  }
};
