function rt(text){
  var words=text.split(/\s+/);
  var result=[];
  var connCount=0;
  var maxConn=4;
  for(var i=0;i<words.length;i++){
    var w=words[i].replace(/[.,;:!?'"]/g,'').toLowerCase();
    if(CONN[w]&&connCount<maxConn){
      result.push('<span class="hindi-pop" data-hi="'+CONN[w]+'" onclick="showWord(this)">'+words[i]+'</span>');
      connCount++;
    }else{
      result.push(words[i]);
    }
  }
  return result.join(' ');
}
function applyLLE(el){
  if(!el)return;
  var nodes=el.querySelectorAll('.body, .q-text, .intro-text, .step-text, .expr, .note');
  nodes.forEach(function(n){
    if(n.getAttribute('data-lle'))return;
    n.setAttribute('data-lle','1');
    n.innerHTML=rt(n.textContent);
  });
}
var wordPopTimer=null;
function showWord(el){
  if(wordPopTimer)clearTimeout(wordPopTimer);
  var existing=document.querySelector('.word-pop');
  if(existing)existing.remove();
  var hi=el.getAttribute('data-hi')||'';
  if(!hi){hi=WM[el.textContent.toLowerCase().replace(/[.,;:!?'"]/g,'')]||'';}
  if(!hi)return;
  var rect=el.getBoundingClientRect();
  var pop=document.createElement('div');
  pop.className='word-pop';
  pop.textContent=hi;
  pop.style.left=rect.left+'px';
  pop.style.top=(rect.top-36)+'px';
  document.body.appendChild(pop);
  wordPopTimer=setTimeout(function(){
    if(pop.parentNode)pop.remove();
  },3000);
}

var App={
  sIdx:0,
  xp:0,
  coins:0,
  level:1,
  streak:0,
  weStepIdx:0,
  rfIdx:0,
  rfScore:0,
  rfTimer:null,
  rfTimeLeft:30,
  mmFlipped:[],
  mmMatched:[],
  mmMoves:0,
  shuffledOpts:null,
  quizAnswered:false,
  themes:{default:{bg:"#12122a",accent:"#7c5cff"},midnight:{bg:"#0a0a1e",accent:"#3c5cff"},forest:{bg:"#0a1e12",accent:"#2cb87a"},sunset:{bg:"#1e120a",accent:"#ff8c3c"}},
  ownedThemes:["default"],
  equippedTheme:"default",
  init:function(){
    this.sIdx=0;
    this.xp=0;
    this.coins=0;
    this.level=1;
    this.streak=0;
    this.render();
  },
  render:function(){
    var step=STEPS[this.sIdx];
    if(!step)return;
    var screen=document.getElementById("screen");
    var html="";
    switch(step.t){
      case"intro":html=this.renderIntro(step);break;
      case"tutor":html=this.renderTutor(step);break;
      case"formula":html=this.renderFormula(step);break;
      case"quiz":html=this.renderQuiz(step);break;
      case"truefalse":html=this.renderTrueFalse(step);break;
      case"we":html=this.renderWE(step);break;
      case"solve":html=this.renderSolve(step);break;
      case"rapid_fire":html=this.renderRapidFire(step);break;
      case"memory_match":html=this.renderMemoryMatch(step);break;
      case"real_example":html=this.renderRealExample(step);break;
      case"milestone":html=this.renderMilestone(step);break;
      case"complete":html=this.renderComplete(step);break;
      case"ix_force_effects":this.renderIxForceEffects(step);return;
      case"ix_friction":this.renderIxFriction(step);return;
      case"ix_noncontact":this.renderIxNoncontact(step);return;
      case"ix_gravity":this.renderIxGravity(step);return;
      case"ix_buoyancy":this.renderIxBuoyancy(step);return;
      default:html="<div class='tutor-card'><p>Unknown step type: "+step.t+"</p></div>";
    }
    screen.innerHTML=html;
    applyLLE(screen);
    this.updateStats();
    this.updateProgress();
    this.updateFooter();
  },
  updateStats:function(){
    var els={
      xp:document.getElementById("xp-val"),
      coins:document.getElementById("coin-val"),
      level:document.getElementById("level-val")
    };
    if(els.xp)els.xp.textContent=this.xp;
    if(els.coins)els.coins.textContent=this.coins;
    if(els.level)els.level.textContent=this.level;
  },
  updateProgress:function(){
    var bar=document.querySelector(".progress-fill");
    if(bar){
      var pct=((this.sIdx+1)/STEPS.length)*100;
      bar.style.width=pct+"%";
    }
    var title=document.querySelector(".h-title");
    if(title){
      title.textContent="Step "+(this.sIdx+1)+" / "+STEPS.length;
    }
  },
  updateFooter:function(){
    var step=STEPS[this.sIdx];
    var btn=document.getElementById("next-btn");
    if(!btn)return;
    if(step.t==="quiz"||step.t==="truefalse"||step.t==="solve"||step.t==="rapid_fire"||step.t==="memory_match"||step.t==="we"){
      btn.disabled=true;
    }else{
      btn.disabled=false;
    }
    if(step.t==="complete"){
      btn.textContent="Restart";
    }else{
      btn.textContent="Next →";
    }
  },
  next:function(){
    if(this.sIdx<STEPS.length-1){
      this.sIdx++;
      this.weStepIdx=0;
      this.render();
      var screen=document.getElementById("screen");
      screen.scrollTop=0;
    }else{
      this.init();
    }
  },
  back:function(){
    if(this.sIdx>0){
      this.sIdx--;
      this.weStepIdx=0;
      this.render();
      var screen=document.getElementById("screen");
      screen.scrollTop=0;
    }
  },
  checkLevelUp:function(){
    var thresholds=[0,50,120,200,300,420,560,720,900,1100];
    var newLevel=1;
    for(var i=0;i<thresholds.length;i++){
      if(this.xp>=thresholds[i])newLevel=i+1;
    }
    if(newLevel>this.level){
      this.level=newLevel;
      this.coins+=20;
      this.showLevelUp();
    }
  },
  showLevelUp:function(){
    var overlay=document.createElement("div");
    overlay.className="modal-overlay";
    overlay.innerHTML='<div class="modal-card"><span class="icon">🎉</span><h2>Level '+this.level+'!</h2><p>You earned 20 bonus coins!</p><button class="modal-btn" onclick="this.parentElement.parentElement.remove();App.render();">Awesome!</button></div>';
    document.body.appendChild(overlay);
    this.fireConfetti();
  },
  fireConfetti:function(){
    var colors=["#7c5cff","#5cb8ff","#7ee8d0","#ffcc6b","#ff6b6b"];
    for(var i=0;i<30;i++){
      var c=document.createElement("div");
      c.className="confetti";
      c.style.left=Math.random()*100+"vw";
      c.style.top="-10px";
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDelay=Math.random()*0.5+"s";
      c.style.animationDuration=(1.5+Math.random())+"s";
      document.body.appendChild(c);
      setTimeout(function(el){if(el&&el.parentNode)el.remove();},3000,c);
    }
  },
  renderIntro:function(step){
    return '<div class="intro-card"><span class="icon">'+(step.icon||'📘')+'</span><h1>'+step.title+'</h1><div class="sub">'+step.sub+'</div><div class="intro-text">'+step.intro+'</div></div>';
  },
  renderTutor:function(step){
    return '<div class="tutor-card"><span class="icon">'+(step.icon||'📖')+'</span><h2>'+step.title+'</h2><div class="body">'+step.body+'</div></div>';
  },
  renderRealExample:function(step){
    return '<div class="real-example-card"><span class="icon">'+(step.icon||'💡')+'</span><h2>'+step.title+'</h2><div class="body">'+step.body+'</div></div>';
  },
  renderFormula:function(step){
    var html='<div class="formula-card"><h2>'+step.title+'</h2>';
    for(var i=0;i<step.formulas.length;i++){
      var f=step.formulas[i];
      html+='<div class="formula-item"><div class="label">'+f.label+'</div><div class="expr">'+f.expr+'</div><div class="note">'+f.note+'</div></div>';
    }
    html+='</div>';
    return html;
  },
  renderQuiz:function(step){
    var opts=step.opts.slice();
    for(var i=opts.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var tmp=opts[i];opts[i]=opts[j];opts[j]=tmp;
    }
    this.shuffledOpts=opts;
    this.quizAnswered=false;
    var letters=["A","B","C","D"];
    var html='<div class="quiz-card"><div class="diff diff-'+step.diff+'">'+step.diff.toUpperCase()+'</div><div class="q-text">'+step.q+'</div>';
    for(var i=0;i<opts.length;i++){
      html+='<div class="quiz-opt" onclick="App.checkQuiz('+i+')"><div class="opt-letter">'+letters[i]+'</div><div>'+opts[i].t+'</div></div>';
    }
    html+='<div class="quiz-feedback" id="quiz-feedback"></div></div>';
    return html;
  },
  checkQuiz:function(idx){
    if(this.quizAnswered)return;
    this.quizAnswered=true;
    var opt=this.shuffledOpts[idx];
    var optsEls=document.querySelectorAll(".quiz-opt");
    for(var i=0;i<optsEls.length;i++){
      optsEls[i].classList.add("disabled");
      if(this.shuffledOpts[i].c){
        optsEls[i].classList.add("correct");
      }
    }
    var fb=document.getElementById("quiz-feedback");
    if(opt.c){
      this.xp+=15;
      this.coins+=5;
      this.streak++;
      fb.className="quiz-feedback show correct";
      fb.innerHTML="✅ Correct! +15 XP, +5 coins";
      this.checkLevelUp();
    }else{
      this.streak=0;
      fb.className="quiz-feedback show wrong";
      var m=opt.m||"Not quite right.";
      var cm=opt.correctMethod||"";
      fb.innerHTML="❌ "+m;
      if(cm)fb.innerHTML+='<div class="correct-method">'+cm+'</div>';
      setTimeout(function(){
        var retryBtn=document.createElement("button");
        retryBtn.className="btn-primary";
        retryBtn.textContent="Try Again";
        retryBtn.style.marginTop="10px";
        retryBtn.onclick=function(){
          App.quizAnswered=false;
          App.render();
        };
        fb.appendChild(retryBtn);
      },500);
    }
    if(opt.c){
      var btn=document.getElementById("next-btn");
      if(btn)btn.disabled=false;
    }
    this.updateStats();
  },
  renderTrueFalse:function(step){
    return '<div class="tf-card"><div class="q-text">'+step.q+'</div><div class="tf-btns"><button class="tf-btn true-btn" onclick="App.checkTrueFalse(true)">True</button><button class="tf-btn false-btn" onclick="App.checkTrueFalse(false)">False</button></div><div class="quiz-feedback" id="tf-feedback"></div></div>';
  },
  checkTrueFalse:function(answer){
    var step=STEPS[this.sIdx];
    var fb=document.getElementById("tf-feedback");
    var btns=document.querySelectorAll(".tf-btn");
    btns[0].classList.add("disabled");
    btns[1].classList.add("disabled");
    if(answer===step.ans){
      btns[answer?0:1].classList.add("selected");
      this.xp+=10;
      this.coins+=3;
      this.streak++;
      fb.className="quiz-feedback show correct";
      fb.innerHTML="✅ Correct! +10 XP, +3 coins. "+(step.explain||"");
      this.checkLevelUp();
    }else{
      btns[answer?0:1].classList.add("selected");
      this.streak=0;
      fb.className="quiz-feedback show wrong";
      var hint=step.m||"";
      fb.innerHTML="❌ Not quite. "+(step.explain||"");
      if(hint)fb.innerHTML+='<div class="correct-method">'+hint+'</div>';
      setTimeout(function(){
        var retryBtn=document.createElement("button");
        retryBtn.className="btn-primary";
        retryBtn.textContent="Try Again";
        retryBtn.style.marginTop="10px";
        retryBtn.onclick=function(){
          App.render();
        };
        fb.appendChild(retryBtn);
      },500);
    }
    if(answer===step.ans){
      var btn=document.getElementById("next-btn");
      if(btn)btn.disabled=false;
    }
    this.updateStats();
  },
  renderWE:function(step){
    var html='<div class="we-card"><div class="q-text">'+step.q+'</div>';
    for(var i=0;i<step.steps.length;i++){
      html+='<div class="we-step" id="we-step-'+i+'"><div class="step-label">Step '+(i+1)+'</div><div class="step-text">'+step.steps[i]+'</div></div>';
    }
    html+='</div>';
    setTimeout(function(){
      var s=document.getElementById("we-step-0");
      if(s)s.classList.add("show");
    },100);
    return html;
  },
  renderSolve:function(step){
    return '<div class="solve-card"><div class="q-text">'+step.q+'</div><input type="text" class="solve-input" id="solve-input" placeholder="Type your answer..." onkeydown="if(event.key===\'Enter\')App.checkSolve()"><div class="quiz-feedback" id="solve-feedback"></div></div>';
  },
  checkSolve:function(){
    var step=STEPS[this.sIdx];
    var input=document.getElementById("solve-input");
    var val=input.value.trim().toLowerCase();
    var fb=document.getElementById("solve-feedback");
    var correct=false;
    if(Array.isArray(step.a)){
      for(var i=0;i<step.a.length;i++){
        if(val===step.a[i].toLowerCase())correct=true;
      }
    }else{
      if(val===String(step.a).toLowerCase())correct=true;
    }
    if(correct){
      this.xp+=20;
      this.coins+=8;
      this.streak++;
      fb.className="quiz-feedback show correct";
      fb.innerHTML="✅ Correct! +20 XP, +8 coins. "+(step.explain||"");
      input.disabled=true;
      this.checkLevelUp();
      var btn=document.getElementById("next-btn");
      if(btn)btn.disabled=false;
    }else{
      this.streak=0;
      fb.className="quiz-feedback show wrong";
      fb.innerHTML="❌ Not quite. Try again!";
    }
    this.updateStats();
  },
  renderRapidFire:function(step){
    this.rfIdx=0;
    this.rfScore=0;
    this.rfTimeLeft=30;
    if(this.rfTimer)clearInterval(this.rfTimer);
    this.renderRFQuestion();
    return '<div class="rf-card" id="rf-card"></div>';
  },
  renderRFQuestion:function(){
    var step=STEPS[this.sIdx];
    var q=step.qs[this.rfIdx];
    if(!q){
      this.endRF();
      return;
    }
    var card=document.getElementById("rf-card");
    if(!card)return;
    var html='<div class="rf-timer" id="rf-timer">'+this.rfTimeLeft+'</div><div class="rf-score">Question '+(this.rfIdx+1)+'/'+step.qs.length+' | Score: '+this.rfScore+'</div><div class="rf-q">'+q.q+'</div><div class="rf-opts">';
    for(var i=0;i<q.opts.length;i++){
      html+='<div class="rf-opt" onclick="App.checkRF('+i+')">'+q.opts[i]+'</div>';
    }
    html+='</div>';
    card.innerHTML=html;
    var self=this;
    this.rfTimer=setInterval(function(){
      self.rfTimeLeft--;
      var t=document.getElementById("rf-timer");
      if(t){
        t.textContent=self.rfTimeLeft;
        if(self.rfTimeLeft<=10)t.classList.add("urgent");
      }
      if(self.rfTimeLeft<=0){
        clearInterval(self.rfTimer);
        self.endRF();
      }
    },1000);
  },
  checkRF:function(idx){
    var step=STEPS[this.sIdx];
    var q=step.qs[this.rfIdx];
    var opts=document.querySelectorAll(".rf-opt");
    for(var i=0;i<opts.length;i++){
      opts[i].classList.add("disabled");
      opts[i].style.pointerEvents="none";
    }
    if(idx===q.ans){
      opts[idx].classList.add("correct");
      this.rfScore++;
      this.xp+=5;
    }else{
      opts[idx].classList.add("wrong");
      opts[q.ans].classList.add("correct");
    }
    var self=this;
    setTimeout(function(){
      self.rfIdx++;
      if(self.rfIdx<step.qs.length){
        self.renderRFQuestion();
      }else{
        self.endRF();
      }
    },800);
  },
  endRF:function(){
    if(this.rfTimer)clearInterval(this.rfTimer);
    var step=STEPS[this.sIdx];
    var total=step.qs.length;
    var card=document.getElementById("rf-card");
    if(!card)return;
    var pct=Math.round((this.rfScore/total)*100);
    var bonus=0;
    if(pct>=80)bonus=30;
    else if(pct>=60)bonus=20;
    else if(pct>=40)bonus=10;
    this.coins+=bonus;
    this.checkLevelUp();
    card.innerHTML='<div class="rf-score" style="font-size:24px;color:#7ee8d0;font-weight:800">Rapid Fire Complete!</div><div class="rf-score" style="font-size:20px;color:#ffcc6b;margin:10px 0">Score: '+this.rfScore+'/'+total+'</div><div class="rf-score">Bonus coins: +'+bonus+'</div>';
    var btn=document.getElementById("next-btn");
    if(btn)btn.disabled=false;
    this.updateStats();
  },
  renderMemoryMatch:function(step){
    var cards=[];
    for(var i=0;i<step.pairs.length;i++){
      cards.push({type:"en",text:step.pairs[i].en,pairIdx:i});
      cards.push({type:"hi",text:step.pairs[i].hi,pairIdx:i});
    }
    for(var i=cards.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var tmp=cards[i];cards[i]=cards[j];cards[j]=tmp;
    }
    this.mmFlipped=[];
    this.mmMatched=[];
    this.mmMoves=0;
    var html='<div class="mm-card"><div class="mm-score">Moves: <span id="mm-moves">0</span> | Matched: <span id="mm-matched">0</span>/'+step.pairs.length+'</div><div class="mm-grid">';
    for(var i=0;i<cards.length;i++){
      html+='<div class="mm-card-item" data-idx="'+i+'" data-pair="'+cards[i].pairIdx+'" data-type="'+cards[i].type+'" data-text="'+cards[i].text+'" onclick="App.flipMM(this)">?</div>';
    }
    html+='</div><div class="quiz-feedback" id="mm-feedback"></div></div>';
    return html;
  },
  flipMM:function(el){
    var idx=parseInt(el.getAttribute("data-idx"));
    if(this.mmFlipped.length>=2)return;
    if(this.mmMatched.indexOf(idx)>=0)return;
    if(this.mmFlipped.indexOf(idx)>=0)return;
    el.classList.add("flipped");
    el.textContent=el.getAttribute("data-text");
    this.mmFlipped.push(idx);
    if(this.mmFlipped.length===2){
      this.mmMoves++;
      var movesEl=document.getElementById("mm-moves");
      if(movesEl)movesEl.textContent=this.mmMoves;
      var self=this;
      setTimeout(function(){
        self.checkMM();
      },800);
    }
  },
  checkMM:function(){
    var c1=document.querySelector('[data-idx="'+this.mmFlipped[0]+'"]');
    var c2=document.querySelector('[data-idx="'+this.mmFlipped[1]+'"]');
    if(!c1||!c2)return;
    var p1=c1.getAttribute("data-pair");
    var p2=c2.getAttribute("data-pair");
    if(p1===p2){
      c1.classList.add("matched");
      c2.classList.add("matched");
      this.mmMatched.push(this.mmFlipped[0]);
      this.mmMatched.push(this.mmFlipped[1]);
      var matchedEl=document.getElementById("mm-matched");
      if(matchedEl)matchedEl.textContent=this.mmMatched.length/2;
      this.xp+=5;
      this.coins+=2;
      this.checkLevelUp();
    }else{
      c1.classList.add("wrong-match");
      c2.classList.add("wrong-match");
      setTimeout(function(){
        c1.classList.remove("flipped","wrong-match");
        c2.classList.remove("flipped","wrong-match");
        c1.textContent="?";
        c2.textContent="?";
      },600);
    }
    this.mmFlipped=[];
    var step=STEPS[this.sIdx];
    if(this.mmMatched.length>=step.pairs.length*2){
      var fb=document.getElementById("mm-feedback");
      if(fb){

  openShop:function(){

      {id:"midnight",name:"Midnight",desc:"Deep blue night theme",price:50},
      {id:"forest",name:"Forest",desc:"Green nature theme",price:80},
      {id:"sunset",name:"Sunset",desc:"Warm orange theme",price:100}
    ];
    for(var i=0;i<themesList.length;i++){
      var t=themesList[i];
      var owned=this.ownedThemes.indexOf(t.id)>=0;
      var equipped=this.equippedTheme===t.id;
      var btnClass=equipped?"equipped":(owned?"bought":"");
      var btnText=equipped?"Equipped":(owned?"Equip":"Buy");

        html+='<div class="si-price">'+t.price+' 🪙</div>';
      }
      html+='<button class="si-btn '+btnClass+'" onclick="App.buyTheme(\''+t.id+'\','+t.price+',this)">'+btnText+'</button></div>';
    }
    html+='<button class="shop-close" onclick="document.getElementById(\'shop-overlay\').remove();">Close</button></div>';

  buyTheme:function(id,price,btn){
    if(this.ownedThemes.indexOf(id)>=0){
      this.equippedTheme=id;
      this.applyTheme();
      this.openShop();
      return;
    }
    if(this.coins>=price){
      this.coins-=price;
      this.ownedThemes.push(id);
      this.equippedTheme=id;
      this.applyTheme();
      this.openShop();
      this.updateStats();
    }

    }
  },

  renderIxFriction:function(step){
    var screen=document.getElementById("screen");

    var canvas=document.getElementById("sim-canvas");

      glass:{color:"#7ee8d0",friction:"Very Low",distance:380,texture:"smooth"},

    };

      var s=surfaces[surface];

      ctx.fillStyle="#7c5cff";
      ctx.fillRect(30,180,50,40);
      ctx.strokeStyle="#ff6b6b";
      ctx.lineWidth=3;

      var arrowEnd=80+s.distance;

      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(arrowEnd,165);
      ctx.lineTo(arrowEnd-10,159);
      ctx.lineTo(arrowEnd-10,171);
      ctx.closePath();
      ctx.fillStyle="#ff6b6b";
      ctx.fill();
      ctx.fillStyle="#ff6b6b";
      ctx.font="12px sans-serif";
      ctx.fillText("Motion →",arrowStart,155);

      ctx.beginPath();
      ctx.moveTo(arrowEnd+10,200);
      ctx.lineTo(arrowEnd-20,200);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(arrowEnd-20,200);
      ctx.lineTo(arrowEnd-12,194);
      ctx.lineTo(arrowEnd-12,206);
      ctx.closePath();
      ctx.fillStyle="#ffcc6b";
      ctx.fill();
      ctx.fillStyle="#ffcc6b";
      ctx.font="12px sans-serif";
      ctx.fillText("← Friction",arrowEnd-60,215);
      ctx.fillStyle="#e8e8f0";
      ctx.font="14px sans-serif";
      ctx.fillText("Distance: "+s.distance+"px",350,250);
      var db=document.getElementById("discovery-box");
      if(db){
        db.innerHTML='<div class="d-title">'+surface.charAt(0).toUpperCase()+surface.slice(1)+' Surface</div>Friction is '+s.friction+' on '+surface+'. The object slides '+s.distance+'px before stopping. '+(s.friction==="Very Low"||s.friction==="Low"?"Lower friction means the object travels farther before stopping.":"Higher friction means the object stops sooner.")+'';

        btns.forEach(function(b){b.classList.remove("active");});

      });
    });

        ctx.fillStyle="#7ee8d0";
        ctx.fillText("Weight changes with gravity!",170,245);
        info={title:"Weight on Different Planets",text:"An object with mass 1 kg weighs 10 N on Earth, only 1.6 N on the Moon, 3.8 N on Mars, 9 N on Venus, and 25.4 N on Jupiter! The mass stays the same — only the weight changes because gravitational force is different on each planet."};
      }
      var db=document.getElementById("discovery-box");
      if(db){
        db.innerHTML='<div class="d-title">'+info.title+'</div>'+info.text;
      }
    }
    draw("throw");
    var btns=document.querySelectorAll(".sim-btn");
    btns.forEach(function(btn){
      btn.addEventListener("click",function(){
        btns.forEach(function(b){b.classList.remove("active");});
        btn.classList.add("active");
        draw(btn.getAttribute("data-mode"));
      });
    });
  },

  renderIxBuoyancy:function(step){
    var screen=document.getElementById("screen");
    screen.innerHTML='<div class="sim-card"><div class="sim-title">Floating and Sinking</div><div class="sim-instruction">'+step.instruction+'</div><canvas class="sim-canvas" id="sim-canvas" width="540" height="300"></canvas><div class="sim-btns"><button class="sim-btn active" data-mode="float">Floating Object</button><button class="sim-btn" data-mode="sink">Sinking Object</button><button class="sim-btn" data-mode="archimedes">Archimedes Principle</button></div><div class="discovery-box" id="discovery-box"><div class="d-title">Floating Object</div>A wooden block floats when buoyant force equals the gravitational force (weight).</div></div>';
    applyLLE(screen);
    this.updateStats();
    this.updateProgress();
    this.updateFooter();
    var canvas=document.getElementById("sim-canvas");
    var ctx=canvas.getContext("2d");
    function draw(mode){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle="#1a1a2e";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle="rgba(92,184,255,0.2)";
      ctx.fillRect(40,150,460,130);
      ctx.fillStyle="#5cb8ff";
      ctx.font="12px sans-serif";
      ctx.fillText("Water",460,165);
      var info={};
      if(mode==="float"){
        ctx.fillStyle="#d4a76a";
        ctx.fillRect(220,130,80,40);
        ctx.fillStyle="#e8e8f0";
        ctx.font="12px sans-serif";
        ctx.fillText("Wooden Block",220,125);
        ctx.strokeStyle="#7ee8d0";
        ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(260,120);
        ctx.lineTo(260,80);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(260,80);
        ctx.lineTo(254,90);
        ctx.lineTo(266,90);
        ctx.closePath();
        ctx.fillStyle="#7ee8d0";
        ctx.fill();
        ctx.fillStyle="#7ee8d0";
        ctx.fillText("Buoyant Force ↑",275,95);
        ctx.strokeStyle="#ff6b6b";
        ctx.beginPath();
        ctx.moveTo(260,175);
        ctx.lineTo(260,215);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(260,215);
        ctx.lineTo(254,205);
        ctx.lineTo(266,205);
        ctx.closePath();
        ctx.fillStyle="#ff6b6b";
        ctx.fill();
        ctx.fillStyle="#ff6b6b";
        ctx.fillText("Weight ↓",275,210);
        ctx.fillStyle="#7ee8d0";
        ctx.font="14px sans-serif";
        ctx.fillText("Buoyant Force = Weight → FLOATS",130,265);
        info={title:"Floating Object",text:"A wooden block floats because the buoyant force (upward) equals the gravitational force/weight (downward). When these two forces are equal, the object floats on the surface of the liquid."};
      }else if(mode==="sink"){
        ctx.fillStyle="#ffcc6b";
        ctx.beginPath();
        ctx.arc(260,220,15,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle="#e8e8f0";
        ctx.font="12px sans-serif";
        ctx.fillText("Coin",250,250);
        ctx.strokeStyle="#7ee8d0";
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(260,205);
        ctx.lineTo(260,165);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(260,165);
        ctx.lineTo(254,175);
        ctx.lineTo(266,175);
        ctx.closePath();
        ctx.fillStyle="#7ee8d0";
        ctx.fill();
        ctx.fillStyle="#7ee8d0";
        ctx.fillText("Buoyant ↑ (small)",275,175);
        ctx.strokeStyle="#ff6b6b";
        ctx.lineWidth=4;
        ctx.beginPath();
        ctx.moveTo(260,235);
        ctx.lineTo(260,100);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(260,100);
        ctx.lineTo(252,115);
        ctx.lineTo(268,115);
        ctx.closePath();
        ctx.fillStyle="#ff6b6b";
        ctx.fill();
        ctx.fillStyle="#ff6b6b";
        ctx.font="16px sans-serif";
        ctx.fillText("Weight ↓ (large)",275,130);
        ctx.fillStyle="#ff6b6b";
        ctx.font="14px sans-serif";
        ctx.fillText("Weight > Buoyant Force → SINKS",120,65);
        info={title:"Sinking Object",text:"A coin sinks because its weight (gravitational force, downward) is greater than the buoyant force (upward). When the gravitational force is more than the buoyant force, the object sinks to the bottom."};
      }else if(mode==="archimedes"){
        ctx.fillStyle="rgba(92,184,255,0.15)";
        ctx.fillRect(150,120,240,150);
        ctx.fillStyle="#d4a76a";
        ctx.fillRect(220,160,80,50);
        ctx.fillStyle="#e8e8f0";
        ctx.font="12px sans-serif";
        ctx.fillText("Object",232,190);
        ctx.strokeStyle="#5cb8ff";
        ctx.lineWidth=2;
        ctx.setLineDash([4,4]);
        ctx.strokeRect(150,120,240,150);
        ctx.setLineDash([]);
        ctx.fillStyle="#7ee8d0";
        ctx.font="13px sans-serif";
        ctx.fillText("Water displaced",155,135);
        ctx.strokeStyle="#7ee8d0";
        ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(260,155);
        ctx.lineTo(260,100);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(260,100);
        ctx.lineTo(254,110);
        ctx.lineTo(266,110);
        ctx.closePath();
        ctx.fillStyle="#7ee8d0";
        ctx.fill();
        ctx.fillStyle="#7ee8d0";
        ctx.fillText("Upward Force = Weight of",270,95);
        ctx.fillText("Displaced Water",270,110);
        ctx.fillStyle="#ffcc6b";
        ctx.font="13px sans-serif";
        ctx.fillText("Archimedes' Principle",200,295);
        info={title:"Archimedes' Principle",text:"Archimedes, a Greek scientist, discovered that when an object is immersed in a liquid, it experiences an upward force equal to the weight of the liquid it displaces. If the weight of liquid displaced is less than the object's weight, it sinks. If equal, it floats."};
      }
      var db=document.getElementById("discovery-box");
      if(db){
        db.innerHTML='<div class="d-title">'+info.title+'</div>'+info.text;
      }
    }
    draw("float");
    var btns=document.querySelectorAll(".sim-btn");
    btns.forEach(function(btn){
      btn.addEventListener("click",function(){
        btns.forEach(function(b){b.classList.remove("active");});
        btn.classList.add("active");
        draw(btn.getAttribute("data-mode"));
      });
    });
  }
};

App.init();
</script>
</body>
