<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#1e40af">
<title>Aasha — Understanding Quadrilaterals (Interactive)</title>
<style>
:root{--brand:#1e40af;--bl:#3b82f6;--surface:#f8fafc;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--green:#10b981;--red:#ef4444;--gold:#f59e0b;--pi:#ec4899;--purple:#a855f7;--amb:#fef3c7}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--surface);color:var(--text);line-height:1.5;font-size:16px;overscroll-behavior:none;max-width:600px;margin:0 auto;min-height:100vh}
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:100}
.hdr-logo{width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0}
.hdr-name{font-size:.95rem;font-weight:800;color:var(--brand);line-height:1.2}
.hdr-hi{font-size:.72rem;color:var(--muted)}
.hdr-tag{font-size:.65rem;color:var(--gold);font-weight:600}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:62px;z-index:99}
.progress-track{flex:1;height:10px;background:var(--border);border-radius:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--purple));border-radius:10px;transition:width .4s;width:0}
.stat{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:700;padding:3px 7px;border-radius:16px;white-space:nowrap}
.stat.coins{color:var(--gold);background:var(--amb)}
.stat.xp{color:var(--purple);background:#ede9fe}
.stat.lvl{color:var(--brand);background:#dbeafe}
.profile-bar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:#fff;border-bottom:1px solid var(--border)}
.profile-avatar{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800}
.profile-name{font-size:.78rem;font-weight:600}
.profile-swap{margin-left:auto;padding:3px 8px;background:var(--border);border:none;border-radius:6px;font-size:.68rem;cursor:pointer}
.screen{padding:14px;min-height:400px;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
.intro-icon{font-size:3rem;margin-bottom:8px;text-align:center}
.intro-title{font-size:1.2rem;font-weight:800;text-align:center;margin-bottom:4px}
.intro-sub{color:var(--muted);font-size:.82rem;font-weight:600;text-align:center;margin-bottom:12px}
.instruction{text-align:center;font-size:.88rem;font-weight:700;color:var(--brand);margin:8px auto;padding:8px 14px;background:#dbeafe;border-radius:10px;max-width:400px}
.hint{font-size:.7rem;color:var(--muted);text-align:center;margin:6px 0}
.bt{font-size:1.05rem;line-height:2.6;color:var(--text);max-width:380px;margin:0 auto;text-align:left;font-weight:700}
.bts{font-size:.88rem;line-height:2.2;color:var(--text);max-width:360px;margin:0 auto;text-align:left;font-weight:600}
.wd{cursor:pointer;border-radius:3px;padding:0 1px;transition:background .15s;font-weight:700}
.wd:hover{background:#e0e7ff}
.cn{color:var(--brand);font-weight:800;cursor:pointer;border-bottom:2px dotted var(--bl);padding:0 1px}
.ch{color:var(--purple);font-size:.85em;font-weight:700}
.card{background:#fff;border:2px solid var(--border);border-radius:14px;padding:14px;max-width:400px;width:100%;margin:0 auto 8px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card-caption{text-align:center;font-size:.75rem;color:var(--muted);margin-top:6px;line-height:1.4}
.canvas-visual{display:block;margin:0 auto;border-radius:8px}
.game-card{background:#fff;border:2px solid var(--border);border-radius:14px;padding:14px;max-width:400px;width:100%;margin:0 auto;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.game-card canvas{display:block;margin:0 auto;cursor:crosshair;border-radius:8px;touch-action:none}
.we-card{background:#fff;border:2px solid var(--border);border-radius:14px;padding:14px;max-width:400px;width:100%;margin:0 auto;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.we-tag{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--brand);margin-bottom:6px}
.we-question{font-size:.92rem;font-weight:600;margin-bottom:10px}
.we-step{padding:10px 12px;background:#dbeafe;border-left:3px solid var(--brand);border-radius:0 8px 8px 0;margin-bottom:6px;animation:stepReveal .3s ease;font-size:.82rem}
.we-step.green{background:#d1fae5;border-left-color:var(--green)}
.we-step.amber{background:#fef3c7;border-left-color:var(--gold)}
.we-step.final{padding:10px;background:#d1fae5;border:2px solid var(--green);border-radius:10px;margin-top:6px;text-align:center;font-weight:700;color:#065f46}
.we-num{display:inline-block;width:20px;height:20px;background:var(--brand);color:#fff;border-radius:50%;text-align:center;font-size:.65rem;font-weight:700;line-height:20px;margin-right:6px}
.we-step.green .we-num{background:var(--green)}.we-step.amber .we-num{background:var(--gold)}
@keyframes stepReveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.quiz-opt{display:flex;align-items:flex-start;gap:10px;padding:12px;margin-bottom:7px;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all .15s;background:#fff}
.quiz-opt:hover{border-color:var(--bl)}
.quiz-opt.selected{border-color:var(--brand);background:#dbeafe}
.quiz-opt.correct{border-color:var(--green);background:#d1fae5}
.quiz-opt.wrong{border-color:var(--red);background:#fee2e2}
.quiz-radio{width:20px;height:20px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;margin-top:1px;transition:all .15s}
.quiz-opt.selected .quiz-radio{border-color:var(--brand);background:var(--brand)}
.quiz-opt.correct .quiz-radio{border-color:var(--green);background:var(--green)}
.quiz-opt.wrong .quiz-radio{border-color:var(--red);background:var(--red)}
.quiz-opt-text{flex:1;font-size:.82rem}
.feedback{padding:12px;border-radius:12px;margin:8px auto;max-width:400px;font-size:.85rem;text-align:center;line-height:1.4}
.feedback.ok{background:#d1fae5;border:1px solid #86efac;color:#065f46}
.feedback.no{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}
.misconception{background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:10px;margin:8px auto;max-width:400px;font-size:.78rem;color:#991b1b;line-height:1.4}
input[type=text]{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-size:1rem;margin-bottom:8px}
input[type=text]:focus{border-color:var(--brand);outline:none}
input[type=range]{width:100%;max-width:260px;accent-color:var(--brand);height:6px}
.angle-display{font-size:1.4rem;font-weight:800;text-align:center;margin:6px 0}
.angle-sum{font-size:1.8rem;font-weight:900;text-align:center;color:var(--brand);margin:6px 0}
.angle-sum.discover{color:var(--green);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.milestone-icon{font-size:3.5rem;margin-bottom:6px;animation:pop .5s ease}
.milestone-text{font-size:1.1rem;font-weight:700;text-align:center}
.milestone-reward{font-size:1.8rem;font-weight:800;color:var(--gold);margin:6px 0}
.milestone-next{font-size:.78rem;color:var(--muted);margin-top:10px}
.complete-icon{font-size:4rem;margin-bottom:8px}
.complete-title{font-size:1.3rem;font-weight:800;margin-bottom:6px}
.complete-coins{font-size:2.5rem;font-weight:800;color:var(--gold);margin:10px 0}
.star-row{display:flex;gap:4px;justify-content:center;margin:8px 0}
.star-row span{font-size:1.8rem}
.chip{padding:3px 8px;border-radius:20px;font-size:.65rem;font-weight:600}
.badge-toast{position:fixed;top:100px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:12px 20px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:95;text-align:center;animation:pop .4s ease}
.badge-toast-icon{font-size:2rem}.badge-toast-name{font-size:.8rem;font-weight:800;color:var(--gold)}.badge-toast-desc{font-size:.68rem;color:var(--muted)}
.bottom-bar{position:sticky;bottom:0;left:0;right:0;background:#fff;padding:10px 16px;box-shadow:0 -1px 3px rgba(0,0,0,.06);z-index:50}
.btn{width:100%;padding:13px;border:none;border-radius:13px;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:#1e3a8a}.btn-primary:disabled{background:#cbd5e1;cursor:not-allowed;color:#fff}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#059669}
.btn-amber{background:var(--gold);color:#fff}
.dd-label{font-size:.78rem;color:var(--muted);text-align:center;margin-bottom:6px;font-weight:600}
.dd-zone{min-height:60px;border:2px dashed var(--border);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;transition:all .2s;margin-bottom:8px}
.dd-zone.over{border-color:var(--green);background:#d1fae5}
.dd-zone.wrong{border-color:var(--red);background:#fee2e2}
.dd-item{padding:8px 14px;background:#f1f5f9;border:1px solid var(--border);border-radius:10px;cursor:grab;font-size:.85rem;font-weight:600;color:var(--text);transition:all .15s;user-select:none;touch-action:none}
.dd-item:hover{border-color:var(--bl);transform:scale(1.05)}
.dd-item.dragging{opacity:.5}
.dd-item.placed{background:#dbeafe;border-color:var(--brand)}
.shape-sort-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:400px;margin:0 auto}
dialog{border:none;border-radius:18px;padding:24px;max-width:300px;width:100%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.15);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.4);backdrop-filter:blur(2px)}
.prop-box{background:#f0fdf4;border-left:4px solid var(--green);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.78rem;margin:6px 0}
.formula-box{background:#eff6ff;border:2px solid var(--bl);border-radius:10px;padding:10px;margin:8px 0;text-align:center}
.formula-box .f-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;font-weight:600}
.formula-box .f-expr{font-size:1.1rem;font-weight:800;color:var(--brand);margin:4px 0}
.lle-sentence{background:#fff;border:2px solid var(--border);border-radius:12px;padding:14px;margin:8px 0}
.lle-label{font-size:.65rem;font-weight:700;color:var(--bl);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.discovery-box{background:linear-gradient(135deg,#dbeafe,#ede9fe);border:2px solid var(--bl);border-radius:14px;padding:14px;margin:8px 0;text-align:center}
.discovery-box .d-title{font-size:.85rem;font-weight:800;color:var(--brand);margin-bottom:4px}
.discovery-box .d-text{font-size:.78rem;color:var(--text)}
.interactive-hint{font-size:.72rem;color:var(--purple);text-align:center;font-weight:600;margin:4px 0;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.tf-btn{display:flex;gap:10px;max-width:380px;margin:0 auto 8px}
.tf-opt{flex:1;padding:14px;border:2px solid var(--border);border-radius:12px;cursor:pointer;text-align:center;font-weight:700;font-size:1rem;transition:all .15s;background:#fff}
.tf-opt:hover{border-color:var(--bl)}
.tf-opt.sel-true{border-color:var(--green);background:#d1fae5;color:#065f46}
.tf-opt.sel-false{border-color:var(--red);background:#fee2e2;color:#991b1b}
.fb-input{width:100%;max-width:380px;margin:0 auto 8px;display:block;padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-size:1rem}
.fb-input:focus{border-color:var(--brand);outline:none}
.fb-sentence{font-size:1.05rem;line-height:2.2;max-width:380px;margin:0 auto 10px;text-align:left;font-weight:600}
.fb-blank{display:inline-block;min-width:60px;padding:2px 8px;margin:0 2px;border-bottom:3px solid var(--brand);text-align:center;font-weight:800;color:var(--brand)}
.diff-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-left:6px}
.diff-easy{background:#d1fae5;color:#065f46}
.diff-medium{background:#fef3c7;color:#92400e}
.diff-hard{background:#fee2e2;color:#991b1b}

.btn-back{background:#f1f5f9;color:#475569;border:2px solid #cbd5e1;padding:10px 16px;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .15s;flex-shrink:0}
.btn-back:active{transform:scale(.95);background:#e2e8f0}
.btn-back:disabled{opacity:.3;cursor:not-allowed}
.btn-restart{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border:none;padding:12px 24px;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;transition:all .15s;margin-top:12px}
.btn-restart:active{transform:scale(.95)}
.bottom-bar{display:flex;gap:8px;align-items:center;justify-content:center}
.bottom-bar .btn-primary{flex:1;max-width:300px}
</style>
</head>

function rt(text,sm){
  var html=text;var keys=Object.keys(CONN).sort(function(a,b){return b.length-a.length});
  var connCount=0,result="",i=0;
  while(i<html.length){
    var ch=html[i];
    if(ch==="."||ch==="!"||ch==="?"){connCount=0;result+=ch;i++;continue;}
    if(ch==="<"){var ci=html.indexOf(">",i);if(ci>=0){result+=html.substring(i,ci+1);i=ci+1;continue;}}
    var matched=false;
    if(i===0||!/[a-zA-Z]/.test(html[i-1])){
      for(var k=0;k<keys.length;k++){
        var c=keys[k];var sub=html.substring(i,i+c.length);
        if(sub.toLowerCase()===c.toLowerCase()){
          var ai=i+c.length;if(ai<html.length&&/[a-zA-Z]/.test(html[ai]))continue;
          var hi=CONN[c];connCount++;
          if(connCount<=3){result+='<span class="cn" data-w="'+sub+'" data-h="'+hi+'">'+sub+' <span class="ch">('+hi+')</span></span>';}
          else{result+='<span class="wd" data-w="'+sub.toLowerCase()+'" data-h="'+hi+'">'+sub+'</span>';}
          i+=c.length;matched=true;break;
        }
      }
    }
    if(matched)continue;
    if(/[a-zA-Z]/.test(ch)){
      var ws=i;while(i<html.length&&/[a-zA-Z]/.test(html[i]))i++;
      var word=html.substring(ws,i);var cw=word.toLowerCase();
      if(!cw){result+=word;continue;}
      var hi2=WM[cw];
      if(hi2)result+='<span class="wd" data-w="'+cw+'" data-h="'+hi2+'">'+word+'</span>';
      else result+='<span class="wd" data-w="'+cw+'" data-h="">'+word+'</span>';
    }else{result+=ch;i++;}
  }
  return result;
}

  var els=document.querySelectorAll(sels);

    var el=els[i];if(el.querySelector(".wd")||el.querySelector(".cn"))continue;
    if(el.tagName==="BUTTON"||el.tagName==="INPUT")continue;

// INTERACTIVE CANVAS: Draggable Quadrilateral
// Kids DRAG vertices, angles update in real-time, discover sum=360
// ════════════════════════════════════════════════════════════════
function setupDragQuad(canvasId, verts, showSum, showSides, discoveryText, cb){
  var canvas=document.getElementById(canvasId);if(!canvas)return;
  var baseId=canvasId.replace("_canvas","");
  var ctx=canvas.getContext("2d");
  var dragging=-1;
  var sumEl=document.getElementById(baseId+"_sum");
  var discEl=document.getElementById(baseId+"_disc");
  var dragCount=0;
  function signedArea(v){var a=0;for(var i=0;i<v.length;i++){var j=(i+1)%v.length;a+=v[i].x*v[j].y-v[j].x*v[i].y;}return a/2;}
  function angleAt(v,prev,next,wind){
    var e1x=prev.x-v.x,e1y=prev.y-v.y;
    var e2x=next.x-v.x,e2y=next.y-v.y;
    var dot=e1x*e2x+e1y*e2y;
    var cross=e1x*e2y-e1y*e2x;
    var u=Math.atan2(Math.abs(cross),dot)*180/Math.PI;
    var convex=(wind>0)?(cross<0):(cross>0);
    return Math.round(convex?u:(360-u));
  }
  function draw(){
    var w=canvas.width,h=canvas.height;
    ctx.clearRect(0,0,w,h);
    // Draw quadrilateral
    ctx.fillStyle="rgba(59,130,246,0.12)";
    ctx.strokeStyle="#1e40af";ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(verts[0].x,verts[0].y);
    for(var i=1;i<4;i++)ctx.lineTo(verts[i].x,verts[i].y);
    ctx.closePath();ctx.fill();ctx.stroke();
    // Show side lengths (when enabled)
    if(showSides){
      ctx.fillStyle="#1e40af";ctx.font="bold 11px sans-serif";ctx.textAlign="center";
      for(var i=0;i<4;i++){
        var va=verts[i],vb=verts[(i+1)%4];
        var mx=(va.x+vb.x)/2,my=(va.y+vb.y)/2;
        var len=Math.round(Math.sqrt((vb.x-va.x)*(vb.x-va.x)+(vb.y-va.y)*(vb.y-va.y)));
        ctx.fillText(len,mx,my-4);
      }
    }
    // Calculate angles
    var wind=signedArea(verts);
    var angles=[];
    for(var i=0;i<4;i++){
      var p1=verts[(i+3)%4],p2=verts[i],p3=verts[(i+1)%4];
      angles.push(angleAt(p2,p1,p3,wind));
    }
    var sum=angles[0]+angles[1]+angles[2]+angles[3];
    // Draw angle labels
    for(var i=0;i<4;i++){
      var p=verts[i];
      ctx.fillStyle="#ef4444";ctx.font="bold 13px sans-serif";ctx.textAlign="center";
      var ox=(verts[(i+3)%4].x+verts[(i+1)%4].x)/2;
      var oy=(verts[(i+3)%4].y+verts[(i+1)%4].y)/2;
      var f=(angles[i]>180)?-0.25:0.3;
      var dx=p.x+(p.x-ox)*f,dy=p.y+(p.y-oy)*f;
      ctx.fillText(angles[i]+"\u00b0",dx,dy);
    }
    // Draw vertices
    for(var i=0;i<4;i++){
      ctx.fillStyle=dragging===i?"#ef4444":"#1e40af";
      ctx.beginPath();ctx.arc(verts[i].x,verts[i].y,dragging===i?12:9,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#fff";ctx.font="bold 10px sans-serif";ctx.textAlign="center";
      ctx.fillText(String.fromCharCode(65+i),verts[i].x,verts[i].y+3.5);
    }
    // Show sum
    if(showSum&&sumEl){
      sumEl.innerHTML="A: "+angles[0]+"\u00b0 + B: "+angles[1]+"\u00b0 + C: "+angles[2]+"\u00b0 + D: "+angles[3]+"\u00b0 = <span style='color:#10b981'>"+sum+"\u00b0</span>";
      if(sum===360){sumEl.classList.add("discover");}else{sumEl.classList.remove("discover");}
    }
    // Show discovery after dragging
    if(discEl&&dragCount>=2){
      discEl.style.display="block";
      if(cb&&dragCount===2){cb();dragCount=3;}
    }
  }
  function getPos(e){
    var rect=canvas.getBoundingClientRect();var scale=canvas.width/rect.width;
    var t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-rect.left)*scale,y:(t.clientY-rect.top)*scale};
  }
  function down(e){
    e.preventDefault();var pos=getPos(e);
    for(var i=0;i<4;i++){
      var dx=pos.x-verts[i].x,dy=pos.y-verts[i].y;
      if(Math.sqrt(dx*dx+dy*dy)<22){dragging=i;dragCount++;draw();playTone(300,0.05,"square",0.08);return;}
    }
  }
  function move(e){
    if(dragging<0)return;e.preventDefault();
    var pos=getPos(e);
    pos.x=Math.max(30,Math.min(canvas.width-30,pos.x));
    pos.y=Math.max(30,Math.min(canvas.height-30,pos.y));
    verts[dragging].x=pos.x;verts[dragging].y=pos.y;
    draw();
  }
  function up(){if(dragging>=0){playTone(500,0.08,"sine",0.1);}dragging=-1;draw();}
  canvas.addEventListener("mousedown",down);
  canvas.addEventListener("touchstart",down,{passive:false});
  document.addEventListener("mousemove",move);
  document.addEventListener("touchmove",move,{passive:false});
  document.addEventListener("mouseup",up);
  document.addEventListener("touchend",up);
  draw();
}

// ═════ INTERACTIVE CANVAS: Parallelogram Angle Slider ═════
function setupParaSlider(canvasId, initialAngle, discoveryText, cb){
  var canvas=document.getElementById(canvasId);if(!canvas)return;
  var baseId=canvasId.replace("_canvas","");
  var ctx=canvas.getContext("2d");
  var angleA=initialAngle||60;
  var sumEl=document.getElementById(baseId+"_sum");
  var discEl=document.getElementById(baseId+"_disc");
  var moved=false;
  function draw(){
    var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
    var cx=w/2,cy=h/2;
    var slant=Math.tan((90-angleA)*Math.PI/180)*40;
    if(Math.abs(slant)>80)slant=slant>0?80:-80;
    var tl={x:cx-70,y:cy-30},tr={x:cx+70,y:cy-30};
    var bl={x:cx-70-slant,y:cy+30},br={x:cx+70-slant,y:cy+30};
    ctx.fillStyle="rgba(59,130,246,0.12)";
    ctx.strokeStyle="#1e40af";ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(tl.x,tl.y);ctx.lineTo(tr.x,tr.y);ctx.lineTo(br.x,br.y);ctx.lineTo(bl.x,bl.y);ctx.closePath();
    ctx.fill();ctx.stroke();
    var angleB=180-angleA;
    var angles=[angleA,angleB,angleA,angleB];
    var pts=[tl,tr,br,bl];
    var labels=["A","B","C","D"];
    for(var i=0;i<4;i++){
      ctx.fillStyle="#ef4444";ctx.font="bold 13px sans-serif";ctx.textAlign="center";
      var ox=(pts[(i+3)%4].x+pts[(i+1)%4].x)/2;
      var oy=(pts[(i+3)%4].y+pts[(i+1)%4].y)/2;
      var dx=pts[i].x+(pts[i].x-ox)*0.4,dy=pts[i].y+(pts[i].y-oy)*0.4;
      ctx.fillText(angles[i]+"\u00b0",dx,dy);
      ctx.fillStyle="#1e40af";ctx.font="bold 11px sans-serif";
      ctx.fillText(labels[i],pts[i].x-12,pts[i].y-8);
    }
    if(sumEl){
      sumEl.innerHTML="A = C = "+angleA+"\u00b0, B = D = "+angleB+"\u00b0, A + B = "+(angleA+angleB)+"\u00b0";
    }
    if(discEl&&moved){
      discEl.style.display="block";
      if(cb&&!cb._called){cb();cb._called=true;}
    }
  }
  var slider=document.getElementById(baseId+"_slider");
  if(slider){
    slider.addEventListener("input",function(){angleA=parseInt(this.value);moved=true;draw();playTone(200+angleA*2,0.03,"sine",0.05);});
  }
  draw();
}

// ═════ INTERACTIVE CANVAS: Diagonal Explorer ═════
function setupDiagonalExplorer(canvasId, shapeType, discoveryText, cb){
  var canvas=document.getElementById(canvasId);if(!canvas)return;
  var baseId=canvasId.replace("_canvas","");
  var ctx=canvas.getContext("2d");
  var showDiag=false;
  var discEl=document.getElementById(baseId+"_disc");
  function draw(){
    var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
    var cx=w/2,cy=h/2;
    var pts=[];
    if(shapeType==="rectangle"){
      pts=[{x:cx-70,y:cy-40},{x:cx+70,y:cy-40},{x:cx+70,y:cy+40},{x:cx-70,y:cy+40}];
    }else if(shapeType==="rhombus"){
      pts=[{x:cx,y:cy-60},{x:cx+80,y:cy},{x:cx,y:cy+60},{x:cx-80,y:cy}];
    }else if(shapeType==="square"){
      pts=[{x:cx-50,y:cy-50},{x:cx+50,y:cy-50},{x:cx+50,y:cy+50},{x:cx-50,y:cy+50}];
    }else{
      pts=[{x:cx-70,y:cy-40},{x:cx+70,y:cy-40},{x:cx+70,y:cy+40},{x:cx-70,y:cy+40}];
    }
    ctx.fillStyle="rgba(59,130,246,0.12)";ctx.strokeStyle="#1e40af";ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
    for(var i=1;i<4;i++)ctx.lineTo(pts[i].x,pts[i].y);
    ctx.closePath();ctx.fill();ctx.stroke();
    var labels=["A","B","C","D"];
    for(var i=0;i<4;i++){
      ctx.fillStyle="#1e40af";ctx.font="bold 12px sans-serif";ctx.textAlign="center";
      var dx=pts[i].x>cx?pts[i].x+12:pts[i].x-12;
      var dy=pts[i].y>cy?pts[i].y+15:pts[i].y-8;
      ctx.fillText(labels[i],dx,dy);
    }
    if(showDiag){
      ctx.strokeStyle="#a855f7";ctx.lineWidth=2;ctx.setLineDash([5,3]);
      ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);ctx.lineTo(pts[2].x,pts[2].y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(pts[1].x,pts[1].y);ctx.lineTo(pts[3].x,pts[3].y);ctx.stroke();
      ctx.setLineDash([]);
      var mx=(pts[0].x+pts[2].x)/2,my=(pts[0].y+pts[2].y)/2;
      ctx.fillStyle="#f59e0b";ctx.beginPath();ctx.arc(mx,my,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#a855f7";ctx.font="bold 11px sans-serif";
      ctx.fillText("O",mx+10,my-5);
      if(discEl){discEl.style.display="block";if(cb&&!cb._called){cb();cb._called=true;}}
    }
  }
  canvas.addEventListener("click",function(){showDiag=!showDiag;draw();playTone(400,0.1,"sine",0.1);});
  canvas.addEventListener("touchstart",function(e){e.preventDefault();showDiag=!showDiag;draw();playTone(400,0.1,"sine",0.1);},{passive:false});
  draw();
}

body:"A parallelogram is a quadrilateral where both pairs of opposite sides are parallel. Key properties: opposite sides are equal, opposite angles are equal, adjacent angles are supplementary (add to 180 degrees), and diagonals bisect each other."},

{icon:"\u{1f4d0}",color:"#ef4444",title:"Angle Sum of Polygons",steps:[

steps:[

{n:2,text:"For n=12: Sum = (12-2) x 180 = 10 x 180.",type:"info"},
{n:3,text:"10 x 180 = 1800 degrees.",type:"amber"},
{n:4,text:"The sum of interior angles of a dodecagon is 1800 degrees.",type:"final"}
]},
{t:"fillblank",diff:"easy",q:{prompt:"Fill in the blank:",sentence:"The sum of interior angles of a polygon with n sides is (n - ___) x 180 degrees.",answer:"2",exp:"The formula is (n-2) x 180. The number 2 comes from the fact that any polygon can be divided into n-2 triangles."}},
{t:"fillblank",diff:"medium",q:{prompt:"Find the sum of interior angles of a hexagon (6 sides):",sentence:"Sum = (6 - 2) x 180 = ___ degrees",answer:"720",unit:" degrees",exp:"(6-2) x 180 = 4 x 180 = 720 degrees."}},

body:"A quadrilateral has 10 elements: 4 sides, 4 angles, and 2 diagonals. To construct a unique quadrilateral, you need at least 5 independent measurements (elements). With 4 or fewer, there can be multiple possible quadrilaterals."},

// ─── NODE 13: Mid-Point Theorem ───
{icon:"\u2702\u{fe0f}",color:"#10b981",title:"Mid-Point Theorem",steps:[
{t:"intro",icon:"\u2702\u{fe0f}",title:"The Mid-Point Theorem",sub:"A powerful theorem about midpoints in triangles",
body:"The Mid-Point Theorem states: The line segment joining the midpoints of two sides of a triangle is parallel to the third side and equal to half of it. If D and E are midpoints of sides AB and AC of triangle ABC, then DE is parallel to BC and DE = BC/2. The converse is also true."},
{t:"we",tag:"Worked Example",question:"In triangle ABC, D and E are midpoints of AB and AC. If BC = 12 cm, find DE.",
steps:[
{n:1,text:"By the Mid-Point Theorem, DE is parallel to BC and DE = BC/2.",type:"info"},
{n:2,text:"Given BC = 12 cm, so DE = 12/2 = 6 cm.",type:"amber"},
{n:3,text:"DE = 6 cm. The segment joining midpoints equals half the third side.",type:"final"}
]},
{t:"fillblank",diff:"easy",q:{prompt:"In triangle ABC, D and E are midpoints of AB and AC. If BC = 20 cm, find DE.",sentence:"DE = BC / 2 = 20 / 2 = ___ cm",answer:"10",unit:" cm",exp:"By the Mid-Point Theorem, DE = BC/2 = 20/2 = 10 cm."}},
{t:"fillblank",diff:"medium",q:{prompt:"In triangle PQR, M and N are midpoints of PQ and PR. If MN = 7 cm, find QR.",sentence:"QR = 2 x MN = 2 x 7 = ___ cm",answer:"14",unit:" cm",exp:"By the converse of the Mid-Point Theorem, QR = 2 x MN = 2 x 7 = 14 cm."}},
{t:"truefalse",diff:"medium",q:{q:"The line joining the midpoints of two sides of a triangle is parallel to the third side.",answer:"true",exp:"Correct! This is exactly the Mid-Point Theorem."}},
{t:"truefalse",diff:"hard",q:{q:"The line joining the midpoints of two sides of a triangle is equal in length to the third side.",answer:"false",exp:"Wrong! The line joining midpoints is HALF the third side, not equal to it. DE = BC/2."}},
{t:"quiz",q:{q:"In triangle ABC, D, E, and F are midpoints of AB, BC, and AC. What is true about triangle DEF?",opts:[
{t:"It has area equal to ABC",c:false,m:"DEF has area 1/4 of ABC, not equal to it."},
{t:"It has area 1/4 of ABC",c:true,m:"Correct! The medial triangle DEF divides ABC into 4 congruent triangles, each with area 1/4 of ABC."},
{t:"It is a parallelogram",c:false,m:"DEF is a triangle, not a parallelogram."},
{t:"It is a rectangle",c:false,m:"DEF is a triangle, not a rectangle."}
]}},
{t:"solve",tag:"Solve Step by Step",question:"In triangle ABC, D and E are midpoints of AB and AC. The perimeter of triangle ADE is 15 cm. Find the perimeter of triangle ABC.",
steps:[
{type:"mcq",prompt:"If D and E are midpoints, what is the ratio of triangle ADE sides to triangle ABC sides?",opts:[
{t:"1:3",c:false,m:"The sides are not in ratio 1:3. Since D and E are midpoints, each side of ADE is half of ABC."},
{t:"1:2",c:true,m:"Correct! Each side of triangle ADE is half the corresponding side of triangle ABC."},
{t:"2:3",c:false,m:"The ratio is 1:2, not 2:3. Each side of ADE is half of ABC."},
{t:"1:1",c:false,m:"The sides are not equal. Each side of ADE is half of ABC."}
]},
{type:"input",prompt:"If each side of ADE is half of ABC, then perimeter of ADE = ___ x perimeter of ABC.",answer:"0.5",m:"Each side of ADE is half of ABC, so the perimeter ratio is 1/2 or 0.5."},
{type:"input",prompt:"If perimeter of ADE = 15, then perimeter of ABC = 15 / 0.5 = ?",answer:"30",m:"Perimeter of ABC = 15 / 0.5 = 30 cm. The perimeter of ABC is twice the perimeter of ADE."}
]},
{t:"progress",text:"You mastered the Mid-Point Theorem!",tokens:20,xp:25,next:"Properties Quick Fire"}
]},

{t:"we",tag:"Q11 Solution",question:"Five angles of a hexagon are 150°, 95°, 80°, 135° & 125°. Find the sixth angle.",steps:[
{text:"Step 1: Sum of interior angles of a hexagon (6 sides) = (n-2)×180 = (6-2)×180 = 720°.",type:""},
{text:"Step 2: Sum of five given angles = 150+95+80+135+125 = 585°.",type:""},
{text:"Step 3: Sixth angle = 720 - 585 = 135°.",type:""},
{text:"Answer: The sixth angle = 135°",type:"final"}]},
{t:"we",tag:"Q12 Solution",question:"How many diagonals are there in a hexagon?",steps:[
{text:"Step 1: Formula for diagonals = n(n-3)/2, where n = number of sides.",type:""},

{text:"Step 3: Diagonals = 6×(6-3)/2 = 6×3/2 = 18/2 = 9.",type:""},
{text:"Answer: A hexagon has 9 diagonals",type:"final"}]},
{t:"we",tag:"Q13 Solution",question:"Find the measure of each interior angle of a regular pentagon.",steps:[

{text:"Step 3: Each angle = 540/5 = 108°.",type:""},
{text:"Answer: Each interior angle = 108°",type:"final"}]},
{t:"we",tag:"Q14 Solution",question:"One angle of a parallelogram is 60°. Find its opposite angle and adjacent angle.",steps:[
{text:"Step 1: In a parallelogram, opposite angles are equal.",type:""},
{text:"Step 2: Opposite angle = 60°.",type:""},
{text:"Step 3: Adjacent angles are supplementary (sum = 180°).",type:""},
{text:"Step 4: Adjacent angle = 180 - 60 = 120°.",type:""},
{text:"Answer: Opposite = 60°, Adjacent = 120°",type:"final"}]},
// Section C: Multi-step problems with WE
{t:"we",tag:"Q16 Solution",question:"An exterior angle and interior angle of a regular polygon are in ratio 2:7. Find the number of sides.",steps:[
{text:"Step 1: Let exterior = 2x, interior = 7x. We know exterior + interior = 180°.",type:""},
{text:"Step 2: 2x + 7x = 180° → 9x = 180° → x = 20°.",type:""},
{text:"Step 3: Exterior angle = 2×20 = 40°.",type:""},
{text:"Step 4: Number of sides = 360/exterior = 360/40 = 9.",type:""},
{text:"Answer: The polygon has 9 sides (nonagon)",type:"final"}]},
{t:"we",tag:"Q19 Solution",question:"Four angles of a quadrilateral are in the ratio 3:4:5:6. Find its angles.",steps:[
{text:"Step 1: Let the angles be 3x, 4x, 5x, 6x.",type:""},
{text:"Step 2: Sum of angles in a quadrilateral = 360°.",type:""},
{text:"Step 3: 3x + 4x + 5x + 6x = 360 → 18x = 360 → x = 20.",type:""},
{text:"Step 4: Angles = 60°, 80°, 100°, 120°.",type:""},
{text:"Answer: Angles are 60°, 80°, 100°, 120°",type:"final"}]},
{t:"we",tag:"Q21 Solution",question:"ABCD is a rectangle. Diagonals meet at O. OA = (2x+4), OD = (3x+1). Find x and BD.",steps:[
{text:"Step 1: In a rectangle, diagonals are equal and bisect each other.",type:""},
{text:"Step 2: Therefore OA = OD → 2x+4 = 3x+1.",type:""},
{text:"Step 3: 4-1 = 3x-2x → x = 3.",type:""},
{text:"Step 4: OD = 3(3)+1 = 10. BD = 2×OD = 2×10 = 20.",type:""},
{text:"Answer: x = 3, BD = 20",type:"final"}]},
// Section D: Application problems with WE
{t:"we",tag:"Q23 Solution",question:"Two adjacent angles of a parallelogram are (3x-4)° and (3x+10)°. Find all angles.",steps:[
{text:"Step 1: Adjacent angles of a parallelogram are supplementary.",type:""},
{text:"Step 2: (3x-4) + (3x+10) = 180 → 6x + 6 = 180.",type:""},
{text:"Step 3: 6x = 174 → x = 29.",type:""},
{text:"Step 4: Angles: 3(29)-4 = 83° and 3(29)+10 = 97°.",type:""},
{text:"Step 5: Opposite angles are equal, so all four angles are 83°, 97°, 83°, 97°.",type:""},
{text:"Answer: Angles are 83°, 97°, 83°, 97°",type:"final"}]},
{t:"we",tag:"Q24 Solution",question:"Three angles of a quadrilateral are in ratio 4:6:3. Fourth angle is 100°. Find the three angles.",steps:[
{text:"Step 1: Let the three angles be 4x, 6x, 3x.",type:""},
{text:"Step 2: Sum = 4x + 6x + 3x + 100 = 360.",type:""},
{text:"Step 3: 13x = 260 → x = 20.",type:""},
{text:"Step 4: Angles = 4(20)=80°, 6(20)=120°, 3(20)=60°.",type:""},
{text:"Answer: Angles are 80°, 120°, 60° (and 100°)",type:"final"}]},
{t:"we",tag:"Q25 Solution",question:"One side of a parallelogram is 4.8 cm. Other side is 1.5 times this side. Find perimeter.",steps:[
{text:"Step 1: Side 1 = 4.8 cm. Side 2 = 1.5 × 4.8 = 7.2 cm.",type:""},
{text:"Step 2: Perimeter = 2 × (Side 1 + Side 2).",type:""},
{text:"Step 3: Perimeter = 2 × (4.8 + 7.2) = 2 × 12 = 24 cm.",type:""},
{text:"Answer: Perimeter = 24 cm",type:"final"}]},
// Section E: Advanced
{t:"we",tag:"Q26 Solution",question:"Sum of two angles of a quadrilateral is 160°. Other two are in ratio 2:3. Find all angles.",steps:[
{text:"Step 1: Remaining angles sum = 360 - 160 = 200°.",type:""},
{text:"Step 2: Let the two angles be 2x and 3x.",type:""},
{text:"Step 3: 2x + 3x = 200 → 5x = 200 → x = 40.",type:""},
{text:"Step 4: Angles = 2(40) = 80° and 3(40) = 120°.",type:""},
{text:"Answer: The four angles are 160° (split), 80°, 120°",type:"final"}]},
{t:"we",tag:"Q27 Solution",question:"Diagonal of a rectangle is 5 cm. One side is 3 cm. Find perimeter.",steps:[
{text:"Step 1: In a rectangle, diagonal² = length² + breadth² (Pythagoras).",type:""},
{text:"Step 2: 5² = 3² + b² → 25 = 9 + b² → b² = 16.",type:""},
{text:"Step 3: b = 4 cm.",type:""},
{text:"Step 4: Perimeter = 2(3 + 4) = 2 × 7 = 14 cm.",type:""},
{text:"Answer: Perimeter = 14 cm",type:"final"}]},
{t:"we",tag:"Q29 Solution",question:"Diagonals of a rhombus are 6 cm and 8 cm. Find side length and perimeter.",steps:[
{text:"Step 1: Diagonals of a rhombus bisect each other at right angles.",type:""},
{text:"Step 2: Half-diagonals = 3 cm and 4 cm.",type:""},
{text:"Step 3: Using Pythagoras: side² = 3² + 4² = 9 + 16 = 25.",type:""},
{text:"Step 4: Side = 5 cm. Perimeter = 4 × 5 = 20 cm.",type:""},
{text:"Answer: Side = 5 cm, Perimeter = 20 cm",type:"final"}]},

{t:"we",tag:"HOTS Q6 Solution",question:"ABCD is a square and CDE is an equilateral triangle. Find ∠BCE and ∠CBE.",steps:[

var App={
  nIdx:0,sIdx:0,xp:0,coins:0,streak:0,level:1,
  weStepIdx:0,solveStepIdx:0,solveAnswered:false,selOpt:null,answered:false,
  retryTimer:null,conceptsMastered:{},

  init:function(){
    loadProfile();
    this.loadProgress();
    var self=this;
    document.getElementById("continueBtn").addEventListener("click",function(){self.next();});
    document.getElementById("pSwap").addEventListener("click",function(){switchProfile();});
    document.getElementById("dlgClose").addEventListener("click",function(){var d=document.getElementById("wordDialog");if(d.open)d.close();});
    document.getElementById("luClose").addEventListener("click",function(){var d=document.getElementById("levelUpDialog");if(d.open)d.close();});
    this.render();
  },

  save:function(){
    try{
      localStorage.setItem("aasha_quad_"+currentProfile,JSON.stringify({
        nIdx:this.nIdx,sIdx:this.sIdx,xp:this.xp,coins:this.coins,level:this.level,
        streak:this.streak,conceptsMastered:this.conceptsMastered,badges:earnedBadges
      }));
    }catch(e){}
  },

  loadProgress:function(){
    try{
      var d=JSON.parse(localStorage.getItem("aasha_quad_"+currentProfile));
      if(d){
        this.nIdx=d.nIdx||0;this.sIdx=d.sIdx||0;this.xp=d.xp||0;
        this.coins=d.coins||0;this.level=d.level||1;this.streak=d.streak||0;
        this.conceptsMastered=d.conceptsMastered||{};earnedBadges=d.badges||{};
      }
    }catch(e){}
  },

  updateStats:function(){
    document.getElementById("statLvl").textContent="Lv "+this.level;
    document.getElementById("statCoins").textContent=this.coins;
    document.getElementById("statXp").textContent=this.xp;
    var totalSteps=0;for(var i=0;i<NODES.length;i++)totalSteps+=NODES[i].steps.length;
    var doneSteps=0;
    for(var i=0;i<this.nIdx;i++)doneSteps+=NODES[i].steps.length;
    doneSteps+=this.sIdx;
    var pct=Math.round((doneSteps/totalSteps)*100);
    document.getElementById("progressFill").style.width=pct+"%";
  },

  checkLevelUp:function(){
    var newLevel=1;
    for(var i=LEVELS.length-1;i>=0;i--){
      if(this.xp>=LEVELS[i].xp){newLevel=i+1;break;}
    }
    if(newLevel>this.level){
      this.level=newLevel;
      var lv=LEVELS[newLevel-1];
      var dlg=document.getElementById("levelUpDialog");
      document.getElementById("luIcon").textContent=lv.ic;
      document.getElementById("luTitle").textContent="Level "+newLevel+": "+lv.name+"!";
      document.getElementById("luSub").textContent="You earned "+this.xp+" XP total!";
      if(!dlg.open)dlg.showModal();
      playTone(523,0.15,"sine",0.15);
      setTimeout(function(){playTone(659,0.15,"sine",0.15);},150);
      setTimeout(function(){playTone(784,0.2,"sine",0.15);},300);
    }
  },

  checkBadges:function(){
    var masteredCount=Object.keys(this.conceptsMastered).length;
    if(masteredCount>=1&&!earnedBadges["first"]){earnedBadges["first"]=true;showBadge(BADGES[0]);}
    if(this.conceptsMastered["angleSum1"]&&!earnedBadges["angles"]){earnedBadges["angles"]=true;showBadge(BADGES[1]);}
    if(this.conceptsMastered["para1"]&&!earnedBadges["para"]){earnedBadges["para"]=true;showBadge(BADGES[2]);}

  render:function(){
    var node=NODES[this.nIdx],step=node.steps[this.sIdx];

    var bb=document.getElementById("bottomBar");

    bb.style.display="block";

      case "quiz":this.renderQuiz(step,cb);break;

  showWE:function(step,cb){
    var steps=step.steps;
    var shown=this.weStepIdx;
    if(shown>=steps.length){
      // All steps shown — final state
      cb.textContent="Continue →";
      cb.className="btn btn-green";
      cb.disabled=false;
      return;
    }
    // Show steps 0..shown (inclusive)
    var html='<div class="we-card">'+
      '<div class="we-tag">'+step.tag+'</div>'+
      '<div class="we-question">'+step.question+'</div>';
    for(var i=0;i<=shown&&i<steps.length;i++){
      var s=steps[i];
      var cls=s.type==="final"?"final":(s.type==="amber"?"amber":"");
      html+='<div class="we-step '+cls+'">'+
        '<span class="we-num">'+s.n+'</span>'+s.text+
        '</div>';
    }
    html+='</div>';
    document.getElementById("screen").innerHTML=html;
    if(shown<steps.length-1){
      cb.textContent="Next Step →";
      cb.className="btn btn-primary";
      cb.disabled=false;
    }else{
      cb.textContent="Continue →";
      cb.className="btn btn-green";
      cb.disabled=false;
      playTone(523,0.12,"sine",0.12);
      setTimeout(function(){playTone(659,0.12,"sine",0.12);},120);
    }
  },

  renderSolve:function(step,cb){
    this.solveStepIdx=0;this.solveAnswered=false;this.selOpt=null;
    TEAS.track({type:"solve",node:this.nIdx});
    this.showSolveStep(step,cb);

  showSolveStep:function(step,cb){
    var sl=step.steps;
    if(this.solveStepIdx>=sl.length){
      // All solve steps done!
      cb.textContent="Continue →";
      cb.className="btn btn-green";
      cb.disabled=false;
      return;
    }
    var sStep=sl[this.solveStepIdx];
    var promptHtml='<div class="we-card">'+
      '<div class="we-tag">'+step.tag+'</div>'+
      '<div class="we-question">'+step.question+'</div>'+
      '<div style="font-size:.82rem;font-weight:600;margin:8px 0;color:var(--text)">'+sStep.prompt+'</div>';
    var inputHtml="";
    if(sStep.type==="mcq"){
      var optsHtml="";
      for(var i=0;i<sStep.opts.length;i++){
        optsHtml+='<div class="quiz-opt" data-solve-idx="'+i+'" id="so'+i+'">'+
          '<div class="quiz-radio"></div>'+
          '<div class="quiz-opt-text">'+sStep.opts[i].t+'</div></div>';
      }
      inputHtml='<div style="max-width:380px;margin:0 auto">'+optsHtml+'</div>';
    }else if(sStep.type==="input"){
      inputHtml='<div style="max-width:380px;margin:0 auto"><input type="text" id="slInput" placeholder="Type your answer..." autocomplete="off"></div>';
    }
    document.getElementById("screen").innerHTML=promptHtml+inputHtml+
      '<div id="slFb"></div>'+
      '<div style="max-width:380px;margin:0 auto;font-size:.72rem;color:var(--muted);margin-top:6px">Step '+(this.solveStepIdx+1)+' of '+sl.length+'</div>';
    // Set up option selection
    if(sStep.type==="mcq"){
      var self=this;
      var optEls=document.querySelectorAll("[data-solve-idx]");
      for(var j=0;j<optEls.length;j++){
        optEls[j].addEventListener("click",function(){
          if(self.solveAnswered)return;
          var idx=parseInt(this.getAttribute("data-solve-idx"));
          self.selOpt=idx;
          for(var k=0;k<optEls.length;k++)optEls[k].classList.remove("selected");
          this.classList.add("selected");
          cb.disabled=false;
          cb.textContent="Check";
        });
      }
    }else if(sStep.type==="input"){
      var inp=document.getElementById("slInput");
      if(inp){
        inp.addEventListener("input",function(){
          cb.disabled=this.value.trim().length<1;
          cb.textContent="Check";
        });
        inp.focus();
      }
    }
    cb.textContent="Check";
    cb.className="btn btn-primary";
    cb.disabled=true;
  },

  checkSolve:function(step,cb){
    var sl=step.steps;
    var sStep=sl[this.solveStepIdx];
    this.solveAnswered=true;
    var fb=document.getElementById("slFb");
    var correct=false,misc="";
    if(sStep.type==="mcq"){
      var opt=sStep.opts[this.selOpt];
      if(!opt){this.solveAnswered=false;return;}
      correct=opt.c;
      var optEls=document.querySelectorAll("[data-solve-idx]");
      for(var i=0;i<optEls.length;i++){
        optEls[i].style.pointerEvents="none";
        if(sStep.opts[i].c)optEls[i].classList.add("correct");
        else if(i===this.selOpt&&!opt.c)optEls[i].classList.add("wrong");
      }
      if(!opt.c)misc=opt.m;
    }else if(sStep.type==="input"){
      var val=document.getElementById("slInput").value.trim();
      var ans=sStep.answer;
      correct=(val===ans||val===ans.replace(/\s/g,"")||parseInt(val)===parseInt(ans)||parseFloat(val)===parseFloat(ans));
      document.getElementById("slInput").disabled=true;
      if(!correct)misc=sStep.m;
    }
    if(correct){
      playTone(523,0.12,"sine",0.12);
      fb.innerHTML='<div class="feedback ok">✓ Correct! +5 XP</div>';
      this.xp+=5;this.streak++;this.updateStats();this.checkLevelUp();
      cb.textContent="Next Step →";
      cb.disabled=false;
    }else{
      playTone(200,0.15,"sawtooth",0.1);
      this.streak=0;this.updateStats();
      fb.innerHTML='<div class="feedback no">✗ Not quite.</div>'+
        (misc?'<div class="misconception">⚠ '+misc+'</div>':'');
      this.solveAnswered=false;this.selOpt=null;
      if(sStep.type==="mcq"){
        var o2=document.querySelectorAll("[data-solve-idx]");
        for(var i=0;i<o2.length;i++){
          o2[i].classList.remove("selected","correct","wrong");
          o2[i].style.pointerEvents="";
        }
      }else{
        var inp2=document.getElementById("slInput");
        if(inp2){inp2.disabled=false;inp2.value="";inp2.focus();}
      }
      cb.textContent="Check";cb.disabled=true;
    }
  },

        '<div class="complete-coins">🪙 '+this.coins+' · ⭐ '+this.xp+'</div>'+
        '<p style="color:var(--muted);font-size:.9rem;font-weight:600">Level '+this.level+': '+LEVELS[this.level-1].name+'</p>'+
        '<p style="color:var(--purple);font-size:.8rem;font-weight:700">📊 Mastery: '+TEAS.getMastery().masteryPct+'%</p>'+
        '<div class="star-row"><span>⭐</span><span>⭐</span><span>⭐</span></div>'+
        '<div style="margin-top:10px;display:flex;gap:4px;justify-content:center;flex-wrap:wrap">'+chips+'</div>'+
        '</div>';
      document.getElementById("progressFill").style.width="100%";
      cb.textContent="Restart Chapter ↻";
      cb.className="btn btn-amber";
      cb.disabled=false;
      cb.onclick=function(){App.restart();};
    }
  },

  next:function(){
    var step=NODES[this.nIdx].steps[this.sIdx];
    // Handle WE (worked example) — show next step
    if(step.t==="we"){
      if(this.weStepIdx<step.steps.length-1){
        this.weStepIdx++;
        this.showWE(step,document.getElementById("continueBtn"));
        applyLLE();
        return;
      }
      this.advance();return;
    }
    // Handle SOLVE
    if(step.t==="solve"){
      var sl=step.steps;
      if(this.solveStepIdx>=sl.length){this.advance();return;}
      if(!this.solveAnswered){
        // Need to check answer
        this.checkSolve(step,document.getElementById("continueBtn"));
        applyLLE();
        return;
      }
      // Already answered — check if correct
      var sStep=sl[this.solveStepIdx];
      var wasCorrect=false;
      if(sStep.type==="mcq"&&this.selOpt!=null)wasCorrect=sStep.opts[this.selOpt].c;
      else if(sStep.type==="input"){
        var inp=document.getElementById("slInput");
        if(inp)wasCorrect=(inp.value.trim()===sStep.answer||parseInt(inp.value.trim())===parseInt(sStep.answer));
      }
      if(!wasCorrect)return;
      this.solveStepIdx++;
      this.solveAnswered=false;this.selOpt=null;
      this.showSolveStep(step,document.getElementById("continueBtn"));
      applyLLE();
      return;
    }
    // Handle TRUEFALSE
    if(step.t==="truefalse"){
      if(!this.answered){this.checkTrueFalse(step,document.getElementById("continueBtn"));return;}
      if(this.selTf!==step.q.answer)return;
      this.advance();return;
    }
    // Handle FILLBLANK
    if(step.t==="fillblank"){
      if(!this.fbAnswered){this.checkFillBlank(step,document.getElementById("continueBtn"));return;}
      this.advance();return;
    }
    // Handle QUIZ
    if(step.t==="quiz"){
      if(!this.answered){this.checkQuiz(step,document.getElementById("continueBtn"));applyLLE();return;}
      var opt=step.q.opts[this.selOpt];
      if(!opt||!opt.c)return;
      this.advance();return;
    }
    // Handle PROGRESS (completion)
    if(step.t==="progress"){
      if(!step.next){
        // Chapter complete - restart
        this.restart();return;
      }
      this.advance();return;
    }
    // Handle interactive steps — just advance
    this.advance();
  },

  
  back:function(){
    if(this.nIdx===0&&this.sIdx===0)return;
    this.sIdx--;
    if(this.sIdx<0){
      this.nIdx--;
      if(this.nIdx<0){this.nIdx=0;this.sIdx=0;return;}
      this.sIdx=NODES[this.nIdx].steps.length-1;
    }
    // Reset state for the step we're going back to
    this.answered=false;this.selOpt=null;this.selTf=null;
    this.fbAnswered=false;this.fbCorrect=false;
    this.weStepIdx=0;this.solveStepIdx=0;this.solveAnswered=false;
    this.save();
    this.render();
  },

  restart:function(){
    this.nIdx=0;this.sIdx=0;this.coins=0;this.xp=0;this.level=1;this.streak=0;
    this.conceptsMastered={};
    this.answered=false;this.selOpt=null;this.selTf=null;
    this.fbAnswered=false;this.fbCorrect=false;
    this.weStepIdx=0;this.solveStepIdx=0;this.solveAnswered=false;
    try{localStorage.removeItem('aasha_quad_progress');}catch(e){}
    this.save();
    this.render();
  },

advance:function(){
    this.sIdx++;
    if(this.sIdx>=NODES[this.nIdx].steps.length){
      this.nIdx++;this.sIdx=0;
      if(this.nIdx>=NODES.length){
        this.nIdx=NODES.length-1;
        this.sIdx=NODES[this.nIdx].steps.length-1;
        return;
      }
    }
    this.save();
    this.render();
  }
};

App.init();
</script>
</body>
</html>
